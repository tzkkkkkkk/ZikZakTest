<script>
/* ZikZak · canal 4 · Concurso · ¡PULSA!
   Un pulsador y una lámpara. Cuando la lámpara se pone verde, se toca. Quien toca antes, pierde.
   Mide los reflejos: cuenta lo poco que se tarda. En los niveles altos la lámpara amaga en ámbar. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta;

  const NIV = [null,
    { ini: [80, 170], falsas: 0 },
    { ini: [110, 200], falsas: 1 },
    { ini: [140, 225], falsas: 2 }];
  const AMAGO = 14;        // pasos que dura un amago
  const C = { fondo: '#3A2A8C', fondoS: '#2A1F5C', atril: '#19B5A5', atrilS: '#0E7F74', verde: '#3DDC6B', ambar: '#FF9F1C', apagada: '#6B5FA8' };

  // --- lógica ---------------------------------------------------------------
  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const enc = rng.entero(N.ini[0], N.ini[1]);
    const falsas = [];
    for (let i = 0; i < N.falsas; i++) {
      const a = 30 + i * 45, b = Math.min(a + 35, enc - 40 - (N.falsas - 1 - i) * 45);
      falsas.push(rng.entero(a, Math.max(a, b)));
    }
    return { semilla, nivel, enc, falsas, pulsado: -1, antes: false, pts: 0, espera: 0, hecho: false, ev: [] };
  }

  const puntosDe = r => ZZ.lim(Math.round(1000 - Math.max(0, r - 9) * 22), 0, 1000);

  function paso(e, entradas, n) {
    if (e.falsas.indexOf(n) >= 0) e.ev.push({ t: 'amago' });
    if (n === e.enc) e.ev.push({ t: 'luz' });
    if (e.pulsado < 0) {
      for (const en of entradas) {
        if (en.t !== 'd') continue;
        e.pulsado = n;
        if (n < e.enc) { e.antes = true; e.pts = 0; e.ev.push({ t: 'antes' }); }
        else { e.pts = puntosDe(n - e.enc); e.ev.push({ t: 'pulsa', r: n - e.enc, pts: e.pts }); }
        break;
      }
    }
    if (e.pulsado >= 0 && ++e.espera > 40) e.hecho = true;
  }

  function puntuacion(e) { return e.pulsado < 0 || e.antes ? 0 : e.pts; }

  // Jugador de la casa: tarda en reaccionar y, si es flojo, pica en los amagos.
  function casa(e, mem, rng, d, n) {
    if (mem.paso === undefined) {
      mem.paso = e.enc + ZZ.lim(Math.round(ZZ.mix(34, 13, d) + rng.campana() * ZZ.mix(8, 2, d)), 1, 80);
      for (const f of e.falsas) if (rng() < ZZ.mix(0.3, 0, Math.min(1, d * 1.3))) { mem.paso = f + rng.entero(10, 20); break; }
    }
    return n === mem.paso && e.pulsado < 0 ? [{ t: 'd', x: 320, y: 560 }] : [];
  }

  // --- dibujo -----------------------------------------------------------------
  function fondo(g) {
    g.fillStyle = C.fondo; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.trama(g, C.fondoS, 12, 3); g.fillRect(0, 0, ZZ.PW, 260);
    // focos
    for (const [x, a] of [[110, 0.35], [530, -0.35]]) {
      g.save(); g.translate(x, -10); g.rotate(a);
      g.globalAlpha = 0.16; T.poli(g, [[-26, 0], [26, 0], [150, 700], [-150, 700]]); T.pinta(g, T.AMARILLO, 0);
      g.globalAlpha = 1; T.vol(g, c => T.rr(c, -34, 0, 68, 54, 10), T.TINTA, { dx: 0, dy: 0, w: 0 });
      g.restore();
    }
    // suelo y atril
    T.vol(g, c => T.rr(c, -20, 700, 680, 200, 0), C.fondoS, { sombra: '#1C1440', dx: 0, dy: 10, w: 7 });
    T.vol(g, c => T.poli(c, [[150, 860], [190, 610], [450, 610], [490, 860]]), C.atril, { sombra: C.atrilS, dx: -14, dy: 0, w: 7 });
    T.vol(g, c => T.rr(c, 150, 580, 340, 44, 12), C.atril, { sombra: C.atrilS, dx: 0, dy: -10, w: 7 });
    T.estrella(g, 320, 760, 46, 20, 5, -0.3); T.pinta(g, T.AMARILLO, 6);
  }
  function lampara(g, color, fuerte, t) {
    if (fuerte) {
      g.save(); g.globalAlpha = 0.3 + 0.1 * Math.sin(t * 0.6);
      T.circ(g, 320, 250, 150); T.pinta(g, color, 0);
      g.restore();
    }
    T.vol(g, c => T.rr(c, 280, 330, 80, 40, 8), T.TINTA, { dx: 0, dy: 0, w: 0 });
    T.vol(g, c => T.circ(c, 320, 250, 96), color, { sombra: T.oscuro(color, 0.25), dx: -12, dy: -12, w: 8 });
    T.elip(g, 286, 212, 22, 13); T.pinta(g, '#FFFFFF', 0);
  }
  function pulsador(g, hundido) {
    T.vol(g, c => T.elip(c, 320, 574, 124, 40), T.TINTA, { dx: 0, dy: 0, w: 0 });
    const y = hundido ? 558 : 526;
    T.vol(g, c => { c.beginPath(); c.ellipse(320, y, 104, 34, 0, Math.PI, 0); c.lineTo(424, 566); c.ellipse(320, 566, 104, 34, 0, 0, Math.PI); c.closePath(); }, T.ROJO, { sombra: T.oscuro(T.ROJO, 0.3), dx: -14, dy: 0, w: 7 });
    T.elip(g, 320, y, 104, 34); T.pinta(g, T.ROJO, 7);
    T.elip(g, 288, y - 8, 30, 8); T.pinta(g, '#FFFFFF', 0);
  }

  function dibuja(g, e, vis) {
    const n = vis.n, t = vis.t;
    T.capa(g, vis, 'concurso', fondo);
    let color = C.apagada, fuerte = false;
    for (const f of e.falsas) if (n >= f && n < f + AMAGO && (e.pulsado < 0 || e.pulsado >= f)) { color = C.ambar; fuerte = true; }
    if (n >= e.enc && !e.antes) { color = C.verde; fuerte = true; }
    if (e.antes) { color = T.ROJO; fuerte = true; }
    lampara(g, color, fuerte, t);
    if (color === C.verde) T.texto(g, '¡YA!', 320, 252, 78, { color: T.TINTA, w: 0 });
    vis.ch.dibuja(g, 0);
    pulsador(g, e.pulsado >= 0 && n - e.pulsado < 10);
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'luz') { son && son.acierto(); }
      else if (x.t === 'amago') { son && son.golpe(); }
      else if (x.t === 'pulsa') {
        const bien = x.pts >= 700;
        T.estrellas(vis.ch, 320, 520, bien ? 9 : 5, T.AMARILLO, 9, bien ? 20 : 14, 1);
        vis.ch.mas({ tipo: 'anillo', x: 320, y: 540, r: 40, R: 200, w: 14, color: '#FFFFFF', vida: 16, capa: 1 });
        T.palabra(vis.ch, (x.r / 60).toFixed(2).replace('.', ',') + ' s', 320, 120, bien ? T.AMARILLO : T.PAPEL, 64, 1);
        T.palabra(vis.ch, bien ? '¡RAYO!' : x.pts >= 350 ? '¡VALE!' : '¡QUÉ PACHORRA!', 320, 440, bien ? T.AMARILLO : T.PAPEL, 46, 1);
        vis.temblor = 7; vis.parada = 2;
        son && son.golpe();
      } else if (x.t === 'antes') {
        T.palabra(vis.ch, '¡ANTES DE TIEMPO!', 320, 120, T.ROJO, 46, 1);
        vis.temblor = 12;
        son && son.fallo();
      }
    }
  }

  ZZ.canales.concurso = {
    id: 'concurso', num: 4, nombre: 'CONCURSO', orden: '¡PULSA!',
    pista: 'Toca cuando la lámpara se ponga verde',
    rotulo: 'EN DIRECTO: «EL DEDO MÁS RÁPIDO»',
    color: '#19B5A5', color2: T.VIOLETA, color3: T.AMARILLO,
    animo: x => (x.t === 'pulsa' ? (x.pts >= 350 ? 1 : -1) : x.t === 'antes' ? -1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
//# sourceURL=zz/canales/concurso.js
</script>
<script>
/* ZikZak · canal 5 · Teletienda · ¡LLENA!
   Se mantiene el dedo para llenar un vaso y se suelta para parar justo en la raya.
   La precisión manda: si el vaso rebosa, la venta se va a cero. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta;

  const NIV = [null,
    { ancho: 196, vel: 0.011, base: 0.62, tol: 0.13, mueve: 0 },
    { ancho: 166, vel: 0.016, base: 0.60, tol: 0.095, mueve: 0 },
    { ancho: 136, vel: 0.021, base: 0.59, tol: 0.075, mueve: 1 }];
  const C = { fondo: '#FF8A3C', fondoS: '#C9572A', balda: '#7B4DFF', vaso: '#D9F3FF', vasoS: '#79B9D1', liquido: '#21C58E', raya: '#FF3B4E', etiqueta: '#FFC928' };

  function rayaEn(e, n) {
    const N = NIV[e.nivel];
    return ZZ.lim(e.base + (N.mueve ? Math.sin((n + (e.semilla % 61)) * 0.055) * 0.085 : 0), 0.43, 0.78);
  }

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    return {
      semilla, nivel, base: N.base + rng.entre(-0.025, 0.025), cantidad: 0, raya: 0,
      llenando: false, resuelto: false, derrame: false, pts: 0, espera: 0, hecho: false, ev: [],
    };
  }

  function resuelve(e) {
    if (e.resuelto) return;
    e.llenando = false; e.resuelto = true;
    if (e.derrame || e.cantidad >= 0.95) {
      e.derrame = true; e.pts = 0; e.ev.push({ t: 'derrame' }); return;
    }
    const N = NIV[e.nivel], err = e.raya - e.cantidad;
    if (err < 0) {
      e.derrame = true; e.pts = 0; e.ev.push({ t: 'derrame' }); return;
    }
    e.pts = Math.max(0, Math.round((1 - err / N.tol) * 1000));
    e.ev.push({ t: 'sirve', err, pts: e.pts });
  }

  function paso(e, entradas, n) {
    e.raya = rayaEn(e, n);
    for (const en of entradas) {
      if (en.t === 'd' && !e.resuelto && !e.llenando) {
        e.llenando = true; e.ev.push({ t: 'empieza' });
      } else if (en.t === 'u' && e.llenando) {
        resuelve(e);
      }
    }
    if (e.llenando) {
      e.cantidad += NIV[e.nivel].vel;
      if (e.cantidad >= 0.95) resuelve(e);
    }
    if (e.resuelto && ++e.espera > 34) e.hecho = true;
  }

  function puntuacion(e) { return e.resuelto ? ZZ.lim(e.pts, 0, 1000) : 0; }

  // La casa llena con un pequeño error, pero siempre usa la misma semilla.
  function casa(e, mem, rng, d, n) {
    if (mem.soltar === undefined) {
      mem.soltar = 0;
      let mejor = 1e9;
      for (let i = 8; i < 150; i++) {
        const q = i * NIV[e.nivel].vel, raya = rayaEn(e, i), err = raya >= q ? raya - q : 1000 + q - raya;
        if (err < mejor) { mejor = err; mem.soltar = i; }
      }
      mem.soltar = ZZ.lim(mem.soltar + Math.round(rng.campana() * ZZ.mix(8, 1, d)), 4, 145);
    }
    if (n === 0) return [{ t: 'd', x: 320, y: 520 }];
    return n === mem.soltar ? [{ t: 'u', x: 320, y: 520 }] : [];
  }

  function fondo(g) {
    g.fillStyle = C.fondo; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.trama(g, C.fondoS, 18, 3); g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    T.texto(g, 'TELETIENDA', 320, 86, 48, { color: T.PAPEL, w: 9 });
    T.texto(g, '¡LLENA!', 320, 145, 70, { color: C.etiqueta, w: 11 });
    T.vol(g, c => T.rr(c, 44, 224, 552, 28, 10), C.balda, { sombra: T.oscuro(C.balda), dx: 0, dy: 9, w: 6 });
    for (const x of [104, 320, 536]) {
      T.vol(g, c => T.rr(c, x - 44, 170, 88, 58, 14), C.etiqueta, { dx: -6, dy: -6, w: 5 });
      T.circ(g, x, 197, 14); T.pinta(g, C.fondoS, 4);
    }
    T.vol(g, c => T.rr(c, 0, 698, 640, 180, 0), C.fondoS, { sombra: '#7D2D2A', dx: 0, dy: 10, w: 0 });
  }

  function vaso(g, e, vis) {
    const N = NIV[e.nivel], x = 320, y = 300, h = 340, w = N.ancho;
    const arriba = y + h * (1 - e.cantidad);
    T.vol(g, c => T.rr(c, x - w / 2, y, w, h, 20), C.vaso, { sombra: C.vasoS, dx: -9, dy: -10, w: 0 });
    g.save();
    T.rr(g, x - w / 2, y, w, h, 20); g.clip();
    g.fillStyle = C.liquido; g.fillRect(x - w, arriba, w * 2, h + 30);
    g.globalAlpha = 0.25; g.fillStyle = '#FFFFFF'; g.fillRect(x - w / 2 + 18, y, 18, h);
    g.restore();
    T.rr(g, x - w / 2, y, w, h, 20); T.linea(g, 8, T.TINTA);
    const ry = y + h * (1 - e.raya);
    g.beginPath(); g.moveTo(x - w / 2 - 28, ry); g.lineTo(x + w / 2 + 28, ry); T.linea(g, 10, C.raya);
    T.texto(g, 'RAYA', x + w / 2 + 51, ry, 20, { color: C.raya, fuente: T.F_UI, peso: 900, w: 4 });
    if (e.llenando) {
      T.tubo(g, c => { c.moveTo(x, 242); c.lineTo(x, y + 4); }, C.liquido, 18, 5);
      T.circ(g, x, 238, 16); T.pinta(g, C.liquido, 5);
    }
    if (e.derrame) {
      for (const dx of [-52, -18, 18, 52]) {
        T.tubo(g, c => { c.moveTo(x + dx, y + 20); c.lineTo(x + dx + dx * 0.15, y - 32); }, C.liquido, 9, 3);
      }
    }
    T.texto(g, Math.round(e.cantidad * 100) + '%', x, y + h + 55, 42, { color: T.PAPEL, w: 7 });
    T.texto(g, 'MANTÉN · SUELTA', x, 774, 25, { color: T.PAPEL, fuente: T.F_UI, peso: 900, w: 4 });
  }

  function dibuja(g, e, vis) {
    T.capa(g, vis, 'teletienda', fondo);
    vaso(g, e, vis);
    vis.ch.dibuja(g, 0); vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'sirve') {
        const bien = x.pts >= 700;
        T.estrellas(vis.ch, 320, 300, bien ? 10 : 5, bien ? T.AMARILLO : T.PAPEL, 10, bien ? 22 : 14, 1);
        T.palabra(vis.ch, bien ? '¡A MEDIDA!' : '¡SERVIDO!', 320, 150, bien ? T.AMARILLO : T.PAPEL, 44, 1);
        son && (bien ? son.acierto() : son.golpe());
      } else if (x.t === 'derrame') {
        T.palabra(vis.ch, '¡SE DERRAMA!', 320, 150, T.ROJO, 46, 1);
        T.polvo(vis.ch, 320, 300, 8, T.AZUL, 7, 22, 1);
        son && son.fallo();
      }
    }
  }

  ZZ.canales.teletienda = {
    id: 'teletienda', num: 5, nombre: 'TELETIENDA', orden: '¡LLENA!',
    pista: 'Mantén el dedo y suelta en la raya',
    rotulo: 'OFERTA RELÁMPAGO: EL VASO JUSTO',
    color: C.fondo, color2: T.MENTA, color3: T.AMARILLO,
    arrastra: true,
    animo: x => x.t === 'sirve' ? (x.pts >= 350 ? 1 : -1) : x.t === 'derrame' ? -1 : 0,
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
//# sourceURL=zz/canales/teletienda.js
</script>
<script>
/* ZikZak · canal 6 · Bricolaje · ¡CLAVA!
   La barra sube y baja. Un golpe de martillo en el punto justo clava el clavo. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta;

  const NIV = [null,
    { vel: 0.025, zona: 0.17, clavos: 1 },
    { vel: 0.041, zona: 0.115, clavos: 1 },
    { vel: 0.062, zona: 0.075, clavos: 2 }];
  const C = { fondo: '#2D6BFF', fondoS: '#2146A8', madera: '#C77A3D', maderaS: '#8C4D2A', metal: '#C9D6E2', metalS: '#71879A', amarillo: '#FFC928' };

  function fuerzaEn(e, n) {
    const q = (e.fase + n * NIV[e.nivel].vel) % 2;
    return q <= 1 ? q : 2 - q;
  }

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel], clavos = [];
    for (let i = 0; i < N.clavos; i++) clavos.push(ZZ.lim(rng.entre(0.46, 0.7) + (i ? rng.entre(-0.07, 0.07) : 0), 0.3, 0.78));
    return {
      semilla, nivel, fase: rng.entre(0, 2), clavos, activa: 0, fuerza: 0, golpes: 0,
      espera: 0, cool: 0, suma: 0, resuelto: false, hecho: false, ev: [],
    };
  }

  function golpe(e, n) {
    if (e.resuelto || e.espera > 0 || e.cool > 0 || e.activa >= e.clavos.length) return;
    const objetivo = e.clavos[e.activa], err = Math.abs(e.fuerza - objetivo), zona = NIV[e.nivel].zona;
    const pts = Math.max(0, Math.round((1 - err / zona) * 1000));
    e.suma += pts; e.golpes++; e.cool = 10;
    e.ev.push({ t: 'golpe', pts, err, bueno: pts >= 700, y: e.fuerza });
    e.activa++;
    if (e.activa >= e.clavos.length) e.resuelto = true;
    else e.espera = 20;
  }

  function paso(e, entradas, n) {
    e.fuerza = fuerzaEn(e, n);
    if (e.cool > 0) e.cool--;
    if (e.espera > 0) e.espera--;
    for (const en of entradas) if (en.t === 'd') golpe(e, n);
    if (e.resuelto && ++e.espera > 32) e.hecho = true;
  }

  function puntuacion(e) { return ZZ.lim(Math.round(e.suma / e.clavos.length), 0, 1000); }

  // La casa busca el siguiente paso cercano al punto justo y añade error según su destreza.
  function casa(e, mem, rng, d, n) {
    if (mem.golpes !== e.golpes) {
      mem.golpes = e.golpes;
      mem.paso = -1;
      if (!e.resuelto) {
        const desde = n + e.espera + 3, objetivo = e.clavos[e.activa];
        let mejor = 1e9;
        for (let i = desde; i < ZZ.PASOS - 5; i++) {
          const err = Math.abs(fuerzaEn(e, i) - objetivo);
          if (err < mejor) { mejor = err; mem.paso = i; }
        }
        mem.paso = ZZ.lim(mem.paso + Math.round(rng.campana() * ZZ.mix(18, 2, d)), desde, ZZ.PASOS - 2);
      }
    }
    return n === mem.paso ? [{ t: 'd', x: 320, y: 350 }] : [];
  }

  function fondo(g) {
    g.fillStyle = C.fondo; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.trama(g, C.fondoS, 16, 3); g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    T.texto(g, 'BRICOLAJE', 320, 82, 46, { color: T.PAPEL, w: 9 });
    T.texto(g, '¡CLAVA!', 320, 140, 70, { color: C.amarillo, w: 11 });
    T.vol(g, c => T.rr(c, 52, 198, 536, 30, 10), C.madera, { sombra: C.maderaS, dx: 0, dy: 10, w: 6 });
    for (const x of [110, 320, 530]) { T.vol(g, c => T.rr(c, x - 34, 148, 68, 54, 10), C.metal, { sombra: C.metalS, dx: -6, dy: -6, w: 5 }); }
    T.vol(g, c => T.rr(c, 0, 700, 640, 180, 0), C.maderaS, { sombra: '#5E2D22', dx: 0, dy: 10, w: 0 });
  }

  function medidor(g, e) {
    const x = 320, y = 244, h = 320, w = 92, zona = NIV[e.nivel].zona;
    T.vol(g, c => T.rr(c, x - w / 2, y, w, h, 22), C.metal, { sombra: C.metalS, dx: -9, dy: -10, w: 8 });
    const fy = y + h * (1 - e.fuerza), ty = y + h * (1 - e.clavos[e.activa < e.clavos.length ? e.activa : e.clavos.length - 1]);
    const zh = h * zona;
    T.rr(g, x - w / 2 - 18, ty - zh, w + 36, zh * 2, 14); T.pinta(g, C.amarillo, 0, T.TINTA); g.globalAlpha = 0.25; g.fillStyle = C.amarillo; g.fill(); g.globalAlpha = 1;
    g.beginPath(); g.moveTo(x - 72, ty); g.lineTo(x + 72, ty); T.linea(g, 9, C.amarillo);
    T.vol(g, c => T.rr(c, x - 25, fy - 18, 50, 36, 12), T.ROJO, { sombra: '#B51F34', dx: -6, dy: -6, w: 6 });
    T.texto(g, 'PUNTO JUSTO', x, 600, 24, { color: C.amarillo, fuente: T.F_UI, peso: 900, w: 4 });
  }

  function martillo(g, e) {
    const y = 615 - e.fuerza * 125;
    g.save(); g.translate(470, y); g.rotate(-0.45 + Math.sin(e.fuerza * Math.PI) * 0.18);
    T.tubo(g, c => { c.moveTo(-5, 8); c.lineTo(-72, 116); }, C.madera, 24, 6);
    T.vol(g, c => T.rr(c, -62, -30, 132, 58, 15), C.metal, { sombra: C.metalS, dx: -7, dy: -8, w: 7 });
    g.restore();
  }

  function dibuja(g, e, vis) {
    T.capa(g, vis, 'bricolaje', fondo);
    medidor(g, e);
    T.vol(g, c => T.rr(c, 190, 676, 260, 96, 16), C.madera, { sombra: C.maderaS, dx: -8, dy: -10, w: 7 });
    for (let i = 0; i < e.clavos.length; i++) {
      const x = 280 + i * 80, clavado = i < e.activa;
      T.tubo(g, c => { c.moveTo(x, 642); c.lineTo(x, 717 - (clavado ? 18 : 0)); }, C.metal, 12, 4);
      T.vol(g, c => T.circ(c, x, 640, 19), clavado ? T.MENTA : C.metal, { sombra: C.metalS, dx: -5, dy: -5, w: 5 });
    }
    martillo(g, e);
    T.texto(g, e.activa >= e.clavos.length ? '¡CLAVADO!' : 'TOCA PARA GOLPEAR', 320, 790, 25, { color: T.PAPEL, fuente: T.F_UI, peso: 900, w: 4 });
    vis.ch.dibuja(g, 0); vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) if (x.t === 'golpe') {
      T.estrellas(vis.ch, 320, 680, x.bueno ? 9 : 4, x.bueno ? T.AMARILLO : T.PAPEL, 10, x.bueno ? 22 : 14, 1);
      T.palabra(vis.ch, x.bueno ? '¡CLAVADO!' : x.pts ? '¡CASI!' : '¡FLOJO!', 320, 160, x.bueno ? T.AMARILLO : T.PAPEL, 46, 1);
      son && (x.bueno ? son.clavado() : son.golpe());
    }
  }

  ZZ.canales.bricolaje = {
    id: 'bricolaje', num: 6, nombre: 'BRICOLAJE', orden: '¡CLAVA!',
    pista: 'Toca cuando la barra esté en el punto justo',
    rotulo: 'TALLER EN DIRECTO: «GOLPE SECO»',
    color: C.fondo, color2: C.madera, color3: T.AMARILLO,
    animo: x => x.t === 'golpe' ? (x.pts >= 350 ? 1 : -1) : 0,
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();

<script>
/* ZikZak · canal 7 · Documental · ¡ATRAPA!
   Una mosca cruza la escena. Toca cuando esté delante de la rana; la avispa no se toca. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta;

  const NIV = [null,
    { vel: 4.6, inicio: 50, onda: 0, tol: 105, avispa: false },
    { vel: 6.2, inicio: 44, onda: 34, tol: 88, avispa: false },
    { vel: 7.6, inicio: 40, onda: 58, tol: 76, avispa: true }];
  const C = { fondo: '#2A7F62', fondoS: '#18503F', hoja: '#43B97B', rana: '#5FD06C', ranaS: '#2D914A', ala: '#F5E6C8', avispa: '#FFC928' };

  function objeto(e, tipo, n) {
    const N = NIV[e.nivel], o = tipo === 'mosca' ? e.mosca : e.avispa;
    if (!o || n < o.inicio) return null;
    const t = n - o.inicio, onda = tipo === 'mosca' ? N.onda : N.onda * 0.45;
    return { x: -70 + t * o.vel, y: o.y + Math.sin(t * (tipo === 'mosca' ? 0.075 : 0.11)) * onda, t };
  }

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    return {
      semilla, nivel,
      mosca: { inicio: N.inicio, vel: N.vel, y: rng.entre(300, 410) },
      avispa: N.avispa ? { inicio: N.inicio + 90, vel: N.vel + 1.1, y: 270 } : null,
      moscaPos: null, avispaPos: null, atrapada: false, fallo: false, pts: 0, espera: 0, hecho: false, ev: [],
    };
  }

  function paso(e, entradas, n) {
    e.moscaPos = objeto(e, 'mosca', n);
    e.avispaPos = objeto(e, 'avispa', n);
    if (!e.atrapada && !e.fallo) {
      for (const en of entradas) {
        if (en.t !== 'd') continue;
        const a = e.avispaPos && e.avispaPos.x > -20 && e.avispaPos.x < 660 ? e.avispaPos : null;
        const m = e.moscaPos && e.moscaPos.x > -20 && e.moscaPos.x < 660 ? e.moscaPos : null;
        if (a && Math.abs(a.x - 320) < 120) {
          e.fallo = true; e.pts = 0; e.ev.push({ t: 'avispa', x: a.x, y: a.y }); break;
        }
        if (m && Math.abs(m.x - 320) < NIV[e.nivel].tol) {
          const err = Math.abs(m.x - 320);
          e.pts = ZZ.lim(Math.round((1 - err / NIV[e.nivel].tol) * 1000), 0, 1000);
          e.atrapada = true; e.ev.push({ t: 'atrapa', x: m.x, y: m.y, pts: e.pts }); break;
        }
        e.ev.push({ t: 'aire' });
      }
    }
    if (!e.atrapada && !e.fallo && e.moscaPos && e.moscaPos.x > 700) { e.fallo = true; e.ev.push({ t: 'pasa' }); }
    if ((e.atrapada || e.fallo) && ++e.espera > 34) e.hecho = true;
  }

  function puntuacion(e) { return e.atrapada ? ZZ.lim(e.pts, 0, 1000) : 0; }

  function casa(e, mem, rng, d, n) {
    if (mem.paso === undefined) {
      let mejor = 1e9, objetivo = e.mosca.inicio;
      for (let i = e.mosca.inicio; i < ZZ.PASOS - 5; i++) {
        const p = objeto(e, 'mosca', i), err = Math.abs(p.x - 320);
        if (err < mejor) { mejor = err; objetivo = i; }
      }
      mem.paso = ZZ.lim(objetivo + Math.round(rng.campana() * ZZ.mix(30, 4, d)), e.mosca.inicio, ZZ.PASOS - 2);
    }
    return n === mem.paso ? [{ t: 'd', x: 320, y: 500 }] : [];
  }

  function fondo(g) {
    g.fillStyle = C.fondo; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.trama(g, C.fondoS, 18, 3); g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    T.texto(g, 'DOCUMENTAL', 320, 82, 43, { color: T.PAPEL, w: 9 });
    T.texto(g, '¡ATRAPA!', 320, 140, 70, { color: T.AMARILLO, w: 11 });
    for (const [x, y, r] of [[70, 220, 70], [555, 270, 90], [84, 520, 80], [566, 570, 70]]) {
      T.vol(g, c => T.elip(c, x, y, r, r * 0.42, -0.4), C.hoja, { sombra: C.fondoS, dx: -6, dy: -8, w: 5 });
    }
    T.vol(g, c => T.rr(c, 0, 742, 640, 140, 0), C.fondoS, { sombra: '#12382F', dx: 0, dy: 10, w: 0 });
  }

  function rana(g, e, vis) {
    T.vol(g, c => T.rr(c, 225, 585, 190, 145, 68), C.rana, { sombra: C.ranaS, dx: -10, dy: -12, w: 8 });
    for (const x of [265, 375]) {
      T.vol(g, c => T.circ(c, x, 578, 36), C.rana, { sombra: C.ranaS, dx: -7, dy: -8, w: 7 });
      T.circ(g, x, 574, 12); T.pinta(g, T.TINTA, 0);
    }
    T.elip(g, 320, 655, 58, 24); T.pinta(g, '#1C503B', 6);
    if (vis.lengua > vis.t) {
      const p = e.moscaPos || { x: 320, y: 390 };
      T.tubo(g, c => { c.moveTo(320, 652); c.lineTo(p.x, p.y); }, T.ROJO, 12, 5);
    }
  }

  function mosca(g, p, t) {
    g.save(); g.translate(p.x, p.y); g.rotate(Math.sin(t * 0.12) * 0.18);
    T.vol(g, c => T.elip(c, 0, 0, 19, 14), T.TINTA, { sombra: '#000000', dx: -4, dy: -5, w: 4 });
    for (const dx of [-18, 18]) { T.elip(g, dx, -15, 24, 12, dx < 0 ? -0.4 : 0.4); T.pinta(g, C.ala, 4); }
    T.circ(g, -6, -3, 4); T.circ(g, 6, -3, 4); T.pinta(g, T.ROJO, 0);
    g.restore();
  }

  function avispa(g, p, t) {
    g.save(); g.translate(p.x, p.y); g.rotate(Math.sin(t * 0.13) * 0.12);
    T.vol(g, c => T.elip(c, 0, 0, 24, 15), C.avispa, { sombra: '#C88D13', dx: -5, dy: -5, w: 5 });
    for (const dx of [-9, 9]) { g.beginPath(); g.moveTo(dx, -6); g.lineTo(dx + 7, 8); T.linea(g, 7, T.TINTA); }
    for (const dx of [-22, 22]) { T.elip(g, dx, -18, 22, 10, dx < 0 ? -0.4 : 0.4); T.pinta(g, C.ala, 4); }
    g.restore();
  }

  function dibuja(g, e, vis) {
    T.capa(g, vis, 'documental', fondo);
    const m = e.moscaPos, a = e.avispaPos;
    if (m && m.x > -90 && m.x < 730 && !e.atrapada) mosca(g, m, vis.t);
    if (a && a.x > -90 && a.x < 730 && !e.fallo) avispa(g, a, vis.t);
    rana(g, e, vis);
    T.texto(g, e.nivel === 3 ? 'MOSCA · ¡CUIDADO CON LA AVISPA!' : 'TOCA CUANDO PASE FRENTE A LA RANA', 320, 790, e.nivel === 3 ? 19 : 22, { color: T.PAPEL, fuente: T.F_UI, peso: 900, w: 4 });
    vis.ch.dibuja(g, 0); vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'atrapa') {
        vis.lengua = vis.t + 9;
        T.estrellas(vis.ch, x.x, x.y, x.pts >= 700 ? 10 : 5, T.AMARILLO, 11, 22, 1);
        T.palabra(vis.ch, x.pts >= 700 ? '¡DELICIOSO!' : '¡A LA LENGUA!', 320, 160, T.AMARILLO, 42, 1);
        son && (x.pts >= 700 ? son.acierto() : son.golpe());
      } else if (x.t === 'avispa') {
        T.palabra(vis.ch, '¡ESA NO!', 320, 160, T.ROJO, 52, 1); vis.temblor = 12; son && son.fallo();
      } else if (x.t === 'pasa') {
        T.palabra(vis.ch, '¡SE ESCAPA!', 320, 160, T.PAPEL, 46, 1); son && son.fallo();
      }
    }
  }

  ZZ.canales.documental = {
    id: 'documental', num: 7, nombre: 'DOCUMENTAL', orden: '¡ATRAPA!',
    pista: 'Toca cuando la mosca pase frente a la rana',
    rotulo: 'NATURALEZA EN DIRECTO: «LA LENGUA»',
    color: C.fondo, color2: T.MENTA, color3: T.AMARILLO,
    animo: x => x.t === 'atrapa' ? (x.pts >= 350 ? 1 : -1) : (x.t === 'avispa' || x.t === 'pasa') ? -1 : 0,
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
//# sourceURL=zz/canales/documental.js

<script>
/* ZikZak · canal 8 · Musical · ¡AL RITMO!
   Cuatro avisos de bombo. Se toca cada golpe y se puntúa el desvío medio. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta;

  const NIV = [null,
    { golpes: [48, 96, 144, 192], tol: 14, silencio: -1 },
    { golpes: [42, 78, 114, 150], tol: 11, silencio: 1 },
    { golpes: [38, 66, 112, 139], tol: 9, silencio: -1 }];
  const C = { fondo: '#7B4DFF', fondoS: '#4A2DA1', aro: '#FFC928', parche: '#F5E6C8', palo: '#C77A3D' };

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const variacion = nivel === 3 ? rng.entero(-2, 2) : 0;
    return {
      semilla, nivel, golpes: N.golpes.map((x, i) => x + (i ? variacion : 0)), tol: N.tol, silencio: N.silencio,
      sig: 0, suma: 0, aciertos: 0, espera: 0, hecho: false, ev: [],
    };
  }

  function paso(e, entradas, n) {
    for (let i = e.sig; i < e.golpes.length; i++) {
      if (e.golpes[i] === n) e.ev.push({ t: 'aviso', i, silencio: i === e.silencio });
      else break;
    }
    while (e.sig < e.golpes.length && n > e.golpes[e.sig] + e.tol) {
      e.ev.push({ t: 'pierde', i: e.sig }); e.sig++;
    }
    for (const en of entradas) {
      if (en.t !== 'd' || e.sig >= e.golpes.length) continue;
      const err = n - e.golpes[e.sig];
      if (Math.abs(err) <= e.tol * 2) {
        const pts = Math.max(0, Math.round((1 - Math.abs(err) / (e.tol * 2)) * 1000));
        e.suma += pts; e.aciertos++; e.ev.push({ t: 'golpe', i: e.sig, err, pts, bueno: pts >= 700 }); e.sig++;
      }
    }
    if (e.sig >= e.golpes.length && ++e.espera > 34) e.hecho = true;
  }

  function puntuacion(e) { return ZZ.lim(Math.round(e.suma / e.golpes.length), 0, 1000); }

  function casa(e, mem, rng, d, n) {
    if (!mem.plan) mem.plan = e.golpes.map(t => t + Math.round(rng.campana() * ZZ.mix(8, 1, d)));
    return e.sig < e.golpes.length && n === mem.plan[e.sig] ? [{ t: 'd', x: 320, y: 610 }] : [];
  }

  function fondo(g) {
    g.fillStyle = C.fondo; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.trama(g, C.fondoS, 18, 3); g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    T.texto(g, 'MUSICAL', 320, 82, 48, { color: T.PAPEL, w: 9 });
    T.texto(g, '¡AL RITMO!', 320, 142, 66, { color: C.aro, w: 11 });
    T.vol(g, c => T.rr(c, 44, 216, 552, 30, 10), C.aro, { sombra: '#C58C10', dx: 0, dy: 9, w: 6 });
    T.vol(g, c => T.rr(c, 0, 706, 640, 174, 0), C.fondoS, { sombra: '#2E1D6C', dx: 0, dy: 10, w: 0 });
  }

  function cartelGolpes(g, e, vis) {
    for (let i = 0; i < e.golpes.length; i++) {
      const x = 104 + i * 144, d = Math.abs(vis.t - e.golpes[i]);
      const cerca = d < 8, hecho = i < e.sig;
      T.vol(g, c => T.circ(c, x, 300, cerca ? 49 : 40), hecho ? T.MENTA : cerca ? C.aro : T.PAPEL, { sombra: T.oscuro(hecho ? T.MENTA : cerca ? C.aro : T.PAPEL), dx: -7, dy: -8, w: 6 });
      T.texto(g, String(i + 1), x, 300, 32, { color: T.TINTA, w: 0 });
      if (i === e.silencio) T.texto(g, 'SILENCIO', x, 366, 16, { color: T.PAPEL, fuente: T.F_UI, peso: 900, w: 3 });
    }
  }

  function bombo(g, e, vis) {
    const golpe = e.golpes.some(t => Math.abs(vis.t - t) < 7);
    T.vol(g, c => T.rr(c, 175, 445, 290, 205, 54), C.palo, { sombra: '#7B3B22', dx: -10, dy: -12, w: 8 });
    T.vol(g, c => T.circ(c, 320, 540, 106 + (golpe ? 7 : 0)), C.parche, { sombra: '#C9AC83', dx: -8, dy: -9, w: 7 });
    T.circ(g, 320, 540, 27); T.pinta(g, C.aro, 7);
    const a = golpe ? 0.18 : -0.08;
    g.save(); g.translate(320, 540); g.rotate(a);
    for (const sx of [-1, 1]) { T.tubo(g, c => { c.moveTo(sx * 70, -160); c.lineTo(sx * 35, 10); }, C.palo, 16, 5); }
    g.restore();
    T.texto(g, 'TOCA CADA GOLPE', 320, 756, 27, { color: T.PAPEL, fuente: T.F_UI, peso: 900, w: 4 });
  }

  function dibuja(g, e, vis) {
    T.capa(g, vis, 'musical', fondo);
    cartelGolpes(g, e, vis); bombo(g, e, vis);
    vis.ch.dibuja(g, 0); vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'aviso') { if (!x.silencio && son) son.tic(); }
      else if (x.t === 'golpe') {
        T.estrellas(vis.ch, 320, 540, x.bueno ? 8 : 4, x.bueno ? T.AMARILLO : T.PAPEL, 10, x.bueno ? 20 : 13, 1);
        T.palabra(vis.ch, x.bueno ? '¡A TIEMPO!' : '¡SIGUE!', 320, 160, x.bueno ? T.AMARILLO : T.PAPEL, 43, 1);
        son && (x.bueno ? son.acierto() : son.golpe());
      } else if (x.t === 'pierde') {
        T.palabra(vis.ch, '¡TE FUISTE!', 320, 160, T.ROJO, 43, 1); son && son.fallo();
      }
    }
  }

  ZZ.canales.musical = {
    id: 'musical', num: 8, nombre: 'MUSICAL', orden: '¡AL RITMO!',
    pista: 'Toca cuatro veces siguiendo los avisos',
    rotulo: 'ORQUESTA DE SALÓN: «A TIEMPO»',
    color: C.fondo, color2: T.ROJO, color3: T.AMARILLO,
    animo: x => x.t === 'golpe' ? (x.pts >= 350 ? 1 : -1) : x.t === 'pierde' ? -1 : 0,
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
//# sourceURL=zz/canales/musical.js
</script>
<script>
/* ZikZak · tele
   El marco común: el aparato, la mecha de la cuenta atrás, las placas de los jugadores,
   la nieve del zapeo, la orden en letras gordas y los rótulos. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta;
  const TV = ZZ.tele = {};
  const W = 720, CUERPO = 982;

  // Reparto de la pantalla del móvil. Todo en unidades lógicas (ancho 720).
  TV.mide = function (H) {
    const libre = H - CUERPO;
    const arriba = ZZ.lim(libre * 0.44, 98, 250);
    const by = arriba;
    return {
      W, H, bx: 14, by, bw: 692, bh: CUERPO,
      px: 40, py: by + 30, pw: ZZ.PW, ph: ZZ.PH,
      tiraY: by + 30 + ZZ.PH + 14, tiraH: 78,
      arriba, abajo: H - by - CUERPO,
    };
  };

  // El fondo de fuera va oscuro para que la pantalla de la tele sea lo más luminoso.
  TV.colorFondo = color => T.mezcla(color, T.TINTA, 0.56);
  TV.VELO = '#1C1436';
  TV.velo = function (g, alfa) { g.save(); g.globalAlpha = alfa; g.fillStyle = TV.VELO; g.fillRect(0, 0, ZZ.PW, ZZ.PH); g.restore(); };
  TV.fondo = function (g, L, color, t) {
    g.fillStyle = TV.colorFondo(color); g.fillRect(-3000, -200, 6720, L.H + 400);
    T.rayos(g, 360, L.py + 420, 2600, 12, t * 0.0012, T.mezcla(color, T.TINTA, 0.47));
    g.save(); g.globalAlpha = 0.5;
    g.fillStyle = T.trama(g, T.mezcla(color, T.TINTA, 0.72), 15, 3.1);
    g.fillRect(-3000, -200, 6720, L.H + 400);
    g.restore();
  };

  TV.cuerpo = function (g, L, antenas) {
    const cam = c => T.rr(c, L.bx, L.by, L.bw, L.bh, 62);
    // antenas (solo cuando arriba no hay placa) y patas
    for (const s of [-1, 1]) {
      if (antenas) {
        g.beginPath(); g.moveTo(360 + s * 36, L.by + 12); g.lineTo(360 + s * 150, L.by - 62); T.linea(g, 11);
        T.vol(g, c => T.circ(c, 360 + s * 153, L.by - 65, 14), T.AMARILLO, { dx: -3, dy: -4, w: 6 });
      }
      T.rr(g, 360 + s * 210 - 52, L.by + L.bh - 10, 104, 44, 14); T.pinta(g, T.TINTA, 0);
    }
    T.sombra(g, cam, 0, 16, 1, T.TINTA, 8);
    T.vol(g, cam, T.PAPEL, { sombra: '#E0D2B2', dx: -8, dy: -12, w: 8 });
    T.rr(g, L.px - 14, L.py - 14, L.pw + 28, L.ph + 28, 46); T.pinta(g, T.TINTA, 0);
  };

  TV.pantalla = function (g, L, pinta) {
    g.save();
    T.rr(g, L.px, L.py, L.pw, L.ph, 34); g.clip();
    g.translate(L.px, L.py);
    pinta(g);
    g.restore();
    T.rr(g, L.px, L.py, L.pw, L.ph, 34); T.linea(g, 6);
  };

  // --- la mecha -----------------------------------------------------------------
  const MX0 = 66, MX1 = 548;
  const my = (L, x) => L.tiraY + L.tiraH / 2 + Math.sin(x * 0.045) * 7;
  function caminoMecha(g, L, a, b) {
    g.beginPath();
    g.moveTo(a, my(L, a));
    for (let x = Math.ceil(a / 10) * 10; x < b; x += 10) g.lineTo(x, my(L, x));
    g.lineTo(b, my(L, b));
  }
  TV.puntaMecha = (L, k) => { const x = MX0 + (MX1 - MX0) * ZZ.lim(k, 0, 1); return [x, my(L, x)]; };
  TV.mecha = function (g, L, k, t, viva, rota) {
    const y = L.tiraY + L.tiraH / 2;
    const xs = MX0 + (MX1 - MX0) * ZZ.lim(k, 0, 1);
    if (k > 0.01) {
      g.save(); g.setLineDash([2, 12]);
      caminoMecha(g, L, MX0, xs); T.linea(g, 6, T.mezcla(T.PAPEL, T.TINTA, 0.42));
      g.restore();
    }
    if (k < 0.995) {
      T.tubo(g, c => caminoMecha(c, L, xs, MX1 + 24), '#D8A75C', 7, 4);
      g.save(); g.setLineDash([4, 14]); caminoMecha(g, L, xs, MX1 + 24); T.linea(g, 3, '#8A5A22'); g.restore();
    }
    if (rota) {
      // la bomba ya estalló: queda la marca
      T.estrella(g, 616, y + 2, 40, 17, 9, 0.3); T.pinta(g, T.TINTA, 0);
      T.estrella(g, 616, y + 2, 22, 9, 9, 0.6); T.pinta(g, '#4A4658', 0);
      for (const [dx, dy, r] of [[-26, -30, 12], [6, -40, 15], [30, -26, 11]]) {
        const s = 1 + Math.sin(t * 0.07 + dx) * 0.1;
        g.save(); g.globalAlpha = 0.7; T.circ(g, 616 + dx, y + dy - (t % 90) * 0.12, r * s); T.pinta(g, '#D8D2C6', 4); g.restore();
      }
      return;
    }
    // bomba
    const tiemb = viva && k > 0.72 ? (Math.random() - 0.5) * 5 * (k - 0.6) * 2.5 : 0;
    const hincha = viva && k > 0.72 ? 1 + Math.abs(Math.sin(t * 0.5)) * 0.07 * (k - 0.6) * 2.5 : 1;
    g.save(); g.translate(616 + tiemb, y + 2 + tiemb * 0.6); g.scale(hincha, hincha);
    T.vol(g, c => T.rr(c, -46, -17, 20, 26, 6), '#8B8798', { dx: -2, dy: -3, w: 5.5 });
    const cam = c => T.circ(c, 0, 0, 31);
    T.sombra(g, cam, 0, 6, 0.3);
    T.vol(g, cam, '#3A3350', { sombra: T.TINTA, dx: -6, dy: -8, w: 6 });
    g.beginPath(); g.arc(0, 0, 20, Math.PI * 1.08, Math.PI * 1.42); T.linea(g, 5.5, T.PAPEL);
    g.restore();
    // chispa
    if (viva && k < 0.995) {
      const [x, yy] = [xs, my(L, xs)];
      T.estrella(g, x, yy, 19 + Math.sin(t * 0.9) * 4, 8, 7, t * 0.21); T.pinta(g, T.AMARILLO, 4.5);
      T.estrella(g, x, yy, 8, 3.5, 5, -t * 0.3); T.pinta(g, '#FFFFFF', 0);
    } else if (!viva) {
      T.circ(g, MX0, my(L, MX0), 6); T.pinta(g, T.TINTA, 0);
      if (k > 0.02 && k < 0.995) {
        // se acabó antes de tiempo: la chispa se apaga con un poco de humo
        const yy = my(L, xs);
        for (const [dx, dy, r] of [[0, -4, 11], [10, -17, 8], [-6, -24, 6]]) { T.circ(g, xs + dx, yy + dy, r); T.pinta(g, '#D8D2C6', 4); }
      }
    }
  };

  // --- placas de los jugadores ----------------------------------------------------
  // d: { nombre, etiqueta, aviso, vivo, puntos, pips: [1|-1|0…], rondas, aspecto, expr, t, golpe, color }
  TV.placa = function (g, x, y, w, h, d) {
    const cam = c => T.rr(c, x, y, w, h, Math.min(30, h / 2.6));
    T.sombra(g, cam, 0, 9, 1);
    cam(g); T.pinta(g, T.PAPEL, 6);
    const r = h / 2 - 7, cx = x + r + 9, cy = y + h / 2;
    g.save();
    T.circ(g, cx, cy, r); g.fillStyle = d.color || T.AZUL; g.fill(); g.clip();
    g.fillStyle = T.trama(g, T.mezcla(d.color || T.AZUL, T.TINTA, 0.22), 9, 2); g.fillRect(cx - r, cy - r, r * 2, r * 2);
    ZZ.personaje.busto(g, cx, cy + r * 0.2, r / 70, d.aspecto, d.expr || 'neutro', d.t || 0, { golpe: d.golpe || 0 });
    g.restore();
    T.circ(g, cx, cy, r); T.linea(g, 5.5);
    const tx = cx + r + 16;
    const tn = Math.min(34, h * 0.36);
    T.texto(g, d.nombre, tx, y + h * 0.36, tn, { al: 'left', color: T.TINTA, w: 0 });
    // etiqueta: EN DIRECTO / EN DIFERIDO
    if (d.etiqueta) {
      const te = Math.min(19, h * 0.21), an = T.ancho(g, d.etiqueta, te, T.F_UI, 900) + 40;
      const ey = y + h * 0.72;
      T.rr(g, tx - 2, ey - te * 0.85, an, te * 1.7, te * 0.85); T.pinta(g, d.vivo ? T.ROJO : T.TINTA, 0);
      T.circ(g, tx + 13, ey, te * 0.3); g.fillStyle = d.vivo ? '#FFFFFF' : T.AMARILLO;
      if (!d.vivo || (d.t >> 4) % 2) g.fill();
      T.texto(g, d.etiqueta, tx + 26, ey + 1, te, { al: 'left', fuente: T.F_UI, peso: 900, w: 0, color: T.PAPEL });
    }
    if (d.sub) T.texto(g, d.sub, tx, y + h * 0.72, Math.min(21, h * 0.2), { al: 'left', fuente: T.F_UI, peso: 700, w: 0, color: T.TINTA });
    // puntos del canal en curso
    if (d.puntos !== null && d.puntos !== undefined) {
      const tp = Math.min(44, h * 0.46), ap = Math.max(T.ancho(g, String(d.puntos), tp), tp * 1.3) + 30;
      T.rr(g, x + w - 14 - ap, y + h * 0.4 - tp * 0.68, ap, tp * 1.36, tp * 0.5); T.pinta(g, T.TINTA, 0);
      T.texto(g, String(d.puntos), x + w - 14 - ap / 2, y + h * 0.4 + 2, tp, { color: T.AMARILLO, w: 0 });
    }
    // canales ganados
    if (d.pips) {
      const n = d.pips.length, pr = Math.min(16, h * 0.15), px0 = x + w - 34 - (n - 1) * (pr * 2 + 8), py = y + h * 0.78;
      for (let i = 0; i < n; i++) {
        const v = d.pips[i];
        T.circ(g, px0 + i * (pr * 2 + 8), py, pr);
        T.pinta(g, v > 0 ? T.AMARILLO : v < 0 ? T.mezcla(T.PAPEL, T.TINTA, 0.5) : T.PAPEL, 4.5);
        if (v > 0) { T.estrella(g, px0 + i * (pr * 2 + 8), py, pr * 0.62, pr * 0.28, 5); T.pinta(g, T.TINTA, 0); }
      }
    }
  };

  // --- nieve del zapeo --------------------------------------------------------------
  let ruido = null;
  function hazRuido() {
    ruido = [];
    for (let k = 0; k < 5; k++) {
      const c = document.createElement('canvas');
      c.width = 108; c.height = 141;
      const x = c.getContext('2d');
      const tonos = ['#2B2536', '#4A4658', '#4A4658', '#6E6A7E', '#6E6A7E', '#8B8798', '#B9B4C4'];
      for (let i = 0; i < 108; i++) for (let j = 0; j < 141; j++) {
        x.fillStyle = tonos[(Math.random() * tonos.length) | 0];
        x.fillRect(i, j, 1, 1);
      }
      ruido.push(c);
    }
  }
  TV.nieve = function (g, t, alfa) {
    if (!ruido) hazRuido();
    alfa = alfa === undefined ? 1 : alfa;
    g.save();
    g.imageSmoothingEnabled = false;
    g.globalAlpha = alfa;
    g.drawImage(ruido[t % ruido.length], -((t * 37) % 12), -((t * 53) % 12), ZZ.PW + 12, ZZ.PH + 12);
    g.fillStyle = T.TINTA;
    g.globalAlpha = 0.22 * alfa;
    for (let yy = (t * 3) % 8; yy < ZZ.PH; yy += 8) g.fillRect(0, yy, ZZ.PW, 3);     // líneas de barrido
    g.globalAlpha = 0.55 * alfa;
    const y = (t * 31) % (ZZ.PH + 160) - 80;
    g.fillRect(0, y, ZZ.PW, 54);
    g.fillRect(0, (y + 410) % ZZ.PH, ZZ.PW, 20);
    g.restore();
  };

  // --- número y nombre del canal, arriba a la izquierda -------------------------------
  TV.mosca = function (g, canal, extra) {
    const x = 18, y = 18;
    const an = T.ancho(g, canal.nombre, 25, T.F_UI, 900);
    T.rr(g, x + 40, y + 8, an + 62, 44, 14); T.pinta(g, T.TINTA, 0);
    T.texto(g, canal.nombre, x + 84, y + 31, 25, { al: 'left', fuente: T.F_UI, peso: 900, w: 0, color: T.PAPEL });
    T.rr(g, x, y, 70, 60, 16); T.pinta(g, canal.color, 5.5);
    T.texto(g, String(canal.num), x + 35, y + 32, 38, { w: 6, color: T.PAPEL, ds: 2 });
    if (extra) {
      const a2 = T.ancho(g, extra, 21, T.F_UI, 900);
      T.rr(g, ZZ.PW - a2 - 118, y + 8, a2 + 30, 40, 13); T.pinta(g, T.TINTA, 0);
      T.texto(g, extra, ZZ.PW - a2 - 103, y + 29, 21, { al: 'left', fuente: T.F_UI, peso: 900, w: 0, color: T.AMARILLO });
    }
  };

  // --- rótulo inferior, como en la tele --------------------------------------------------
  TV.rotulo = function (g, canal, k) {
    if (k <= 0) return;
    const tam = 23, an = T.ancho(g, canal.rotulo, tam, T.F_UI, 700) + 40;
    const x = -(an + 90) + (an + 90 + 14) * ZZ.e.out3(Math.min(1, k)), y = ZZ.PH - 78;
    T.rr(g, x + 46, y + 4, an + 20, 46, 8); T.pinta(g, T.TINTA, 0);
    T.rr(g, x + 40, y - 2, an + 20, 46, 8); T.pinta(g, T.PAPEL, 5);
    T.texto(g, canal.rotulo, x + 78, y + 22, tam, { al: 'left', fuente: T.F_UI, peso: 700, w: 0, color: T.TINTA });
    T.rr(g, x, y - 8, 62, 58, 10); T.pinta(g, canal.color, 5);
    T.texto(g, String(canal.num), x + 31, y + 22, 32, { w: 5, ds: 2 });
  };

  // --- la orden: un verbo enorme que entra de golpe ------------------------------------------
  TV.orden = function (g, canal, te, total, t) {
    const kin = Math.min(1, te / 10), kout = te > total - 10 ? (te - (total - 10)) / 10 : 0;
    let esc = kin < 1 ? ZZ.mix(3.2, 1, ZZ.e.out3(kin)) : 1 + Math.sin(t * 0.45) * 0.025;
    esc *= 1 + kout * 0.7;
    g.save();
    g.fillStyle = TV.VELO; g.globalAlpha = 0.6 * Math.min(1, kin * 2) * (1 - kout);
    g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.globalAlpha = 1 - kout;
    g.translate(ZZ.PW / 2, 392); g.rotate(-0.075); g.scale(esc, esc);
    T.sombra(g, c => estallidoCamino(c, 282, 13, canal.num), 8, 12, 1);
    estallidoCamino(g, 282, 13, canal.num); T.pinta(g, canal.color2, 8);
    let tam = 150;
    const an = T.ancho(g, canal.orden, tam);
    if (an > 384) tam *= 384 / an;
    T.texto(g, canal.orden, 0, 4, tam, { color: T.PAPEL, w: tam * 0.18, ds: tam * 0.07 });
    g.restore();
    if (kin >= 1 && kout === 0 && canal.pista) {
      const a2 = T.ancho(g, canal.pista, 25, T.F_UI, 700) + 44;
      const ka = Math.min(1, (te - 10) / 7);
      g.save(); g.globalAlpha = ka; g.translate(ZZ.PW / 2, 640 + (1 - ka) * 20);
      T.rr(g, -a2 / 2, -27, a2, 54, 27); T.pinta(g, T.TINTA, 0);
      T.texto(g, canal.pista, 0, 1, 25, { fuente: T.F_UI, peso: 700, w: 0, color: T.PAPEL });
      g.restore();
    }
  };
  function estallidoCamino(g, R, n, semilla) {
    const rng = ZZ.azar(semilla);
    g.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = 0.1 + i * Math.PI / n;
      const rr = i % 2 ? R * (0.74 + rng() * 0.06) : R * (0.94 + rng() * 0.12);
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.8;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath();
  }

  // --- botones ----------------------------------------------------------------------
  TV.boton = function (g, b) {
    const baja = b.pulsado ? 9 : 0, r = Math.min(28, b.h / 2.3);
    T.rr(g, b.x, b.y + 11, b.w, b.h, r); T.pinta(g, T.TINTA, 6);
    const cam = c => T.rr(c, b.x, b.y + baja, b.w, b.h, r);
    T.vol(g, cam, b.color, { dx: 0, dy: -8, w: 6 });
    const tam = b.tam || b.h * 0.46;
    T.texto(g, b.txt, b.x + b.w / 2, b.y + b.h / 2 + baja + 2, tam, { color: b.ctxt || T.PAPEL, w: b.ctxt ? 0 : tam * 0.17, ds: 3, fuente: b.fuente, peso: b.peso });
  };

  // Sello girado, como un tampón.
  TV.sello = function (g, txt, x, y, tam, color, k) {
    const s = k < 1 ? ZZ.mix(2.6, 1, ZZ.e.out3(k)) : 1;
    g.save(); g.translate(x, y); g.rotate(-0.13); g.scale(s, s); g.globalAlpha = Math.min(1, k * 2);
    const an = T.ancho(g, txt, tam) + 56;
    T.rr(g, -an / 2 + 7, -tam * 0.72 + 9, an, tam * 1.44, 18); T.pinta(g, T.TINTA, 6);
    T.rr(g, -an / 2, -tam * 0.72, an, tam * 1.44, 18); T.pinta(g, color, 7);
    T.texto(g, txt, 0, 3, tam, { w: tam * 0.16, ds: 3 });
    g.restore();
  };
})();
//# sourceURL=zz/tele.js
</script>
<script>
/* ZikZak · red
   Para jugar en directo con otra persona que tenga la página abierta a la vez.
   Usa la sala de la página (la capacidad `room`) y solo su parte de «presencia»: cada móvil publica
   su estado entero (a quién reta, por qué canal va, cuántos puntos lleva) y lee el del otro.
   No hay servidor de juego: cada uno hace su prueba en su móvil, con la misma semilla, y se comparan.
   Lo que llega del otro móvil se trata como dato sin fiar: se limpia antes de usarlo.
   En este equipo, sin la plataforma, hay una sala de mentira entre pestañas para poder probar. */
(function () {
  'use strict';
  const ZZ = window.ZZ;
  const R = ZZ.red = { estado: 'sin', sala: null, yo: {} };

  const NOMBRES = ['MANDO', 'ZAPEO', 'ANTENA', 'PALOMITA', 'SOFÁ', 'SINTONÍA', 'PARABÓLICA', 'CORTINILLA', 'TELETEXTO', 'PLATÓ', 'FOCO', 'CLAQUETA'];
  R.aliasNuevo = () => NOMBRES[(Math.random() * NOMBRES.length) | 0] + ' ' + (10 + ((Math.random() * 90) | 0));

  // --- sala de mentira, solo en este equipo -------------------------------------------
  function salaLocal() {
    const yo = 'p' + Math.random().toString(36).slice(2, 10);
    const canal = new BroadcastChannel('zz-sala');
    const otros = new Map();
    let mio = {};
    const manda = () => canal.postMessage({ peer: yo, presence: mio });
    canal.onmessage = ev => {
      const m = ev.data;
      if (!m || !m.peer || m.peer === yo) return;
      if (m.adios) otros.delete(m.peer); else otros.set(m.peer, { presence: m.presence || {}, visto: Date.now() });
    };
    setInterval(manda, 400);
    window.addEventListener('pagehide', () => canal.postMessage({ peer: yo, adios: true }));
    return {
      presence(patch) {
        const n = Object.assign({}, mio);
        for (const k in patch) { if (patch[k] === null) delete n[k]; else n[k] = patch[k]; }
        mio = n; manda();
        return Promise.resolve();
      },
      peers() {
        const ahora = Date.now();
        const l = [{ peer: yo, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: mio }];
        for (const [peer, o] of otros) {
          if (ahora - o.visto > 2500) { otros.delete(peer); continue; }
          l.push({ peer, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: o.presence });
        }
        return l;
      },
      connected() { return true; },
    };
  }

  // --- sala por el tiempo real de Supabase: para la página alojada fuera de claude.ai ---------
  // Un solo canal para todos. Cada móvil repite su estado entero por él; quien calla unos segundos, se da por ido.
  function salaSupabase(cfg) {
    const yo = 'p' + Math.random().toString(36).slice(2, 12);
    // Sala privada: su nombre va en el enlace (#sala-xxxx). Solo se ven quienes abren ese mismo enlace.
    let cod = (/^#sala-([a-z0-9]{8,24})$/.exec(location.hash) || [])[1];
    try { if (!cod) cod = localStorage.getItem('zz-sala'); } catch (e) { /* nada */ }
    if (!cod || !/^[a-z0-9]{8,24}$/.test(cod)) {
      const v = new Uint8Array(12); crypto.getRandomValues(v);
      cod = Array.from(v, x => 'abcdefghjkmnpqrstuvwxyz23456789'[x % 31]).join('');
    }
    try { localStorage.setItem('zz-sala', cod); } catch (e) { /* nada */ }
    try { history.replaceState(null, '', '#sala-' + cod); } catch (e) { location.hash = 'sala-' + cod; }
    R.codigoSala = cod;
    const tema = 'realtime:zz-' + cod;
    const otros = new Map();
    let mio = {}, ws = null, ref = 0, unido = false, pendiente = false, ultimoEnvio = 0;
    const manda = (topic, event, payload) => { try { ws.send(JSON.stringify({ topic, event, payload, ref: String(++ref) })); } catch (e) { /* nada */ } };
    const emite = datos => { ultimoEnvio = Date.now(); manda(tema, 'broadcast', { type: 'broadcast', event: 'e', payload: datos || { peer: yo, presence: mio } }); };
    function abre() {
      unido = false;
      try { ws = new WebSocket(cfg.url.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(cfg.clave) + '&vsn=1.0.0'); } catch (e) { return; }
      ws.onopen = () => manda(tema, 'phx_join', { config: { broadcast: { ack: false, self: false }, presence: { key: '' }, postgres_changes: [], private: false } });
      ws.onmessage = ev => {
        let m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.event === 'phx_reply' && m.topic === tema && m.payload && m.payload.status === 'ok') { if (!unido) { unido = true; emite(); } }
        else if (m.event === 'phx_reply' && m.topic === tema && m.payload && m.payload.status === 'error') R.error = JSON.stringify(m.payload.response || '').slice(0, 120);
        else if (m.event === 'broadcast' && m.payload && m.payload.event === 'e') {
          const d = m.payload.payload;
          if (!d || typeof d.peer !== 'string' || d.peer === yo) return;
          const quien = d.peer.slice(0, 24);
          if (d.adios) otros.delete(quien);
          else otros.set(quien, { presence: d.presence && typeof d.presence === 'object' ? d.presence : {}, visto: Date.now() });
        }
      };

<script>
/* ZikZak · código de reto
   Una partida entera cabe en un texto corto: la semilla y lo que tocó quien jugó.
   Quien pega ese texto en su ZikZak juega contra esa partida, repetida paso a paso en su móvil.
   No hace falta cuenta, sala ni servidor: el texto viaja por donde quiera quien lo manda.
   Lo que se lee de un código es un dato sin fiar: se comprueba todo y, si algo no cuadra, no vale. */
(function () {
  'use strict';
  const ZZ = window.ZZ, C = ZZ.codigo = {};
  const IDS = ['cocina', 'tiempo', 'western', 'concurso', 'teletienda', 'bricolaje', 'documental', 'musical'];      // este orden va dentro de los códigos: no se cambia
  const TIPOS = ['d', 'm', 'u'];
  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

  function aTexto(b) {
    let s = '';
    for (let i = 0; i < b.length; i += 3) {
      const n = (b[i] << 16) | ((b[i + 1] || 0) << 8) | (b[i + 2] || 0);
      s += B64[n >> 18] + B64[(n >> 12) & 63];
      if (i + 1 < b.length) s += B64[(n >> 6) & 63];
      if (i + 2 < b.length) s += B64[n & 63];
    }
    return s;
  }
  function aBytes(s) {
    const out = [];
    let n = 0, bits = 0;
    for (const ch of s) {
      const v = B64.indexOf(ch);

      n = (n << 6) | v; bits += 6;

    }

  C.crea = function (d) {
    const b = [1, d.pinta & 255];
    const al = Array.from(new TextEncoder().encode(String(d.alias || '').slice(0, 14)));
    b.push(al.length);
    for (const v of al) b.push(v);
    b.push((d.semilla >>> 24) & 255, (d.semilla >>> 16) & 255, (d.semilla >>> 8) & 255, d.semilla & 255);
    for (const r of d.rondas) {
      // en los canales de tocar solo cuenta dónde y cuándo se toca
      const ev = ZZ.canales[r.id].arrastra ? r.grab : r.grab.filter(e => e[1] === 'd');
      b.push(IDS.indexOf(r.id), r.nivel, (ev.length >> 8) & 255, ev.length & 255);
      let ps = 0, px = 0, py = 0;
      for (const e of ev) {
        const t = TIPOS.indexOf(e[1]), ds = e[0] - ps, dx = e[2] - px, dy = e[3] - py;
        if (ds >= 0 && ds < 63 && dx >= -127 && dx <= 127 && dy >= -127 && dy <= 127) b.push((t << 6) | ds, dx + 128, dy + 128);
        else b.push((t << 6) | 63, e[0] >> 8, e[0] & 255, e[2] >> 8, e[2] & 255, e[3] >> 8, e[3] & 255);
        ps = e[0]; px = e[2]; py = e[3];
      }
    }
    const s = suma(b, b.length);
    b.push(s >> 8, s & 255);
    return 'ZZ1-' + aTexto(b);
  };

  // Devuelve { alias, pinta, semilla, rondas } o null si el texto no es un código válido.
  C.lee = function (txt) {
    const m = /ZZ1-([A-Za-z0-9_-]+)/.exec(String(txt || '').replace(/\s+/g, ''));
    if (!m) return null;
    const b = aBytes(m[1]);
    if (!b || b.length < 24 || b.length > 12000) return null;
    const fin = b.length - 2;
    if (suma(b, fin) !== ((b[fin] << 8) | b[fin + 1])) return null;
    let i = 0;
    const uno = () => (i < fin ? b[i++] : -1);
    if (uno() !== 1) return null;
    const pinta = uno() % 5, n = uno();
    if (n < 0 || n > 60 || i + n > fin) return null;
    let alias = '';
    try { alias = new TextDecoder().decode(new Uint8Array(b.slice(i, i + n))); } catch (e) { alias = ''; }
    i += n;
    const semilla = ((uno() << 24) | (uno() << 16) | (uno() << 8) | uno()) >>> 0;
    const rondas = [];
    for (let k = 0; k < 3; k++) {
      const id = IDS[uno()], nivel = uno(), cuantos = (uno() << 8) | uno();
      if (!id || !ZZ.canales[id] || nivel < 1 || nivel > 3 || cuantos < 0 || cuantos > 1500) return null;
      const grab = [];
      let ps = 0, px = 0, py = 0;
      for (let j = 0; j < cuantos; j++) {
        const c0 = uno(), t = TIPOS[c0 >> 6];
        if (c0 < 0 || !t) return null;

    return { alias, pinta, semilla, rondas };
  };
})();

<script>
/* ZikZak · la aplicación

(function () {

  // Por turnos, en el mismo móvil: primero juega una persona y luego la otra, contra su grabación.
  function creaTurnos() {
    const def = defVivo();
    return { tipo: 'turnos', fase: 1, semilla: def.s, yoNombre: 'JUGADOR 1', pintas: [perfil.pinta, (perfil.pinta + 1) % P.PINTAS.length],
      rondas: rondasDe(def), rival: null, i: 0, res: [], pts: [] };
  }
  // En directo: cada uno en su móvil, con los mismos retos. `o` es lo que publica el otro.
  function creaVivo(def, o) {
    return { tipo: 'vivo', semilla: def.s, rondas: rondasDe(def), peer: o.peer, rv: o, visto: A.t, mSeq: o.m[0], misPts: [], i: 0, res: [], pts: [],
      rival: { nombre: o.alias, etiqueta: 'EN DIRECTO', vivo: true, sub: 'Juega ahora mismo: desde su móvil', aspecto: P.PINTAS[o.pinta], color: T.ROJO } };
  }
  // A distancia: quien crea el reto juega solo y se lleva un código; quien lo pega juega contra esa partida.
  function creaReto() { const def = defVivo(); return { tipo: 'reto', semilla: def.s, rondas: rondasDe(def), rival: null, i: 0, res: [], pts: [] }; }
  function creaRetado(c) {
    return { tipo: 'retado', semilla: c.semilla, rondas: c.rondas.map(r => ({ id: r.id, nivel: r.nivel, semilla: r.semilla, grab: r.grab })), i: 0, res: [], pts: [],
      rival: { nombre: aliasLimpio(c.alias), etiqueta: 'EN DIFERIDO', sub: 'Su reto: grabado en su móvil', aspecto: P.PINTAS[c.pinta % P.PINTAS.length], color: T.MENTA } };
  }
  const F_ROTULO = 34;      // lo que dura el rótulo del programa antes de la orden
  function empiezaRonda() {
    const d = A.duelo, def = d.rondas[d.i], canal = ZZ.canales[def.id];
    A.ronda = {
      canal, nivel: def.nivel, semilla: def.semilla,
      yo: new ZZ.Partida(canal, def.semilla, def.nivel),
      rival: def.grab ? new ZZ.Repeticion(canal, def.semilla, def.nivel, def.grab) : null,
      vis: { t: 0, n: 0, esc: A.s, ch: new T.Chispas(), temblor: 0, parada: 0 },
      pYo: 0, pRival: 0, gana: 0, agotado: false,
      fOrden: (perfil.vistos[def.id] || 0) < 2 ? 132 : 66,   // las dos primeras veces, más tiempo para leer la pista
    };
    perfil.vistos[def.id] = (perfil.vistos[def.id] || 0) + 1;
    guardaPerfil();
    A.cola.length = 0; A.dedo = null;
    if (d.tipo === 'vivo') { d.pEnv = 0; publica({ est: 'duelo', a: d.peer, i: d.i, f: 'juego', p: 0 }); }
    ir('zap');
  }
  function vivo() {
    const r = A.ronda, v = r.vis;
    v.t++;
    r.canal.efectos(r.yo.e, v, [], null);
    v.ch.paso();
    if (v.temblor > 0) v.temblor--;
  }
  function escena(gg, sinMosca) {
    const r = A.ronda, v = r.vis;
    v.esc = A.s;
    gg.save();
    if (v.temblor > 0) gg.translate((Math.random() - 0.5) * v.temblor * 1.5, (Math.random() - 0.5) * v.temblor * 1.5);
    r.canal.dibuja(gg, r.yo.e, v);
    gg.restore();
    if (!sinMosca) TV.mosca(gg, r.canal);
    // el rótulo del programa sale solo, antes de la orden, y se va: durante el juego no tapa nada
    if (A.est === 'orden' && A.te < F_ROTULO) TV.rotulo(gg, r.canal, Math.min(1, A.te / 8, (F_ROTULO - A.te) / 7));
  }
  function finRonda() {
    const r = A.ronda;
    son.calla();
    r.pYo = r.yo.puntos();
    r.agotado = r.yo.n >= ZZ.PASOS;
    if (r.rival) {
      r.pRival = r.rival.hastaElFinal();
      r.gana = r.pYo > r.pRival ? 1 : r.pYo < r.pRival ? -1 : 0;
    }
    if (A.duelo.tipo === 'vivo') { const d = A.duelo; d.misPts[d.i] = r.pYo; publica({ f: 'hecho', p: r.pYo, r: d.misPts.slice() }); }
    ir('remate');
  }
  function sigue() {
    const d = A.duelo;
    d.rondas[d.i].mia = A.ronda.yo.grab;
    if (!d.rival) d.pts[d.i] = [A.ronda.pYo, 0];
    d.i++;
    if (d.i < d.rondas.length) {
      if (d.tipo === 'vivo') { publica({ est: 'duelo', a: d.peer, i: d.i, f: 'listo', p: 0 }); ir('listos'); } else empiezaRonda();
      return;
    }
    if (d.tipo === 'turnos' && d.fase === 1) {
      // ha jugado la primera persona: su turno queda grabado y le toca a la segunda
      d.fase = 2; d.i = 0; d.res = []; d.pts = [];
      d.rondas.forEach(r => { r.grab = r.mia; r.mia = null; });
      d.rival = { nombre: 'JUGADOR 1', etiqueta: 'EN DIFERIDO', sub: 'Su turno: grabado hace un momento', aspecto: P.PINTAS[d.pintas[0] % P.PINTAS.length], color: T.MENTA };
      d.yoNombre = 'JUGADOR 2';
      ir('pase');
      return;
    }
    if (d.tipo === 'reto') {
      // mi partida, convertida en un texto que se puede mandar
      A.codigo = ZZ.codigo.crea({ alias: perfil.alias, pinta: perfil.pinta, semilla: d.semilla, rondas: d.rondas.map(r => ({ id: r.id, nivel: r.nivel, grab: r.mia })) });
      A.misPts = d.pts.map(x => x[0]);
      ir('codListo');
      return;
    }
    const mias = d.res.filter(v => v > 0).length, suyas = d.res.filter(v => v < 0).length;
    const tot = d.pts.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0, 0]);
    const gana = mias !== suyas ? Math.sign(mias - suyas) : Math.sign(tot[0] - tot[1]);
    const antes = perfil.cuota;
    if (d.tipo === 'casa' || d.tipo === 'yo') {
      perfil.duelos++;
      if (gana > 0) perfil.ganados++;
      if (d.tipo === 'casa') perfil.cuota = ZZ.lim(perfil.cuota + gana * 0.06, 0.1, 0.95);
      guardaPerfil();
      guarda.pon('ultimo', { semilla: d.semilla, pinta: perfil.pinta, rondas: d.rondas.map(r => ({ id: r.id, nivel: r.nivel, semilla: r.semilla, grab: r.mia })) });
    }
    A.final = { gana, mias, suyas, tot, antes, ahora: perfil.cuota };
    ir('final');
  }

  // --- en directo: seguir lo que publica el otro móvil -------------------------------------------
  function sigueRival() {
    const d = A.duelo;
    if (!d || d.tipo !== 'vivo' || A.est === 'final') return;
    const o = red.de(d.peer);
    if (o && (o.est === 'duelo' || o.est === 'reto') && o.a === red.miPeer()) {
      d.rv = o; d.visto = A.t;
      if (o.m[0] !== d.mSeq) { d.mSeq = o.m[0]; if (o.m[1] && A.est === 'juego') animo('rival', o.m[1]); }
    } else if (A.t - d.visto > 300) {
      // cuatro o cinco segundos sin noticias: se ha ido, y quien se va pierde
      for (let i = 0; i < d.rondas.length; i++) if (d.res[i] === undefined) { d.res[i] = 1; d.pts[i] = [d.misPts[i] || 0, 0]; }
      const tot = d.pts.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0, 0]);
      son.calla();
      A.final = { gana: 1, mias: d.res.filter(v => v > 0).length, suyas: d.res.filter(v => v < 0).length, tot, antes: perfil.cuota, ahora: perfil.cuota, ido: true };
      ir('final');
    }
  }

  // Texto en varias líneas.
  function parrafo(gg, txt, x, y, ancho, tam, color, centrado) {
    gg.save(); gg.font = '700 ' + tam + 'px ' + T.F_UI;
    const lineas = [];
    let ln = '';
    for (const pal of txt.split(' ')) {
      const t = ln ? ln + ' ' + pal : pal;
      if (ln && gg.measureText(t).width > ancho) { lineas.push(ln); ln = pal; } else ln = t;
    }
    if (ln) lineas.push(ln);
    gg.restore();
    lineas.forEach((l, i) => T.texto(gg, l, x, y + i * tam * 1.32, tam, ui(color, { peso: 700, al: centrado ? 'center' : 'left' })));
  }

  function fondoPantalla(gg, color, cx, cy) {
    gg.fillStyle = T.mezcla(color, T.TINTA, 0.42); gg.fillRect(0, 0, PW, PH);

    gg.fillStyle = T.trama(gg, T.mezcla(color, T.TINTA, 0.6), 14, 3); gg.fillRect(0, 0, PW, PH);
    gg.restore();
  }

  // --- búsqueda de rival y cara a cara ---------------------------------------------------------------
  const F_NADIE = 66, F_VS = 118, F_FIN = 270;
  EST.buscando = {
    entra() { A.color = T.VIOLETA; if (A.duelo.tipo === 'yo' || A.duelo.tipo === 'vivo' || A.duelo.tipo === 'retado') A.te = F_VS; },
    tic() {
      if (A.te === F_NADIE) son.fallo();
      if (A.te === F_VS) { son.orden(); A.temblor = 8; }
      const d = A.duelo;
      if (d.tipo === 'vivo') {
        // en directo se empieza cuando los dos están listos
        if (A.te === F_VS + 60) publica({ f: 'listo' });
        if (A.te > F_VS + 60 && d.rv && d.rv.f !== 'espera') empiezaRonda();
      } else if (A.te >= F_FIN) empiezaRonda();
    },
    toca() {
      if (A.te < F_VS) A.te = F_VS - 1;
      else if (A.duelo.tipo === 'vivo') A.te = Math.max(A.te, F_VS + 59);
      else if (A.te > F_VS + 30) A.te = F_FIN;
    },
    pinta(gg) {
      const d = A.duelo;
      if (A.te < F_VS) {
        fondoPantalla(gg, T.VIOLETA, 320, 350);
        const cx = 320, cy = 350;
        for (let i = 0; i < 3; i++) {
          const k = ((A.t * 0.012) + i / 3) % 1;
          T.circ(gg, cx, cy, 150 + k * 170); T.linea(gg, 11 - k * 9, T.AMARILLO);
        }
        T.circ(gg, cx, cy + 10, 146); T.pinta(gg, T.TINTA, 0);
        gg.save(); T.circ(gg, cx, cy, 146); gg.fillStyle = T.AZUL; gg.fill(); gg.clip();
        gg.fillStyle = T.trama(gg, T.mezcla(T.AZUL, T.TINTA, 0.25), 12, 2.6); gg.fillRect(cx - 150, cy - 150, 300, 300);
        P.busto(gg, cx, cy + 30, 1.85, miPinta(), A.te < F_NADIE ? 'tension' : 'triste', A.t, { mira: { x: Math.sin(A.t * 0.07), y: -0.2 } });
        gg.restore(); T.circ(gg, cx, cy, 146); T.linea(gg, 7);
        if (A.te < F_NADIE) {
          T.texto(gg, 'MESA DE PRUEBA', 320, 640, 44, { color: T.PAPEL });
          T.texto(gg, 'Sin apuesta. Buscando a alguien en directo…', 320, 704, 24, ui(T.PAPEL, { peso: 700 }));
        } else {
          TV.sello(gg, 'NADIE EN DIRECTO', 320, 640, 46, T.ROJO, (A.te - F_NADIE) / 8);
          T.texto(gg, 'Juegas contra Ajuste, el rival de la casa', 320, 730, 24, ui(T.PAPEL, { peso: 700 }));
        }
        return;
      }
      // cara a cara: dos viñetas cortadas en diagonal; cada uno con su gesto, inclinado hacia el otro
      const k = ZZ.e.out3(Math.min(1, (A.te - F_VS) / 14));
      const camR = c => T.poli(c, [[0, 0], [PW, 0], [PW, 330], [0, 510]]);
      const camY = c => T.poli(c, [[0, 510], [PW, 330], [PW, PH], [0, PH]]);
      const gR = P.gesto(d.rival.aspecto, 'reto'), gY = P.gesto(miPinta(), 'reto');
      gg.save(); camR(gg); gg.clip();
      gg.fillStyle = T.mezcla(d.rival.color, T.PAPEL, 0.12); gg.fillRect(0, 0, PW, PH);
      T.rayos(gg, 430, 230, 900, 14, 0.2, T.mezcla(d.rival.color, T.TINTA, 0.16));
      gg.fillStyle = T.trama(gg, T.mezcla(d.rival.color, T.TINTA, 0.3), 14, 3.2); gg.fillRect(0, 0, PW, PH);
      gg.save(); gg.translate(474 + (1 - k) * 460, 548); gg.rotate(-0.1);
      P.entero(gg, 0, 0, 1.96, d.rival.aspecto, gR[1], A.t, gR[0]);
      gg.restore(); gg.restore();
      // mi viñeta va en azul marino: así destaca cualquier ropa, también la azul
      gg.save(); camY(gg); gg.clip();
      gg.fillStyle = T.mezcla(T.AZUL, T.TINTA, 0.5); gg.fillRect(0, 0, PW, PH);
      T.rayos(gg, 220, 640, 900, 14, 0.5, T.mezcla(T.AZUL, T.TINTA, 0.36));
      gg.fillStyle = T.trama(gg, T.mezcla(T.AZUL, T.TINTA, 0.68), 14, 3.2); gg.fillRect(0, 0, PW, PH);
      gg.save(); gg.translate(176 - (1 - k) * 460, 1050); gg.rotate(0.1);
      P.entero(gg, 0, 0, 2.1, miPinta(), gY[1], A.t, gY[0]);
      gg.restore(); gg.restore();
      gg.beginPath(); gg.moveTo(-10, 513); gg.lineTo(PW + 10, 327); T.linea(gg, 12);
      // nombres
      gg.save(); gg.translate(28 - (1 - k) * 400, 0);
      T.texto(gg, d.rival.nombre, 0, 92, d.rival.nombre.length > 7 ? 40 : 56, { al: 'left', color: T.PAPEL });
      etiqueta(gg, 2, 146, d.rival.etiqueta, !!d.rival.vivo);
      const sub = d.rival.sub.split(': ');
      sub.forEach((ln, i) => T.texto(gg, ln + (i < sub.length - 1 ? ':' : ''), 4, 198 + i * 30, 22, ui(T.PAPEL, { al: 'left' })));

      gg.save(); gg.translate(320, 92); gg.rotate(-0.05); gg.scale(k, k);

})();

<script>
/* ZikZak · pruebas automáticas

   que la misma semilla y las mismas entradas dan siempre el mismo resultado. */
(function () {
  'use strict';
  const ZZ = window.ZZ;

  ZZ.pruebas = function (semillas) {

      const canal = ZZ.canales[id];

        const medias = {};
        for (const d of [0.1, 0.3, 0.5, 0.7, 0.9]) {

            const b = ZZ.grabaCasa(canal, sem, nivel, d);
            anota(a.puntos === b.puntos && a.grab.length === b.grab.length, id + nivel + ' no repite con la misma semilla ' + sem);
            const rep = new ZZ.Repeticion(canal, sem, nivel, a.grab);
            const p = rep.hastaElFinal();
            anota(p === a.puntos, id + nivel + ' la repetición da ' + p + ' y la partida dio ' + a.puntos + ' (semilla ' + sem + ')');
            anota(a.puntos >= 0 && a.puntos <= 1000 && Number.isInteger(a.puntos), id + nivel + ' puntos fuera de rango: ' + a.puntos);
            anota(a.pasos <= ZZ.PASOS, id + nivel + ' dura más de la cuenta');
            suma += a.puntos; min = Math.min(min, a.puntos); max = Math.max(max, a.puntos);
            if (a.pasos < ZZ.PASOS) acabanAntes++;
          }
          medias[d] = Math.round(suma / semillas) + ' (' + min + '–' + max + ')';
        }
        // sin tocar nada no se puede ganar
        const quieta = new ZZ.Repeticion(canal, 12345, nivel, []).hastaElFinal();
        anota(quieta <= 100, id + nivel + ' da ' + quieta + ' puntos sin jugar');
        medias.quieta = quieta;
        tabla[id + ' n' + nivel] = medias;
      }
    }
    return { ok: fallos.length === 0, fallos: fallos.slice(0, 12), nFallos: fallos.length, tabla };
  };
})();
