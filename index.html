        if (A.te > 480) parrafo(gg, 'El servidor del directo no contesta. Mientras tanto podéis retaros con un código: «Con un amigo», «A distancia».', 320, 420, 500, 23, T.PAPEL, true);
      }
      else {
        T.texto(gg, (red.modo === 'web' ? 'Aquí sale quien ha abierto el enlace de tu sala' : 'Aquí sale quien tiene la página abierta ahora mismo'), 320, 134, 21, ui(T.PAPEL, { peso: 700 }));
        const gente = red.gente().slice(0, 4);
        if (!gente.length) {
          T.texto(gg, 'NADIE MÁS POR AQUÍ', 320, 320, 40, { color: T.PAPEL });
          parrafo(gg, (red.modo === 'web' && A.enlace > 0 ? 'Copiado. Pégalo en un mensaje: solo entra en tu sala quien abra ese enlace.' : red.modo === 'web' && A.enlace < 0 ? 'No se ha podido copiar solo. Usa «Compartir» del navegador: la dirección ya lleva tu sala.' : red.modo === 'web' ? 'Esta sala es solo tuya. Mándale su enlace a tu amigo o amiga y dile que entre en «Con un amigo» y «A la sala».' : 'Comparte la página con tu amigo o amiga desde el menú Compartir y dile que entre en «Con un amigo».'), 320, 384, 500, 23, T.PAPEL, true);
          if (red.modo === 'web') {
            boton(gg, 'enlace', 90, 470, 460, 96, A.enlace > 0 ? '¡COPIADO!' : 'COPIAR ENLACE', A.enlace > 0 ? T.AZUL : T.AMARILLO, () => {
              const fin = ok => { A.enlace = ok ? 1 : -1; };
              try { navigator.clipboard.writeText(location.href).then(() => fin(true), () => fin(false)); } catch (e) { fin(false); }
            }, { tam: 40 });
          }
        }
        gente.forEach((o, i) => {
          const y = 166 + i * 128;
          const meReta = o.est === 'reto' && o.a === yo, leReto = sl.reto === o.peer, ocupado = o.est === 'duelo' && o.a !== yo;
          T.rr(gg, 32, y + 9, 584, 112, 24); T.pinta(gg, T.TINTA, 6);
          T.rr(gg, 28, y, 584, 112, 24); T.pinta(gg, meReta ? T.AMARILLO : T.PAPEL, 6);
          gg.save(); T.circ(gg, 84, y + 56, 44); gg.fillStyle = T.AZUL; gg.fill(); gg.clip();
          P.busto(gg, 84, y + 66, 0.62, P.PINTAS[o.pinta], meReta ? 'contento' : 'neutro', A.t + i * 31);
          gg.restore(); T.circ(gg, 84, y + 56, 44); T.linea(gg, 5);
          T.texto(gg, o.alias, 142, y + 40, 27, { al: 'left', color: T.TINTA, w: 0 });
          const est = meReta ? '¡Te reta!' : leReto ? 'Esperando su respuesta…' : ocupado ? 'Está en un duelo' : o.est === 'menu' ? 'En el menú' : 'En la sala';
          T.texto(gg, (o.otra ? 'Tu otra pestaña · ' : '') + est, 142, y + 78, 19, ui(T.TINTA, { al: 'left', peso: 700 }));
          if (meReta) boton(gg, 'r' + i, 432, y + 22, 166, 60, 'ACEPTAR', T.MENTA, () => reta(o.peer), { tam: 24 });
          else if (leReto) boton(gg, 'r' + i, 432, y + 22, 166, 60, 'CANCELAR', T.TINTA, () => { sl.reto = null; publica({ est: 'sala', a: null }); }, { tam: 21 });
          else if (!ocupado) boton(gg, 'r' + i, 432, y + 22, 166, 60, 'RETAR', T.ROJO, () => reta(o.peer), { tam: 26 });
        });
      }
      T.texto(gg, 'Te ven como ' + perfil.alias, 40, 712, 22, ui(T.PAPEL, { al: 'left' }));
      boton(gg, 'alias', 40, 742, 260, 62, 'OTRO NOMBRE', T.AMARILLO, () => { perfil.alias = red.aliasNuevo(); guardaPerfil(); publica({}); }, { tam: 22, ctxt: T.TINTA, fuente: T.F_UI, peso: 900 });
      boton(gg, 'volver', 400, 742, 200, 62, 'VOLVER', T.TINTA, () => ir('titulo'), { tam: 26 });
    },
    fuera(gg, L) { miPlaca(gg, L, false); },
  };

  // --- resultado del duelo ----------------------------------------------------------------------------------
  // Por turnos siempre se celebra a quien gana, sea quien sea; en los demás modos se mira desde quien juega.
  const signoFinal = () => (A.duelo.tipo === 'turnos' ? Math.abs(A.final.gana) : A.final.gana);
  EST.final = {
    entra() {
      const g = signoFinal();
      A.color = g > 0 ? T.AMARILLO : g < 0 ? T.VIOLETA : T.AZUL;
      if (g > 0) { son.gana(); confetiLados(); } else if (g < 0) son.pierde(); else son.golpe();
    },
    tic() { if (signoFinal() > 0 && A.te % 40 === 20 && A.te < 200) confetiLados(); },
    pinta(gg) {
      const f = A.final, d = A.duelo, turnos = d.tipo === 'turnos', g = signoFinal();
      const base = g > 0 ? T.AMARILLO : g < 0 ? T.mezcla(T.VIOLETA, T.TINTA, 0.35) : T.AZUL;
      gg.fillStyle = base; gg.fillRect(0, 0, PW, PH);
      T.rayos(gg, 320, 420, 1000, 14, A.t * 0.006, T.mezcla(base, g > 0 ? T.ROJO : T.TINTA, 0.2));
      gg.save(); gg.globalAlpha = 0.5; gg.fillStyle = T.trama(gg, T.mezcla(base, T.TINTA, 0.3), 14, 3); gg.fillRect(0, 0, PW, PH); gg.restore();
      const k = ZZ.e.outBack(Math.min(1, A.te / 14));
      const titulo = turnos ? (f.gana > 0 ? '¡GANA EL 2!' : f.gana < 0 ? '¡GANA EL 1!' : 'EMPATE') : (f.gana > 0 ? '¡GANAS!' : f.gana < 0 ? 'PIERDES' : 'EMPATE');
      gg.save(); gg.translate(320, 92); gg.rotate(-0.05); gg.scale(k, k);
      T.texto(gg, titulo, 0, 0, turnos ? 84 : 104, { color: g > 0 ? T.ROJO : T.PAPEL, w: 19, ds: 8 });
      gg.restore();
      // a la izquierda y en grande, quien juega; por turnos, quien gana
      const cambio = turnos && f.gana < 0;
      const aIzq = cambio ? d.rival.aspecto : miPinta(), aDer = cambio ? miPinta() : d.rival.aspecto;
      const gIzq = P.gesto(aIzq, g > 0 ? 'gana' : g < 0 ? 'pierde' : 'reto');
      const gDer = P.gesto(aDer, g < 0 ? 'gana' : g > 0 ? 'pierde' : 'reto');
      // un medallón oscuro detrás de cada uno: así cualquier ropa destaca sobre cualquier fondo
      const medallon = (x, y, r) => {
        T.circ(gg, x + 6, y + 9, r); T.pinta(gg, T.TINTA, 0);
        T.circ(gg, x, y, r); T.pinta(gg, '#2B2536', 7);
        gg.save(); T.circ(gg, x, y, r - 4); gg.clip(); gg.fillStyle = T.trama(gg, '#463E62', 13, 2.8); gg.fillRect(x - r, y - r, r * 2, r * 2); gg.restore();
      };
      gg.save(); gg.beginPath(); gg.rect(0, 0, PW, 584); gg.clip();
      medallon(204, 404, 182); medallon(474, 436, 132);
      P.entero(gg, 468, g > 0 ? 690 : 742, g < 0 ? 1.5 : 1.4, aDer, gDer[1], A.t + 30, gDer[0]);
      P.entero(gg, 204, g < 0 ? 704 : 778, g < 0 ? 1.7 : 2.0, aIzq, gIzq[1], A.t, gIzq[0]);
      gg.restore();
      // la mesa
      T.rr(gg, -20, 574, PW + 40, 300, 0); T.pinta(gg, '#2B2536', 7);
      gg.fillStyle = T.PAPEL; gg.fillRect(0, 584, PW, 6);
      const nR = d.rondas.length, wR = (572 - (nR - 1) * 10) / nR;
      d.rondas.forEach((r, i) => {
        const c = ZZ.canales[r.id], x = 34 + i * (wR + 10), y = 610, v = d.res[i];
        const pt = turnos ? [d.pts[i][1], d.pts[i][0]] : d.pts[i];
        T.rr(gg, x + 5, y + 8, wR, 64, 16); T.pinta(gg, T.TINTA, 5);
        T.rr(gg, x, y, wR, 64, 16); T.pinta(gg, turnos || v > 0 ? T.PAPEL : T.mezcla(T.PAPEL, T.TINTA, 0.3), 5);
        if (nR > 3) {
          T.rr(gg, x + 7, y + 8, 40, 48, 11); T.pinta(gg, c.color, 4.5);
          T.texto(gg, String(c.num), x + 27, y + 33, 26, { w: 5, ds: 2 });
          T.texto(gg, String(pt[0]), x + 78, y + 21, 17, ui(T.TINTA));
          gg.fillStyle = T.TINTA; gg.fillRect(x + 58, y + 32, 40, 3);
          T.texto(gg, String(pt[1]), x + 78, y + 47, 17, ui(T.TINTA));
        } else {
          T.rr(gg, x + 8, y + 8, 48, 48, 12); T.pinta(gg, c.color, 4.5);
          T.texto(gg, String(c.num), x + 32, y + 33, 30, { w: 5, ds: 2 });
          T.texto(gg, pt[0] + '–' + pt[1], x + 120, y + 34, 19, ui(T.TINTA));
        }
      });
      const sube = f.ahora - f.antes, mar = f.mias + '–' + f.suyas + ' en canales';
      const linea = d.tipo === 'casa' ? mar + ' · cuota de pantalla ' + cuotaTxt(f.ahora) + (sube > 0 ? ' ▲' : sube < 0 ? ' ▼' : '')
        : d.tipo === 'yo' ? mar + ' · contra ti la cuota no cambia'
          : d.tipo === 'retado' ? mar + ' · contra el reto de ' + d.rival.nombre
          : turnos ? 'Canales ganados · Jugador 1: ' + f.suyas + ' · Jugador 2: ' + f.mias
            : f.ido ? 'Tu rival se ha ido: el duelo es tuyo' : mar + ' · en directo contra ' + d.rival.nombre;
      T.texto(gg, linea, 320, 706, 22, ui(T.PAPEL));
      if (A.te > 30) {
        if (turnos) {
          boton(gg, 'otraT', 36, 738, 340, 76, 'OTRA PARTIDA', T.ROJO, () => { A.duelo = creaTurnos(); ir('pase'); }, { tam: 30 });
          boton(gg, 'menu', 396, 738, 210, 76, 'MENÚ', T.AZUL, () => ir('titulo'), { tam: 28 });
        } else if (d.tipo === 'retado') {
          boton(gg, 'otroC', 36, 738, 340, 76, 'CREAR MI RETO', T.ROJO, () => { A.duelo = creaReto(); empiezaRonda(); }, { tam: 30 });
          boton(gg, 'menu', 396, 738, 210, 76, 'MENÚ', T.AZUL, () => ir('titulo'), { tam: 28 });
        } else if (d.tipo === 'vivo') {
          boton(gg, 'salaF', 36, 738, 340, 76, 'A LA SALA', T.ROJO, () => ir('sala'), { tam: 32 });
          boton(gg, 'menu', 396, 738, 210, 76, 'MENÚ', T.AZUL, () => ir('titulo'), { tam: 28 });
        } else {
          boton(gg, 'revancha', 36, 738, 268, 76, 'OTRO DUELO', T.ROJO, () => { A.duelo = creaDuelo('casa'); ir('buscando'); }, { tam: 30 });
          boton(gg, 'contrati2', 320, 738, 186, 76, 'CONTRA TI', T.MENTA, () => { A.duelo = creaDuelo('yo'); ir('buscando'); }, { tam: 21 });
          boton(gg, 'menu', 522, 738, 84, 76, 'MENÚ', T.AZUL, () => ir('titulo'), { tam: 18 });
        }
      }
    },
    fuera(gg, L) { placas(gg, L); },
  };

  // --- placas de arriba y de abajo --------------------------------------------------------------------------
  function medidasPlacas(L) {
    const hT = ZZ.lim(L.arriba - 24, 70, 140), hB = ZZ.lim(L.abajo - 34, 66, 140);
    return { hT, yT: Math.max(6, L.arriba - hT - 34), hB, yB: L.by + L.bh + 24 + Math.max(0, (L.abajo - 36 - hB) * 0.3) };
  }
  function placas(gg, L) {
    const d = A.duelo, r = A.ronda, m = medidasPlacas(L);
    if (!d) return;
    const jugando = A.est === 'juego' || A.est === 'remate' || A.est === 'marcador' || A.est === 'espera';
    // en directo, los puntos del rival son los que publica su móvil
    const suyos = () => { const o = d.rv; return !o ? 0 : o.r.length > d.i ? o.r[d.i] : o.i === d.i ? o.p : 0; };
    const enJuego = A.est === 'juego';
    const n = d.rondas.length;
    const pips = s => d.rondas.map((_, i) => (d.res[i] === undefined ? 0 : d.res[i] * s > 0 ? 1 : -1));
    if (d.rival) {
      TV.placa(gg, 30, m.yT, 660, m.hT, {
        nombre: d.rival.nombre, etiqueta: d.rival.etiqueta, vivo: !!d.rival.vivo, aspecto: d.rival.aspecto, color: d.rival.color,
        expr: exprDe('rival', enJuego ? 'tension' : 'neutro'), t: A.t + 77, golpe: A.caras.rival.golpe,
        puntos: !jugando || !r ? null : d.tipo === 'vivo' ? (A.est === 'marcador' ? r.pRival : suyos()) : r.rival ? (enJuego ? r.rival.puntos() : r.pRival) : null,
        pips: n > 1 ? pips(-1) : null,
      });
    } else if (d.tipo === 'turnos' || d.tipo === 'reto') {
      const h = Math.min(m.hT, 96), y = L.arriba - h - 22;
      T.rr(gg, 30, y + 9, 660, h, 26); T.pinta(gg, T.TINTA, 6);
      T.rr(gg, 30, y, 660, h, 26); T.pinta(gg, T.PAPEL, 6);
      T.texto(gg, d.tipo === 'reto' ? 'TU RETO' : 'POR TURNOS', 56, y + h / 2 + 2, Math.min(32, h * 0.38), { al: 'left', color: T.TINTA, w: 0 });
      T.texto(gg, d.tipo === 'reto' ? 'SE ESTÁ GRABANDO TU PARTIDA' : 'JUGADOR 2 ESPERA SU TURNO', 666, y + h / 2 + 1, 20, ui(T.TINTA, { al: 'right' }));
    } else if (r) {
      // ensayo: arriba va la ficha del canal en vez de un rival
      const h = Math.min(m.hT, 96), y = L.arriba - h - 22;
      T.rr(gg, 30, y + 9, 660, h, 26); T.pinta(gg, T.TINTA, 6);
      T.rr(gg, 30, y, 660, h, 26); T.pinta(gg, T.PAPEL, 6);
      T.texto(gg, 'ENSAYO', 56, y + h / 2 + 2, Math.min(34, h * 0.4), { al: 'left', color: T.TINTA, w: 0 });
      const an = T.ancho(gg, 'NIVEL ' + r.nivel, 22, T.F_UI, 900) + 36;
      T.rr(gg, 236, y + h / 2 - 22, an, 44, 22); T.pinta(gg, T.TINTA, 0);
      T.texto(gg, 'NIVEL ' + r.nivel, 236 + an / 2, y + h / 2 + 1, 22, ui(T.AMARILLO));
      const mej = perfil.mejores[r.canal.id + r.nivel] || 0;
      T.texto(gg, mej ? 'MEJOR MARCA: ' + mej : 'SIN MARCA TODAVÍA', 666, y + h / 2 + 1, 21, ui(T.TINTA, { al: 'right' }));
    }
    TV.placa(gg, 30, m.yB, 660, m.hB, {
      nombre: yoNombre(), aspecto: miPinta(), color: T.AZUL,
      expr: exprDe('yo', enJuego ? 'tension' : 'neutro'), t: A.t, golpe: A.caras.yo.golpe,
      puntos: jugando && r ? (enJuego ? r.yo.puntos() : r.pYo) : null, pips: n > 1 ? pips(1) : null,
      sub: d.tipo === 'ensayo' ? 'Sin rival y sin apuesta' : null,
    });
  }

  // =====================================================================================
  // BUCLE
  // =====================================================================================
  function tic() {
    A.t++; A.te++;
    sigueRival();
    const E = EST[A.est];
    if (E.tic) E.tic();
    A.ch.paso();
    if (A.temblor > 0) A.temblor--;
    A.caras.yo.golpe *= 0.86; A.caras.rival.golpe *= 0.86;
  }

  // El fondo y el aparato no cambian de un fotograma a otro: se dibujan una vez y se copian.
  const CON_ANTENAS = { carga: 1, titulo: 1, ensayo: 1, muestra: 1, amigo: 1, pase: 1, codListo: 1, codPega: 1 };
  let capaFija = null;
  function pintaFijo(dx, dy) {
    const antenas = !!CON_ANTENAS[A.est];
    const k = A.color + '|' + lienzo.width + '|' + lienzo.height + '|' + A.s + '|' + A.ox + '|' + antenas;
    if (!capaFija || capaFija.k !== k) {
      const c = (capaFija && capaFija.c) || document.createElement('canvas');
      c.width = lienzo.width; c.height = lienzo.height;
      const x = c.getContext('2d');
      x.setTransform(A.s, 0, 0, A.s, A.ox, 0);
      TV.fondo(x, A.L, A.color, 0);
      TV.cuerpo(x, A.L, antenas);
      capaFija = { k, c };
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
    if (dx || dy) { g.fillStyle = TV.colorFondo(A.color); g.fillRect(0, 0, lienzo.width, lienzo.height); }
    g.drawImage(capaFija.c, Math.round(dx * A.s), Math.round(dy * A.s));
  }

  function pinta() {
    const L = A.L, E = EST[A.est];
    colocaCaja();
    const tx = A.temblor > 0 ? (Math.random() - 0.5) * A.temblor * 1.4 : 0, ty = A.temblor > 0 ? (Math.random() - 0.5) * A.temblor * 1.4 : 0;
    pintaFijo(tx, ty);
    g.setTransform(A.s, 0, 0, A.s, A.ox, 0);
    A.botones.length = 0;
    g.save();
    g.translate(tx, ty);
    if (E.fuera) E.fuera(g, L);
    TV.pantalla(g, L, gg => E.pinta(gg));
    const r = A.ronda;
    const tras = r && (A.est === 'remate' || A.est === 'marcador');
    const k = r && (A.est === 'juego' || tras) ? (r.agotado ? 1 : r.yo.n / ZZ.pasosDe(r.canal)) : 0;
    TV.mecha(g, L, k, A.t, !!r && A.est === 'juego', !!(tras && r.agotado));
    g.restore();
    A.ch.dibuja(g, 0);
  }

  let antes = 0, acum = 0;
  function cuadro(ts) {
    if (!antes) antes = ts;
    acum += Math.min(100, ts - antes); antes = ts;
    const paso = 1000 / ZZ.HZ;
    let n = 0;
    if (ZZ.depura.pausa) acum = 0;
    while (acum >= paso && n < 5) { tic(); acum -= paso; n++; }
    if (acum > paso) acum = 0;
    pinta();
    requestAnimationFrame(cuadro);
  }

  window.addEventListener('resize', mide);
  if (window.ResizeObserver) new ResizeObserver(mide).observe(lienzo);
  mide();
  requestAnimationFrame(cuadro);
  red.inicia();
  publica({ est: 'menu' });

  // Las letras tardan un instante en llegar.
  const listo = () => { if (A.est === 'carga') ir('titulo'); };
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('40px "Bowlby One"'), document.fonts.load('900 20px Rubik'), document.fonts.load('700 20px Rubik')]).then(listo, listo);
    setTimeout(listo, 2500);
  } else listo();

  // Para las pruebas automáticas y para mirar una pantalla concreta.
  Object.assign(ZZ.depura, { ir, creaDuelo, creaEnsayo, creaTurnos, creaReto, empiezaRonda, EST, guarda, pinta, mide, pasos: n => { for (let i = 0; i < n; i++) tic(); mide(); pinta(); },
    // Manda el lienzo al servidor de este equipo, que lo guarda en .tmp/capturas/.
    captura: nombre => new Promise(res => { mide(); pinta(); lienzo.toBlob(b => fetch('/captura/' + nombre, { method: 'POST', body: b }).then(r => res(r.status), () => res(0)), 'image/png'); }) });
})();

</script>
<script>
/* ZikZak · pruebas automáticas
   Se lanzan desde la consola con ZZ.pruebas(). Comprueban lo que más adelante hará el servidor:
   que la misma semilla y las mismas entradas dan siempre el mismo resultado. */
(function () {
  'use strict';
  const ZZ = window.ZZ;

  ZZ.pruebas = function (semillas) {
    semillas = semillas || 40;
    const fallos = [], tabla = {};
    const anota = (ok, msg) => { if (!ok) fallos.push(msg); };
    for (const id of Object.keys(ZZ.canales)) {
      const canal = ZZ.canales[id];
      for (let nivel = 1; nivel <= 3; nivel++) {
        const medias = {};
        for (const d of [0.1, 0.3, 0.5, 0.7, 0.9]) {
          let suma = 0, min = 1e9, max = -1, acabanAntes = 0;
          for (let s = 1; s <= semillas; s++) {
            const sem = (s * 2654435761) >>> 0;
            const a = ZZ.grabaCasa(canal, sem, nivel, d);
            const b = ZZ.grabaCasa(canal, sem, nivel, d);
            anota(a.puntos === b.puntos && a.grab.length === b.grab.length, id + nivel + ' no repite con la misma semilla ' + sem);
            const rep = new ZZ.Repeticion(canal, sem, nivel, a.grab);
            const p = rep.hastaElFinal();
            anota(p === a.puntos, id + nivel + ' la repetición da ' + p + ' y la partida dio ' + a.puntos + ' (semilla ' + sem + ')');
            anota(a.puntos >= 0 && a.puntos <= 1000 && Number.isInteger(a.puntos), id + nivel + ' puntos fuera de rango: ' + a.puntos);
            anota(a.pasos <= ZZ.pasosDe(canal), id + nivel + ' dura más de la cuenta');
            suma += a.puntos; min = Math.min(min, a.puntos); max = Math.max(max, a.puntos);
            if (a.pasos < ZZ.pasosDe(canal)) acabanAntes++;
          }
          medias[d] = Math.round(suma / semillas) + ' (' + min + '–' + max + ')';
        }
        // sin tocar nada no se puede ganar
        const quieta = new ZZ.Repeticion(canal, 12345, nivel, []).hastaElFinal();
        anota(quieta <= 100, id + nivel + ' da ' + quieta + ' puntos sin jugar');
        medias.quieta = quieta;
        tabla[id + ' n' + nivel] = medias;
      }
    }
    return { ok: fallos.length === 0, fallos: fallos.slice(0, 12), nFallos: fallos.length, tabla };
  };
})();
//# sourceURL=zz/pruebas.js
</script>
