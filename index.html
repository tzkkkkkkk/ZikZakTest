</script>
<script>
/* ZikZak · canal 9 · Noticias · ¡ENDEREZA!
   El cuadro de detrás del presentador está torcido. Se arrastra el dedo a un lado o a otro para girarlo
   y se suelta cuando está recto. No hay nivel: se endereza a ojo.
   Mide el ojo: cuentan los grados que le faltan y, un poco, lo pronto que se da por bueno.
   En los niveles altos el cuadro pesa, se escurre al soltarlo y el presentador estornuda. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const CLAVO = { x: 404, y: 168 };      // de dónde cuelga el cuadro
  const K = 0.004;                       // radianes por cada punto que se arrastra
  const GR = 180 / Math.PI;
  const CAE_PASOS = 22;                  // lo que tarda en escurrirse al soltarlo
  const NIV = [null,
    { ini: [14, 24], cae: 0, muelle: 1, susto: false, tol: 9 },
    { ini: [18, 30], cae: 3.5, muelle: 0.3, susto: false, tol: 8 },
    { ini: [20, 34], cae: 5, muelle: 0.24, susto: true, tol: 7 }];
  const C = { pared: '#27408F', paredS: '#1B2E6B', marco: '#E2A93B', marcoS: '#B27A1E', zocalo: '#F3E3B5' };

  // --- lógica ---------------------------------------------------------------
  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const sg = rng() < 0.5 ? -1 : 1;
    return {
      semilla, nivel, ang: sg * rng.entre(N.ini[0], N.ini[1]) / GR, obj: 0, a0: 0, x0: 0,
      lado: rng() < 0.5 ? -1 : 1,                                   // hacia dónde se escurre
      pasoSusto: N.susto ? rng.entero(110, 165) : -1,                // cuándo estornuda el presentador
      golpe: (rng() < 0.5 ? -1 : 1) * rng.entre(6, 9) / GR,          // lo que mueve el cuadro el estornudo
      agarrado: false, tocado: false, cayendo: 0, caidas: 0, quieto: 0, fin: -1, hecho: false, ev: [],
    };
  }

  function puntuacion(e) {
    if (!e.tocado) return 0;
    const ojo = Math.max(0, 1 - Math.abs(e.ang) * GR / NIV[e.nivel].tol);
    const prisa = e.fin >= 0 ? 1 - e.fin / ZZ.PASOS : 0;
    return ZZ.lim(Math.round(1000 * ojo * (0.88 + 0.12 * prisa)), 0, 1000);
  }

  function paso(e, entradas, n) {
    const N = NIV[e.nivel];
    for (const en of entradas) {
      if (en.t === 'd' && !e.agarrado) {
        e.agarrado = true; e.tocado = true; e.x0 = en.x; e.a0 = e.ang; e.obj = e.ang; e.cayendo = 0; e.quieto = 0;
        e.ev.push({ t: 'agarra' });
      } else if (en.t === 'm' && e.agarrado) {
        e.obj = ZZ.lim(e.a0 + (en.x - e.x0) * K, -0.95, 0.95);
      } else if (en.t === 'u' && e.agarrado) {
        e.agarrado = false; e.quieto = 0; e.cayendo = N.cae > 0 ? CAE_PASOS : 0;
        e.ev.push({ t: 'suelta', cae: N.cae > 0 && e.caidas === 0 });
      }
    }
    if (e.agarrado) e.ang += (e.obj - e.ang) * N.muelle;             // con muelle < 1 el cuadro pesa y va detrás del dedo
    else if (e.cayendo > 0) { e.ang += e.lado * N.cae / GR / CAE_PASOS; if (--e.cayendo === 0) e.caidas++; }
    if (n === e.pasoSusto) { e.ang += e.golpe; e.a0 += e.golpe; e.obj += e.golpe; e.quieto = 0; e.ev.push({ t: 'susto' }); }
    // se da por bueno cuando lleva un rato suelto y quieto
    const dado = e.tocado && !e.agarrado && e.cayendo === 0 && n > e.pasoSusto && ++e.quieto > 54;
    if (!e.hecho && (dado || (e.tocado && n === ZZ.PASOS - 1))) {
      if (dado) { e.fin = n; e.hecho = true; }
      e.ev.push({ t: 'fin', gr: Math.abs(e.ang) * GR, pts: puntuacion(e) });
    }
  }

  // Jugador de la casa: lo gira hasta donde cree que está recto; si es bueno, aprende cuánto se escurre y lo compensa.
  function casa(e, mem, rng, d, n) {
    const N = NIV[e.nivel];
    if (mem.fase === undefined) { mem.fase = 'espera'; mem.hasta = Math.round(ZZ.mix(44, 14, d) + rng.entre(0, 12)); mem.veces = 0; }
    if (mem.fase === 'espera') {
      if (n < mem.hasta || e.cayendo > 0) return [];
      const gr = Math.abs(e.ang) * GR;
      if (mem.veces > 0 && gr < ZZ.mix(4.5, 1.1, d)) return [];
      if (mem.veces >= (d > 0.4 ? 4 : d > 0.2 ? 2 : 1)) return [];
      const comp = e.caidas > 0 ? -e.lado * N.cae / GR * ZZ.mix(0.3, 1, d) : 0;
      mem.meta = comp + rng.campana() * ZZ.mix(5.5, 0.6, d) / GR;
      mem.x0 = 320; mem.x = 320; mem.fase = 'gira'; mem.veces++; mem.llego = false;
      return [{ t: 'd', x: 320, y: 320 }];
    }
    const xMeta = ZZ.lim(Math.round(mem.x0 + (mem.meta - e.a0) / K), 0, ZZ.PW);
    if (mem.llego && mem.x === xMeta && Math.abs(e.obj - e.ang) < 0.01) {
      mem.fase = 'espera'; mem.hasta = n + CAE_PASOS + Math.round(ZZ.mix(26, 8, d));
      return [{ t: 'u', x: mem.x, y: 320 }];
    }
    const tramo = Math.round(ZZ.mix(8, 20, d)), dx = xMeta - mem.x;
    mem.x = Math.abs(dx) <= tramo ? xMeta : mem.x + Math.sign(dx) * tramo;
    mem.llego = mem.x === xMeta;
    return [{ t: 'm', x: mem.x, y: 320 }];
  }

  // --- dibujo -----------------------------------------------------------------
  function fondo(g) {
    // pared del plató, en paños
    for (let i = 0; i < 4; i++) { g.fillStyle = i % 2 ? C.pared : T.mezcla(C.pared, C.paredS, 0.3); g.fillRect(i * 160, 0, 160, 520); }
    g.fillStyle = T.trama(g, C.paredS, 13, 2.6); g.fillRect(0, 0, ZZ.PW, 130);
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(i * 160, 0); g.lineTo(i * 160, 520); T.linea(g, 4, C.paredS); }
    // zócalo
    g.fillStyle = C.paredS; g.fillRect(0, 520, ZZ.PW, 160);
    g.fillStyle = T.trama(g, '#111F4F', 13, 2.6); g.fillRect(0, 534, ZZ.PW, 140);
    T.vol(g, c => T.rr(c, -20, 506, 680, 28, 0), C.zocalo, { sombra: '#CDB67C', dx: 0, dy: -10, w: 6 });
    // el reloj del plató
    const rx = 58, ry = 372;
    T.circ(g, rx + 6, ry + 8, 44); T.pinta(g, T.TINTA, 0);
    T.vol(g, c => T.circ(c, rx, ry, 44), T.PAPEL, { sombra: '#D9CDB3', dx: -5, dy: -6, w: 6 });
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;
      g.beginPath(); g.moveTo(rx + Math.cos(a) * 31, ry + Math.sin(a) * 31); g.lineTo(rx + Math.cos(a) * 37, ry + Math.sin(a) * 37);
      T.linea(g, i % 3 ? 3 : 5.5);
    }
    g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx + 2, ry - 26); T.linea(g, 6);
    g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx + 18, ry + 10); T.linea(g, 6);
    T.circ(g, rx, ry, 6); T.pinta(g, T.ROJO, 4);
    // el foco de arriba
    g.save(); g.globalAlpha = 0.1; T.poli(g, [[300, 0], [460, 0], [640, 520], [130, 520]]); g.fillStyle = '#FFFFFF'; g.fill(); g.restore();
  }

  // La mesa va por delante del presentador.
  function mesa(g) {
    T.vol(g, c => T.rr(c, -20, 668, 680, 200, 0), T.ROJO, { sombra: T.oscuro(T.ROJO, 0.3), dx: 0, dy: 34, w: 7 });
    g.fillStyle = T.trama(g, T.oscuro(T.ROJO, 0.28), 13, 2.4); g.fillRect(0, 772, ZZ.PW, 68);
    T.vol(g, c => T.rr(c, -20, 640, 680, 38, 8), T.PAPEL, { sombra: '#D9CDB3', dx: 0, dy: -10, w: 7 });
    // el globo del informativo
    const gx = 508, gy = 752;
    T.circ(g, gx + 6, gy + 8, 54); T.pinta(g, T.TINTA, 0);
    T.vol(g, c => T.circ(c, gx, gy, 54), T.AZUL, { dx: -7, dy: -9, w: 7 });
    g.save(); T.circ(g, gx, gy, 50); g.clip();
    T.elip(g, gx, gy, 23, 54); T.linea(g, 4.5, T.PAPEL);
    g.beginPath(); g.moveTo(gx - 54, gy); g.lineTo(gx + 54, gy); T.linea(g, 4.5, T.PAPEL);
    for (const dy of [-27, 27]) { g.beginPath(); g.moveTo(gx - 48, gy + dy); g.quadraticCurveTo(gx, gy + dy * 0.7, gx + 48, gy + dy); T.linea(g, 4.5, T.PAPEL); }
    g.restore();
    T.circ(g, gx, gy, 54); T.linea(g, 7);
    // folios, taza y micrófono
    for (const [x, y, r] of [[330, 636, -0.07], [352, 632, 0.09]]) {
      g.save(); g.translate(x, y); g.rotate(r);
      T.vol(g, c => T.rr(c, -50, -13, 100, 26, 3), '#FFFFFF', { sombra: '#D9E1EA', dx: 0, dy: -7, w: 5 });
      g.beginPath(); g.moveTo(-36, -3); g.lineTo(30, -3); g.moveTo(-36, 5); g.lineTo(10, 5); T.linea(g, 2.5, '#9AA6B8');
      g.restore();
    }
    T.vol(g, c => T.rr(c, 566, 592, 46, 54, 8), T.AMARILLO, { dx: -7, dy: 0, w: 6 });
    g.beginPath(); g.arc(614, 618, 14, -1.25, 1.25); T.linea(g, 6);
    T.tubo(g, c => { c.beginPath(); c.moveTo(262, 646); c.quadraticCurveTo(258, 612, 238, 598); }, '#3A3350', 8, 4);
    T.vol(g, c => T.elip(c, 231, 592, 19, 14, -0.6), '#6A6480', { sombra: '#3A3350', dx: -4, dy: -4, w: 5 });
  }

  // El rótulo de abajo: titulares que corren.
  const TITULARES = 'ÚLTIMA HORA: EL CUADRO SIGUE TORCIDO   ·   EL TIEMPO: NUBES CON MALA CARA   ·   DEPORTES: UN SEÑOR CON BIGOTE SALTA VALLAS   ·   SUCESOS: DESAPARECE UNA BOLITA EN PLENA FUNCIÓN   ·   ';
  function rotulo(g, t) {
    const x = 24, y = 708, w = 372, h = 48;
    T.rr(g, x + 5, y + 7, w, h, 10); T.pinta(g, T.TINTA, 0);
    T.rr(g, x, y, w, h, 10); T.pinta(g, T.PAPEL, 5);
    g.save(); T.rr(g, x, y, w, h, 10); g.clip();
    g.fillStyle = T.AZUL; g.fillRect(x, y, 58, h);
    g.restore();
    g.save(); g.beginPath(); g.rect(x + 62, y + 3, w - 66, h - 6); g.clip();
    const an = T.ancho(g, TITULARES, 23, T.F_UI, 900), off = (t * 2.4) % an;
    for (let i = 0; i < 3; i++) T.texto(g, TITULARES, x + 74 + i * an - off, y + h / 2 + 1, 23, { al: 'left', color: T.TINTA, w: 0, fuente: T.F_UI, peso: 900 });
    g.restore();
    g.beginPath(); g.moveTo(x + 58, y); g.lineTo(x + 58, y + h); T.linea(g, 5);
    T.rr(g, x, y, w, h, 10); T.linea(g, 5);
    T.circ(g, x + 29, y + h / 2, 11); T.pinta(g, Math.sin(t * 0.2) > 0 ? T.ROJO : T.oscuro(T.ROJO, 0.55), 4.5);
  }

  function cuadro(g, e) {
    g.save(); g.translate(CLAVO.x, CLAVO.y); g.rotate(e.ang);
    const marco = c => T.rr(c, -160, 46, 320, 244, 10);
    T.sombra(g, marco, 10, 15, 0.32);
    g.beginPath(); g.moveTo(-120, 52); g.lineTo(0, 0); g.lineTo(120, 52); T.linea(g, 5, '#2B2536');
    T.vol(g, marco, C.marco, { sombra: C.marcoS, dx: -9, dy: -11, w: 7 });
    // la marina
    g.save(); T.rr(g, -134, 72, 268, 192, 4); g.clip();
    g.fillStyle = '#9EDCF7'; g.fillRect(-134, 72, 268, 112);
    g.fillStyle = '#FFE9A8'; g.fillRect(-134, 150, 268, 34);
    T.circ(g, 74, 126, 30); T.pinta(g, '#FFD84A', 5);
    for (const [x, y, s] of [[-78, 104, 1], [-12, 122, 0.7]]) {
      g.fillStyle = '#FFFFFF';
      for (const [a, b, r] of [[-20, 4, 13], [0, -5, 17], [20, 4, 13]]) { T.circ(g, x + a * s, y + b * s, r * s); g.fill(); }
    }
    g.fillStyle = '#2D6BFF'; g.fillRect(-134, 184, 268, 90);
    g.fillStyle = '#1F4FD0'; g.fillRect(-134, 226, 268, 48);
    g.beginPath();
    for (const [x, y] of [[-110, 204], [-30, 210], [50, 202], [-70, 244], [20, 248], [90, 240]]) { g.moveTo(x, y); g.quadraticCurveTo(x + 14, y - 8, x + 28, y); }
    T.linea(g, 4, '#BFE3FF');
    g.beginPath(); g.moveTo(-134, 184); g.lineTo(134, 184); T.linea(g, 4);
    // el velero
    T.poli(g, [[-42, 194], [-42, 108], [18, 186]]); T.pinta(g, '#FFFFFF', 5);
    T.poli(g, [[-50, 194], [-50, 130], [-92, 190]]); T.pinta(g, T.ROJO, 5);
    T.poli(g, [[-100, 196], [36, 196], [18, 222], [-84, 222]]); T.pinta(g, '#7A4220', 5);
    g.restore();
    T.rr(g, -134, 72, 268, 192, 4); T.linea(g, 6);
    T.rr(g, -28, 270, 56, 14, 5); T.pinta(g, '#FFF2B8', 4);
    g.restore();
    T.circ(g, CLAVO.x, CLAVO.y, 9); T.pinta(g, '#DCE6EE', 5);
  }

  // Dos arcos con flechas alrededor del cuadro: se gira hacia los dos lados.
  function flechas(g, t) {
    const cx = CLAVO.x, cy = CLAVO.y + 168, R = 232 + Math.sin(t * 0.22) * 4;
    g.save();
    for (const [a0, a1] of [[-Math.PI / 2 - 0.4, -Math.PI / 2 + 0.4], [Math.PI / 2 - 0.4, Math.PI / 2 + 0.4]]) {
      g.beginPath(); g.arc(cx, cy, R, a0, a1); T.linea(g, 15); g.beginPath(); g.arc(cx, cy, R, a0, a1); T.linea(g, 7, T.AMARILLO);
      for (const [a, dir] of [[a0, -1], [a1, 1]]) {
        const px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R, tx = -Math.sin(a) * dir, ty = Math.cos(a) * dir, nx = Math.cos(a), ny = Math.sin(a);
        T.poli(g, [[px + tx * 26, py + ty * 26], [px + nx * 17, py + ny * 17], [px - nx * 17, py - ny * 17]]); T.pinta(g, T.AMARILLO, 5);
      }
    }
    g.restore();
  }

  function dedo(g, t) {
    g.save(); g.translate(CLAVO.x - 20 + Math.sin(t * 0.1) * 80, CLAVO.y + 316);
    const mano = c => { c.beginPath(); c.moveTo(-14, -52); c.quadraticCurveTo(0, -66, 14, -52); c.lineTo(14, -6); c.lineTo(40, -6); c.quadraticCurveTo(52, 4, 48, 44); c.quadraticCurveTo(10, 62, -34, 44); c.lineTo(-36, 6); c.quadraticCurveTo(-30, -8, -14, 0); c.closePath(); };
    T.sombra(g, mano, 6, 8, 0.4);
    T.vol(g, mano, '#FFFFFF', { sombra: '#D9E1EA', dx: -7, dy: -4, w: 6 });
    g.beginPath(); g.moveTo(0, 10); g.lineTo(0, 34); g.moveTo(22, 10); g.lineTo(22, 34); T.linea(g, 3.5, '#9AA6B8');
    g.restore();
  }

  function dibuja(g, e, vis) {
    const t = vis.t, gr = Math.abs(e.ang) * GR;
    T.capa(g, vis, 'noticias', fondo);
    cuadro(g, e);
    if (!e.tocado) { flechas(g, t); dedo(g, t); }
    vis.ch.dibuja(g, 0);
    // el presentador: mira de reojo al cuadro hasta que queda recto
    const antes = e.pasoSusto >= 0 && vis.n >= e.pasoSusto - 40 && vis.n <= e.pasoSusto;
    const tras = vis.achis !== undefined && t - vis.achis < 26;
    const o = { ladeo: antes ? -0.18 * Math.min(1, (vis.n - e.pasoSusto + 40) / 30) : tras ? 0.22 * (1 - (t - vis.achis) / 26) : 0 };
    if (tras) o.golpe = 1 - (t - vis.achis) / 26;
    if (!antes && !tras && gr >= 1.5) o.mira = { x: 0.9, y: -0.7 };
    P.busto(g, 146, 588, 1.42, P.AJUSTE, tras ? 'enfadado' : antes ? 'susto' : gr < 1.5 ? 'contento' : gr < 5 ? 'neutro' : 'triste', t, o);
    T.capa(g, vis, 'noticiasMesa', mesa);
    rotulo(g, t);
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'agarra') { son && son.agarra(); }
      else if (x.t === 'suelta') {
        if (x.cae) { T.palabra(vis.ch, '¡SE ESCURRE!', 400, 128, T.PAPEL, 50, 1, true); son && son.golpe(); }
      } else if (x.t === 'susto') {
        vis.achis = vis.t; vis.temblor = 14;
        T.polvo(vis.ch, 196, 588, 10, '#FFFFFF', 10, 14, 1);
        T.palabra(vis.ch, '¡ACHÍS!', 210, 452, T.AMARILLO, 60, 1, true);
        son && son.pum();
      } else if (x.t === 'fin') {
        const bien = x.gr < 1.2, casi = x.gr < 3.5;
        T.palabra(vis.ch, bien ? '¡NI CON NIVEL!' : casi ? '¡CASI RECTO!' : '¡TORCIDO!', 360, 132, bien ? T.AMARILLO : casi ? T.PAPEL : T.ROJO, 58, 1, true);
        if (bien) {
          T.confeti(vis.ch, CLAVO.x, CLAVO.y + 120, 26, [T.AMARILLO, T.ROJO, T.MENTA, T.PAPEL], 11, 1);
          son && son.sol();
        } else son && (casi ? son.acierto() : son.fallo());
      }
    }
  }

  ZZ.canales.noticias = {
    id: 'noticias', num: 9, nombre: 'NOTICIAS', orden: '¡ENDEREZA!', hechoTxt: '¡COLGADO!',
    pista: 'Arrastra a los lados y suelta cuando esté recto',
    rotulo: 'ÚLTIMA HORA: EL CUADRO SIGUE TORCIDO',
    color: C.pared, color2: T.ROJO, color3: T.AMARILLO,
    arrastra: true,
    animo: x => (x.t === 'fin' ? (x.pts >= 350 ? 1 : -1) : x.t === 'susto' ? -1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();

</script>
<script>
/* ZikZak · canal 10 · Magia · ¿DÓNDE ESTÁ?
   Dura diez segundos. La bolita se esconde bajo un cubilete, los cubiletes se cambian de sitio
   y al final se toca el que la tiene.
   Mide la vista: acertar es casi todo, y contestar pronto da el resto. Fallar es cero. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const MESA = 612;                      // donde apoyan los cubiletes
  const VER = 64, BAJA = 22, INI = VER + BAJA;       // se enseña la bolita, se tapa y empieza el baile
  const RESP = 170, FINAL = 60;          // lo que se puede tardar en contestar y lo que dura el final
  const SUBE = 100;                      // lo que se levanta un cubilete
  const HUECOS = { 3: [150, 320, 490], 4: [104, 248, 392, 536] };
  const NIV = [null,
    { n: 3, cambios: 5, dur: 44 },
    { n: 3, cambios: 8, dur: 32 },
    { n: 4, cambios: 10, dur: 26 }];
  const C = { fondo: '#2A1653', fondoS: '#3D2478', telon: '#D3273E', telonS: '#8E1630', tapete: '#6B3FC4', tapeteS: '#4A2A8E',
    cubi: '#19B5A5', cubiS: '#0E7F74', oro: '#FFC928', bola: '#FF5A6E' };

  // --- lógica ---------------------------------------------------------------
  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const cambios = [];
    let ant = -1;
    for (let i = 0; i < N.cambios; i++) {
      let a, b, clave;
      do {
        a = rng.entero(0, N.n - 1); b = rng.entero(0, N.n - 2); if (b >= a) b++;
        clave = Math.min(a, b) * 10 + Math.max(a, b);
      } while (clave === ant);
      ant = clave; cambios.push([a, b]);
    }
    const pos = [];
    for (let i = 0; i < N.n; i++) pos.push(i);
    return {
      semilla, nivel, n: N.n, dur: N.dur, cambios, pos, bola: rng.entero(0, N.n - 1), hechos: 0, e0: INI + N.cambios * N.dur,
      elegido: -2, pasoEleccion: -1, acierto: false, fin: -1, hecho: false, ev: [],
    };
  }

  function paso(e, entradas, n) {
    if (n === VER) e.ev.push({ t: 'baja' });
    // los cambios que ya han terminado: cada cubilete queda en su hueco nuevo
    while (e.hechos < e.cambios.length && n >= INI + (e.hechos + 1) * e.dur) {
      const ab = e.cambios[e.hechos], ca = e.pos.indexOf(ab[0]), cb = e.pos.indexOf(ab[1]);
      e.pos[ca] = ab[1]; e.pos[cb] = ab[0]; e.hechos++;
    }
    if (n >= INI && n < e.e0 && (n - INI) % e.dur === 0) e.ev.push({ t: 'cambio' });
    if (n === e.e0) e.ev.push({ t: 'elige' });
    if (e.elegido === -2 && n >= e.e0) {
      for (const en of entradas) {
        if (en.t !== 'd' || en.y < MESA - 200 || en.y > MESA + 70) continue;
        let c = -1, mejor = 86;
        for (let i = 0; i < e.n; i++) { const d = Math.abs(HUECOS[e.n][e.pos[i]] - en.x); if (d < mejor) { mejor = d; c = i; } }
        if (c < 0) continue;
        e.elegido = c; e.pasoEleccion = n; e.acierto = c === e.bola; e.fin = n + FINAL;
        e.ev.push({ t: e.acierto ? 'acierto' : 'fallo', x: HUECOS[e.n][e.pos[c]] });
        break;
      }
      if (e.elegido === -2 && n >= e.e0 + RESP) { e.elegido = -1; e.pasoEleccion = n; e.fin = n + FINAL; e.ev.push({ t: 'tarde' }); }
    }
    if (e.fin >= 0 && n >= e.fin) e.hecho = true;
  }

  function puntuacion(e) {
    return e.acierto ? Math.round(650 + 350 * ZZ.lim(1 - (e.pasoEleccion - e.e0) / RESP, 0, 1)) : 0;
  }

  // Jugador de la casa: sigue la bolita mejor o peor y tarda más o menos en decidirse.
  function casa(e, mem, rng, d, n) {
    if (mem.paso === undefined) {
      const p = ZZ.lim(ZZ.mix(0.36, 0.98, d) - (e.nivel - 1) * 0.07 * (1 - d), 0, 1);
      mem.c = e.bola;
      if (rng() > p) { mem.c = rng.entero(0, e.n - 2); if (mem.c >= e.bola) mem.c++; }
      mem.paso = e.e0 + Math.round(ZZ.mix(86, 16, d) + rng.entre(0, 26));
    }
    return n === mem.paso && e.elegido === -2 ? [{ t: 'd', x: HUECOS[e.n][e.pos[mem.c]], y: MESA - 70 }] : [];
  }

  // --- dibujo -----------------------------------------------------------------
  // Dónde está un cubilete en el paso n: en su hueco o a medio cambio, uno por delante y otro por detrás.
  function sitio(e, c, n) {
    const Hc = HUECOS[e.n], s = e.pos[c], k = e.hechos;
    let x = Hc[s], y = 0, mov = 0;
    if (n >= INI && k < e.cambios.length) {
      const ab = e.cambios[k];
      if (s === ab[0] || s === ab[1]) {
        const u = ZZ.lim((n - INI - k * e.dur) / e.dur, 0, 1), otro = s === ab[0] ? ab[1] : ab[0];
        x = Hc[s] + (Hc[otro] - Hc[s]) * ZZ.e.io(u);
        mov = Math.sin(u * Math.PI);
        y = mov * (s === ab[0] ? 36 : -36);
      }
    }
    return { x, y, mov };
  }
  // Cuánto está levantado (0 a 1).
  function alza(e, c, n) {
    if (n < VER) return 1;
    if (n < INI) return 1 - ZZ.e.io((n - VER) / BAJA);
    if (e.elegido === -2) return 0;
    const dt = n - e.pasoEleccion - (c === e.elegido ? 0 : 20);
    return ZZ.e.outBack(ZZ.lim(dt / 14, 0, 1));
  }

  function fondo(g) {
    g.fillStyle = C.fondo; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.trama(g, C.fondoS, 15, 3); g.fillRect(0, 0, ZZ.PW, 560);
    g.fillStyle = '#FFE48A';
    for (const [x, y, r] of [[176, 196, 9], [262, 132, 6], [420, 150, 10], [486, 262, 7], [200, 330, 8], [452, 372, 6], [236, 250, 5]]) { T.estrella(g, x, y, r * 2, r * 0.8, 4); g.fill(); }
    // el haz del foco
    g.save(); g.globalAlpha = 0.14; T.poli(g, [[250, 0], [390, 0], [640, 660], [0, 660]]); g.fillStyle = '#FFF2B8'; g.fill(); g.restore();
    // cortinas
    for (const s of [-1, 1]) {
      g.save(); g.translate(s < 0 ? 0 : ZZ.PW, 0); g.scale(-s, 1);
      const cam = c => { c.beginPath(); c.moveTo(-20, -20); c.lineTo(156, -20); c.bezierCurveTo(146, 200, 58, 320, 98, 456); c.bezierCurveTo(74, 520, 40, 572, -20, 610); c.closePath(); };
      T.vol(g, cam, C.telon, { sombra: C.telonS, dx: -24, dy: 0, w: 7 });
      g.save(); cam(g); g.clip();
      for (const x of [44, 88, 128]) { g.beginPath(); g.moveTo(x, -20); g.bezierCurveTo(x - 6, 200, x - 54, 320, x - 30, 540); T.linea(g, 5, C.telonS); }
      g.restore();
      T.vol(g, c => T.rr(c, 50, 430, 62, 26, 13), '#B81F38', { sombra: C.telonS, dx: 0, dy: -7, w: 6 });
      g.restore();
    }
    // bambalina con flecos
    const fest = c => {
      c.beginPath(); c.moveTo(-20, -20); c.lineTo(660, -20); c.lineTo(660, 64);
      for (let i = 7; i >= 0; i--) c.quadraticCurveTo(-20 + i * 85 + 42, 124, -20 + i * 85, 64);
      c.closePath();
    };
    T.vol(g, fest, '#B81F38', { sombra: C.telonS, dx: 0, dy: -16, w: 7 });
    for (let i = 0; i < 8; i++) { T.circ(g, -20 + i * 85 + 42, 98, 9); T.pinta(g, C.oro, 5); }
  }

  // La mesa va por delante del mago y por detrás de los cubiletes.
  function mesa(g) {
    T.vol(g, c => { c.beginPath(); c.moveTo(-60, MESA + 6); c.quadraticCurveTo(320, MESA + 200, 700, MESA + 6); c.lineTo(700, 870); c.lineTo(-60, 870); c.closePath(); },
      C.tapeteS, { sombra: '#35206B', dx: 0, dy: 40, w: 7 });
    for (let i = 0; i < 7; i++) {
      const x = 40 + i * 93.3;
      g.save(); g.globalAlpha = 0.16; T.poli(g, [[x - 26, 826], [x + 26, 826], [x + 60, 700], [x - 60, 700]]); g.fillStyle = '#FFF2B8'; g.fill(); g.restore();
      T.vol(g, c => { c.beginPath(); c.arc(x, 846, 34, Math.PI, 0); c.closePath(); }, C.oro, { sombra: '#E0A51A', dx: -8, dy: 0, w: 6 });
    }
    T.vol(g, c => T.elip(c, 320, MESA + 6, 380, 98), C.tapete, { sombra: C.tapeteS, dx: 0, dy: -18, w: 7 });
    g.save(); T.elip(g, 320, MESA + 6, 380, 98); g.clip();
    g.fillStyle = T.trama(g, C.tapeteS, 15, 2.6); g.fillRect(0, MESA + 30, ZZ.PW, 90);
    g.restore();
  }

  // Un cubilete con el centro de la base en el origen.
  function cubilete(g, expr, t, mira, brillo) {
    const cam = c => { c.beginPath(); c.moveTo(-62, 0); c.lineTo(-45, -136); c.quadraticCurveTo(0, -156, 45, -136); c.lineTo(62, 0); c.quadraticCurveTo(0, 16, -62, 0); c.closePath(); };
    if (brillo) { cam(g); g.lineJoin = 'round'; g.lineWidth = 22; g.strokeStyle = C.oro; g.stroke(); }
    T.vol(g, cam, C.cubi, { sombra: C.cubiS, dx: -12, dy: 0, w: 7 });
    g.save(); cam(g); g.clip();
    g.fillStyle = C.oro; g.fillRect(-70, -36, 140, 20);
    g.fillStyle = T.oscuro(C.oro, 0.28); g.fillRect(40, -36, 30, 20);
    g.restore();
    g.beginPath(); g.moveTo(-58, -36); g.lineTo(58, -36); g.moveTo(-60, -16); g.lineTo(60, -16); T.linea(g, 5);
    cam(g); T.linea(g, 7);
    g.save(); g.translate(0, -92); g.scale(0.62, 0.62);
    P.cara(g, expr, t, { ex: 21, ey: -6, by: 24, piel: C.cubi, mira });
    g.restore();
  }

  function bolita(g, x, y, t, contenta) {
    g.save(); g.translate(x, y);
    T.vol(g, c => T.circ(c, 0, 0, 25), C.bola, { sombra: '#C92F47', dx: -5, dy: -6, w: 6 });
    T.elip(g, -9, -11, 8, 5, -0.5); T.pinta(g, '#FFFFFF', 0);
    g.scale(0.36, 0.36);
    P.cara(g, contenta ? 'euforico' : 'contento', t, { ex: 19, ey: -2, by: 26, piel: C.bola });
    g.restore();
  }

  function guante(g, x, y, rot) {
    g.save(); g.translate(x, y); g.rotate(rot);
    T.vol(g, c => T.rr(c, -22, 22, 44, 30, 8), '#2B2536', { sombra: T.TINTA, dx: 0, dy: -6, w: 6 });
    T.vol(g, c => T.rr(c, -28, -30, 56, 60, 22), '#FFFFFF', { sombra: '#D9E1EA', dx: -6, dy: -6, w: 6 });
    for (const dx of [-17, -6, 5, 16]) { T.vol(g, c => T.rr(c, dx - 5, -52, 11, 34, 5), '#FFFFFF', { sombra: '#D9E1EA', dx: -2, dy: 0, w: 5 }); }
    T.vol(g, c => T.elip(c, 30, -2, 9, 17, 0.5), '#FFFFFF', { sombra: '#D9E1EA', dx: -2, dy: -3, w: 5 });
    g.restore();
  }

  function mago(g, e, vis) {
    const n = vis.n, t = vis.t, baile = n >= INI && n < e.e0;
    const expr = e.elegido === -2 ? (baile ? 'tension' : n < INI ? 'contento' : 'neutro') : e.acierto ? 'susto' : 'euforico';
    P.busto(g, 320, 326, 1.4, P.AJUSTE, expr, t, { ladeo: baile ? Math.sin(t * 0.18) * 0.06 : 0 });
    // la chistera
    g.save(); g.translate(318, 226 + Math.sin(t * 0.09) * 1.5); g.rotate(-0.12); g.scale(1.06, 1.06);
    T.vol(g, c => T.rr(c, -52, -92, 104, 96, 8), '#2B2536', { sombra: T.TINTA, dx: -12, dy: 0, w: 7 });
    g.fillStyle = C.telon; g.fillRect(-52, -22, 104, 18);
    g.beginPath(); g.moveTo(-52, -22); g.lineTo(52, -22); g.moveTo(-52, -4); g.lineTo(52, -4); T.linea(g, 5);
    T.vol(g, c => T.elip(c, 0, 4, 84, 16), '#2B2536', { sombra: T.TINTA, dx: 0, dy: -6, w: 7 });
    g.restore();
    // las manos, que mueven el aire
    const m = baile ? Math.sin(t * 0.3) : 0, ap = n >= e.e0 ? 1 : 0;
    guante(g, 144 - ap * 44 + m * 22, 372 - ap * 96 - Math.abs(m) * 16, -0.45 - ap * 0.3 + m * 0.2);
    g.save(); g.translate(496 + ap * 44 + m * 22, 372 - ap * 96 - Math.abs(m) * 16); g.scale(-1, 1); guante(g, 0, 0, -0.45 - ap * 0.3 - m * 0.2); g.restore();
  }

  function dibuja(g, e, vis) {
    const n = vis.n, t = vis.t;
    T.capa(g, vis, 'magia', fondo);
    mago(g, e, vis);
    T.capa(g, vis, 'magiaMesa', mesa);
    vis.ch.dibuja(g, 0);
    // de atrás hacia delante
    const l = [];
    for (let c = 0; c < e.n; c++) { const s = sitio(e, c, n); l.push({ c, x: s.x, y: s.y, mov: s.mov, up: alza(e, c, n) }); }
    l.sort((a, b) => a.y - b.y);
    const elige = e.elegido === -2 && n >= e.e0;
    for (const q of l) {
      const by = MESA + q.y;
      g.save(); g.globalAlpha = 0.28; T.elip(g, q.x + 8, by + 6, 66 - q.up * 12, 15); g.fillStyle = T.TINTA; g.fill(); g.restore();
      if (q.c === e.bola && q.up > 0.02) bolita(g, q.x, by - 24 - (n < VER ? Math.abs(Math.sin(t * 0.2)) * 14 : 0), t, e.acierto);
      const fin = e.elegido !== -2;
      const expr = n < INI ? 'contento' : q.mov > 0.1 ? 'susto' : !fin ? 'neutro'
        : q.c === e.bola ? (e.acierto ? 'euforico' : 'contento') : q.c === e.elegido ? 'triste' : 'neutro';
      g.save(); g.translate(q.x, by - q.up * SUBE + (elige ? -Math.abs(Math.sin(t * 0.16 + q.c * 1.3)) * 7 : 0));
      g.rotate(q.mov * (q.y > 0 ? -0.08 : 0.08) + (q.up > 0 && q.up < 1 ? (1 - q.up) * 0.08 : 0));
      cubilete(g, expr, t + q.c * 31, elige ? { x: Math.sin(t * 0.07 + q.c * 2) * 0.9, y: -0.3 } : undefined, fin && q.c === e.elegido);
      g.restore();
      if (elige) {
        T.marca(g, q.x, by - 162 + Math.sin(t * 0.2 + q.c) * 5, 0, 30);
      }
    }
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    // estela de estrellas mientras los cubiletes se cruzan
    if (vis.n >= INI && vis.n < e.e0 && vis.t % 4 === 0) {
      for (let c = 0; c < e.n; c++) {
        const s = sitio(e, c, vis.n);
        if (s.mov > 0.25) vis.ch.mas({ tipo: 'estrella', x: s.x + (Math.random() - 0.5) * 60, y: MESA + s.y - 150 - Math.random() * 20, vy: -1, r: 9, color: C.oro, vida: 14, capa: 1 });
      }
    }
    for (const x of ev) {
      if (x.t === 'baja') { son && son.golpe(); }
      else if (x.t === 'cambio') { son && son.agarra(); }
      else if (x.t === 'elige') { T.palabra(vis.ch, '¿DÓNDE ESTÁ?', 320, 752, T.AMARILLO, 56, 1, true); son && son.orden(); }
      else if (x.t === 'acierto') {
        T.estrellas(vis.ch, x.x, MESA - 60, 12, T.AMARILLO, 13, 22, 1);
        T.confeti(vis.ch, x.x, MESA - 120, 26, [T.AMARILLO, T.ROJO, T.MENTA, T.PAPEL], 12, 1);
        T.palabra(vis.ch, '¡AHÍ ESTÁ!', 320, 752, T.AMARILLO, 60, 1, true);
        vis.temblor = 8; son && son.sol();
      } else if (x.t === 'fallo') {
        T.polvo(vis.ch, x.x, MESA - 20, 6, '#FFFFFF', 5, 13, 1);
        T.palabra(vis.ch, '¡AHÍ NO!', 320, 752, T.ROJO, 60, 1, true);
        vis.temblor = 10; son && son.fallo();
      } else if (x.t === 'tarde') {
        T.palabra(vis.ch, '¡MUY TARDE!', 320, 752, T.ROJO, 56, 1, true); son && son.fallo();
      }
    }
  }

  ZZ.canales.magia = {
    id: 'magia', num: 10, nombre: 'MAGIA', orden: '¿DÓNDE ESTÁ?', hechoTxt: '¡TACHÁN!',
    pista: 'Sigue la bolita y toca su cubilete al final',
    rotulo: 'ESTA NOCHE: «EL GRAN AJUSTE»',
    color: C.tapete, color2: C.telon, color3: C.oro,
    pasos: 600,      // diez segundos
    animo: x => (x.t === 'acierto' ? 1 : x.t === 'fallo' || x.t === 'tarde' ? -1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();

</script>
<script>
/* ZikZak · canal 11 · Deportes · ¡SALTA!
   Dura quince segundos. Una carrera de vallas que va cada vez más deprisa: un toque es un salto.
   Corre una zapatilla. (Empezó durando treinta y con un corredor: al dueño se le hacía eterno y feo.)
   En los niveles altos cruzan balones por arriba: con balón no se salta.
   Mide el aguante: cada valla puntúa según lo centrado que cae el salto; tirarla no da nada. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const TOTAL = 900;                     // quince segundos
  const RX = 176, SUELO = 726;           // por dónde corre
  const ESC = 1.05;                      // tamaño de la zapatilla
  const J = 36, ALTO = 160;              // lo que dura un salto y lo que sube
  const NIV = [null,
    { v0: 5.4, v1: 7.8, n: 9, hueco: [72, 100], alto: 64, balones: 0 },
    { v0: 6.0, v1: 9.0, n: 12, hueco: [54, 76], alto: 76, balones: 2 },
    { v0: 6.6, v1: 10.2, n: 14, hueco: [46, 60], alto: 86, balones: 4 }];
  const C = { pista: '#E0623A', pistaS: '#C24E2A', cesped: '#3DBB6B', cespedS: '#2C9A55', grada: '#2B3A8C', gradaS: '#1C2766',
    piel: '#F2B98A', pielS: '#D9925F', pelo: '#5A3A22' };

  // --- lógica ---------------------------------------------------------------
  function altura(e, n) {
    if (e.salto < 0) return 0;
    const u = (n - e.salto) / J;
    return u >= 1 ? 0 : ALTO * 4 * u * (1 - u);
  }

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    let llegadas = [110];
    for (let i = 1; i < N.n; i++) llegadas.push(llegadas[i - 1] + rng.entero(N.hueco[0], N.hueco[1]));
    const ult = llegadas[N.n - 1];
    if (ult > 770) llegadas = llegadas.map(a => Math.round(110 + (a - 110) * 660 / (ult - 110)));
    // cuáles son balones: nunca los dos primeros ni dos seguidos
    const esBalon = [];
    let quedan = N.balones;
    for (let k = 0; k < 200 && quedan > 0; k++) {
      const i = rng.entero(2, N.n - 2);
      if (esBalon[i] || esBalon[i - 1] || esBalon[i + 1]) continue;
      esBalon[i] = true; quedan--;
    }
    const dist = [];
    let d = 0;
    for (let s = 0; s <= TOTAL + 2; s++) { dist.push(d); d += N.v0 + (N.v1 - N.v0) * s / TOTAL; }
    const obs = llegadas.map((a, i) => ({ llega: a, d: dist[a], balon: !!esBalon[i], estado: 0, pts: 0 }));
    const meta = llegadas[N.n - 1] + 84;
    return {
      semilla, nivel, dist, obs, meta, dMeta: dist[meta], vallas: obs.filter(o => !o.balon).length, sig: 0,
      salto: -1, aturdido: 0, suma: 0, golpes: 0, tropiezos: 0, racha: 0, enMeta: false, hecho: false, ev: [],
    };
  }

  function paso(e, entradas, n) {
    const N = NIV[e.nivel];
    if (e.salto >= 0 && n - e.salto >= J) { e.salto = -1; e.ev.push({ t: 'aterriza' }); }
    for (const en of entradas) {
      if (en.t !== 'd' || e.salto >= 0 || n < e.aturdido || e.enMeta) continue;
      e.salto = n; e.ev.push({ t: 'salta' });
    }
    while (e.sig < e.obs.length && e.obs[e.sig].llega <= n) {
      const o = e.obs[e.sig++], y = altura(e, n);
      if (o.balon) {
        if (y > 36) { o.estado = 2; e.golpes++; e.racha = 0; e.ev.push({ t: 'balonazo' }); }
        else o.estado = 1;
      } else if (y >= N.alto) {
        const c = 1 - Math.abs(n - e.salto - J / 2) / (J / 2);
        o.estado = 1; o.pts = 55 + Math.round(45 * c); e.suma += o.pts; e.racha++;
        e.ev.push({ t: 'pasa', pts: o.pts, limpio: c > 0.7, racha: e.racha });
      } else {
        o.estado = 2; e.tropiezos++; e.racha = 0; e.aturdido = n + 18;
        e.ev.push({ t: 'tropieza' });
      }
    }
    if (!e.enMeta && n >= e.meta) { e.enMeta = true; e.ev.push({ t: 'meta', limpia: e.tropiezos + e.golpes === 0 }); }
    if (n >= e.meta + 44) e.hecho = true;
  }

  function puntuacion(e) {
    return ZZ.lim(Math.round((e.suma - 60 * e.golpes) * 10 / e.vallas), 0, 1000);
  }

  // Jugador de la casa: salta antes o después de la cuenta, se deja alguna valla y a veces pica con un balón.
  function casa(e, mem, rng, d, n) {
    if (!mem.plan) {
      mem.plan = {};
      for (const o of e.obs) {
        const az = rng(), j = Math.round(rng.campana() * ZZ.mix(13, 2.5, d));
        if (o.balon) { if (az < ZZ.mix(0.3, 0, Math.min(1, d * 1.3))) mem.plan[o.llega - 16 + j] = 1; }
        else if (az >= ZZ.mix(0.1, 0, d)) mem.plan[o.llega - J / 2 + j] = 1;
      }
    }
    return mem.plan[n] ? [{ t: 'd', x: 320, y: 500 }] : [];
  }

  // --- dibujo -----------------------------------------------------------------
  function nubeCam(c, ex) {
    c.beginPath();
    for (const [a, b, r] of [[-40, 8, 26], [-6, -10, 32], [34, 6, 27]]) { c.moveTo(a + r + ex, b); c.arc(a, b, r + ex, 0, 6.2832); }
  }
  function fondo(g) {
    const fr = ['#4FAEEB', '#8FD3F4', '#C5E9FA'];
    fr.forEach((c, i) => {
      g.fillStyle = c; g.fillRect(0, i * 110, ZZ.PW, 140);
      if (i) { g.fillStyle = T.trama(g, fr[i - 1], 11, 3); g.fillRect(0, i * 110, ZZ.PW, 28); }
    });
    for (const [x, y, sc] of [[470, 262, 0.9], [150, 226, 0.7]]) {
      g.save(); g.translate(x, y); g.scale(sc, sc);
      nubeCam(g, 6); g.fillStyle = T.TINTA; g.fill();
      T.vol(g, c => nubeCam(c, 0), '#FFFFFF', { sombra: '#C9D6F5', dx: -5, dy: -9, w: 0 });
      g.restore();
    }
    // torres de luz
    for (const x of [64, 576]) {
      T.tubo(g, c => { c.beginPath(); c.moveTo(x, 360); c.lineTo(x, 246); }, '#6B7896', 10, 5);
      T.vol(g, c => T.rr(c, x - 50, 178, 100, 70, 10), '#3A4460', { sombra: '#252C42', dx: 0, dy: -9, w: 6 });
      for (let i = 0; i < 6; i++) { T.circ(g, x - 30 + (i % 3) * 30, 200 + Math.floor(i / 3) * 27, 10); T.pinta(g, '#FFF2B8', 4); }
    }
  }

  // La grada, dos veces seguidas para que dé la vuelta. Se dibuja con el origen en y = 300.
  // El público va apagado y delante hay un murete liso: detrás del corredor, calma.
  function grada(g) {
    for (let k = 0; k < 2; k++) {
      g.save(); g.translate(k * 640, -300);
      g.fillStyle = C.grada; g.fillRect(-10, 340, 660, 250);
      const rng = ZZ.azar(77), cols = [T.ROJO, T.AMARILLO, T.PAPEL, T.MENTA, '#FF9F1C', '#F6A7D5', '#8FD3F4'].map(c => T.mezcla(c, C.grada, 0.45));
      for (let f = 0; f < 5; f++) for (let i = 0; i < 23; i++) {
        const x = 14 + i * 27.826 + (f % 2) * 13.9, y = 366 + f * 30;
        g.fillStyle = C.gradaS; g.fillRect(x - 8, y + 5, 16, 12);
        T.circ(g, x, y, 9.5); g.fillStyle = rng.elige(cols); g.fill(); T.linea(g, 2.5, C.gradaS);
      }
      g.fillStyle = C.gradaS; g.fillRect(-10, 508, 660, 82);
      g.fillStyle = T.trama(g, '#141C4D', 13, 2.4); g.fillRect(-10, 548, 660, 42);
      g.beginPath(); g.moveTo(-10, 508); g.lineTo(650, 508); T.linea(g, 6);
      for (const x of [0, 320]) T.vol(g, c => T.rr(c, x - 8, 334, 16, 176, 0), '#6F80B8', { sombra: '#52629A', dx: -5, dy: 0, w: 5 });
      T.vol(g, c => T.poli(c, [[-10, 304], [650, 304], [650, 344], [-10, 344]]), '#6F80B8', { sombra: '#52629A', dx: 0, dy: -14, w: 6 });
      for (let i = 0; i < 8; i++) {
        const tri = [[i * 80 + 12, 344], [i * 80 + 68, 344], [i * 80 + 40, 366]];
        T.poli(g, tri); T.pinta(g, T.mezcla(i % 2 ? T.ROJO : T.PAPEL, C.grada, 0.35), 4);
      }
      g.restore();
    }
  }

  // Las vallas de publicidad, también dos veces. Origen en y = 586. Claras y con dibujos pequeños.
  function carteles(g) {
    const cols = [T.PAPEL, '#FFD98A', '#BFE6FA', '#BFEBD6'];
    for (let k = 0; k < 2; k++) for (let i = 0; i < 4; i++) {
      const x = k * 640 + i * 160, cx = x + 80, cy = 36;
      T.vol(g, c => T.rr(c, x + 3, 6, 154, 60, 6), cols[i], { sombra: '#D9CDB3', dx: 0, dy: -9, w: 6 });
      if (i === 0) { T.estrella(g, cx, cy, 20, 9, 5, -0.3); T.pinta(g, T.AZUL, 4); }
      else if (i === 1) { T.poli(g, [[cx + 6, cy - 22], [cx - 13, cy + 3], [cx - 1, cy + 3], [cx - 7, cy + 22], [cx + 13, cy - 4], [cx + 1, cy - 4]]); T.pinta(g, T.AMARILLO, 4); }
      else if (i === 2) { T.circ(g, cx - 16, cy, 13); T.pinta(g, T.AZUL, 4); T.circ(g, cx + 16, cy, 13); T.pinta(g, T.VIOLETA, 4); }
      else { T.rr(g, cx - 30, cy - 12, 60, 24, 12); T.pinta(g, T.MENTA, 4); }
    }
  }

  function pista(g, d) {
    g.fillStyle = C.cesped; g.fillRect(0, 648, ZZ.PW, 36);
    g.fillStyle = C.cespedS;
    for (let x = -((d * 0.8) % 120); x < ZZ.PW; x += 120) g.fillRect(x, 648, 60, 36);
    g.beginPath(); g.moveTo(0, 650); g.lineTo(ZZ.PW, 650); T.linea(g, 6);
    g.fillStyle = C.pista; g.fillRect(0, 680, ZZ.PW, 170);
    g.fillStyle = T.trama(g, C.pistaS, 13, 3);
    for (let x = -(d % 220) - 60; x < ZZ.PW + 60; x += 220) { T.poli(g, [[x + 30, 680], [x + 110, 680], [x + 76, 850], [x - 4, 850]]); g.fill(); }
    g.beginPath(); g.moveTo(0, 682); g.lineTo(ZZ.PW, 682); T.linea(g, 6);
    g.fillStyle = T.PAPEL; g.fillRect(0, 694, ZZ.PW, 5); g.fillRect(0, 768, ZZ.PW, 8); g.fillRect(0, 828, ZZ.PW, 10);
  }

  function valla(g, x, alto, cae) {
    const h = alto - 12;
    g.save(); g.translate(x, SUELO + 8); g.scale(1.3, 1.3); g.rotate(-cae * 1.4);
    g.save(); g.globalAlpha = 0.22 * (1 - cae); T.elip(g, 6, 2, 40, 7); g.fillStyle = T.TINTA; g.fill(); g.restore();
    T.tubo(g, c => { c.beginPath(); c.moveTo(-24, 0); c.lineTo(30, 0); }, '#DCE6EE', 8, 4);
    for (const dx of [-18, 18]) T.tubo(g, c => { c.beginPath(); c.moveTo(dx, 0); c.lineTo(dx, -h); }, '#DCE6EE', 8, 4);
    const cam = c => T.rr(c, -34, -h - 18, 68, 28, 7);
    T.vol(g, cam, T.PAPEL, { sombra: '#D9CDB3', dx: 0, dy: -8, w: 0 });
    g.save(); cam(g); g.clip(); g.fillStyle = T.ROJO; g.fillRect(-21, -h - 18, 14, 28); g.fillRect(7, -h - 18, 14, 28); g.restore();
    cam(g); T.linea(g, 5);
    g.restore();
  }

  // El balón viene con mal genio: si saltas, te lo comes.
  function balon(g, x, y, t, dado) {
    g.save(); g.translate(x, y);
    if (!dado) { g.beginPath(); for (const dy of [-13, 0, 13]) { g.moveTo(38, dy); g.lineTo(66 + (dy ? 0 : 16), dy); } T.linea(g, 5, T.PAPEL); }
    g.rotate(dado ? t * 0.5 : Math.sin(t * 0.3) * 0.15);
    T.vol(g, c => T.circ(c, 0, 0, 30), '#FFFFFF', { sombra: '#C9D6F5', dx: -6, dy: -7, w: 6 });
    g.save(); T.circ(g, 0, 0, 28); g.clip(); g.fillStyle = T.TINTA;
    for (const [a, b] of [[-22, -24], [24, -20], [26, 22], [-20, 24]]) { T.circ(g, a, b, 12); g.fill(); }
    g.restore();
    g.scale(0.4, 0.4);
    P.cara(g, 'enfadado', t, { ex: 20, ey: -6, by: 22, piel: '#FFFFFF' });
    g.restore();
  }

  // Un dirigible con cara cruza el cielo.
  function dirigible(g, t) {
    const x = 330 + Math.sin(t * 0.008) * 150, y = 96 + Math.sin(t * 0.03) * 6;
    g.save(); g.translate(x, y);
    T.poli(g, [[58, 0], [96, -30], [96, 30]]); T.pinta(g, T.ROJO, 5);
    T.vol(g, c => T.rr(c, -24, 30, 48, 18, 7), '#2B2536', { sombra: T.TINTA, dx: 0, dy: -5, w: 5 });
    T.vol(g, c => T.elip(c, 0, 0, 80, 38), T.AMARILLO, { sombra: '#E0A51A', dx: -7, dy: -9, w: 6 });
    g.translate(-22, 2); g.scale(0.52, 0.52);
    P.cara(g, 'contento', t, { ex: 20, ey: -6, by: 22, piel: T.AMARILLO });
    g.restore();
  }

  // La zapatilla: trota a saltitos, se estira al saltar y se aplasta al caer. El origen es donde pisa.
  function zapatilla(g, e, vis) {
    const n = vis.n, t = vis.t, y = altura(e, n), aire = y > 0;
    const tr = vis.tropiezo === undefined ? 99 : t - vis.tropiezo, cae = tr < 24;
    const fase = e.dist[Math.min(n, TOTAL)] * 0.07;
    const bote = aire ? 0 : Math.abs(Math.sin(fase)) * 18;
    const u = aire ? (n - e.salto) / J : 0;
    let sx = 1, sy = 1;
    if (aire) { const k = Math.cos(u * Math.PI); sy = 1 + k * 0.28; sx = 1 - k * 0.17; }
    else { const k = Math.abs(Math.cos(fase)); sy = 1 - k * 0.09; sx = 1 + k * 0.06; }
    if (vis.aterriza !== undefined && t - vis.aterriza < 7) { const k = 1 - (t - vis.aterriza) / 7; sy = 1 - 0.34 * k; sx = 1 + 0.24 * k; }
    g.save(); g.globalAlpha = 0.28; T.elip(g, RX + 6, SUELO + 12, 96 - y * 0.25, 13 - y * 0.03); g.fillStyle = T.TINTA; g.fill(); g.restore();
    // rayas de velocidad
    g.beginPath(); for (const [dy, l] of [[-40, 46], [-78, 30], [-112, 40]]) { g.moveTo(RX - 124 - ((t * 9 + dy) % 30), SUELO - y - bote + dy); g.lineTo(RX - 124 - l - ((t * 9 + dy) % 30), SUELO - y - bote + dy); } T.linea(g, 5, T.PAPEL);
    g.save(); g.translate(RX, SUELO - y - bote - (cae ? Math.sin(tr / 24 * Math.PI) * 60 : 0));
    g.rotate(cae ? ZZ.e.io(tr / 24) * 6.2832 : aire ? -0.34 + u * 0.62 : Math.sin(fase) * 0.11);
    g.scale(sx * ESC, sy * ESC);
    const cuerpo = c => {
      c.beginPath(); c.moveTo(-90, -28); c.lineTo(-94, -116); c.quadraticCurveTo(-92, -146, -60, -142); c.lineTo(-16, -134);
      c.quadraticCurveTo(12, -90, 62, -78); c.quadraticCurveTo(104, -66, 102, -28); c.closePath();
    };
    // la lengüeta y el lazo, por detrás
    T.vol(g, c => T.rr(c, -50, -172, 44, 52, 14), '#FFFFFF', { sombra: '#D9E1EA', dx: -6, dy: 0, w: 6 });
    const lazo = Math.sin(t * 0.5) * 0.25;
    for (const sg of [-1, 1]) { g.save(); g.translate(-8, -132); g.rotate(sg * (0.9 + lazo) - 0.3); T.vol(g, c => T.elip(c, 0, -22, 10, 22), '#FFFFFF', { sombra: '#D9E1EA', dx: -3, dy: 0, w: 5 }); g.restore(); }
    T.vol(g, cuerpo, T.ROJO, { sombra: '#C92F47', dx: -10, dy: -8, w: 7 });
    // puntera, talón y cordones
    g.save(); cuerpo(g); g.clip();
    T.circ(g, 98, -22, 50); T.pinta(g, '#FFFFFF', 6);
    T.rr(g, -100, -124, 26, 100, 8); T.pinta(g, T.AMARILLO, 6);
    g.restore();
    g.beginPath(); for (const [x, yy] of [[2, -104], [22, -92], [42, -84]]) { g.moveTo(x - 9, yy + 10); g.lineTo(x + 9, yy - 12); } T.linea(g, 7, '#FFFFFF');
    cuerpo(g); T.linea(g, 7);
    // suela
    T.vol(g, c => { c.beginPath(); c.moveTo(-96, -10); c.quadraticCurveTo(-98, -32, -82, -34); c.lineTo(88, -34); c.quadraticCurveTo(108, -30, 104, -10); c.quadraticCurveTo(100, 4, 80, 4); c.lineTo(-78, 4); c.quadraticCurveTo(-94, 4, -96, -10); c.closePath(); },
      '#FFFFFF', { sombra: '#D9E1EA', dx: 0, dy: -9, w: 7 });
    g.beginPath(); for (let i = 0; i < 6; i++) { g.moveTo(-70 + i * 30, 4); g.lineTo(-70 + i * 30, -6); } T.linea(g, 4, '#B9C6D2');
    // la cara, bien grande en el costado
    g.translate(-30, -82); g.scale(0.92, 0.92);
    P.cara(g, cae ? 'susto' : e.enMeta ? 'euforico' : aire ? 'contento' : 'tension', t, { ex: 22, ey: -8, by: 20, piel: T.ROJO, mira: { x: 0.7, y: 0 } });
    g.restore();
  }

  function cinta(g, x0, y0, x1, y1) {
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); T.linea(g, 18);
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); T.linea(g, 9, T.ROJO);
  }

  function dibuja(g, e, vis) {
    const n = Math.min(vis.n, TOTAL), t = vis.t, d = e.dist[n], N = NIV[e.nivel];
    T.capa(g, vis, 'deportes', fondo);
    dirigible(g, t);
    g.save(); g.translate(-((d * 0.14) % 640), 300); T.capa(g, vis, 'deportesGrada', grada, 1280, 292); g.restore();
    g.save(); g.translate(-((d * 0.5) % 640), 586); T.capa(g, vis, 'deportesCarteles', carteles, 1280, 72); g.restore();
    pista(g, d);
    // la meta: dos postes y la cinta
    const xm = RX + e.dMeta - d, hayMeta = xm > -80 && xm < 760;
    if (hayMeta) {
      T.tubo(g, c => { c.beginPath(); c.moveTo(xm + 34, SUELO - 24); c.lineTo(xm + 34, SUELO - 300); }, T.PAPEL, 11, 5);
      if (!e.enMeta) cinta(g, xm + 34, SUELO - 190, xm, SUELO - 160);
    }
    vis.ch.dibuja(g, 0);
    const delante = [];
    for (const o of e.obs) {
      const x = RX + o.d - d;
      if (x < -140 || x > 780) continue;
      const dt = n - o.llega;
      if (o.balon) {
        if (o.estado === 2) balon(g, x - dt * 3, SUELO - 240 - dt * 9 + dt * dt * 0.3, t, true);
        else {
          balon(g, x, SUELO - 240 + Math.sin(t * 0.2 + o.llega) * 5, t, false);
          g.save(); g.globalAlpha = 0.2; T.elip(g, x, SUELO + 12, 24, 7); g.fillStyle = T.TINTA; g.fill(); g.restore();
        }
      } else if (x > RX) delante.push([x, o.estado === 2 ? Math.min(1, dt / 9) : 0]);
      else valla(g, x, N.alto, o.estado === 2 ? Math.min(1, dt / 9) : 0);
    }
    zapatilla(g, e, vis);
    for (const v of delante) valla(g, v[0], N.alto, v[1]);
    if (hayMeta) {
      T.tubo(g, c => { c.beginPath(); c.moveTo(xm - 34, SUELO + 40); c.lineTo(xm - 34, SUELO - 236); }, T.PAPEL, 11, 5);
      if (!e.enMeta) cinta(g, xm, SUELO - 160, xm - 34, SUELO - 130);
    }
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'salta') { son && son.agarra(); }
      else if (x.t === 'aterriza') { vis.aterriza = vis.t; T.polvo(vis.ch, RX - 30, SUELO + 4, 6, '#F6C9A0', 5, 12, 0); }
      else if (x.t === 'pasa') {
        if (x.limpio) { T.estrellas(vis.ch, RX + 30, SUELO - 40, 5, T.AMARILLO, 8, 15, 1); son && son.golpe(); }
        if (x.racha % 5 === 0) { T.palabra(vis.ch, '¡' + x.racha + ' SEGUIDAS!', 330, 160, T.AMARILLO, 52, 1, true); son && son.acierto(); }
      } else if (x.t === 'tropieza') {
        vis.tropiezo = vis.t; vis.temblor = 10;
        T.estrellas(vis.ch, RX + 40, SUELO - 60, 7, T.PAPEL, 9, 18, 1);
        T.palabra(vis.ch, '¡AY!', 330, 160, T.ROJO, 64, 1, true);
        son && son.fallo();
      } else if (x.t === 'balonazo') {
        vis.tropiezo = vis.t; vis.temblor = 12;
        T.estrellas(vis.ch, RX + 10, SUELO - 236, 9, T.PAPEL, 10, 20, 1);
        T.palabra(vis.ch, '¡BALONAZO!', 330, 160, T.ROJO, 56, 1, true);
        son && son.pum();
      } else if (x.t === 'meta') {
        T.confeti(vis.ch, RX + 30, SUELO - 260, 40, [T.AMARILLO, T.ROJO, T.MENTA, T.PAPEL, T.AZUL], 14, 1);
        T.palabra(vis.ch, x.limpia ? '¡CARRERA LIMPIA!' : '¡META!', 330, 160, T.AMARILLO, x.limpia ? 50 : 70, 1, true);
        son && son.sol();
      }
    }
  }

  ZZ.canales.deportes = {
    id: 'deportes', num: 11, nombre: 'DEPORTES', orden: '¡SALTA!', hechoTxt: '¡META!',
    pista: 'Toca para saltar cada valla. Con balón, no saltes',
    rotulo: 'EN DIRECTO: LOS 15 SEGUNDOS VALLAS',
    color: C.pista, color2: C.grada, color3: T.AMARILLO,
    pasos: TOTAL,      // quince segundos
    animo: x => (x.t === 'tropieza' || x.t === 'balonazo' ? -1 : (x.t === 'pasa' && x.racha % 5 === 0) || x.t === 'meta' ? 1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
