</script>
<script>
/* ZikZak · canal 12 · Terror · ¡QUIETO!
   Dura diez segundos. Un fantasma de sábana cruza el salón del monstruo para llegar al tarro de galletas.
   Con el dedo puesto, avanza de puntillas; al soltarlo, se queda quieto. El monstruo duerme, se revuelve
   (deja de roncar: es el aviso) y abre el ojo: si te pilla andando, te manda un trecho atrás.
   Mide los nervios: cuenta llegar, y llegar pronto. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const TOTAL = 600;
  const X0 = 74, X1 = 456, SUELO = 800;      // de dónde sale el fantasma, adónde llega y por dónde pisa
  const PASO = 1 / 270;                      // lo que avanza cada paso con el dedo puesto
  const GRACIA = 6;                          // pasos que perdona el monstruo al abrir el ojo
  const NIV = [null,
    { duerme: [70, 110], aviso: 30, mira: [34, 46], falsos: 0 },
    { duerme: [54, 92], aviso: 22, mira: [38, 54], falsos: 0.3 },
    { duerme: [40, 76], aviso: 16, mira: [40, 60], falsos: 0.45 }];
  const C = { pared: '#6A48D7', paredS: '#5536B8', friso: '#3F2A8C', frisoS: '#2C1D66', suelo: '#C97B45', sueloS: '#8E4F2A',
    bicho: '#8BD63A', bichoS: '#5FA51F', sillon: '#D3273E', sillonS: '#8E1630', noche: '#1B1447' };

  // --- lógica ---------------------------------------------------------------
  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const seg = [];
    let t = 0;
    while (t < TOTAL + 80) {
      const d = rng.entero(N.duerme[0], N.duerme[1]) + (seg.length ? 0 : 24);
      seg.push({ t0: t, tipo: 'duerme', dur: d }); t += d;
      if (rng() < N.falsos) {       // se revuelve y sigue durmiendo
        seg.push({ t0: t, tipo: 'falso', dur: N.aviso + 10 }); t += N.aviso + 10;
        const d2 = rng.entero(24, 50);
        seg.push({ t0: t, tipo: 'duerme', dur: d2 }); t += d2;
      }
      seg.push({ t0: t, tipo: 'aviso', dur: N.aviso }); t += N.aviso;
      const m = rng.entero(N.mira[0], N.mira[1]);
      seg.push({ t0: t, tipo: 'mira', dur: m, pillo: false }); t += m;
    }
    return { semilla, nivel, seg, is: 0, dist: 0, pulsado: false, anda: false, aturdido: 0, pillados: 0, fin: -1, hecho: false, ev: [] };
  }

  function paso(e, entradas, n) {
    while (e.is < e.seg.length - 1 && n >= e.seg[e.is].t0 + e.seg[e.is].dur) { e.is++; e.ev.push({ t: e.seg[e.is].tipo }); }
    const s = e.seg[e.is];
    for (const en of entradas) { if (en.t === 'd') e.pulsado = true; else if (en.t === 'u') e.pulsado = false; }
    e.anda = false;
    if (e.fin >= 0) { if (n >= e.fin + 44) e.hecho = true; return; }
    if (!e.pulsado || n < e.aturdido) return;
    const mirando = s.tipo === 'mira' && n - s.t0 >= GRACIA;
    if (mirando) {
      if (!s.pillo) { s.pillo = true; e.pillados++; e.dist = Math.max(0, e.dist - 0.2); e.aturdido = n + 36; e.ev.push({ t: 'pillado' }); }
      return;
    }
    e.dist += PASO; e.anda = true;
    if (e.dist >= 1) { e.dist = 1; e.fin = n; e.ev.push({ t: 'llega' }); }
  }

  function puntuacion(e) {
    if (e.fin >= 0) return ZZ.lim(Math.round(1000 - (e.fin - 300) * 1.2), 650, 1000);
    return Math.round(640 * e.dist);
  }

  // Jugador de la casa: anda mientras ronca y tarda más o menos en darse cuenta de que deja de roncar.
  function casa(e, mem, rng, d, n) {
    if (mem.is === undefined) { mem.is = -1; mem.pulsa = false; mem.meta = false; mem.cuando = 0; }
    if (e.fin >= 0) { if (!mem.pulsa) return []; mem.pulsa = false; return [{ t: 'u', x: 320, y: 500 }]; }
    if (mem.is !== e.is) {
      mem.is = e.is;
      const s = e.seg[e.is];
      const reac = Math.max(1, Math.round(ZZ.mix(30, 7, d) + rng.campana() * ZZ.mix(9, 2, d)));
      if (s.tipo === 'duerme') { mem.meta = true; mem.cuando = n + reac; }
      else if (s.tipo === 'mira') { mem.cuando = mem.meta ? n : Math.max(mem.cuando, n); mem.meta = false; }
      else { mem.meta = false; mem.cuando = n + reac; }
    }
    if (n >= mem.cuando && mem.pulsa !== mem.meta) { mem.pulsa = mem.meta; return [{ t: mem.meta ? 'd' : 'u', x: 320, y: 500 }]; }
    return [];
  }

  // --- dibujo -----------------------------------------------------------------
  function fondo(g) {
    g.fillStyle = C.pared; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.rayas(g, C.paredS, 34, 12); g.fillRect(0, 0, ZZ.PW, 470);
    // ventana con luna
    const vx = 520, vy = 112;
    const hueco = c => T.rr(c, vx - 70, vy, 140, 196, 66);
    T.sombra(g, hueco, 7, 9, 0.35);
    hueco(g); T.pinta(g, C.noche, 9);
    g.save(); hueco(g); g.clip();
    T.circ(g, vx + 6, vy + 74, 40); T.pinta(g, '#FFE48A', 0);
    T.circ(g, vx + 26, vy + 60, 34); T.pinta(g, C.noche, 0);
    g.fillStyle = '#FFFFFF';
    for (const [x, y, r] of [[vx - 36, vy + 46, 6], [vx + 40, vy + 130, 5], [vx - 20, vy + 150, 4]]) { T.estrella(g, x, y, r * 2, r * 0.8, 4); g.fill(); }
    g.restore();
    g.beginPath(); g.moveTo(vx, vy); g.lineTo(vx, vy + 196); g.moveTo(vx - 70, vy + 104); g.lineTo(vx + 70, vy + 104); T.linea(g, 7);
    hueco(g); T.linea(g, 9);
    // dos retratos de familia
    for (const [x, y, col] of [[120, 250, '#FF9F1C'], [262, 150, T.MENTA]]) {
      const marco = c => T.rr(c, x - 52, y - 62, 104, 124, 10);
      T.sombra(g, marco, 7, 9, 0.35);
      T.vol(g, marco, '#E2A93B', { sombra: '#B27A1E', dx: -6, dy: -7, w: 6 });
      T.rr(g, x - 38, y - 48, 76, 96, 6); T.pinta(g, C.noche, 5);
      g.save(); T.rr(g, x - 38, y - 48, 76, 96, 6); g.clip();
      T.vol(g, c => T.elip(c, x, y + 22, 34, 44), col, { dx: -5, dy: -6, w: 5 });
      T.poli(g, [[x - 30, y - 6], [x - 22, y - 36], [x - 10, y - 12]]); T.pinta(g, T.PAPEL, 4);
      T.poli(g, [[x + 30, y - 6], [x + 22, y - 36], [x + 10, y - 12]]); T.pinta(g, T.PAPEL, 4);
      g.restore();
      T.circ(g, x, y + 8, 13); T.pinta(g, '#FFFFFF', 4); T.circ(g, x + 3, y + 10, 5); T.pinta(g, T.TINTA, 0);
      g.beginPath(); g.moveTo(x - 12, y + 34); g.lineTo(x - 6, y + 40); g.lineTo(x, y + 34); g.lineTo(x + 6, y + 40); g.lineTo(x + 12, y + 34); T.linea(g, 4);
    }
    // friso y suelo de tablas
    T.vol(g, c => T.rr(c, -20, 462, 680, 200, 0), C.friso, { sombra: C.frisoS, dx: 0, dy: 22, w: 7 });
    g.fillStyle = T.trama(g, C.frisoS, 14, 2.8); g.fillRect(0, 560, ZZ.PW, 90);
    T.vol(g, c => T.rr(c, -20, 648, 680, 230, 0), C.suelo, { sombra: C.sueloS, dx: 0, dy: 24, w: 7 });
    g.beginPath();
    for (const y of [712, 776]) { g.moveTo(0, y); g.lineTo(ZZ.PW, y); }
    for (const [x, y0] of [[120, 672], [380, 672], [250, 712], [520, 712], [90, 776], [430, 776]]) { g.moveTo(x, y0); g.lineTo(x, y0 + (y0 === 672 ? 40 : 64)); }
    T.linea(g, 4, C.sueloS);
    // la alfombra
    T.vol(g, c => T.elip(c, 280, 790, 270, 40), T.ROJO, { sombra: '#C92F47', dx: 0, dy: -8, w: 6 });
    T.elip(g, 280, 788, 220, 26); T.linea(g, 5, T.AMARILLO);
    // la mesita y el tarro de galletas
    T.tubo(g, c => { c.beginPath(); c.moveTo(512, 690); c.lineTo(500, 796); }, '#E8A968', 11, 5);
    T.tubo(g, c => { c.beginPath(); c.moveTo(600, 690); c.lineTo(612, 796); }, '#E8A968', 11, 5);
    T.vol(g, c => T.rr(c, 484, 668, 144, 26, 9), '#E8A968', { sombra: C.suelo, dx: 0, dy: -8, w: 6 });
    const tarro = c => T.rr(c, 498, 546, 116, 124, 32);
    T.vol(g, tarro, '#BFE6FA', { sombra: '#8FC3DE', dx: -9, dy: 0, w: 7 });
    for (const [x, y] of [[528, 636], [570, 630], [548, 602], [584, 598], [540, 574]]) { T.circ(g, x, y, 15); T.pinta(g, '#D99A5B', 4); T.circ(g, x - 4, y - 3, 3); T.pinta(g, '#7A4220', 0); T.circ(g, x + 5, y + 4, 3); T.pinta(g, '#7A4220', 0); }
    tarro(g); T.linea(g, 7);
    T.vol(g, c => T.rr(c, 508, 524, 96, 30, 12), T.ROJO, { dx: 0, dy: -8, w: 6 });
  }

  // El monstruo en su sillón. ojo: 0 cerrado, 0,5 entreabierto, 1 abierto.
  function monstruo(g, ojo, t, miraX, ronca) {
    const resp = ronca ? Math.sin(t * 0.09) : 0;
    // el sillón, por detrás
    T.vol(g, c => T.rr(c, 150, 300, 340, 370, 60), C.sillon, { sombra: C.sillonS, dx: -16, dy: 0, w: 8 });
    for (const [x, y] of [[230, 370], [320, 350], [410, 370], [276, 430], [364, 430]]) { T.circ(g, x, y, 7); T.pinta(g, C.sillonS, 0); }
    // cuernos y cuerpo
    for (const sg of [-1, 1]) { T.vol(g, c => T.poli(c, [[320 + sg * 62, 430], [320 + sg * 124, 362], [320 + sg * 104, 452]]), T.PAPEL, { sombra: '#D9CDB3', dx: 0, dy: -6, w: 6 }); }
    T.vol(g, c => T.elip(c, 320, 546 - resp * 4, 146, 130 + resp * 5), C.bicho, { sombra: C.bichoS, dx: -14, dy: -12, w: 8 });
    g.beginPath();
    for (const [x, y] of [[214, 596], [246, 632], [392, 634], [424, 598], [300, 652], [344, 650]]) { g.moveTo(x - 8, y); g.lineTo(x, y + 14); g.lineTo(x + 8, y); }
    T.linea(g, 5, C.bichoS);
    // el ojo
    const ex = 320, ey = 500 - resp * 4;
    if (ojo < 0.2) {
      g.beginPath(); g.moveTo(ex - 58, ey); g.quadraticCurveTo(ex, ey + 40, ex + 58, ey); T.linea(g, 9);
      g.beginPath(); for (const dx of [-36, 0, 36]) { g.moveTo(ex + dx, ey + 22 - Math.abs(dx) * 0.3); g.lineTo(ex + dx * 1.15, ey + 40 - Math.abs(dx) * 0.3); } T.linea(g, 6);
    } else {
      T.elip(g, ex, ey, 62, 54); T.pinta(g, '#FFFFFF', 8);
      const px = ex + ZZ.lim(miraX, -1, 1) * 26, py = ey + 18;
      T.circ(g, px, py, 28); T.pinta(g, ojo >= 1 ? T.ROJO : '#FF9F1C', 6);
      T.circ(g, px, py, 13); T.pinta(g, T.TINTA, 0);
      T.circ(g, px - 9, py - 9, 6); T.pinta(g, '#FFFFFF', 0);
      if (ojo < 1) { g.save(); T.elip(g, ex, ey, 62, 54); g.clip(); g.fillStyle = C.bicho; g.fillRect(ex - 70, ey - 60, 140, 62); g.restore(); g.beginPath(); g.moveTo(ex - 60, ey + 2); g.lineTo(ex + 60, ey + 2); T.linea(g, 8); T.elip(g, ex, ey, 62, 54); T.linea(g, 8); }
    }
    // la boca
    if (ojo >= 1) {
      T.rr(g, 262, 584, 116, 40, 16); T.pinta(g, '#3B1522', 7);
      g.fillStyle = '#FFFFFF'; for (let i = 0; i < 5; i++) { T.poli(g, [[270 + i * 22, 586], [292 + i * 22, 586], [281 + i * 22, 606]]); g.fill(); }
      T.rr(g, 262, 584, 116, 40, 16); T.linea(g, 7);
    } else {
      T.elip(g, 320, 600, 30 + resp * 8, 18 + resp * 12); T.pinta(g, '#3B1522', 7);
      T.poli(g, [[300, 588], [312, 588], [306, 602]]); T.pinta(g, '#FFFFFF', 3);
      T.poli(g, [[328, 588], [340, 588], [334, 602]]); T.pinta(g, '#FFFFFF', 3);
    }
    // los brazos del sillón, por delante
    for (const sg of [-1, 1]) {
      T.vol(g, c => T.rr(c, 320 + sg * 196 - 44, 536, 88, 150, 34), C.sillon, { sombra: C.sillonS, dx: -10, dy: 0, w: 8 });
      T.vol(g, c => T.elip(c, 320 + sg * 176, 548, 36, 26), C.bicho, { sombra: C.bichoS, dx: -5, dy: -5, w: 7 });
    }
  }

  function fantasma(g, x, e, vis) {
    const t = vis.t, susto = vis.pillado !== undefined && t - vis.pillado < 32;
    const k = susto ? (t - vis.pillado) / 32 : 0;
    const bote = e.anda ? Math.abs(Math.sin(t * 0.36)) * 9 : 0;
    g.save(); g.globalAlpha = 0.28; T.elip(g, x + 4, SUELO + 6, 50, 11); g.fillStyle = T.TINTA; g.fill(); g.restore();
    g.save(); g.translate(x, SUELO - bote - Math.sin(k * Math.PI) * 76); g.rotate(susto ? -Math.sin(k * Math.PI) * 0.3 : e.anda ? 0.06 : 0);
    for (const sg of [-1, 1]) {
      const dy = e.anda ? Math.max(0, Math.sin(t * 0.36 + (sg > 0 ? 0 : Math.PI))) * 12 : 0;
      T.vol(g, c => T.rr(c, sg * 18 - 16, -16 - dy, 36, 20, 9), T.ROJO, { dx: 0, dy: -5, w: 5 });
    }
    const cam = c => {
      c.beginPath(); c.moveTo(-52, -14); c.lineTo(-52, -104); c.quadraticCurveTo(-52, -170, 0, -170); c.quadraticCurveTo(52, -170, 52, -104); c.lineTo(52, -14);
      c.quadraticCurveTo(39, -30, 26, -14); c.quadraticCurveTo(13, -30, 0, -14); c.quadraticCurveTo(-13, -30, -26, -14); c.quadraticCurveTo(-39, -30, -52, -14); c.closePath();
    };
    T.vol(g, cam, '#FFFFFF', { sombra: '#C9D6F5', dx: -9, dy: -6, w: 7 });
    const quieto = !e.anda && !susto && e.fin < 0, feliz = e.fin >= 0;
    for (const sg of [-1, 1]) {
      if (feliz) { g.beginPath(); g.moveTo(sg * 20 - 12, -112); g.quadraticCurveTo(sg * 20, -128, sg * 20 + 12, -112); T.linea(g, 7); }
      else { T.elip(g, sg * 20 + (quieto ? -5 : 4), -114 + (quieto ? -4 : 0), 12, susto ? 22 : 16); T.pinta(g, T.TINTA, 0); T.circ(g, sg * 20 + (quieto ? -8 : 1), -120, 4); T.pinta(g, '#FFFFFF', 0); }
    }
    if (susto) { T.elip(g, 0, -78, 12, 16); T.pinta(g, T.TINTA, 0); }
    else if (feliz) { g.beginPath(); g.moveTo(-14, -90); g.quadraticCurveTo(0, -72, 14, -90); T.linea(g, 6); }
    else if (quieto) { T.poli(g, [[40, -150], [34, -134], [46, -134]]); T.pinta(g, '#8FD3F4', 4); }
    g.restore();
  }

  const estado = (e, n) => { const s = e.seg[e.is]; return s.tipo === 'mira' ? 1 : (s.tipo === 'aviso' || s.tipo === 'falso') ? 0.5 : 0; };

  function dibuja(g, e, vis) {
    const n = vis.n, t = vis.t, ojo = estado(e, n), x = X0 + (X1 - X0) * e.dist;
    T.capa(g, vis, 'terror', fondo);
    monstruo(g, ojo, t, (x - 320) / 220, ojo === 0);
    if (ojo >= 1) {      // lo que ve cuando abre el ojo
      g.save(); g.globalAlpha = 0.3; T.poli(g, [[296, 520], [344, 520], [680, 850], [-40, 850]]); g.fillStyle = T.AMARILLO; g.fill(); g.restore();
      g.setLineDash([18, 14]); g.beginPath(); g.moveTo(296, 560); g.lineTo(-10, 850); g.moveTo(344, 560); g.lineTo(650, 850); T.linea(g, 5, T.AMARILLO); g.setLineDash([]);
    } else if (ojo === 0) {  // ronca
      for (let i = 0; i < 3; i++) {
        const k = ((t * 0.012) + i / 3) % 1;
        T.texto(g, 'Z', 404 + k * 30, 440 - k * 190, 24 + k * 30, { color: T.PAPEL, w: 6, rot: Math.sin(k * 6) * 0.2 });
      }
    }
    if (e.fin < 0) T.marca(g, 556, 498 + Math.sin(t * 0.22) * 5, 0, 36);
    vis.ch.dibuja(g, 0);
    fantasma(g, x, e, vis);
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    if (e.anda && vis.t % 9 === 0) T.polvo(vis.ch, X0 + (X1 - X0) * e.dist - 20, SUELO + 2, 1, '#F3C58E', 2, 8, 0);
    for (const x of ev) {
      if (x.t === 'aviso' || x.t === 'falso') { T.palabra(vis.ch, '¿EH?', 320, 250, T.PAPEL, 56, 1, true); son && son.golpe(); }
      else if (x.t === 'mira') { vis.temblor = 6; son && son.orden(); }
      else if (x.t === 'pillado') {
        vis.pillado = vis.t; vis.temblor = 14;
        T.estrellas(vis.ch, X0 + (X1 - X0) * e.dist, SUELO - 120, 8, T.PAPEL, 11, 18, 1);
        T.palabra(vis.ch, '¡TE VIO!', 320, 250, T.ROJO, 62, 1, true);
        son && son.pum();
      } else if (x.t === 'llega') {
        T.confeti(vis.ch, 556, 520, 30, [T.AMARILLO, T.ROJO, T.MENTA, T.PAPEL], 12, 1);
        T.palabra(vis.ch, e.pillados ? '¡GALLETAS!' : '¡NI SE ENTERA!', 320, 250, T.AMARILLO, 56, 1, true);
        son && son.sol();
      }
    }
  }

  ZZ.canales.terror = {
    id: 'terror', num: 12, nombre: 'TERROR', orden: '¡QUIETO!', hechoTxt: '¡ÑAM!',
    pista: 'Mantén para andar. Suelta si abre el ojo',
    rotulo: 'SESIÓN GOLFA: «EL TARRO DE GALLETAS»',
    color: C.pared, color2: C.bicho, color3: T.AMARILLO,
    arrastra: true,
    pasos: TOTAL,      // diez segundos
    animo: x => (x.t === 'pillado' ? -1 : x.t === 'llega' ? 1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
//# sourceURL=zz/canales/terror.js
</script>
<script>
/* ZikZak · canal 13 · Dibujos · ¡ESQUIVA!
   Dura diez segundos. Desde las ventanas caen cosas sobre un huevo. En cada tanda caen dos, una siempre
   encima de él: solo queda un sitio libre y hay que llegar. Se toca a la izquierda o a la derecha
   de la pantalla para dar un salto a ese lado.
   Mide los reflejos: cuenta salvarse y, además, lo pronto que se llega al sitio libre. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const TOTAL = 600;
  const XS = [130, 320, 510], SUELO = 694, VENTANA = 190;
  const NIV = [null,
    { cada: 76, cae: 62, n: 7 },
    { cada: 58, cae: 48, n: 9 },
    { cada: 46, cae: 38, n: 12 }];
  const C = { muro: '#F6A7D5', muroS: '#E57FBC', acera: '#AEB9D4', aceraS: '#8C98B8', calle: '#4A3B8F', calleS: '#35296B',
    huevo: '#FFF4DC', huevoS: '#EAD9B0' };

  // --- lógica ---------------------------------------------------------------
  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const plan = [];
    for (let k = 0; k < N.n; k++) plan.push({ s: 40 + k * N.cada, lado: rng.entero(0, 1), tipos: [rng.entero(0, 2), rng.entero(0, 2)] });
    return { semilla, nivel, plan, cae: N.cae, io: 0, ola: null, carril: 1, de: 1, cambio: -99, aturdido: 0, suma: 0, golpes: 0, hecho: false, ev: [] };
  }

  function paso(e, entradas, n) {
    for (const en of entradas) {
      if (en.t !== 'd' || n < e.aturdido) continue;
      const a = ZZ.lim(e.carril + (en.x < ZZ.PW / 2 ? -1 : 1), 0, 2);
      if (a === e.carril) continue;
      e.de = e.carril; e.carril = a; e.cambio = n;
      e.ev.push({ t: 'salta' });
    }
    // empieza una tanda: una cosa cae donde está el huevo y otra en uno de los dos sitios que quedan
    if (e.io < e.plan.length && n === e.plan[e.io].s) {
      const p = e.plan[e.io], otros = [0, 1, 2].filter(c => c !== e.carril);
      e.ola = { k: e.io, s: n, peligro: [e.carril, otros[p.lado]], libre: otros[1 - p.lado], tipos: p.tipos, estado: 0 };
      e.io++;
      e.ev.push({ t: 'cae' });
    }
    const o = e.ola;
    if (o && o.estado === 0 && n === o.s + e.cae) {
      if (e.carril === o.libre) {
        const pronto = 1 - ZZ.lim((e.cambio - o.s) / e.cae, 0, 1);
        o.estado = 1; o.pts = 60 + Math.round(40 * pronto); e.suma += o.pts;
        e.ev.push({ t: 'salva', pts: o.pts, pronto: pronto > 0.6 });
      } else {
        o.estado = 2; e.golpes++; e.aturdido = n + 16;
        e.ev.push({ t: 'golpe' });
      }
      if (e.io >= e.plan.length) e.fin = n;
    }
    if (e.fin !== undefined && n >= e.fin + 14) e.hecho = true;
  }

  function puntuacion(e) { return ZZ.lim(Math.round(e.suma * 10 / e.plan.length), 0, 1000); }

  // Jugador de la casa: tarda en ver por dónde cae y, si es flojo, a veces se va al sitio malo.
  function casa(e, mem, rng, d, n) {
    const o = e.ola;
    if (!o || o.estado !== 0) return [];
    if (mem.k !== o.k) {
      mem.k = o.k; mem.ult = -9;
      mem.meta = rng() < ZZ.mix(0.28, 0, d) ? o.peligro[1] : o.libre;
      mem.desde = n + Math.round(ZZ.mix(30, 7, d) + Math.abs(rng.campana()) * ZZ.mix(8, 2, d));
    }
    if (n >= mem.desde && e.carril !== mem.meta && n - mem.ult >= 5 && n >= e.aturdido) {
      mem.ult = n;
      return [{ t: 'd', x: mem.meta < e.carril ? 100 : 540, y: 500 }];
    }
    return [];
  }

  // --- dibujo -----------------------------------------------------------------
  function fondo(g) {
    // la fachada
    g.fillStyle = C.muro; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.trama(g, C.muroS, 15, 3); g.fillRect(0, 300, ZZ.PW, 160);
    g.beginPath();
    for (const [x, y] of [[40, 380], [210, 430], [420, 350], [560, 440], [90, 520], [470, 540]]) { g.moveTo(x, y); g.lineTo(x + 46, y); g.moveTo(x + 14, y + 16); g.lineTo(x + 60, y + 16); }
    T.linea(g, 4, C.muroS);
    // tres ventanas, una encima de cada sitio
    for (const x of XS) {
      const hueco = c => T.rr(c, x - 62, 96, 124, 150, 12);
      T.sombra(g, hueco, 6, 8, 0.3);
      hueco(g); T.pinta(g, '#2B2536', 8);
      g.save(); hueco(g); g.clip(); g.fillStyle = T.trama(g, '#463E62', 13, 2.8); g.fillRect(x - 62, 96, 124, 150); g.restore();
      const vec = { 130: ['#FF9F1C', 'euforico'], 320: ['#8BD63A', 'enfadado'], 510: ['#57C7F2', 'contento'] }[x];
      g.save(); hueco(g); g.clip();
      T.vol(g, c => T.elip(c, x, 236, 52, 66), vec[0], { sombra: T.oscuro(vec[0], 0.25), dx: -7, dy: -7, w: 6 });
      g.translate(x, 206); g.scale(0.62, 0.62); P.cara(g, vec[1], x, { ex: 22, ey: -8, by: 20, piel: vec[0], mira: { x: 0, y: 0.9 } });
      g.restore();
      hueco(g); T.linea(g, 8);
      for (const sg of [-1, 1]) T.vol(g, c => T.rr(c, x + sg * 78 - 14, 92, 28, 158, 8), T.MENTA, { sombra: T.oscuro(T.MENTA, 0.25), dx: -5, dy: 0, w: 6 });
      T.vol(g, c => T.rr(c, x - 78, 240, 156, 26, 8), T.PAPEL, { sombra: '#D9CDB3', dx: 0, dy: -8, w: 6 });
    }
    // toldo de la tienda
    T.vol(g, c => T.rr(c, -20, 592, 680, 34, 0), C.muroS, { sombra: '#C95F9E', dx: 0, dy: -10, w: 6 });
    // acera y calle
    T.vol(g, c => T.rr(c, -20, 640, 680, 110, 0), C.acera, { sombra: C.aceraS, dx: 0, dy: -14, w: 7 });
    g.beginPath(); for (const x of [110, 225, 415, 530]) { g.moveTo(x, 656); g.lineTo(x - 14, 736); } T.linea(g, 4, C.aceraS);
    T.vol(g, c => T.rr(c, -20, 744, 680, 130, 0), C.calle, { sombra: C.calleS, dx: 0, dy: 22, w: 7 });
    g.fillStyle = T.trama(g, C.calleS, 14, 2.6); g.fillRect(0, 790, ZZ.PW, 50);
    g.fillStyle = T.AMARILLO; for (const x of [30, 250, 470]) { T.rr(g, x, 802, 130, 14, 7); g.fill(); }
    // boca de riego
    T.vol(g, c => T.rr(c, 580, 668, 44, 64, 12), T.ROJO, { dx: -8, dy: 0, w: 6 });
    T.vol(g, c => T.rr(c, 572, 656, 60, 20, 10), T.ROJO, { dx: 0, dy: -6, w: 6 });
    T.circ(g, 602, 702, 9); T.pinta(g, T.AMARILLO, 5);
  }

  // Las cosas que caen, centradas en el origen. Cada una con su cara.
  function cosa(g, tipo, t) {
    if (tipo === 0) {            // yunque
      const cam = c => { c.beginPath(); c.moveTo(-66, -40); c.lineTo(66, -40); c.lineTo(40, -8); c.lineTo(30, -8); c.lineTo(30, 16); c.lineTo(58, 44); c.lineTo(-58, 44); c.lineTo(-30, 16); c.lineTo(-30, -8); c.lineTo(-90, -18); c.closePath(); };
      T.vol(g, cam, '#4A5470', { sombra: '#2A3148', dx: -9, dy: -7, w: 7 });
      g.save(); g.translate(0, -14); g.scale(0.62, 0.62); P.cara(g, 'enfadado', t, { ex: 22, ey: -10, by: 18, piel: '#4A5470' }); g.restore();
    } else if (tipo === 1) {     // piano
      T.vol(g, c => T.rr(c, -66, -54, 132, 104, 12), '#8A4FD0', { sombra: '#5E2FA0', dx: -9, dy: -7, w: 7 });
      T.rr(g, -54, 10, 108, 30, 6); T.pinta(g, '#FFFFFF', 5);
      g.beginPath(); for (let i = 1; i < 7; i++) { g.moveTo(-54 + i * 15.4, 10); g.lineTo(-54 + i * 15.4, 40); } T.linea(g, 4);
      g.fillStyle = T.TINTA; for (const i of [1, 2, 4, 5, 6]) g.fillRect(-54 + i * 15.4 - 4, 10, 8, 17);
      for (const sg of [-1, 1]) { T.circ(g, sg * 24, -22, 15); T.pinta(g, '#FFFFFF', 5); T.circ(g, sg * 24 + 3, -19, 6); T.pinta(g, T.TINTA, 0); }
    } else {                     // maceta
      g.beginPath(); g.moveTo(0, -30); g.lineTo(0, -66); T.linea(g, 8, '#2C9A55');
      for (let i = 0; i < 6; i++) { const a = i * 1.047 + t * 0.03; T.circ(g, Math.cos(a) * 20, -78 + Math.sin(a) * 20, 13); T.pinta(g, T.AMARILLO, 5); }
      T.circ(g, 0, -78, 12); T.pinta(g, T.ROJO, 5);
      T.vol(g, c => T.poli(c, [[-52, -24], [52, -24], [38, 46], [-38, 46]]), '#E0623A', { sombra: '#B94A27', dx: -8, dy: 0, w: 7 });
      T.vol(g, c => T.rr(c, -60, -36, 120, 22, 8), '#E0623A', { sombra: '#B94A27', dx: 0, dy: -6, w: 7 });
      g.save(); g.translate(0, 10); g.scale(0.56, 0.56); P.cara(g, 'contento', t, { ex: 22, ey: -8, by: 20, piel: '#E0623A' }); g.restore();
    }
  }

  function huevo(g, e, vis) {
    const n = vis.n, t = vis.t, o = e.ola;
    const k = ZZ.lim((n - e.cambio) / 8, 0, 1), x = XS[e.de] + (XS[e.carril] - XS[e.de]) * ZZ.e.io(k);
    const salto = k < 1 ? Math.sin(k * Math.PI) * 46 : 0;
    const plaf = n < e.aturdido, kp = plaf ? 1 - (e.aturdido - n) / 16 : 1;
    const enPeligro = o && o.estado === 0 && o.peligro.indexOf(e.carril) >= 0;
    g.save(); g.globalAlpha = 0.26; T.elip(g, x + 4, SUELO + 8, 58 - salto * 0.3, 13); g.fillStyle = T.TINTA; g.fill(); g.restore();
    if (plaf) {
      g.save(); g.translate(x, SUELO + 4);
      const clara = c => { c.beginPath(); c.moveTo(-92, 0); c.bezierCurveTo(-96, -30, -50, -20, -34, -36); c.bezierCurveTo(-6, -52, 30, -30, 54, -34); c.bezierCurveTo(100, -34, 104, 4, 78, 14); c.bezierCurveTo(40, 30, -60, 28, -92, 0); c.closePath(); };
      T.vol(g, clara, '#FFFFFF', { sombra: '#D9E1EA', dx: 0, dy: -7, w: 7 });
      T.vol(g, c => T.elip(c, 0, -10, 40, 24), T.AMARILLO, { sombra: '#E0A51A', dx: -5, dy: -5, w: 6 });
      g.translate(0, -12); g.scale(0.5, 0.36); P.cara(g, 'triste', t, { ex: 22, ey: -8, by: 22, piel: T.AMARILLO });
      g.restore();
      return;
    }
    g.save(); g.translate(x, SUELO - salto + (enPeligro ? Math.sin(t * 1.2) * 2 : 0));
    g.rotate(k < 1 ? (e.carril > e.de ? 1 : -1) * Math.sin(k * Math.PI) * 0.22 : 0);
    g.scale(plaf ? 1 + 0.3 * (1 - kp) : 1, plaf ? 0.6 + 0.4 * kp : 1 + (k < 1 ? Math.sin(k * Math.PI) * 0.08 : Math.sin(t * 0.1) * 0.015));
    for (const sg of [-1, 1]) T.vol(g, c => T.elip(c, sg * 22, -6, 20, 11), '#FF9F1C', { sombra: '#D97A0A', dx: 0, dy: -4, w: 5 });
    const cam = c => { c.beginPath(); c.moveTo(0, -150); c.bezierCurveTo(48, -150, 62, -78, 62, -56); c.bezierCurveTo(62, -24, 36, -8, 0, -8); c.bezierCurveTo(-36, -8, -62, -24, -62, -56); c.bezierCurveTo(-62, -78, -48, -150, 0, -150); c.closePath(); };
    T.vol(g, cam, C.huevo, { sombra: C.huevoS, dx: -10, dy: -8, w: 7 });
    // las grietas que lleva
    g.beginPath();
    if (e.golpes > 0) { g.moveTo(-10, -148); g.lineTo(2, -128); g.lineTo(-12, -116); g.lineTo(-2, -102); }
    if (e.golpes > 1) { g.moveTo(52, -90); g.lineTo(34, -84); g.lineTo(42, -70); g.lineTo(26, -64); }
    if (e.golpes > 2) { g.moveTo(-56, -78); g.lineTo(-40, -70); g.lineTo(-48, -56); g.lineTo(-32, -48); }
    if (e.golpes > 0) T.linea(g, 5);
    g.translate(0, -62); g.scale(0.86, 0.86);
    P.cara(g, plaf ? 'triste' : enPeligro ? 'susto' : o && o.estado === 0 ? 'contento' : 'neutro', t, { ex: 22, ey: -8, by: 20, piel: C.huevo });
    g.restore();
    // antes del primer salto: a qué lados se toca
    if (e.cambio < 0 && e.io < 2) for (const sg of [-1, 1]) T.marca(g, x + sg * (104 + Math.sin(t * 0.22) * 6), SUELO - 70, -sg * Math.PI / 2, 34);
  }

  function dibuja(g, e, vis) {
    const n = vis.n, t = vis.t, o = e.ola;
    T.capa(g, vis, 'dibujos', fondo);
    const u = o ? ZZ.lim((n - o.s) / e.cae, 0, 1) : 0;
    // las sombras avisan de dónde va a caer
    if (o && o.estado === 0) for (const c of o.peligro) {
      g.save(); g.globalAlpha = 0.2 + u * 0.35; T.elip(g, XS[c], SUELO + 8, 30 + u * 52, 8 + u * 12); g.fillStyle = T.TINTA; g.fill(); g.restore();
    }
    vis.ch.dibuja(g, 0);
    huevo(g, e, vis);
    if (o) for (let i = 0; i < 2; i++) {
      const x = XS[o.peligro[i]];
      let y, rot = 0, aplasta = 1;
      if (o.estado === 0) { y = VENTANA + (SUELO - 46 - VENTANA) * u * u; rot = Math.sin(t * 0.3 + i * 2) * 0.12; }
      else { const dt = n - o.s - e.cae; if (dt > 26) continue; y = SUELO - 46 - Math.abs(Math.sin(Math.min(dt, 14) / 14 * Math.PI)) * 16 * (dt < 14 ? 1 : 0); aplasta = dt < 5 ? 0.8 : 1; g.globalAlpha = dt > 18 ? 1 - (dt - 18) / 8 : 1; }
      g.save(); g.translate(x, y + (1 - aplasta) * 40); g.rotate(rot); g.scale(1 + (1 - aplasta) * 0.3, aplasta);
      cosa(g, o.tipos[i], t);
      g.restore(); g.globalAlpha = 1;
    }
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'salta') { son && son.agarra(); }
      else if (x.t === 'cae') { son && son.tic(); }
      else if (x.t === 'salva' || x.t === 'golpe') {
        for (const c of e.ola.peligro) T.polvo(vis.ch, XS[c], SUELO, 7, '#FFFFFF', 7, 16, 0);
        vis.temblor = x.t === 'golpe' ? 14 : 7;
        if (x.t === 'golpe') {
          T.estrellas(vis.ch, XS[e.carril], SUELO - 120, 9, T.AMARILLO, 11, 20, 1);
          T.palabra(vis.ch, '¡PLAF!', 320, 420, T.ROJO, 66, 1, true);
          son && son.pum();
        } else {
          T.palabra(vis.ch, x.pronto ? '¡REFLEJOS!' : '¡UF!', 320, 420, x.pronto ? T.AMARILLO : T.PAPEL, x.pronto ? 54 : 62, 1, true);
          son && (x.pronto ? son.acierto() : son.golpe());
        }
      }
    }
  }

  ZZ.canales.dibujos = {
    id: 'dibujos', num: 13, nombre: 'DIBUJOS', orden: '¡ESQUIVA!', hechoTxt: '¡ENTERO!',
    pista: 'Toca a un lado o a otro para saltar ahí',
    rotulo: 'HOY: «UN HUEVO CON MUCHA SUERTE»',
    color: '#E57FBC', color2: T.MENTA, color3: T.AMARILLO,
    pasos: TOTAL,      // diez segundos
    animo: x => (x.t === 'golpe' ? -1 : x.t === 'salva' ? 1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
//# sourceURL=zz/canales/dibujos.js
</script>
<script>
/* ZikZak · canal 14 · Buenas noches · ¿CUÁNTAS?
   Dura diez segundos. Las ovejas saltan la valla y hay que contarlas. Luego salen tres números y se toca el bueno.
   En los niveles altos van más juntas y se cuelan lobos con disfraz de oveja, que no cuentan.
   Mide la atención: acertar es casi todo y contestar pronto da el resto. Quedarse a una da algo. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const TOTAL = 600, CRUZA = 58, RESP = 170, FINAL = 60;
  const PRADO = 612;                       // por dónde pisan
  const OPX = [130, 320, 510], OPY = 290;  // dónde salen los tres números
  const NIV = [null,
    { n: [4, 6], hueco: [40, 58], lobos: [0, 0] },
    { n: [6, 9], hueco: [22, 42], lobos: [1, 2] },
    { n: [8, 12], hueco: [14, 30], lobos: [2, 3] }];
  const C = { cielo: '#2B3A8C', cieloS: '#1C2766', monte: '#1D7A62', monteS: '#145848', prado: '#3DBB6B', pradoS: '#2C9A55',
    lana: '#FFFFFF', lanaS: '#C9D6F5', cara: '#FFE9C7', lobo: '#8E889F', loboS: '#5A5470', colcha: '#D3273E', colchaS: '#8E1630' };

  // --- lógica ---------------------------------------------------------------
  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const ovejas = rng.entero(N.n[0], N.n[1]), lobos = rng.entero(N.lobos[0], N.lobos[1]), m = ovejas + lobos;
    const esLobo = [];
    for (let k = 0, q = lobos; k < 200 && q > 0; k++) { const i = rng.entero(1, m - 1); if (!esLobo[i]) { esLobo[i] = true; q--; } }
    let sale = [30];
    for (let i = 1; i < m; i++) sale.push(sale[i - 1] + rng.entero(N.hueco[0], N.hueco[1]));
    const ult = sale[m - 1];
    if (ult > 320) sale = sale.map(a => Math.round(30 + (a - 30) * 290 / (ult - 30)));
    const bichos = sale.map((s, i) => ({ s, lobo: !!esLobo[i], fila: rng.entero(0, 2) }));
    // tres números: el bueno, el de quien cuenta también los lobos y otro cercano
    const ops = [ovejas];
    if (lobos > 0) ops.push(ovejas + lobos);
    const cerca = [ovejas - 1, ovejas + 1, ovejas - 2, ovejas + 2].filter(v => v >= 1 && ops.indexOf(v) < 0);
    while (ops.length < 3) ops.push(cerca.splice(rng.entero(0, Math.min(1, cerca.length - 1)), 1)[0]);
    for (let i = 2; i > 0; i--) { const j = rng.entero(0, i), x = ops[i]; ops[i] = ops[j]; ops[j] = x; }
    return { semilla, nivel, bichos, ovejas, ops, e0: sale[m - 1] + CRUZA + 14, elegido: -2, pasoEleccion: -1, fin: -1, hecho: false, ev: [] };
  }

  function paso(e, entradas, n) {
    for (const b of e.bichos) if (b.s === n) e.ev.push({ t: 'sale', lobo: b.lobo });
    if (n === e.e0) e.ev.push({ t: 'pregunta' });
    if (e.elegido === -2 && n >= e.e0) {
      for (const en of entradas) {
        if (en.t !== 'd' || Math.abs(en.y - OPY) > 130) continue;
        let j = -1, mejor = 100;
        for (let i = 0; i < 3; i++) { const d = Math.abs(OPX[i] - en.x); if (d < mejor) { mejor = d; j = i; } }
        if (j < 0) continue;
        e.elegido = j; e.pasoEleccion = n; e.fin = n + FINAL;
        const dif = Math.abs(e.ops[j] - e.ovejas);
        e.ev.push({ t: dif === 0 ? 'acierto' : 'fallo', j, casi: dif === 1 });
        break;
      }
      if (e.elegido === -2 && n >= e.e0 + RESP) { e.elegido = -1; e.pasoEleccion = n; e.fin = n + FINAL; e.ev.push({ t: 'tarde' }); }
    }
    if (e.fin >= 0 && n >= e.fin) e.hecho = true;
  }

  function puntuacion(e) {
    if (e.elegido < 0) return 0;
    const dif = Math.abs(e.ops[e.elegido] - e.ovejas);
    if (dif === 0) return Math.round(650 + 350 * ZZ.lim(1 - (e.pasoEleccion - e.e0) / RESP, 0, 1));
    return dif === 1 ? 250 : 0;
  }

  // Jugador de la casa: cuenta bien o se le va una, y tarda más o menos en contestar.
  function casa(e, mem, rng, d, n) {
    if (mem.paso === undefined) {
      const p = ZZ.lim(ZZ.mix(0.34, 0.97, d) - (e.nivel - 1) * 0.07 * (1 - d), 0, 1);
      mem.j = e.ops.indexOf(e.ovejas);
      if (rng() > p) mem.j = (mem.j + 1 + rng.entero(0, 1)) % 3;
      mem.paso = e.e0 + Math.round(ZZ.mix(90, 18, d) + rng.entre(0, 26));
    }
    return n === mem.paso && e.elegido === -2 ? [{ t: 'd', x: OPX[mem.j], y: OPY }] : [];
  }

  // --- dibujo -----------------------------------------------------------------
  function bultos(c, l, ex) { c.beginPath(); for (const [a, b, r] of l) { c.moveTo(a + r + ex, b); c.arc(a, b, r + ex, 0, 6.2832); } }
  const LANA = [[-34, 4, 26], [-10, -16, 30], [22, -12, 28], [40, 8, 24], [4, 14, 30]];
  const NUBE = [[-46, 10, 38], [-8, -18, 48], [40, -6, 42], [4, 22, 44]];

  function fondo(g) {
    g.fillStyle = C.cielo; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.trama(g, C.cieloS, 14, 2.8); g.fillRect(0, 0, ZZ.PW, 200);
    g.fillStyle = '#FFE48A';
    for (const [x, y, r] of [[300, 96, 8], [420, 150, 6], [70, 180, 7], [200, 230, 5], [580, 360, 6], [40, 400, 5], [470, 60, 5]]) { T.estrella(g, x, y, r * 2, r * 0.8, 4); g.fill(); }
    // la luna, que también tiene sueño
    T.circ(g, 546, 150, 70); T.pinta(g, T.TINTA, 0);
    T.vol(g, c => T.circ(c, 540, 142, 70), '#FFE48A', { sombra: '#F2C24A', dx: -9, dy: -10, w: 7 });
    for (const [x, y, r] of [[512, 112, 10], [570, 176, 13], [562, 108, 7]]) { T.circ(g, x, y, r); T.pinta(g, '#F2C24A', 0); }
    g.beginPath(); for (const sg of [-1, 1]) { g.moveTo(540 + sg * 24 - 12, 140); g.quadraticCurveTo(540 + sg * 24, 152, 540 + sg * 24 + 12, 140); } T.linea(g, 6);
    T.elip(g, 540, 168, 8, 10); T.pinta(g, '#3B1522', 4);
    // montes y prado
    T.vol(g, c => { c.beginPath(); c.moveTo(-20, 640); c.lineTo(-20, 470); c.quadraticCurveTo(150, 380, 330, 480); c.quadraticCurveTo(500, 400, 660, 470); c.lineTo(660, 640); c.closePath(); }, C.monte, { sombra: C.monteS, dx: 0, dy: -14, w: 7 });
    g.fillStyle = T.trama(g, C.monteS, 14, 2.8); g.fillRect(0, 520, ZZ.PW, 70);
    T.vol(g, c => T.rr(c, -20, 590, 680, 140, 0), C.prado, { sombra: C.pradoS, dx: 0, dy: -18, w: 7 });
    g.beginPath(); for (const [x, y] of [[60, 640], [220, 668], [460, 644], [580, 672]]) { g.moveTo(x, y); g.lineTo(x + 8, y - 16); g.lineTo(x + 16, y); g.lineTo(x + 24, y - 14); g.lineTo(x + 32, y); } T.linea(g, 4, C.pradoS);
  }

  // La valla va por delante de las ovejas que pasan por detrás y por detrás de las de delante: en medio.
  function valla(g) {
    g.translate(320, PRADO + 22); g.scale(1.42, 1.42); g.translate(-320, -PRADO - 22);
    for (const x of [262, 320, 378]) T.vol(g, c => T.poli(c, [[x - 16, PRADO + 22], [x - 16, PRADO - 74], [x, PRADO - 94], [x + 16, PRADO - 74], [x + 16, PRADO + 22]]), T.PAPEL, { sombra: '#D9CDB3', dx: -5, dy: 0, w: 6 });
    for (const y of [PRADO - 54, PRADO - 14]) T.vol(g, c => T.rr(c, 236, y, 168, 16, 6), T.PAPEL, { sombra: '#D9CDB3', dx: 0, dy: -5, w: 6 });
  }

  // La cama, en primer plano: quien cuenta es Ajuste.
  function cabecero(g) {
    T.vol(g, c => T.rr(c, 10, 548, 300, 260, 60), '#C97B45', { sombra: '#8E4F2A', dx: -12, dy: 0, w: 8 });
    T.rr(g, 44, 584, 232, 150, 40); T.linea(g, 6, '#8E4F2A');
    T.vol(g, c => T.rr(c, 30, 690, 250, 90, 40), '#FFFFFF', { sombra: '#D9E1EA', dx: -8, dy: -8, w: 7 });
  }
  function cama(g) {
    const colcha = c => { c.beginPath(); c.moveTo(-20, 790); c.quadraticCurveTo(160, 742, 330, 772); c.quadraticCurveTo(500, 800, 660, 760); c.lineTo(660, 870); c.lineTo(-20, 870); c.closePath(); };
    T.vol(g, colcha, C.colcha, { sombra: C.colchaS, dx: 0, dy: 20, w: 7 });
    g.save(); colcha(g); g.clip(); g.fillStyle = T.trama(g, C.colchaS, 14, 2.8); g.fillRect(0, 810, ZZ.PW, 40);
    g.fillStyle = T.AMARILLO; for (const [x, y, r] of [[360, 812, 9], [470, 822, 7], [580, 800, 9], [250, 818, 7], [90, 812, 8]]) { T.estrella(g, x, y, r * 2, r * 0.8, 5); g.fill(); }
    g.restore();
    T.vol(g, c => { c.beginPath(); c.moveTo(-20, 772); c.quadraticCurveTo(160, 724, 330, 754); c.quadraticCurveTo(500, 782, 660, 742); c.lineTo(660, 768); c.quadraticCurveTo(500, 808, 330, 780); c.quadraticCurveTo(160, 750, -20, 798); c.closePath(); }, T.PAPEL, { sombra: '#D9CDB3', dx: 0, dy: -6, w: 6 });
  }

  function oveja(g, lobo, t, u) {
    const pata = Math.sin(u * Math.PI);        // en el aire estira las patas
    // patas
    g.beginPath();
    for (const [x, d] of [[-26, -1], [-8, -1], [16, 1], [32, 1]]) { g.moveTo(x, 20); g.lineTo(x + d * pata * 16, 46 - pata * 6); }
    T.linea(g, 9, lobo ? C.loboS : '#3A3350');
    if (lobo) { T.vol(g, c => { c.beginPath(); c.moveTo(-52, 0); c.quadraticCurveTo(-96, -30, -104, 14); c.quadraticCurveTo(-78, 12, -52, 18); c.closePath(); }, C.lobo, { sombra: C.loboS, dx: 0, dy: -5, w: 6 }); }
    // lana
    bultos(g, LANA, 6); g.fillStyle = T.TINTA; g.fill();
    T.vol(g, c => bultos(c, LANA, 0), C.lana, { sombra: C.lanaS, dx: -6, dy: -8, w: 0 });
    // cabeza
    g.save(); g.translate(58, -22);
    if (lobo) {
      for (const sg of [-1, 1]) { T.poli(g, [[sg * 10, -24], [sg * 26, -52], [sg * 30, -18]]); T.pinta(g, C.lobo, 5); }
      T.vol(g, c => { c.beginPath(); c.moveTo(-26, -22); c.lineTo(22, -22); c.lineTo(54, 12); c.lineTo(22, 26); c.lineTo(-26, 22); c.closePath(); }, C.lobo, { sombra: C.loboS, dx: -5, dy: -5, w: 6 });
      T.circ(g, 52, 10, 7); T.pinta(g, T.TINTA, 0);
      g.fillStyle = '#FFFFFF'; for (const x of [12, 26, 38]) { T.poli(g, [[x, 20], [x + 10, 18], [x + 5, 32]]); g.fill(); T.poli(g, [[x, 20], [x + 10, 18], [x + 5, 32]]); T.linea(g, 2.5); }
      for (const sg of [-1, 1]) { T.elip(g, sg * 11 - 2, -6, 8, 9); T.pinta(g, '#FFE48A', 3.5); T.circ(g, sg * 11, -5, 3.5); T.pinta(g, T.TINTA, 0); }
      g.beginPath(); g.moveTo(-22, -20); g.lineTo(-6, -13); g.moveTo(18, -20); g.lineTo(2, -13); T.linea(g, 5);
    } else {
      for (const sg of [-1, 1]) T.vol(g, c => T.elip(c, sg * 26, -10, 14, 8, sg * 0.6), C.cara, { sombra: '#EAC79A', dx: 0, dy: -3, w: 5 });
      T.vol(g, c => T.elip(c, 0, 0, 27, 30), C.cara, { sombra: '#EAC79A', dx: -5, dy: -6, w: 6 });
      bultos(g, [[-12, -28, 10], [4, -32, 11], [18, -26, 9]], 4); g.fillStyle = T.TINTA; g.fill();
      bultos(g, [[-12, -28, 10], [4, -32, 11], [18, -26, 9]], 0); g.fillStyle = C.lana; g.fill();
      g.scale(0.5, 0.5); P.cara(g, 'contento', t, { ex: 20, ey: -4, by: 24, piel: C.cara });
    }
    g.restore();
  }

  function burbuja(g, x, y, num, estado, t, i) {
    g.save(); g.translate(x, y + Math.sin(t * 0.12 + i * 2) * 6); g.scale(0.92, 0.92);
    g.save(); g.translate(7, 10); bultos(g, NUBE, 6); g.fillStyle = T.TINTA; g.fill(); g.restore();
    bultos(g, NUBE, 7); g.fillStyle = T.TINTA; g.fill();
    const col = estado === 1 ? T.AMARILLO : estado === 2 ? '#FF9FA8' : '#FFFFFF';
    T.vol(g, c => bultos(c, NUBE, 0), col, { sombra: estado === 1 ? '#F2C24A' : estado === 2 ? '#E8707C' : C.lanaS, dx: -7, dy: -10, w: 0 });
    T.texto(g, String(num), 0, 4, 76, { color: T.TINTA, w: 0 });
    g.restore();
  }

  function dibuja(g, e, vis) {
    const n = vis.n, t = vis.t, pregunta = n >= e.e0, hecho = e.elegido !== -2;
    T.capa(g, vis, 'noches', fondo);
    // por detrás de la valla, las de las filas del fondo; por delante, las de la primera
    const pinta = fila => {
      for (const b of e.bichos) {
        if ((b.fila === 2) !== fila) continue;
        const u = (n - b.s) / CRUZA;
        if (u < 0 || u > 1) continue;
        const sc = [1.12, 1.28, 1.46][b.fila];
        g.save(); g.translate(-130 + u * 900, PRADO - 50 + (b.fila - 1) * 18 - Math.sin(u * Math.PI) * (176 + b.fila * 12));
        g.rotate((u - 0.5) * 0.7); g.scale(sc, sc);
        oveja(g, b.lobo, t + b.s, u);
        g.restore();
      }
    };
    pinta(false);
    T.capa(g, vis, 'nochesValla', valla);
    pinta(true);
    vis.ch.dibuja(g, 0);
    // Ajuste, en la cama, con su gorro de dormir
    const expr = !hecho ? (pregunta ? 'tension' : 'neutro') : e.elegido >= 0 && e.ops[e.elegido] === e.ovejas ? 'contento' : 'susto';
    T.capa(g, vis, 'nochesCabecero', cabecero);
    P.busto(g, 156, 664, 1.22, P.AJUSTE, expr, t, pregunta ? {} : { mira: { x: 0.6, y: -0.8 } });
    g.save(); g.translate(156, 590 + Math.sin(t * 0.09) * 1.5); g.rotate(-0.2); g.scale(1.22, 1.22);
    T.vol(g, c => { c.beginPath(); c.moveTo(-58, 6); c.quadraticCurveTo(-30, -70, 40, -92); c.quadraticCurveTo(60, -40, 58, 6); c.closePath(); }, T.AZUL, { sombra: '#1F4FD0', dx: -8, dy: 0, w: 6 });
    T.vol(g, c => T.rr(c, -64, -2, 128, 20, 10), T.PAPEL, { sombra: '#D9CDB3', dx: 0, dy: -5, w: 6 });
    T.circ(g, 46, -94, 14); T.pinta(g, T.PAPEL, 5);
    g.restore();
    T.capa(g, vis, 'nochesCama', cama);
    // las bolitas de lo que está pensando
    if (pregunta) for (let i = 0; i < 3; i++) {
      const bueno = e.ops[i] === e.ovejas;
      burbuja(g, OPX[i], OPY, e.ops[i], !hecho ? 0 : bueno ? 1 : i === e.elegido ? 2 : 0, t, i);
    }
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'sale') { son && (x.lobo ? son.golpe() : son.agarra()); }
      else if (x.t === 'pregunta') { T.palabra(vis.ch, '¿CUÁNTAS OVEJAS?', 320, 470, T.AMARILLO, 50, 1, true); son && son.orden(); }
      else if (x.t === 'acierto') {
        T.estrellas(vis.ch, OPX[x.j], OPY, 12, T.AMARILLO, 13, 22, 1);
        T.confeti(vis.ch, OPX[x.j], OPY - 40, 26, [T.AMARILLO, T.ROJO, T.MENTA, T.PAPEL], 12, 1);
        T.palabra(vis.ch, '¡A DORMIR!', 320, 470, T.AMARILLO, 58, 1, true);
        son && son.sol();
      } else if (x.t === 'fallo') {
        vis.temblor = 10;
        T.palabra(vis.ch, x.casi ? '¡POR UNA!' : '¡TE HAS LIADO!', 320, 470, T.ROJO, 54, 1, true);
        son && son.fallo();
      } else if (x.t === 'tarde') { T.palabra(vis.ch, '¡TE DORMISTE!', 320, 470, T.ROJO, 54, 1, true); son && son.fallo(); }
    }
  }

  ZZ.canales.noches = {
    id: 'noches', num: 14, nombre: 'BUENAS NOCHES', orden: '¿CUÁNTAS?', hechoTxt: '¡ZZZ!',
    pista: 'Cuenta las ovejas (los lobos no) y toca el número',
    rotulo: 'ANTES DE DORMIR: «CONTANDO OVEJAS»',
    color: C.cielo, color2: C.prado, color3: T.AMARILLO,
    pasos: TOTAL,      // diez segundos
    animo: x => (x.t === 'acierto' ? 1 : x.t === 'fallo' || x.t === 'tarde' ? -1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
//# sourceURL=zz/canales/noches.js
</script>
<script>
/* ZikZak · tele
   El marco común: el aparato, la mecha de la cuenta atrás, las placas de los jugadores,
   la nieve del zapeo, la orden en letras gordas y los rótulos. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta;
  const TV = ZZ.tele = {};
  const W = 720, CUERPO = 982;

  // Reparto de la pantalla del móvil. Todo en unidades lógicas (ancho 720).
  TV.mide = function (H) {
    const libre = H - CUERPO;
    const arriba = ZZ.lim(libre * 0.44, 98, 250);
    const by = arriba;
    return {
      W, H, bx: 14, by, bw: 692, bh: CUERPO,
      px: 40, py: by + 30, pw: ZZ.PW, ph: ZZ.PH,
      tiraY: by + 30 + ZZ.PH + 14, tiraH: 78,
      arriba, abajo: H - by - CUERPO,
    };
  };

  // El fondo de fuera va oscuro para que la pantalla de la tele sea lo más luminoso.
  TV.colorFondo = color => T.mezcla(color, T.TINTA, 0.56);
  TV.VELO = '#1C1436';
  TV.velo = function (g, alfa) { g.save(); g.globalAlpha = alfa; g.fillStyle = TV.VELO; g.fillRect(0, 0, ZZ.PW, ZZ.PH); g.restore(); };
  TV.fondo = function (g, L, color, t) {
    g.fillStyle = TV.colorFondo(color); g.fillRect(-3000, -200, 6720, L.H + 400);
    T.rayos(g, 360, L.py + 420, 2600, 12, t * 0.0012, T.mezcla(color, T.TINTA, 0.47));
    g.save(); g.globalAlpha = 0.5;
    g.fillStyle = T.trama(g, T.mezcla(color, T.TINTA, 0.72), 15, 3.1);
    g.fillRect(-3000, -200, 6720, L.H + 400);
    g.restore();
  };

  TV.cuerpo = function (g, L, antenas) {
    const cam = c => T.rr(c, L.bx, L.by, L.bw, L.bh, 62);
    // antenas (solo cuando arriba no hay placa) y patas
    for (const s of [-1, 1]) {
      if (antenas) {
        g.beginPath(); g.moveTo(360 + s * 36, L.by + 12); g.lineTo(360 + s * 150, L.by - 62); T.linea(g, 11);
        T.vol(g, c => T.circ(c, 360 + s * 153, L.by - 65, 14), T.AMARILLO, { dx: -3, dy: -4, w: 6 });
      }
      T.rr(g, 360 + s * 210 - 52, L.by + L.bh - 10, 104, 44, 14); T.pinta(g, T.TINTA, 0);
    }
    T.sombra(g, cam, 0, 16, 1, T.TINTA, 8);
    T.vol(g, cam, T.PAPEL, { sombra: '#E0D2B2', dx: -8, dy: -12, w: 8 });
    T.rr(g, L.px - 14, L.py - 14, L.pw + 28, L.ph + 28, 46); T.pinta(g, T.TINTA, 0);
  };

  TV.pantalla = function (g, L, pinta) {
    g.save();
    T.rr(g, L.px, L.py, L.pw, L.ph, 34); g.clip();
    g.translate(L.px, L.py);
    pinta(g);
    g.restore();
    T.rr(g, L.px, L.py, L.pw, L.ph, 34); T.linea(g, 6);
  };

  // --- la mecha -----------------------------------------------------------------
  const MX0 = 66, MX1 = 548;
  const my = (L, x) => L.tiraY + L.tiraH / 2 + Math.sin(x * 0.045) * 7;
  function caminoMecha(g, L, a, b) {
    g.beginPath();
    g.moveTo(a, my(L, a));
    for (let x = Math.ceil(a / 10) * 10; x < b; x += 10) g.lineTo(x, my(L, x));
    g.lineTo(b, my(L, b));
  }
  TV.puntaMecha = (L, k) => { const x = MX0 + (MX1 - MX0) * ZZ.lim(k, 0, 1); return [x, my(L, x)]; };
  TV.mecha = function (g, L, k, t, viva, rota) {
    const y = L.tiraY + L.tiraH / 2;
    const xs = MX0 + (MX1 - MX0) * ZZ.lim(k, 0, 1);
    if (k > 0.01) {
      g.save(); g.setLineDash([2, 12]);
      caminoMecha(g, L, MX0, xs); T.linea(g, 6, T.mezcla(T.PAPEL, T.TINTA, 0.42));
      g.restore();
    }
    if (k < 0.995) {
      T.tubo(g, c => caminoMecha(c, L, xs, MX1 + 24), '#D8A75C', 7, 4);
      g.save(); g.setLineDash([4, 14]); caminoMecha(g, L, xs, MX1 + 24); T.linea(g, 3, '#8A5A22'); g.restore();
    }
    if (rota) {
      // la bomba ya estalló: queda la marca
      T.estrella(g, 616, y + 2, 40, 17, 9, 0.3); T.pinta(g, T.TINTA, 0);
      T.estrella(g, 616, y + 2, 22, 9, 9, 0.6); T.pinta(g, '#4A4658', 0);
      for (const [dx, dy, r] of [[-26, -30, 12], [6, -40, 15], [30, -26, 11]]) {
        const s = 1 + Math.sin(t * 0.07 + dx) * 0.1;
        g.save(); g.globalAlpha = 0.7; T.circ(g, 616 + dx, y + dy - (t % 90) * 0.12, r * s); T.pinta(g, '#D8D2C6', 4); g.restore();
      }
      return;
    }
    // bomba
    const tiemb = viva && k > 0.72 ? (Math.random() - 0.5) * 5 * (k - 0.6) * 2.5 : 0;
    const hincha = viva && k > 0.72 ? 1 + Math.abs(Math.sin(t * 0.5)) * 0.07 * (k - 0.6) * 2.5 : 1;
    g.save(); g.translate(616 + tiemb, y + 2 + tiemb * 0.6); g.scale(hincha, hincha);
    T.vol(g, c => T.rr(c, -46, -17, 20, 26, 6), '#8B8798', { dx: -2, dy: -3, w: 5.5 });
    const cam = c => T.circ(c, 0, 0, 31);
    T.sombra(g, cam, 0, 6, 0.3);
    T.vol(g, cam, '#3A3350', { sombra: T.TINTA, dx: -6, dy: -8, w: 6 });
    g.beginPath(); g.arc(0, 0, 20, Math.PI * 1.08, Math.PI * 1.42); T.linea(g, 5.5, T.PAPEL);
    g.restore();
    // chispa
    if (viva && k < 0.995) {
      const [x, yy] = [xs, my(L, xs)];
      T.estrella(g, x, yy, 19 + Math.sin(t * 0.9) * 4, 8, 7, t * 0.21); T.pinta(g, T.AMARILLO, 4.5);
      T.estrella(g, x, yy, 8, 3.5, 5, -t * 0.3); T.pinta(g, '#FFFFFF', 0);
    } else if (!viva) {
      T.circ(g, MX0, my(L, MX0), 6); T.pinta(g, T.TINTA, 0);
      if (k > 0.02 && k < 0.995) {
        // se acabó antes de tiempo: la chispa se apaga con un poco de humo
        const yy = my(L, xs);
        for (const [dx, dy, r] of [[0, -4, 11], [10, -17, 8], [-6, -24, 6]]) { T.circ(g, xs + dx, yy + dy, r); T.pinta(g, '#D8D2C6', 4); }
      }
    }
  };

  // --- placas de los jugadores ----------------------------------------------------
  // d: { nombre, etiqueta, aviso, vivo, puntos, pips: [1|-1|0…], rondas, aspecto, expr, t, golpe, color }
  TV.placa = function (g, x, y, w, h, d) {
    const cam = c => T.rr(c, x, y, w, h, Math.min(30, h / 2.6));
    T.sombra(g, cam, 0, 9, 1);
    cam(g); T.pinta(g, T.PAPEL, 6);
    const r = h / 2 - 7, cx = x + r + 9, cy = y + h / 2;
    g.save();
    T.circ(g, cx, cy, r); g.fillStyle = d.color || T.AZUL; g.fill(); g.clip();
    g.fillStyle = T.trama(g, T.mezcla(d.color || T.AZUL, T.TINTA, 0.22), 9, 2); g.fillRect(cx - r, cy - r, r * 2, r * 2);
    ZZ.personaje.busto(g, cx, cy + r * 0.2, r / 70, d.aspecto, d.expr || 'neutro', d.t || 0, { golpe: d.golpe || 0 });
    g.restore();
    T.circ(g, cx, cy, r); T.linea(g, 5.5);
    const tx = cx + r + 16;
    const tn = Math.min(34, h * 0.36);
    T.texto(g, d.nombre, tx, y + h * 0.36, tn, { al: 'left', color: T.TINTA, w: 0 });
    // etiqueta: EN DIRECTO / EN DIFERIDO
    if (d.etiqueta) {
      const te = Math.min(19, h * 0.21), an = T.ancho(g, d.etiqueta, te, T.F_UI, 900) + 40;
      const ey = y + h * 0.72;
      T.rr(g, tx - 2, ey - te * 0.85, an, te * 1.7, te * 0.85); T.pinta(g, d.vivo ? T.ROJO : T.TINTA, 0);
      T.circ(g, tx + 13, ey, te * 0.3); g.fillStyle = d.vivo ? '#FFFFFF' : T.AMARILLO;
      if (!d.vivo || (d.t >> 4) % 2) g.fill();
      T.texto(g, d.etiqueta, tx + 26, ey + 1, te, { al: 'left', fuente: T.F_UI, peso: 900, w: 0, color: T.PAPEL });
    }
    if (d.sub) T.texto(g, d.sub, tx, y + h * 0.72, Math.min(21, h * 0.2), { al: 'left', fuente: T.F_UI, peso: 700, w: 0, color: T.TINTA });
    // puntos del canal en curso
    if (d.puntos !== null && d.puntos !== undefined) {
      const tp = Math.min(44, h * 0.46), ap = Math.max(T.ancho(g, String(d.puntos), tp), tp * 1.3) + 30;
      T.rr(g, x + w - 14 - ap, y + h * 0.4 - tp * 0.68, ap, tp * 1.36, tp * 0.5); T.pinta(g, T.TINTA, 0);
      T.texto(g, String(d.puntos), x + w - 14 - ap / 2, y + h * 0.4 + 2, tp, { color: T.AMARILLO, w: 0 });
    }
    // canales ganados
    if (d.pips) {
      const n = d.pips.length, pr = Math.min(16, h * 0.15), px0 = x + w - 34 - (n - 1) * (pr * 2 + 8), py = y + h * 0.78;
      for (let i = 0; i < n; i++) {
        const v = d.pips[i];
        T.circ(g, px0 + i * (pr * 2 + 8), py, pr);
        T.pinta(g, v > 0 ? T.AMARILLO : v < 0 ? T.mezcla(T.PAPEL, T.TINTA, 0.5) : T.PAPEL, 4.5);
        if (v > 0) { T.estrella(g, px0 + i * (pr * 2 + 8), py, pr * 0.62, pr * 0.28, 5); T.pinta(g, T.TINTA, 0); }
      }
    }
  };

  // --- nieve del zapeo --------------------------------------------------------------
  let ruido = null;
  function hazRuido() {
    ruido = [];
    for (let k = 0; k < 5; k++) {
      const c = document.createElement('canvas');
      c.width = 108; c.height = 141;
      const x = c.getContext('2d');
      const tonos = ['#2B2536', '#4A4658', '#4A4658', '#6E6A7E', '#6E6A7E', '#8B8798', '#B9B4C4'];
      for (let i = 0; i < 108; i++) for (let j = 0; j < 141; j++) {
        x.fillStyle = tonos[(Math.random() * tonos.length) | 0];
        x.fillRect(i, j, 1, 1);
      }
      ruido.push(c);
    }
  }
  TV.nieve = function (g, t, alfa) {
    if (!ruido) hazRuido();
    alfa = alfa === undefined ? 1 : alfa;
    g.save();
    g.imageSmoothingEnabled = false;
    g.globalAlpha = alfa;
    g.drawImage(ruido[t % ruido.length], -((t * 37) % 12), -((t * 53) % 12), ZZ.PW + 12, ZZ.PH + 12);
    g.fillStyle = T.TINTA;
    g.globalAlpha = 0.22 * alfa;
    for (let yy = (t * 3) % 8; yy < ZZ.PH; yy += 8) g.fillRect(0, yy, ZZ.PW, 3);     // líneas de barrido
    g.globalAlpha = 0.55 * alfa;
    const y = (t * 31) % (ZZ.PH + 160) - 80;
    g.fillRect(0, y, ZZ.PW, 54);
    g.fillRect(0, (y + 410) % ZZ.PH, ZZ.PW, 20);
    g.restore();
  };

  // --- número y nombre del canal, arriba a la izquierda -------------------------------
  TV.mosca = function (g, canal, extra) {
    const x = 18, y = 18;
    const an = T.ancho(g, canal.nombre, 25, T.F_UI, 900);
    T.rr(g, x + 40, y + 8, an + 62, 44, 14); T.pinta(g, T.TINTA, 0);
    T.texto(g, canal.nombre, x + 84, y + 31, 25, { al: 'left', fuente: T.F_UI, peso: 900, w: 0, color: T.PAPEL });
    T.rr(g, x, y, 70, 60, 16); T.pinta(g, canal.color, 5.5);
    T.texto(g, String(canal.num), x + 35, y + 32, 38, { w: 6, color: T.PAPEL, ds: 2 });
    if (extra) {
      const a2 = T.ancho(g, extra, 21, T.F_UI, 900);
      T.rr(g, ZZ.PW - a2 - 118, y + 8, a2 + 30, 40, 13); T.pinta(g, T.TINTA, 0);
      T.texto(g, extra, ZZ.PW - a2 - 103, y + 29, 21, { al: 'left', fuente: T.F_UI, peso: 900, w: 0, color: T.AMARILLO });
    }
  };

  // --- rótulo inferior, como en la tele --------------------------------------------------
  TV.rotulo = function (g, canal, k) {
    if (k <= 0) return;
    const tam = 23, an = T.ancho(g, canal.rotulo, tam, T.F_UI, 700) + 40;
    const x = -(an + 90) + (an + 90 + 14) * ZZ.e.out3(Math.min(1, k)), y = ZZ.PH - 78;
    T.rr(g, x + 46, y + 4, an + 20, 46, 8); T.pinta(g, T.TINTA, 0);
    T.rr(g, x + 40, y - 2, an + 20, 46, 8); T.pinta(g, T.PAPEL, 5);
    T.texto(g, canal.rotulo, x + 78, y + 22, tam, { al: 'left', fuente: T.F_UI, peso: 700, w: 0, color: T.TINTA });
    T.rr(g, x, y - 8, 62, 58, 10); T.pinta(g, canal.color, 5);
    T.texto(g, String(canal.num), x + 31, y + 22, 32, { w: 5, ds: 2 });
  };

  // --- la orden: un verbo enorme que entra de golpe ------------------------------------------
  TV.orden = function (g, canal, te, total, t) {
    const kin = Math.min(1, te / 10), kout = te > total - 10 ? (te - (total - 10)) / 10 : 0;
    let esc = kin < 1 ? ZZ.mix(3.2, 1, ZZ.e.out3(kin)) : 1 + Math.sin(t * 0.45) * 0.025;
    esc *= 1 + kout * 0.7;
    g.save();
    g.fillStyle = TV.VELO; g.globalAlpha = 0.6 * Math.min(1, kin * 2) * (1 - kout);
    g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.globalAlpha = 1 - kout;
    g.translate(ZZ.PW / 2, 392); g.rotate(-0.075); g.scale(esc, esc);
    T.sombra(g, c => estallidoCamino(c, 282, 13, canal.num), 8, 12, 1);
    estallidoCamino(g, 282, 13, canal.num); T.pinta(g, canal.color2, 8);
    let tam = 150;
    const an = T.ancho(g, canal.orden, tam);
    if (an > 384) tam *= 384 / an;
    T.texto(g, canal.orden, 0, 4, tam, { color: T.PAPEL, w: tam * 0.18, ds: tam * 0.07 });
    g.restore();
    if (kin >= 1 && kout === 0 && canal.pista) {
      const a2 = T.ancho(g, canal.pista, 25, T.F_UI, 700) + 44;
      const ka = Math.min(1, (te - 10) / 7);
      g.save(); g.globalAlpha = ka; g.translate(ZZ.PW / 2, 640 + (1 - ka) * 20);
      T.rr(g, -a2 / 2, -27, a2, 54, 27); T.pinta(g, T.TINTA, 0);
      T.texto(g, canal.pista, 0, 1, 25, { fuente: T.F_UI, peso: 700, w: 0, color: T.PAPEL });
      g.restore();
    }
  };
  function estallidoCamino(g, R, n, semilla) {
    const rng = ZZ.azar(semilla);
    g.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = 0.1 + i * Math.PI / n;
      const rr = i % 2 ? R * (0.74 + rng() * 0.06) : R * (0.94 + rng() * 0.12);
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.8;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath();
  }

  // --- botones ----------------------------------------------------------------------
  TV.boton = function (g, b) {
    const baja = b.pulsado ? 9 : 0, r = Math.min(28, b.h / 2.3);
    T.rr(g, b.x, b.y + 11, b.w, b.h, r); T.pinta(g, T.TINTA, 6);
    const cam = c => T.rr(c, b.x, b.y + baja, b.w, b.h, r);
    T.vol(g, cam, b.color, { dx: 0, dy: -8, w: 6 });
    const tam = b.tam || b.h * 0.46;
    T.texto(g, b.txt, b.x + b.w / 2, b.y + b.h / 2 + baja + 2, tam, { color: b.ctxt || T.PAPEL, w: b.ctxt ? 0 : tam * 0.17, ds: 3, fuente: b.fuente, peso: b.peso });
  };

  // Sello girado, como un tampón.
  TV.sello = function (g, txt, x, y, tam, color, k) {
    const s = k < 1 ? ZZ.mix(2.6, 1, ZZ.e.out3(k)) : 1;
    g.save(); g.translate(x, y); g.rotate(-0.13); g.scale(s, s); g.globalAlpha = Math.min(1, k * 2);
    const an = T.ancho(g, txt, tam) + 56;
    T.rr(g, -an / 2 + 7, -tam * 0.72 + 9, an, tam * 1.44, 18); T.pinta(g, T.TINTA, 6);
    T.rr(g, -an / 2, -tam * 0.72, an, tam * 1.44, 18); T.pinta(g, color, 7);
    T.texto(g, txt, 0, 3, tam, { w: tam * 0.16, ds: 3 });
    g.restore();
  };
})();
//# sourceURL=zz/tele.js
</script>
<script>
/* ZikZak · red
   Para jugar en directo con otra persona que tenga la página abierta a la vez.
   Usa la sala de la página (la capacidad `room`) y solo su parte de «presencia»: cada móvil publica
   su estado entero (a quién reta, por qué canal va, cuántos puntos lleva) y lee el del otro.
   No hay servidor de juego: cada uno hace su prueba en su móvil, con la misma semilla, y se comparan.
   Lo que llega del otro móvil se trata como dato sin fiar: se limpia antes de usarlo.
   En este equipo, sin la plataforma, hay una sala de mentira entre pestañas para poder probar. */
(function () {
  'use strict';
  const ZZ = window.ZZ;
  const R = ZZ.red = { estado: 'sin', sala: null, yo: {} };

  const NOMBRES = ['MANDO', 'ZAPEO', 'ANTENA', 'PALOMITA', 'SOFÁ', 'SINTONÍA', 'PARABÓLICA', 'CORTINILLA', 'TELETEXTO', 'PLATÓ', 'FOCO', 'CLAQUETA'];
  R.aliasNuevo = () => NOMBRES[(Math.random() * NOMBRES.length) | 0] + ' ' + (10 + ((Math.random() * 90) | 0));

  // --- sala de mentira, solo en este equipo -------------------------------------------
  function salaLocal() {
    const yo = 'p' + Math.random().toString(36).slice(2, 10);
    const canal = new BroadcastChannel('zz-sala');
    const otros = new Map();
    let mio = {};
    const manda = () => canal.postMessage({ peer: yo, presence: mio });
    canal.onmessage = ev => {
      const m = ev.data;
      if (!m || !m.peer || m.peer === yo) return;
      if (m.adios) otros.delete(m.peer); else otros.set(m.peer, { presence: m.presence || {}, visto: Date.now() });
    };
    setInterval(manda, 400);
    window.addEventListener('pagehide', () => canal.postMessage({ peer: yo, adios: true }));
    return {
      presence(patch) {
        const n = Object.assign({}, mio);
        for (const k in patch) { if (patch[k] === null) delete n[k]; else n[k] = patch[k]; }
        mio = n; manda();
        return Promise.resolve();
      },
      peers() {
        const ahora = Date.now();
        const l = [{ peer: yo, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: mio }];
        for (const [peer, o] of otros) {
          if (ahora - o.visto > 2500) { otros.delete(peer); continue; }
          l.push({ peer, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: o.presence });
        }
        return l;
      },
      connected() { return true; },
    };
  }

  // --- sala por el tiempo real de Supabase: para la página alojada fuera de claude.ai ---------
  // Un solo canal para todos. Cada móvil repite su estado entero por él; quien calla unos segundos, se da por ido.
  function salaSupabase(cfg) {
    const yo = 'p' + Math.random().toString(36).slice(2, 12);
    // Sala privada: su nombre va en el enlace (#sala-xxxx). Solo se ven quienes abren ese mismo enlace.
    let cod = (/^#sala-([a-z0-9]{8,24})$/.exec(location.hash) || [])[1];
    try { if (!cod) cod = localStorage.getItem('zz-sala'); } catch (e) { /* nada */ }
    if (!cod || !/^[a-z0-9]{8,24}$/.test(cod)) {
      const v = new Uint8Array(12); crypto.getRandomValues(v);
      cod = Array.from(v, x => 'abcdefghjkmnpqrstuvwxyz23456789'[x % 31]).join('');
    }
    try { localStorage.setItem('zz-sala', cod); } catch (e) { /* nada */ }
    try { history.replaceState(null, '', '#sala-' + cod); } catch (e) { location.hash = 'sala-' + cod; }
    R.codigoSala = cod;
    const tema = 'realtime:zz-' + cod;
    const otros = new Map();
    let mio = {}, ws = null, ref = 0, unido = false, pendiente = false, ultimoEnvio = 0;
    const manda = (topic, event, payload) => { try { ws.send(JSON.stringify({ topic, event, payload, ref: String(++ref) })); } catch (e) { /* nada */ } };
    const emite = datos => { ultimoEnvio = Date.now(); manda(tema, 'broadcast', { type: 'broadcast', event: 'e', payload: datos || { peer: yo, presence: mio } }); };
    function abre() {
      unido = false;
      try { ws = new WebSocket(cfg.url.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(cfg.clave) + '&vsn=1.0.0'); } catch (e) { return; }
      ws.onopen = () => manda(tema, 'phx_join', { config: { broadcast: { ack: false, self: false }, presence: { key: '' }, postgres_changes: [], private: false } });
      ws.onmessage = ev => {
        let m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.event === 'phx_reply' && m.topic === tema && m.payload && m.payload.status === 'ok') { if (!unido) { unido = true; emite(); } }
        else if (m.event === 'phx_reply' && m.topic === tema && m.payload && m.payload.status === 'error') R.error = JSON.stringify(m.payload.response || '').slice(0, 120);
        else if (m.event === 'broadcast' && m.payload && m.payload.event === 'e') {
          const d = m.payload.payload;
          if (!d || typeof d.peer !== 'string' || d.peer === yo) return;
          const quien = d.peer.slice(0, 24);
          if (d.adios) otros.delete(quien);
          else otros.set(quien, { presence: d.presence && typeof d.presence === 'object' ? d.presence : {}, visto: Date.now() });
        }
      };
      ws.onclose = () => { unido = false; setTimeout(abre, 2000); };
    }
    abre();
    setInterval(() => { if (ws && ws.readyState === 1) manda('phoenix', 'heartbeat', {}); }, 25000);
    setInterval(() => { if (unido && (pendiente || Date.now() - ultimoEnvio > 900)) { pendiente = false; emite(); } }, 150);
    window.addEventListener('pagehide', () => { if (unido) emite({ peer: yo, adios: true }); });
    return {
      presence(patch) {
        const n = Object.assign({}, mio);
        for (const k in patch) { if (patch[k] === null) delete n[k]; else n[k] = patch[k]; }
        mio = n; pendiente = true;
        return Promise.resolve();
      },
      peers() {
        const ahora = Date.now();
        const l = [{ peer: yo, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: mio }];
        for (const [peer, o] of otros) {
          if (ahora - o.visto > 3500) { otros.delete(peer); continue; }
          l.push({ peer, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: o.presence });
        }
        return l;
      },
      connected() { return unido; },
    };
  }

  // --- conexión ---------------------------------------------------------------------
  R.inicia = function () {
    if (R.estado !== 'sin') return;
    R.estado = 'conectando';
    const lista = sala => { R.sala = sala; R.estado = 'lista'; ultimo = ''; R.pon({}); };
    if (!window.claude || !window.claude.use) {
      const enCasa = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
      const sb = ZZ.CONFIG && ZZ.CONFIG.supabase;
      // fuera de claude.ai, la sala es el tiempo real del servidor; en este equipo, entre pestañas (salvo que se pida el servidor)
      if (sb && sb.url && window.WebSocket && (!enCasa || /[?&]red=supabase/.test(location.search))) { R.modo = 'web'; lista(salaSupabase(sb)); }
      else if (enCasa && window.BroadcastChannel) lista(salaLocal());
      else R.estado = 'no';
      return;
    }
    window.claude.use('room').then(sala => {
      if (!sala) { R.estado = 'no'; return; }
      // si la plataforma no admite a quien mira, lo dice por aquí
      try { sala.onConnection(() => {}, () => { R.estado = 'no'; R.sala = null; }); } catch (e) { /* nada */ }
      lista(sala);
    }, () => { R.estado = 'no'; });
  };

  // --- mi estado: siempre entero, nunca a trozos ---------------------------------------
  const CLAVES = ['v', 'alias', 'pinta', 'est', 'a', 'd', 'i', 'f', 'p', 'm', 'r', 'n'];
  let ultimo = '';
  R.pon = function (patch) {
    Object.assign(R.yo, patch);
    if (!R.sala) return;
    const todo = {};
    for (const k of CLAVES) todo[k] = R.yo[k] === undefined ? null : R.yo[k];
    const js = JSON.stringify(todo);
    if (js === ultimo) return;
    ultimo = js;
    try { const pr = R.sala.presence(todo); if (pr && pr.catch) pr.catch(() => {}); } catch (e) { /* nada */ }
  };

  // --- los demás: se limpia todo lo que llega -----------------------------------------
  const limpia = s => (typeof s === 'string' ? s : '').toUpperCase().replace(/[^A-ZÁÉÍÓÚÜÑ0-9 ]/g, '').slice(0, 14) || 'ALGUIEN';
  const ent = (v, a, b, def) => (Number.isInteger(v) && v >= a && v <= b ? v : def);
  const tiene = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);
  function lee(p) {
    const q = p.presence || {};
    if (q.v !== 1) return null;
    const o = {
      peer: String(p.peer), otra: !!p.isMe, alias: limpia(q.alias), pinta: ent(q.pinta, 0, 4, 0),
      est: ['menu', 'sala', 'reto', 'duelo'].indexOf(q.est) >= 0 ? q.est : 'menu',
      a: typeof q.a === 'string' ? q.a.slice(0, 64) : null,
      i: ent(q.i, 0, 5, 0), n: q.n === 5 ? 5 : 3, f: ['espera', 'listo', 'juego', 'hecho'].indexOf(q.f) >= 0 ? q.f : 'espera',
      p: ent(q.p, 0, 1000, 0),
      m: Array.isArray(q.m) && q.m.length === 2 ? [ent(q.m[0], 0, 1e6, 0), ent(q.m[1], -1, 1, 0)] : [0, 0],
      r: Array.isArray(q.r) ? q.r.slice(0, 5).map(v => ent(v, 0, 1000, 0)) : [],
      d: null,
    };
    const d = q.d;
    if (d && Number.isInteger(d.s) && Array.isArray(d.r) && (d.r.length === 3 || d.r.length === 5) &&
        d.r.every(x => Array.isArray(x) && tiene(ZZ.canales, x[0]) && ent(x[1], 1, 3, 0))) {
      o.d = { s: d.s >>> 0, r: d.r.map(x => [x[0], x[1]]) };
    }
    return o;
  }
  function todos() { try { return R.sala ? R.sala.peers() : []; } catch (e) { return []; } }
  R.gente = function () {
    const out = [];
    for (const p of todos()) {
      if (p.sameTab || p.kind === 'agent') continue;
      const o = lee(p);
      if (o) out.push(o);
    }
    return out;
  };
  R.miPeer = function () { const yo = todos().find(p => p.sameTab); return yo ? String(yo.peer) : null; };
  R.de = peer => R.gente().find(o => o.peer === peer) || null;
  R.conectada = () => { try { return !!(R.sala && R.sala.connected()); } catch (e) { return false; } };
})();
//# sourceURL=zz/red.js
</script>
<script>
/* ZikZak · código de reto
   Una partida entera cabe en un texto corto: la semilla y lo que tocó quien jugó.
   Quien pega ese texto en su ZikZak juega contra esa partida, repetida paso a paso en su móvil.
   No hace falta cuenta, sala ni servidor: el texto viaja por donde quiera quien lo manda.
   Lo que se lee de un código es un dato sin fiar: se comprueba todo y, si algo no cuadra, no vale. */
(function () {
  'use strict';
  const ZZ = window.ZZ, C = ZZ.codigo = {};
  const IDS = ['cocina', 'tiempo', 'western', 'concurso', 'teletienda', 'bricolaje', 'documental', 'musical', 'noticias', 'magia', 'deportes', 'terror', 'dibujos', 'noches'];      // este orden va dentro de los códigos: no se cambia
  const TIPOS = ['d', 'm', 'u'];
  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

  function aTexto(b) {
    let s = '';
    for (let i = 0; i < b.length; i += 3) {
      const n = (b[i] << 16) | ((b[i + 1] || 0) << 8) | (b[i + 2] || 0);
      s += B64[n >> 18] + B64[(n >> 12) & 63];
      if (i + 1 < b.length) s += B64[(n >> 6) & 63];
      if (i + 2 < b.length) s += B64[n & 63];
    }
    return s;
  }
  function aBytes(s) {
    const out = [];
    let n = 0, bits = 0;
    for (const ch of s) {
      const v = B64.indexOf(ch);
      if (v < 0) return null;
      n = (n << 6) | v; bits += 6;
      if (bits >= 8) { bits -= 8; out.push((n >> bits) & 255); n &= (1 << bits) - 1; }
    }
    return out;
  }
  const suma = (b, hasta) => { let s = 7; for (let i = 0; i < hasta; i++) s = (s * 31 + b[i]) & 0xFFFF; return s; };

  // d: { alias, pinta, semilla, rondas: [{ id, nivel, grab }] }
  C.crea = function (d) {
    const b = [1, d.pinta & 255];
    const al = Array.from(new TextEncoder().encode(String(d.alias || '').slice(0, 14)));
    b.push(al.length);
    for (const v of al) b.push(v);
    b.push((d.semilla >>> 24) & 255, (d.semilla >>> 16) & 255, (d.semilla >>> 8) & 255, d.semilla & 255);
    for (const r of d.rondas) {
      // en los canales de tocar solo cuenta dónde y cuándo se toca
      const ev = ZZ.canales[r.id].arrastra ? r.grab : r.grab.filter(e => e[1] === 'd');
      b.push(IDS.indexOf(r.id), r.nivel, (ev.length >> 8) & 255, ev.length & 255);
      let ps = 0, px = 0, py = 0;
      for (const e of ev) {
        const t = TIPOS.indexOf(e[1]), ds = e[0] - ps, dx = e[2] - px, dy = e[3] - py;
        if (ds >= 0 && ds < 63 && dx >= -127 && dx <= 127 && dy >= -127 && dy <= 127) b.push((t << 6) | ds, dx + 128, dy + 128);
        else b.push((t << 6) | 63, e[0] >> 8, e[0] & 255, e[2] >> 8, e[2] & 255, e[3] >> 8, e[3] & 255);
        ps = e[0]; px = e[2]; py = e[3];
      }
    }
    const s = suma(b, b.length);
    b.push(s >> 8, s & 255);
    return 'ZZ1-' + aTexto(b);
  };

  // Devuelve { alias, pinta, semilla, rondas } o null si el texto no es un código válido.
  C.lee = function (txt) {
    const m = /ZZ1-([A-Za-z0-9_-]+)/.exec(String(txt || '').replace(/\s+/g, ''));
    if (!m) return null;
    const b = aBytes(m[1]);
    if (!b || b.length < 24 || b.length > 30000) return null;
    const fin = b.length - 2;
    if (suma(b, fin) !== ((b[fin] << 8) | b[fin + 1])) return null;
    let i = 0;
    const uno = () => (i < fin ? b[i++] : -1);
    if (uno() !== 1) return null;
    const pinta = uno() % 5, n = uno();
    if (n < 0 || n > 60 || i + n > fin) return null;
    let alias = '';
    try { alias = new TextDecoder().decode(new Uint8Array(b.slice(i, i + n))); } catch (e) { alias = ''; }
    i += n;
    const semilla = ((uno() << 24) | (uno() << 16) | (uno() << 8) | uno()) >>> 0;
    const rondas = [];
    for (let k = 0; i < fin && k < 5; k++) {
      const id = IDS[uno()], nivel = uno(), cuantos = (uno() << 8) | uno();
      if (!id || !ZZ.canales[id] || nivel < 1 || nivel > 3 || cuantos < 0) return null;
      const tope = ZZ.pasosDe(ZZ.canales[id]);
      if (cuantos > tope * 5) return null;
      const grab = [];
      let ps = 0, px = 0, py = 0;
      for (let j = 0; j < cuantos; j++) {
        const c0 = uno(), t = TIPOS[c0 >> 6];
        if (c0 < 0 || !t) return null;
        let s, x, y;
        if ((c0 & 63) < 63) { s = ps + (c0 & 63); x = px + uno() - 128; y = py + uno() - 128; }
        else { s = (uno() << 8) | uno(); x = (uno() << 8) | uno(); y = (uno() << 8) | uno(); }
        if (!(s >= ps && s <= tope && x >= 0 && x <= ZZ.PW && y >= 0 && y <= ZZ.PH)) return null;
        grab.push([s, t, x, y]);
        ps = s; px = x; py = y;
      }
      rondas.push({ id, nivel, semilla: (semilla + 7919 * (k + 1)) >>> 0, grab });
    }
    if (i !== fin || (rondas.length !== 3 && rondas.length !== 5)) return null;
    return { alias, pinta, semilla, rondas };
  };
})();
//# sourceURL=zz/codigo.js
</script>
<script>

    v.esc = A.s;
    gg.save();
    if (v.temblor > 0) gg.translate((Math.random() - 0.5) * v.temblor * 1.5, (Math.random() - 0.5) * v.temblor * 1.5);
    r.canal.dibuja(gg, r.yo.e, v);
    gg.restore();
    if (!sinMosca) TV.mosca(gg, r.canal);
    // el rótulo del programa sale solo, antes de la orden, y se va: durante el juego no tapa nada
    if (A.est === 'orden' && A.te < F_ROTULO) TV.rotulo(gg, r.canal, Math.min(1, A.te / 8, (F_ROTULO - A.te) / 7));
  }
  function finRonda() {
    const r = A.ronda;
    son.calla();
    r.pYo = r.yo.puntos();
    r.agotado = r.yo.n >= ZZ.pasosDe(r.canal);
    if (r.rival) {
      r.pRival = r.rival.hastaElFinal();
      r.gana = r.pYo > r.pRival ? 1 : r.pYo < r.pRival ? -1 : 0;
    }
    if (A.duelo.tipo === 'vivo') { const d = A.duelo; d.misPts[d.i] = r.pYo; publica({ f: 'hecho', p: r.pYo, r: d.misPts.slice() }); }
    ir('remate');
  }
  function sigue() {
    const d = A.duelo;
    d.rondas[d.i].mia = A.ronda.yo.grab;
    if (!d.rival) d.pts[d.i] = [A.ronda.pYo, 0];
    d.i++;
    if (d.i < d.rondas.length) {
      if (d.tipo === 'vivo') { publica({ est: 'duelo', a: d.peer, i: d.i, f: 'listo', p: 0 }); ir('listos'); } else empiezaRonda();
      return;
    }
    if (d.tipo === 'turnos' && d.fase === 1) {
      // ha jugado la primera persona: su turno queda grabado y le toca a la segunda
      d.fase = 2; d.i = 0; d.res = []; d.pts = [];
      d.rondas.forEach(r => { r.grab = r.mia; r.mia = null; });
      d.rival = { nombre: 'JUGADOR 1', etiqueta: 'EN DIFERIDO', sub: 'Su turno: grabado hace un momento', aspecto: P.PINTAS[d.pintas[0] % P.PINTAS.length], color: T.MENTA };
      d.yoNombre = 'JUGADOR 2';
      ir('pase');
      return;
    }
    if (d.tipo === 'reto') {
      // mi partida, convertida en un texto que se puede mandar
      A.codigo = ZZ.codigo.crea({ alias: perfil.alias, pinta: perfil.pinta, semilla: d.semilla, rondas: d.rondas.map(r => ({ id: r.id, nivel: r.nivel, grab: r.mia })) });
      A.misPts = d.pts.map(x => x[0]);
      ir('codListo');
      return;
    }
    const mias = d.res.filter(v => v > 0).length, suyas = d.res.filter(v => v < 0).length;
    const tot = d.pts.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0, 0]);
    const gana = mias !== suyas ? Math.sign(mias - suyas) : Math.sign(tot[0] - tot[1]);
    const antes = perfil.cuota;
    if (d.tipo === 'casa' || d.tipo === 'yo') {
      perfil.duelos++;
      if (gana > 0) perfil.ganados++;
      if (d.tipo === 'casa') perfil.cuota = ZZ.lim(perfil.cuota + gana * 0.06, 0.1, 0.95);
      guardaPerfil();
      guarda.pon('ultimo', { semilla: d.semilla, pinta: perfil.pinta, rondas: d.rondas.map(r => ({ id: r.id, nivel: r.nivel, semilla: r.semilla, grab: r.mia })) });
    }
    A.final = { gana, mias, suyas, tot, antes, ahora: perfil.cuota };
    ir('final');
  }

  // --- en directo: seguir lo que publica el otro móvil -------------------------------------------
  function sigueRival() {
    const d = A.duelo;
    if (!d || d.tipo !== 'vivo' || A.est === 'final') return;
    const o = red.de(d.peer);
    if (o && (o.est === 'duelo' || o.est === 'reto') && o.a === red.miPeer()) {
      d.rv = o; d.visto = A.t;
      if (o.m[0] !== d.mSeq) { d.mSeq = o.m[0]; if (o.m[1] && A.est === 'juego') animo('rival', o.m[1]); }
    } else if (A.t - d.visto > 300) {
      // cuatro o cinco segundos sin noticias: se ha ido, y quien se va pierde
      for (let i = 0; i < d.rondas.length; i++) if (d.res[i] === undefined) { d.res[i] = 1; d.pts[i] = [d.misPts[i] || 0, 0]; }
      const tot = d.pts.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0, 0]);
      son.calla();
      A.final = { gana: 1, mias: d.res.filter(v => v > 0).length, suyas: d.res.filter(v => v < 0).length, tot, antes: perfil.cuota, ahora: perfil.cuota, ido: true };
      ir('final');
    }
  }

  const F_NADIE = 66, F_VS = 118, F_FIN = 270;

      if (d.tipo === 'vivo') {

      gg.save(); gg.translate(176 - (1 - k) * 460, 1050); gg.rotate(0.1);
      P.entero(gg, 0, 0, 2.1, miPinta(), gY[1], A.t, gY[0]);
