</script>
<script>
/* ZikZak · canal 3 · Western · ¡DISPARA!
   Saltan latas por detrás de la valla y se toca encima de cada una.
   Mide la puntería: cuenta acertar, acertar en el centro y hacerlo pronto. Fallar gasta balas. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta;

  const Y0 = 700;          // de dónde salen las latas (queda tapado por la valla)
  const VALLA = 628;       // borde de arriba de la valla
  const NIV = [null,
    { n: 3, r: 50, balas: 6, g: 0.34, ini: 20, hueco: 80, alto: [150, 330], gallina: false },
    { n: 4, r: 44, balas: 6, g: 0.38, ini: 14, hueco: 60, alto: [140, 340], gallina: false },
    { n: 5, r: 38, balas: 7, g: 0.44, ini: 12, hueco: 46, alto: [130, 350], gallina: true }];

  const C = {
    cielo: ['#33257F', T.VIOLETA, T.ROJO, '#FF8A3C', T.AMARILLO],
    roca: '#43318A', rocaS: '#2A1F5C', arena: '#E9792B', arenaS: '#C25A1C',
    madera: '#A9632F', maderaS: '#7A4220', lata: '#CFD9E0', lataS: '#98A7B4',
  };

  // --- lógica ---------------------------------------------------------------
  function hazObjeto(rng, N, s0, gallina) {
    const apice = rng.entre(N.alto[0], N.alto[1]);
    const vy = -Math.sqrt(2 * N.g * (Y0 - apice));
    const T2 = Math.floor(-2 * vy / N.g);
    const x0 = rng.entre(110, 530), x1 = ZZ.lim(x0 + rng.entre(-190, 190), 90, 550);
    return { s0, x0, y0: Y0, vx: (x1 - x0) / T2, vy, g: N.g, dura: T2, r: gallina ? N.r + 6 : N.r, gallina: !!gallina,
      dado: -1, caido: false, giro: rng.entre(0.09, 0.17) * (rng() < 0.5 ? -1 : 1) };
  }
  function donde(o, n) {
    const t = n - o.s0;
    return [o.x0 + o.vx * t, o.y0 + o.vy * t + o.g * t * t / 2];
  }
  const enElAire = (o, n) => o.dado < 0 && !o.caido && n >= o.s0 && n < o.s0 + o.dura;

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const objs = [];
    for (let i = 0; i < N.n; i++) objs.push(hazObjeto(rng, N, N.ini + i * N.hueco + rng.entero(-6, 6), false));
    if (N.gallina) objs.push(hazObjeto(rng, N, rng.entero(40, 170), true));
    return { semilla, nivel, objs, latas: N.n, balas: N.balas, balasMax: N.balas, suma: 0, fallos: 0, pena: 0, espera: 0, hecho: false, ev: [] };
  }

  function paso(e, entradas, n) {
    for (let i = 0; i < e.objs.length; i++) if (e.objs[i].s0 === n) e.ev.push({ t: 'lanza', i });
    for (const en of entradas) {
      if (en.t !== 'd') continue;
      if (e.balas <= 0) { e.ev.push({ t: 'clic', x: en.x, y: en.y }); continue; }
      e.balas--;
      let j = -1, mejor = 1e9;
      for (let i = 0; i < e.objs.length; i++) {
        const o = e.objs[i];
        if (!enElAire(o, n)) continue;
        const p = donde(o, n);
        if (p[1] > VALLA + 30) continue;                 // tapada por la valla
        const d = Math.hypot(p[0] - en.x, p[1] - en.y);
        if (d <= o.r + 8 && d < mejor) { mejor = d; j = i; }
      }
      if (j < 0) { e.fallos++; e.ev.push({ t: 'aire', x: en.x, y: en.y }); continue; }
      const o = e.objs[j], p = donde(o, n);
      o.dado = n;
      if (o.gallina) { e.pena += 150; e.ev.push({ t: 'gallina', i: j, x: p[0], y: p[1], tx: en.x, ty: en.y }); continue; }
      const centro = 1 - mejor / (o.r + 8), pronto = 1 - (n - o.s0) / o.dura;
      const pts = Math.round(50 + 30 * centro + 20 * pronto);
      e.suma += pts;
      e.ev.push({ t: 'lata', i: j, x: p[0], y: p[1], tx: en.x, ty: en.y, pts, pleno: centro > 0.72 });
    }
    let quedan = 0;
    for (let i = 0; i < e.objs.length; i++) {
      const o = e.objs[i];
      if (o.dado < 0 && !o.caido && n >= o.s0 + o.dura) { o.caido = true; if (!o.gallina) e.ev.push({ t: 'cae', i }); }
      if (o.dado < 0 && !o.caido && !o.gallina) quedan++;
    }
    if (quedan === 0 && ++e.espera > 22) e.hecho = true;
  }

  function puntuacion(e) {
    return ZZ.lim(Math.round((e.suma - 10 * e.fallos - e.pena) * 10 / e.latas), 0, 1000);
  }

  // Jugador de la casa: tarda en reaccionar y apunta con más o menos tino.
  function casa(e, mem, rng, d, n) {
    if (!mem.plan) {
      mem.plan = [];
      e.objs.forEach((o, i) => {
        if (o.gallina) { if (rng() < ZZ.mix(0.35, 0, Math.min(1, d * 1.4))) mem.plan.push({ paso: o.s0 + rng.entero(24, 50), i }); return; }
        const reac = Math.round(ZZ.mix(48, 17, d) + rng.campana() * ZZ.mix(9, 3, d));
        mem.plan.push({ paso: o.s0 + ZZ.lim(reac, 8, o.dura - 8), i, otra: rng() < ZZ.mix(0.35, 0.92, d) });
      });
    }
    const sal = [];
    for (const p of mem.plan.slice()) {
      if (p.paso !== n) continue;
      const o = e.objs[p.i];
      if (!enElAire(o, n) || e.balas - sal.length <= 0) continue;
      const q = donde(o, n), sig = ZZ.mix(36, 6, d);
      sal.push({ t: 'd', x: Math.round(ZZ.lim(q[0] + rng.campana() * sig, 0, ZZ.PW)), y: Math.round(ZZ.lim(q[1] + rng.campana() * sig, 0, ZZ.PH)) });
      if (p.otra) mem.plan.push({ paso: n + Math.round(ZZ.mix(26, 12, d)), i: p.i, otra: false });
    }
    return sal;
  }

  // --- dibujo -----------------------------------------------------------------
  function franja(g, y, h, color, arriba) {
    g.fillStyle = color; g.fillRect(0, y, ZZ.PW, h);
    if (arriba) { g.fillStyle = T.trama(g, arriba, 11, 3.3); g.fillRect(0, y, ZZ.PW, 34); g.fillStyle = T.trama(g, arriba, 11, 1.8); g.fillRect(0, y + 34, ZZ.PW, 24); }
  }
  function cactus(g, x, y, s) {
    g.save(); g.translate(x, y); g.scale(s, s);
    const brazo = (sg, h0, h1) => c => { c.beginPath(); c.moveTo(0, h0); c.lineTo(sg * 46, h0); c.lineTo(sg * 46, h1); };
    T.tubo(g, brazo(-1, -90, -138), T.MENTA, 26, 6);
    T.tubo(g, brazo(1, -124, -182), T.MENTA, 26, 6);
    T.vol(g, c => T.rr(c, -22, -250, 44, 262, 22), T.MENTA, { dx: -7, dy: 0, w: 6 });
    g.beginPath();
    for (const [a, b] of [[-8, -220], [8, -190], [-8, -150], [8, -110], [-8, -70], [8, -40]]) { g.moveTo(a - 4, b); g.lineTo(a + 4, b); }
    T.linea(g, 4);
    // una flor de cactus
    for (let i = 0; i < 5; i++) { const an = i * 1.2566 - 1.57; T.circ(g, Math.cos(an) * 11, -262 + Math.sin(an) * 11, 8); T.pinta(g, T.ROJO, 4); }
    T.circ(g, 0, -262, 6); T.pinta(g, T.AMARILLO, 4);
    g.restore();
  }
  function fondo(g) {
    franja(g, 0, 190, C.cielo[0]);
    franja(g, 190, 150, C.cielo[1], C.cielo[0]);
    franja(g, 340, 130, C.cielo[2], C.cielo[1]);
    franja(g, 470, 110, C.cielo[3], C.cielo[2]);
    franja(g, 580, 80, C.cielo[4], C.cielo[3]);
    // estrellas
    g.fillStyle = T.PAPEL;
    for (const [x, y, r] of [[70, 60, 5], [190, 120, 4], [300, 44, 6], [520, 90, 5], [600, 160, 4], [430, 150, 3.5], [120, 170, 3.5]]) { T.estrella(g, x, y, r * 2, r * 0.8, 4); g.fill(); }
    // sol
    g.save(); g.beginPath(); g.rect(0, 0, ZZ.PW, 650); g.clip();
    T.vol(g, c => T.circ(c, 410, 650, 176), '#FFE48A', { sombra: T.AMARILLO, dx: -10, dy: -12, w: 7 });
    g.restore();
    // mesetas
    T.vol(g, c => T.poli(c, [[-20, 660], [-20, 452], [52, 444], [70, 388], [146, 382], [166, 458], [226, 468], [256, 660]]), C.roca, { sombra: C.rocaS, dx: -10, dy: -4, w: 7 });
    T.vol(g, c => T.poli(c, [[420, 660], [446, 520], [520, 512], [538, 464], [660, 458], [660, 660]]), C.roca, { sombra: C.rocaS, dx: -10, dy: -4, w: 7 });
    // arena
    T.vol(g, c => { c.beginPath(); c.moveTo(-10, 640); c.quadraticCurveTo(160, 610, 330, 636); c.quadraticCurveTo(500, 660, 650, 626); c.lineTo(650, 850); c.lineTo(-10, 850); c.closePath(); }, C.arena, { sombra: C.arenaS, dx: 0, dy: 10, w: 7 });
    cactus(g, 574, 662, 1);
  }
  function valla(g) {
    const tops = [650, 632, 644, 628, 640, 634, 648, 630, 642];
    // travesaño
    T.vol(g, c => T.rr(c, -20, 700, 680, 34, 6), C.maderaS, { sombra: '#5A2F15', dx: 0, dy: -8, w: 6 });
    for (let i = 0; i < 9; i++) {
      const x = -14 + i * 76, y = tops[i];
      T.vol(g, c => T.poli(c, [[x, 860], [x, y + 16], [x + 34, y], [x + 68, y + 16], [x + 68, 860]]), C.madera, { sombra: C.maderaS, dx: -8, dy: 0, w: 6 });
      g.beginPath(); g.moveTo(x + 22, y + 44); g.quadraticCurveTo(x + 30, y + 110, x + 20, y + 170); T.linea(g, 4, C.maderaS);
      T.circ(g, x + 34, 716, 5); T.pinta(g, T.TINTA, 0);
    }
    // cartel
    g.save(); g.translate(486, 742); g.rotate(0.06);
    T.rr(g, -78, -62, 164, 132, 8); T.pinta(g, T.TINTA, 0);
    T.rr(g, -84, -70, 164, 132, 8); T.pinta(g, T.PAPEL, 6);
    T.texto(g, 'SE BUSCA', -2, -42, 27, { color: T.TINTA, w: 0 });
    g.save(); g.translate(-2, 6); g.rotate(-0.2); lata(g, 21); g.restore();
    T.texto(g, 'VIVA O ABOLLADA', -2, 46, 14.5, { fuente: T.F_UI, peso: 900, w: 0, color: T.TINTA });
    g.restore();
  }

  // Una lata con el centro en el origen. r es el radio que cuenta para acertar.
  function lata(g, r, borde) {
    const w = r * 1.36, h = r * 1.84;
    const cam = c => T.rr(c, -w / 2, -h / 2, w, h, r * 0.2);
    // borde claro de pegatina: la lata se separa de cualquier franja del cielo
    if (borde) { cam(g); g.lineJoin = 'round'; g.lineWidth = Math.max(4, r * 0.13) + 13; g.strokeStyle = T.PAPEL; g.stroke(); }
    T.vol(g, cam, C.lata, { sombra: C.lataS, dx: -r * 0.2, dy: 0, w: Math.max(4, r * 0.13) });
    g.save(); cam(g); g.clip();
    g.fillStyle = T.ROJO; g.fillRect(-w / 2, -h * 0.26, w, h * 0.52);
    g.fillStyle = T.oscuro(T.ROJO, 0.25); g.fillRect(w / 2 - r * 0.2, -h * 0.26, r * 0.2, h * 0.52);
    g.restore();
    T.circ(g, 0, 0, r * 0.36); T.pinta(g, T.PAPEL, Math.max(3, r * 0.09));
    T.estrella(g, 0, 0, r * 0.25, r * 0.11, 5); T.pinta(g, T.AMARILLO, Math.max(2.5, r * 0.07));
    g.beginPath(); g.moveTo(-w / 2, -h * 0.26); g.lineTo(w / 2, -h * 0.26); g.moveTo(-w / 2, h * 0.26); g.lineTo(w / 2, h * 0.26);
    g.moveTo(-w / 2 + 4, -h * 0.4); g.lineTo(w / 2 - 4, -h * 0.4); g.moveTo(-w / 2 + 4, h * 0.4); g.lineTo(w / 2 - 4, h * 0.4);
    T.linea(g, Math.max(3, r * 0.09));
    cam(g); T.linea(g, Math.max(4, r * 0.13));
  }
  function gallina(g, r, t, susto) {
    const al = Math.sin(t * 0.7) * 0.5;
    T.vol(g, c => T.poli(c, [[-r * 0.9, -r * 0.1], [-r * 1.5, -r * 0.6], [-r * 1.3, r * 0.1], [-r * 1.55, r * 0.5], [-r * 0.8, r * 0.4]]), T.PAPEL, { sombra: '#DDD0B4', dx: -2, dy: -3, w: 5 });
    T.vol(g, c => T.elip(c, 0, 0, r, r * 0.8), T.PAPEL, { sombra: '#DDD0B4', dx: -5, dy: -6, w: 6 });
    g.save(); g.translate(-r * 0.1, -r * 0.1); g.rotate(al - 0.5);
    T.vol(g, c => T.elip(c, -r * 0.1, -r * 0.5, r * 0.34, r * 0.66), T.PAPEL, { sombra: '#DDD0B4', dx: -2, dy: -3, w: 5 });
    g.restore();
    T.vol(g, c => T.circ(c, r * 0.86, -r * 0.62, r * 0.46), T.PAPEL, { sombra: '#DDD0B4', dx: -3, dy: -4, w: 6 });
    for (const [x, y] of [[0.7, -1.1], [0.9, -1.16], [1.08, -1.06]]) { T.circ(g, r * x, r * y, r * 0.13); T.pinta(g, T.ROJO, 4.5); }
    T.poli(g, [[r * 1.26, -r * 0.7], [r * 1.66, -r * 0.56], [r * 1.26, -r * 0.42]]); T.pinta(g, T.AMARILLO, 5);
    T.circ(g, r * 0.96, -r * 0.7, susto ? r * 0.17 : r * 0.12); T.pinta(g, '#FFFFFF', 4);
    T.circ(g, r * 0.98, -r * 0.7, r * 0.06); T.pinta(g, T.TINTA, 0);
    T.circ(g, r * 1.02, -r * 0.34, r * 0.12); T.pinta(g, T.ROJO, 4);
  }
  function bala(g, x, y, llena) {
    g.save(); g.translate(x, y); g.scale(1.35, 1.35);
    if (!llena) {
      // gastada: solo el contorno, en claro, para que se vea sobre la valla
      g.globalAlpha = 0.9;
      g.beginPath(); g.moveTo(-9, 20); g.lineTo(-9, -8); g.quadraticCurveTo(-9, -24, 0, -26); g.quadraticCurveTo(9, -24, 9, -8); g.lineTo(9, 20); g.closePath();
      g.setLineDash([5, 5]); T.linea(g, 3.2, T.PAPEL); g.setLineDash([]);
      g.restore();
      return;
    }
    if (llena) {
      T.vol(g, c => { c.beginPath(); c.moveTo(-9, 20); c.lineTo(-9, -8); c.quadraticCurveTo(-9, -24, 0, -26); c.quadraticCurveTo(9, -24, 9, -8); c.lineTo(9, 20); c.closePath(); }, T.AMARILLO, { dx: -4, dy: 0, w: 5 });
      g.beginPath(); g.moveTo(-9, -6); g.lineTo(9, -6); T.linea(g, 4);
    } else {
      g.globalAlpha = 0.45; T.rr(g, -9, -6, 18, 26, 4); T.pinta(g, T.TINTA, 0);
    }
    g.restore();
  }
  function rodadora(g, x, y, r, giro) {
    g.save(); g.translate(x, y); g.rotate(giro);
    T.circ(g, 0, 0, r); T.pinta(g, '#D9A25A', 5);
    g.beginPath();
    for (let i = 0; i < 5; i++) { const a = i * 1.3; g.moveTo(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9); g.quadraticCurveTo(0, 0, Math.cos(a + 2.2) * r * 0.9, Math.sin(a + 2.2) * r * 0.9); }
    T.linea(g, 3.5, '#8A5A22');
    g.restore();
  }

  function dibuja(g, e, vis) {
    const n = vis.n, t = vis.t;
    T.capa(g, vis, 'western', fondo);
    // una rodadora cruza el desierto
    const rx = ((t * 2.1 + 200) % 900) - 120;
    rodadora(g, rx, 612 - Math.abs(Math.sin(t * 0.09)) * 26, 24, t * 0.13);
    // agujeros de los tiros que no dieron en nada
    for (const a of vis.agujeros || []) {
      T.estrella(g, a.x, a.y, 19, 8, 7, a.rot); T.pinta(g, T.TINTA, 0);
      T.circ(g, a.x, a.y, 5.5); T.pinta(g, T.PAPEL, 0);
    }
    vis.ch.dibuja(g, 0);
    for (const o of e.objs) {
      if (!enElAire(o, n)) continue;
      const p = donde(o, n);
      g.save(); g.translate(p[0], p[1]);
      if (o.gallina) { g.rotate(Math.sin(t * 0.3) * 0.25); gallina(g, o.r * 0.62, t, false); }
      else { g.rotate((n - o.s0) * o.giro); lata(g, o.r, true); }
      g.restore();
    }
    T.capa(g, vis, 'westernValla', valla);
    // balas
    for (let i = 0; i < e.balasMax; i++) bala(g, 44 + i * 40, 790, i < e.balas);
    vis.ch.dibuja(g, 1);
    // fogonazo
    if (vis.fogonazo && t - vis.fogonazo.t < 5) {
      const k = (t - vis.fogonazo.t) / 5, f = vis.fogonazo;
      if (f.gris) { T.estrella(g, f.x, f.y, 34 * (1 - k * 0.4), 14, 7, f.rot); T.pinta(g, '#D8D2C6', 5); }
      else {
        T.estrella(g, f.x, f.y, 62 * (1 - k * 0.4), 24, 8, f.rot); T.pinta(g, T.AMARILLO, 6);
        T.estrella(g, f.x, f.y, 30 * (1 - k * 0.4), 12, 8, f.rot + 0.4); T.pinta(g, '#FFFFFF', 0);
      }
    }
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'lata' || x.t === 'aire' || x.t === 'gallina') {
        const tx = x.tx === undefined ? x.x : x.tx, ty = x.ty === undefined ? x.y : x.ty;
        vis.fogonazo = { x: tx, y: ty, t: vis.t, rot: Math.random() * 3, gris: x.t === 'aire' };
        vis.temblor = x.t === 'aire' ? 4 : 7;
        son && son.tiro();
      }
      if (x.t === 'lata') {
        const o = e.objs[x.i], dir = Math.sign(x.x - x.tx) || (Math.random() < 0.5 ? -1 : 1);
        const dx = x.tx - x.x, dy = x.ty - x.y, r = o.r, rot0 = (o.dado - o.s0) * o.giro;
        vis.ch.mas({ tipo: 'dib', x: x.x, y: x.y, vx: dir * (5 + Math.random() * 3) + o.vx, vy: -11, g: 0.6, rot: rot0, vr: dir * 0.42, vida: 46, capa: 0,
          dib: (c, p, k) => {
            c.globalAlpha = k > 0.75 ? (1 - k) * 4 : 1;
            lata(c, r);
            const hx = dx * Math.cos(-rot0) - dy * Math.sin(-rot0), hy = dx * Math.sin(-rot0) + dy * Math.cos(-rot0);
            T.estrella(c, ZZ.lim(hx, -r * 0.5, r * 0.5), ZZ.lim(hy, -r * 0.7, r * 0.7), r * 0.34, r * 0.14, 6, 0.3); T.pinta(c, T.TINTA, 0);
          } });
        T.estrellas(vis.ch, x.x, x.y, x.pleno ? 8 : 5, T.AMARILLO, 9, x.pleno ? 20 : 14, 1);
        T.rayitas(vis.ch, x.x, x.y, 7, T.PAPEL, 30, o.r, 1);
        if (x.pleno) vis.ch.mas({ tipo: 'anillo', x: x.x, y: x.y, r: 30, R: 140, w: 14, color: '#FFFFFF', vida: 16, capa: 1 });
        T.palabra(vis.ch, x.pleno ? '¡PLENO!' : '¡PAM!', ZZ.lim(x.x, 170, 470), 150, x.pleno ? T.AMARILLO : T.PAPEL, x.pleno ? 58 : 52, 1);
        vis.parada = 2;
        son && son.lata();
      } else if (x.t === 'aire') {
        vis.agujeros = vis.agujeros || [];
        if (x.y < VALLA) vis.agujeros.push({ x: x.x, y: x.y, rot: Math.random() * 3 });
        T.polvo(vis.ch, x.x, x.y, 4, T.PAPEL, 3, 9, 1);
      } else if (x.t === 'gallina') {
        const o = e.objs[x.i];
        for (let i = 0; i < 9; i++) {
          vis.ch.mas({ tipo: 'dib', x: x.x, y: x.y, vx: (Math.random() - 0.5) * 9, vy: -3 - Math.random() * 5, g: 0.16, roz: 0.95, vr: (Math.random() - 0.5) * 0.3, vida: 50, capa: 1,
            dib: (c, p, k) => { c.globalAlpha = 1 - k * k; T.elip(c, 0, 0, 13, 6); T.pinta(c, T.PAPEL, 4); } });
        }
        vis.ch.mas({ tipo: 'dib', x: x.x, y: x.y, vx: (Math.random() - 0.5) * 6, vy: -13, g: 0.5, vr: 0.3, vida: 60, capa: 0,
          dib: (c) => gallina(c, o.r * 0.62, vis.t, true) });
        T.palabra(vis.ch, '¡LA GALLINA NO!', 320, 150, T.ROJO, 44, 1);
        vis.temblor = 12;
        son && son.cacareo();
      } else if (x.t === 'cae') {
        const o = e.objs[x.i], p = donde(o, o.s0 + o.dura);
        T.palabra(vis.ch, '¡SE ESCAPA!', ZZ.lim(p[0], 170, 470), 150, T.ROJO, 44, 1);
        son && son.fallo();
      } else if (x.t === 'clic') {
        T.palabra(vis.ch, 'SIN BALAS', 320, 150, T.PAPEL, 44, 1);
        son && son.golpe();
      } else if (x.t === 'lanza') {
        const o = e.objs[x.i];
        T.polvo(vis.ch, o.x0, VALLA + 6, 4, '#F3C58E', 4, 13, 0);
      }
    }
  }

  ZZ.canales.western = {
    id: 'western', num: 3, nombre: 'WESTERN', orden: '¡DISPARA!',
    pista: 'Toca cada lata antes de que caiga',
    rotulo: 'SESIÓN DE TARDE: «POR UN PUÑADO DE LATAS»',
    color: '#E9792B', color2: T.VIOLETA, color3: T.AMARILLO,
    animo: x => (x.t === 'lata' ? 1 : (x.t === 'aire' || x.t === 'cae' || x.t === 'gallina') ? -1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
//# sourceURL=zz/canales/western.js
</script>
<script>
/* ZikZak · canal 4 · Concurso · ¡PULSA!
   Un pulsador y una lámpara. Cuando la lámpara se pone verde, se toca. Quien toca antes, pierde.
   Mide los reflejos: cuenta lo poco que se tarda. En los niveles altos la lámpara amaga en ámbar. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const NIV = [null,
    { ini: [80, 170], falsas: 0 },
    { ini: [110, 200], falsas: 1 },
    { ini: [140, 225], falsas: 2 }];
  const AMAGO = 14;        // pasos que dura un amago
  const C = { fondo: '#3A2A8C', fondoS: '#2A1F5C', atril: '#19B5A5', atrilS: '#0E7F74', verde: '#3DDC6B', ambar: '#FF9F1C', apagada: '#6B5FA8' };

  // --- lógica ---------------------------------------------------------------
  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const enc = rng.entero(N.ini[0], N.ini[1]);
    const falsas = [];
    for (let i = 0; i < N.falsas; i++) {
      const a = 30 + i * 45, b = Math.min(a + 35, enc - 40 - (N.falsas - 1 - i) * 45);
      falsas.push(rng.entero(a, Math.max(a, b)));
    }
    return { semilla, nivel, enc, falsas, pulsado: -1, antes: false, pts: 0, espera: 0, hecho: false, ev: [] };
  }

  const puntosDe = r => ZZ.lim(Math.round(1000 - Math.max(0, r - 9) * 22), 0, 1000);

  function paso(e, entradas, n) {
    if (e.falsas.indexOf(n) >= 0) e.ev.push({ t: 'amago' });
    if (n === e.enc) e.ev.push({ t: 'luz' });
    if (e.pulsado < 0) {
      for (const en of entradas) {
        if (en.t !== 'd') continue;
        e.pulsado = n;
        if (n < e.enc) { e.antes = true; e.pts = 0; e.ev.push({ t: 'antes' }); }
        else { e.pts = puntosDe(n - e.enc); e.ev.push({ t: 'pulsa', r: n - e.enc, pts: e.pts }); }
        break;
      }
    }
    if (e.pulsado >= 0 && ++e.espera > 40) e.hecho = true;
  }

  function puntuacion(e) { return e.pulsado < 0 || e.antes ? 0 : e.pts; }

  // Jugador de la casa: tarda en reaccionar y, si es flojo, pica en los amagos.
  function casa(e, mem, rng, d, n) {
    if (mem.paso === undefined) {
      mem.paso = e.enc + ZZ.lim(Math.round(ZZ.mix(34, 13, d) + rng.campana() * ZZ.mix(8, 2, d)), 1, 80);
      for (const f of e.falsas) if (rng() < ZZ.mix(0.3, 0, Math.min(1, d * 1.3))) { mem.paso = f + rng.entero(10, 20); break; }
    }
    return n === mem.paso && e.pulsado < 0 ? [{ t: 'd', x: 320, y: 560 }] : [];
  }

  // --- dibujo -----------------------------------------------------------------
  function fondo(g) {
    g.fillStyle = C.fondo; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    T.rayos(g, 320, 262, 900, 18, 0.2, T.mezcla(C.fondo, '#FFFFFF', 0.08));
    g.fillStyle = T.trama(g, C.fondoS, 12, 3); g.fillRect(0, 0, ZZ.PW, 190);
    // guirnalda de bombillas
    g.beginPath(); g.moveTo(-10, 118); g.quadraticCurveTo(320, 176, 650, 118); T.linea(g, 5);
    for (let i = 0; i < 9; i++) {
      const u = (i + 0.5) / 9, x = u * 640, y = 118 + 58 * 2 * u * (1 - u) + 12;
      T.circ(g, x, y, 12); T.pinta(g, [T.AMARILLO, T.ROJO, T.MENTA][i % 3], 5);
    }
    // dos focos de verdad, con su haz
    for (const [x, a] of [[92, 0.4], [548, -0.4]]) {
      g.save(); g.translate(x, 30); g.rotate(a);
      g.save(); g.globalAlpha = 0.15; T.poli(g, [[-30, 44], [30, 44], [180, 760], [-180, 760]]); g.fillStyle = '#FFF2B8'; g.fill(); g.restore();
      T.vol(g, c => T.poli(c, [[-24, -34], [24, -34], [40, 44], [-40, 44]]), '#6B7896', { sombra: '#3A4460', dx: -9, dy: 0, w: 6 });
      T.elip(g, 0, 44, 40, 11); T.pinta(g, '#FFF2B8', 5);
      g.restore();
    }
    // suelo del plató
    T.vol(g, c => T.rr(c, -20, 690, 680, 200, 0), C.fondoS, { sombra: '#1C1440', dx: 0, dy: 26, w: 7 });
    g.fillStyle = T.trama(g, '#1C1440', 13, 2.6); g.fillRect(0, 730, ZZ.PW, 110);
    // el atril del pulsador
    T.vol(g, c => T.poli(c, [[150, 860], [190, 616], [450, 616], [490, 860]]), C.atril, { sombra: C.atrilS, dx: -14, dy: 0, w: 7 });
    T.vol(g, c => T.rr(c, 140, 588, 360, 46, 12), C.atril, { sombra: C.atrilS, dx: 0, dy: -10, w: 7 });
    T.estrella(g, 324, 712, 44, 19, 5, -0.3); T.pinta(g, T.TINTA, 0);
    T.estrella(g, 320, 706, 44, 19, 5, -0.3); T.pinta(g, T.AMARILLO, 6);
  }

  // El público, en primera fila: va por delante de todo.
  function publico(g) {
    const pelos = ['#2B2536', '#5A3A22', '#8E1630', '#2B2536', '#C97B45', '#3A4460', '#5A3A22'];
    for (let i = 0; i < 7; i++) {
      const x = 14 + i * 102, y = 836 + (i % 2) * 10, r = 50;
      T.vol(g, c => T.circ(c, x, y, r), pelos[i], { sombra: T.TINTA, dx: -8, dy: -6, w: 6 });
      if (i % 3 === 1) { T.vol(g, c => T.circ(c, x + 26, y - 50, 20), pelos[i], { sombra: T.TINTA, dx: -4, dy: -4, w: 6 }); }
      if (i % 3 === 2) { for (const sg of [-1, 1]) { T.circ(g, x + sg * 22, y - 52, 15); T.pinta(g, '#F6A7D5', 5); } T.circ(g, x, y - 52, 9); T.pinta(g, T.ROJO, 5); }
    }
  }

  function lampara(g, color, fuerte, t) {
    if (fuerte) { g.save(); g.globalAlpha = 0.55; T.rayos(g, 320, 262, 186 + Math.sin(t * 0.5) * 12, 14, t * 0.02, color); g.restore(); }
    g.beginPath(); g.moveTo(320, -10); g.lineTo(320, 150); T.linea(g, 9);
    T.vol(g, c => T.rr(c, 284, 140, 72, 44, 10), '#6B7896', { sombra: '#3A4460', dx: -8, dy: 0, w: 6 });
    T.vol(g, c => T.circ(c, 320, 268, 98), color, { sombra: T.oscuro(color, 0.25), dx: -12, dy: -12, w: 8 });
    T.elip(g, 284, 228, 23, 13); T.pinta(g, '#FFFFFF', 0);
  }

  // El pulsador tiene cara: se aburre, se pone nervioso y pide que le des.
  function pulsador(g, hundido, expr, t) {
    T.elip(g, 320, 596, 156, 42); T.pinta(g, T.TINTA, 0);
    const y = hundido ? 560 : 508;
    const lado = c => { c.beginPath(); c.ellipse(320, y, 132, 40, 0, Math.PI, 0); c.lineTo(452, 580); c.ellipse(320, 580, 132, 40, 0, 0, Math.PI); c.closePath(); };
    T.vol(g, lado, T.ROJO, { sombra: T.oscuro(T.ROJO, 0.3), dx: -18, dy: 0, w: 7 });
    T.elip(g, 320, y, 132, 40); T.pinta(g, T.claro(T.ROJO, 0.14), 7);
    T.elip(g, 274, y - 11, 38, 9); T.pinta(g, '#FFFFFF', 0);
    if (!hundido) {
      g.save(); g.translate(320, y + 70); g.scale(0.8, 0.8);
      P.cara(g, expr, t, { ex: 30, ey: -10, by: 16, piel: T.ROJO });
      g.restore();
    }
  }

  function cartel(g, encendido, t) {
    g.save(); g.translate(540, 436); g.rotate(0.05);
    T.tubo(g, c => { c.beginPath(); c.moveTo(0, 30); c.lineTo(0, 270); }, '#6B7896', 10, 5);
    const cam = c => T.rr(c, -88, -38, 176, 76, 12);
    T.sombra(g, cam, 6, 8, 0.4);
    T.vol(g, cam, encendido ? T.AMARILLO : '#4A3B8F', { sombra: encendido ? '#E0A51A' : '#2F2468', dx: 0, dy: -10, w: 6 });
    for (let i = 0; i < 6; i++) { T.circ(g, -72 + i * 29, -38, 7); T.pinta(g, encendido && Math.floor(t / 4 + i) % 2 ? '#FFFFFF' : T.PAPEL, 4); }
    T.texto(g, 'APLAUSOS', 0, 4, 26, { color: encendido ? T.TINTA : '#8E82C9', w: 0 });
    g.restore();
  }

  function dibuja(g, e, vis) {
    const n = vis.n, t = vis.t;
    T.capa(g, vis, 'concurso', fondo);
    let color = C.apagada, fuerte = false, amago = false;
    for (const f of e.falsas) if (n >= f && n < f + AMAGO && (e.pulsado < 0 || e.pulsado >= f)) { color = C.ambar; fuerte = true; amago = true; }
    const verde = n >= e.enc && !e.antes;
    if (verde) { color = C.verde; fuerte = true; }
    if (e.antes) { color = T.ROJO; fuerte = true; }
    lampara(g, color, fuerte, t);
    if (verde) T.texto(g, '¡YA!', 320, 270, 80, { color: T.TINTA, w: 0 });
    const hecho = e.pulsado >= 0, bien = hecho && !e.antes && e.pts >= 350;
    cartel(g, bien && n - e.pulsado > 4, t);
    // el presentador, detrás de su atril
    P.busto(g, 88, 468, 1.06, P.AJUSTE, e.antes ? 'euforico' : bien ? 'contento' : hecho ? 'triste' : verde ? 'susto' : amago ? 'contento' : 'neutro', t,
      hecho || verde ? {} : { mira: { x: 0.8, y: -0.8 } });
    T.vol(g, c => T.poli(c, [[14, 716], [26, 582], [146, 582], [158, 716]]), '#7B4DFF', { sombra: '#5A35C9', dx: -10, dy: 0, w: 6 });
    T.circ(g, 86, 644, 20); T.pinta(g, T.PAPEL, 5);
    vis.ch.dibuja(g, 0);
    pulsador(g, hecho && n - e.pulsado < 10, e.antes ? 'enfadado' : bien ? 'euforico' : hecho ? 'triste' : verde ? 'susto' : amago ? 'tension' : 'neutro', t);
    T.capa(g, vis, 'concursoPublico', publico);
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'luz') { son && son.acierto(); }
      else if (x.t === 'amago') { son && son.golpe(); }
      else if (x.t === 'pulsa') {
        const bien = x.pts >= 700;
        T.estrellas(vis.ch, 320, 520, bien ? 10 : 5, T.AMARILLO, 10, bien ? 22 : 14, 1);
        vis.ch.mas({ tipo: 'anillo', x: 320, y: 540, r: 40, R: 210, w: 14, color: '#FFFFFF', vida: 16, capa: 1 });
        if (bien) T.confeti(vis.ch, 320, 420, 22, [T.AMARILLO, T.ROJO, T.MENTA, T.PAPEL], 11, 1);
        // solo cabe una palabra a la vez: el grito y el tiempo van juntos
        T.palabra(vis.ch, (bien ? '¡RAYO! ' : x.pts >= 350 ? '¡VALE! ' : '¡PACHORRA! ') + (x.r / 60).toFixed(2).replace('.', ',') + ' s', 320, 432, bien ? T.AMARILLO : T.PAPEL, 48, 1, true);
        vis.temblor = 7; vis.parada = 2;
        son && son.golpe();
      } else if (x.t === 'antes') {
        T.palabra(vis.ch, '¡ANTES DE TIEMPO!', 320, 432, T.ROJO, 46, 1, true);
        vis.temblor = 12;
        son && son.fallo();
      }
    }
  }

  ZZ.canales.concurso = {
    id: 'concurso', num: 4, nombre: 'CONCURSO', orden: '¡PULSA!',
    pista: 'Toca cuando la lámpara se ponga verde',
    rotulo: 'EN DIRECTO: «EL DEDO MÁS RÁPIDO»',
    color: '#19B5A5', color2: T.VIOLETA, color3: T.AMARILLO,
    animo: x => (x.t === 'pulsa' ? (x.pts >= 350 ? 1 : -1) : x.t === 'antes' ? -1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
//# sourceURL=zz/canales/concurso.js
</script>
<script>
/* ZikZak · canal 5 · Teletienda · ¡LLENA!
   Se mantiene el dedo para llenar un vaso y se suelta para parar justo en la raya.
   La precisión manda: si el vaso rebosa, la venta se va a cero. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const NIV = [null,
    { ancho: 196, vel: 0.011, base: 0.62, tol: 0.13, mueve: 0 },
    { ancho: 166, vel: 0.016, base: 0.60, tol: 0.095, mueve: 0 },
    { ancho: 136, vel: 0.021, base: 0.59, tol: 0.075, mueve: 1 }];
  const C = { fondo: '#FF8A3C', fondoS: '#C9572A', balda: '#7B4DFF', vaso: '#D9F3FF', vasoS: '#79B9D1', liquido: '#21C58E', raya: '#FF3B4E', etiqueta: '#FFC928' };

  function rayaEn(e, n) {
    const N = NIV[e.nivel];
    return ZZ.lim(e.base + (N.mueve ? Math.sin((n + (e.semilla % 61)) * 0.055) * 0.085 : 0), 0.43, 0.78);
  }

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    return {
      semilla, nivel, base: N.base + rng.entre(-0.025, 0.025), cantidad: 0, raya: 0,
      llenando: false, resuelto: false, derrame: false, pts: 0, espera: 0, hecho: false, ev: [],
    };
  }

  function resuelve(e) {
    if (e.resuelto) return;
    e.llenando = false; e.resuelto = true;
    if (e.derrame || e.cantidad >= 0.95) {
      e.derrame = true; e.pts = 0; e.ev.push({ t: 'derrame' }); return;
    }
    const N = NIV[e.nivel], err = e.raya - e.cantidad;
    e.pts = Math.max(0, Math.round((1 - (err < 0 ? -2 * err : err) / N.tol) * 1000));
    e.ev.push({ t: 'sirve', err, pts: e.pts });
  }

  function paso(e, entradas, n) {
    e.raya = rayaEn(e, n);
    for (const en of entradas) {
      if (en.t === 'd' && !e.resuelto && !e.llenando) {
        e.llenando = true; e.ev.push({ t: 'empieza' });
      } else if (en.t === 'u' && e.llenando) {
        resuelve(e);
      }
    }
    if (e.llenando) {
      e.cantidad += NIV[e.nivel].vel;
      if (e.cantidad >= 0.95) resuelve(e);
    }
    if (e.resuelto && ++e.espera > 34) e.hecho = true;
  }

  function puntuacion(e) { return e.resuelto ? ZZ.lim(e.pts, 0, 1000) : 0; }

  // La casa llena con un pequeño error, pero siempre usa la misma semilla.
  function casa(e, mem, rng, d, n) {
    if (mem.soltar === undefined) {
      mem.soltar = 0;
      let mejor = 1e9;
      for (let i = 8; i < 150; i++) {
        const q = i * NIV[e.nivel].vel, raya = rayaEn(e, i), err = raya >= q ? raya - q : 2 * (q - raya);
        if (err < mejor) { mejor = err; mem.soltar = i; }
      }
      mem.soltar = ZZ.lim(mem.soltar + Math.round(rng.campana() * ZZ.mix(8, 1, d)), 4, 145);
    }
    if (n === 0) return [{ t: 'd', x: 320, y: 520 }];
    return n === mem.soltar ? [{ t: 'u', x: 320, y: 520 }] : [];
  }

  function fondo(g) {
    g.fillStyle = C.fondo; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    T.rayos(g, 320, 470, 900, 14, 0.2, T.claro(C.fondo, 0.22));
    g.fillStyle = T.trama(g, C.fondoS, 16, 2.6); g.fillRect(0, 0, ZZ.PW, 250);
    // el expositor: un disco oscuro detrás del vaso, para que el cristal destaque
    T.circ(g, 327, 472, 198); T.pinta(g, T.TINTA, 0);
    T.vol(g, c => T.circ(c, 320, 462, 198), '#4A2A8E', { sombra: '#35206B', dx: -10, dy: -12, w: 7 });
    g.save(); T.circ(g, 320, 462, 192); g.clip(); g.fillStyle = T.trama(g, '#35206B', 14, 2.6); g.fillRect(120, 470, 400, 200); g.restore();

    T.estallido(g, 0, 0, 92, 11, 0.1, C.etiqueta, 6, 5);

    g.restore();
    // el teléfono de pedidos
    g.save(); g.translate(548, 300); g.rotate(0.14);
    T.sombra(g, c => T.rr(c, -52, -6, 104, 74, 14), 6, 8, 0.35);
    T.vol(g, c => T.rr(c, -52, -6, 104, 74, 14), T.MENTA, { dx: -8, dy: -6, w: 6 });
    T.circ(g, 0, 32, 20); T.pinta(g, T.PAPEL, 5);
    T.circ(g, 0, 32, 6); T.pinta(g, T.TINTA, 0);
    T.tubo(g, c => { c.beginPath(); c.moveTo(-58, -8); c.quadraticCurveTo(0, -52, 58, -8); }, T.MENTA, 26, 6);
    g.restore();
    // mostrador con mantel
    T.vol(g, c => T.rr(c, -20, 604, 680, 276, 0), C.balda, { sombra: T.oscuro(C.balda, 0.35), dx: 0, dy: 26, w: 7 });
    g.fillStyle = T.trama(g, T.oscuro(C.balda, 0.3), 14, 2.4); g.fillRect(0, 668, ZZ.PW, 172);
    // las cajas del producto
    for (const [x, y, w, h, col] of [[26, 664, 132, 96, T.MENTA], [44, 596, 96, 70, T.AMARILLO]]) {
      const cam = c => T.rr(c, x, y, w, h, 8);
      T.sombra(g, cam, 6, 8, 0.35);
      T.vol(g, cam, col, { dx: -8, dy: 0, w: 6 });
      g.fillStyle = T.ROJO; g.fillRect(x + w / 2 - 9, y + 3, 18, h - 6);
      g.beginPath(); g.moveTo(x + w / 2 - 9, y); g.lineTo(x + w / 2 - 9, y + h); g.moveTo(x + w / 2 + 9, y); g.lineTo(x + w / 2 + 9, y + h); T.linea(g, 4);
    }
    T.estrella(g, 92, 584, 24, 10, 5, -0.2); T.pinta(g, T.ROJO, 5);
    // el cartelito del 3×2
    g.save(); g.translate(540, 716); g.rotate(-0.06);
    const tarj = c => T.poli(c, [[-70, 50], [-56, -46], [56, -46], [70, 50]]);
    T.sombra(g, tarj, 6, 8, 0.35);
    T.vol(g, tarj, T.PAPEL, { sombra: '#D9CDB3', dx: -8, dy: 0, w: 6 });
    T.texto(g, '3×2', 0, 4, 52, { color: T.ROJO, w: 8 });
    g.restore();
    // el grifo
    T.vol(g, c => T.rr(c, 262, -30, 116, 170, 22), T.ROJO, { sombra: '#C92F47', dx: -14, dy: 0, w: 7 });
    g.fillStyle = T.PAPEL; g.fillRect(266, 104, 108, 14); g.beginPath(); g.moveTo(264, 104); g.lineTo(376, 104); g.moveTo(264, 118); g.lineTo(376, 118); T.linea(g, 4);
    T.vol(g, c => T.rr(c, 240, 128, 160, 34, 12), '#DCE6EE', { sombra: '#93A6B8', dx: 0, dy: -10, w: 7 });
    T.vol(g, c => T.poli(c, [[292, 160], [348, 160], [338, 226], [302, 226]]), '#DCE6EE', { sombra: '#93A6B8', dx: -8, dy: 0, w: 7 });
    T.circ(g, 320, 62, 28); T.pinta(g, T.PAPEL, 6);
    T.estrella(g, 320, 62, 19, 8, 5, -0.3); T.pinta(g, T.AMARILLO, 4);
  }

  function vaso(g, e, vis) {
    const N = NIV[e.nivel], x = 320, y = 290, h = 350, w = N.ancho, t = vis.t;
    const arriba = y + h * (1 - e.cantidad);
    const cam = c => { c.beginPath(); c.moveTo(x - w / 2, y); c.lineTo(x - w / 2, y + h - 18); c.quadraticCurveTo(x - w / 2, y + h, x - w / 2 + 18, y + h);
      c.lineTo(x + w / 2 - 18, y + h); c.quadraticCurveTo(x + w / 2, y + h, x + w / 2, y + h - 18); c.lineTo(x + w / 2, y); };
    T.elip(g, x + 14, y + h + 4, w * 0.62, 16); T.pinta(g, T.oscuro(C.balda, 0.45), 0);
    cam(g); g.fillStyle = C.vaso; g.fill();
    g.save(); cam(g); g.clip();
    // líquido con la superficie ondulada
    g.beginPath(); g.moveTo(x - w, y + h + 20);
    for (let i = 0; i <= 12; i++) { const px = x - w / 2 + i * w / 12; g.lineTo(px, arriba + (e.llenando ? Math.sin(t * 0.5 + i * 1.1) * 5 : 0)); }
    g.lineTo(x + w, y + h + 20); g.closePath(); g.fillStyle = C.liquido; g.fill();
    g.fillStyle = T.oscuro(C.liquido, 0.22); g.fillRect(x + w / 2 - 26, arriba, 26, h);
    g.fillStyle = T.claro(C.liquido, 0.5); g.fillRect(x - w / 2, arriba - 2, w, 9);
    for (let i = 0; i < 5; i++) {
      const by = y + h - ((t * (1.4 + i * 0.3) + i * 67) % h);
      if (by > arriba + 16) { T.circ(g, x - w / 2 + 28 + ((i * 53) % (w - 56)), by, 4 + (i % 3) * 2); g.fillStyle = T.claro(C.liquido, 0.6); g.fill(); }
    }
    g.globalAlpha = 0.6; g.fillStyle = '#FFFFFF'; T.rr(g, x - w / 2 + 16, y + 20, 14, h - 70, 7); g.fill();
    g.globalAlpha = 1; g.fillStyle = C.vasoS; g.fillRect(x - w / 2, y + h - 16, w, 16);
    g.restore();
    cam(g); T.linea(g, 8);
    T.rr(g, x - w / 2 - 8, y - 8, w + 16, 14, 7); T.pinta(g, '#FFFFFF', 5);
    // la cara del vaso: aguanta, se asusta si se llena de más y sonríe si queda justo
    const ry = y + h * (1 - e.raya), falta = e.raya - e.cantidad;
    g.save(); g.translate(x, y + h - 96); g.scale(0.74, 0.74);
    P.cara(g, e.derrame ? 'triste' : e.resuelto ? (e.pts >= 350 ? 'euforico' : 'triste') : e.llenando ? (falta < 0.12 ? 'susto' : 'tension') : 'neutro', t, { ex: 22, ey: -8, by: 22, piel: C.liquido });
    g.restore();
    if (e.llenando) {
      T.tubo(g, c => { c.beginPath(); c.moveTo(x, 226); c.lineTo(x, Math.max(236, arriba)); }, C.liquido, 20, 5);
      for (const sg of [-1, 1]) { T.circ(g, x + sg * (16 + (t * 3 % 14)), arriba - 6 - (t * 2 % 12), 5); T.pinta(g, C.liquido, 3); }
    }
    // la raya, por encima del chorro, con dos marcas amarillas a los lados
    g.beginPath(); g.moveTo(x - w / 2, ry); g.lineTo(x + w / 2, ry); T.linea(g, 15);
    g.setLineDash([16, 10]); g.beginPath(); g.moveTo(x - w / 2, ry); g.lineTo(x + w / 2, ry); T.linea(g, 8, C.raya); g.setLineDash([]);
    for (const sg of [-1, 1]) T.marca(g, x + sg * (w / 2 + 10 + Math.sin(t * 0.22) * 3), ry, sg * Math.PI / 2, 34);
    if (e.derrame) {
      for (const dx of [-1, 1]) {
        T.tubo(g, c => { c.beginPath(); c.moveTo(x + dx * (w / 2 - 6), y + 6); c.quadraticCurveTo(x + dx * (w / 2 + 34), y - 20, x + dx * (w / 2 + 30), y + 120); }, C.liquido, 14, 5);
      }
      T.vol(g, c => T.elip(c, x, y + h + 14, w * 0.9, 20), C.liquido, { dx: 0, dy: 6, w: 6 });
    }
  }

  function dibuja(g, e, vis) {
    T.capa(g, vis, 'teletienda', fondo);
    vis.ch.dibuja(g, 0);
    vaso(g, e, vis);
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'sirve') {
        const bien = x.pts >= 700;
        T.estrellas(vis.ch, 320, 300, bien ? 10 : 5, bien ? T.AMARILLO : T.PAPEL, 10, bien ? 22 : 14, 1);
        T.palabra(vis.ch, bien ? '¡A MEDIDA!' : x.err < 0 ? '¡TE PASASTE!' : x.pts ? '¡SERVIDO!' : '¡QUÉ POCO!', 320, 250, bien ? T.AMARILLO : T.PAPEL, 52, 1, true);
        son && (bien ? son.acierto() : son.golpe());
      } else if (x.t === 'derrame') {
        T.palabra(vis.ch, '¡SE DERRAMA!', 320, 250, T.ROJO, 52, 1, true);
        T.polvo(vis.ch, 320, 300, 10, C.liquido, 8, 20, 1); vis.temblor = 10;
        son && son.fallo();
      }
    }
  }

  ZZ.canales.teletienda = {
    id: 'teletienda', num: 5, nombre: 'TELETIENDA', orden: '¡LLENA!',
    pista: 'Mantén el dedo y suelta en la raya',
    rotulo: 'OFERTA RELÁMPAGO: EL VASO JUSTO',
    color: C.fondo, color2: T.MENTA, color3: T.AMARILLO,
    arrastra: true,
    animo: x => x.t === 'sirve' ? (x.pts >= 350 ? 1 : -1) : x.t === 'derrame' ? -1 : 0,
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();

</script>
<script>
/* ZikZak · canal 6 · Bricolaje · ¡CLAVA!
   La fuerza recorre el medidor. Toca al alinear el cursor con la marca dorada. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const NIV = [null,
    { vel: 0.02, zona: 0.2, clavos: 1 },
    { vel: 0.027, zona: 0.16, clavos: 1 },
    { vel: 0.031, zona: 0.15, clavos: 2 }];
  const C = { pared: '#FFC857', paredS: '#EDA838', panel: '#19B5A5', panelS: '#0E7F74', madera: '#C97B45', maderaS: '#8E4F2A', liston: '#F3CB95', listonS: '#DDA263', metal: '#DCE6EE', metalS: '#93A6B8', verde: '#59D69B', piel: '#FFD2A6', pielS: '#E0A070' };

  function fuerzaEn(e, n) {
    const q = (e.fase + n * NIV[e.nivel].vel) % 2;
    return q <= 1 ? q : 2 - q;
  }

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel], clavos = [];
    for (let i = 0; i < N.clavos; i++) clavos.push(ZZ.lim(rng.entre(0.46, 0.7) + (i ? rng.entre(-0.07, 0.07) : 0), 0.3, 0.78));
    return { semilla, nivel, fase: rng.entre(0, 2), clavos, activa: 0, fuerza: 0, golpes: 0, espera: 0, cool: 0, suma: 0, resuelto: false, hecho: false, ev: [] };
  }

  function golpe(e, n) {
    if (e.resuelto || e.espera > 0 || e.cool > 0 || e.activa >= e.clavos.length) return;
    const objetivo = e.clavos[e.activa], err = Math.abs(e.fuerza - objetivo), zona = NIV[e.nivel].zona;
    const pts = Math.max(0, Math.round((1 - err / zona) * 1000));
    e.suma += pts; e.golpes++; e.cool = 10;
    e.ev.push({ t: 'golpe', pts, err, bueno: pts >= 700, y: e.fuerza, fuerte: e.fuerza > objetivo });
    e.activa++;
    if (e.activa >= e.clavos.length) e.resuelto = true;
    else e.espera = 20;
  }

  function paso(e, entradas, n) {
    e.fuerza = fuerzaEn(e, n);
    if (e.cool > 0) e.cool--;
    if (e.espera > 0) e.espera--;
    for (const en of entradas) if (en.t === 'd') golpe(e, n);
    if (e.resuelto && ++e.espera > 32) e.hecho = true;
  }

  function puntuacion(e) { return ZZ.lim(Math.round(e.suma / e.clavos.length), 0, 1000); }

  function casa(e, mem, rng, d, n) {
    if (mem.golpes !== e.golpes) {
      mem.golpes = e.golpes; mem.paso = -1;
      if (!e.resuelto) {
        const desde = n + e.espera + 3, objetivo = e.clavos[e.activa];
        let mejor = 1e9;
        for (let i = desde; i < ZZ.PASOS - 5; i++) {
          const err = Math.abs(fuerzaEn(e, i) - objetivo);
          if (err < mejor) { mejor = err; mem.paso = i; }
        }
        mem.paso = ZZ.lim(mem.paso + Math.round(rng.campana() * ZZ.mix(18, 2, d)), desde, ZZ.PASOS - 2);
      }
    }
    return n === mem.paso ? [{ t: 'd', x: 320, y: 420 }] : [];
  }

  const MX = 74, MY0 = 236, MY1 = 546;      // el medidor: de abajo (flojo) a arriba (fuerte)
  const BANCO = 604, PT = BANCO - 34;       // el banco y la cara de arriba del listón
  const sitios = e => (e.clavos.length > 1 ? [262, 420] : [340]);

  function fondo(g) {
    g.fillStyle = C.pared; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.trama(g, C.paredS, 15, 3); g.fillRect(0, 0, ZZ.PW, 190);
    g.fillStyle = T.trama(g, C.paredS, 15, 2); g.fillRect(0, 190, ZZ.PW, 60);
    // panel de herramientas
    const panel = c => T.rr(c, 170, 70, 276, 236, 16);
    T.sombra(g, panel, 8, 10, 0.28);
    T.vol(g, panel, C.panel, { sombra: C.panelS, dx: 0, dy: 12, w: 7 });
    g.fillStyle = T.trama(g, C.panelS, 26, 3.4); g.fillRect(184, 96, 248, 196);
    // serrucho
    g.save(); g.translate(262, 150); g.rotate(-0.3); g.scale(0.86, 0.86);
    const dientes = [[-20, -22], [150, -10]];
    for (let i = 0; i <= 10; i++) { dientes.push([150 - i * 17, 18]); dientes.push([141 - i * 17, 6]); }
    T.sombra(g, c => T.poli(c, dientes), 5, 7, 0.3);
    T.vol(g, c => T.poli(c, dientes), C.metal, { sombra: C.metalS, dx: 0, dy: -6, w: 5 });
    T.vol(g, c => T.rr(c, -78, -34, 70, 64, 18), T.ROJO, { dx: -6, dy: 0, w: 6 });
    T.rr(g, -60, -14, 34, 24, 10); T.pinta(g, C.panel, 5);
    g.restore();
    // llave inglesa
    g.save(); g.translate(330, 222); g.rotate(1.2); g.scale(0.8, 0.8);
    T.sombra(g, c => T.rr(c, -12, -10, 24, 160, 10), 5, 7, 0.3);
    T.vol(g, c => T.rr(c, -12, -10, 24, 160, 10), C.metal, { sombra: C.metalS, dx: -6, dy: 0, w: 5 });
    T.vol(g, c => T.circ(c, 0, -22, 34), C.metal, { sombra: C.metalS, dx: -6, dy: 0, w: 5 });
    T.poli(g, [[-12, -62], [12, -62], [12, -22], [-12, -22]]); T.pinta(g, C.panel, 5);
    g.restore();
    // destornillador
    // el banco: frente con cajones y tablero
    T.vol(g, c => T.rr(c, -20, BANCO + 36, 680, 240, 0), C.madera, { sombra: C.maderaS, dx: 0, dy: 30, w: 7 });
    for (const x of [34, 346]) {
      T.vol(g, c => T.rr(c, x, BANCO + 92, 260, 124, 12), T.claro(C.madera, 0.14), { sombra: C.maderaS, dx: 0, dy: -12, w: 6 });
      T.vol(g, c => T.rr(c, x + 92, BANCO + 138, 76, 22, 11), C.metal, { sombra: C.metalS, dx: 0, dy: -6, w: 5 });
    }
    T.vol(g, c => T.rr(c, -20, BANCO, 680, 44, 8), '#E8A968', { sombra: C.madera, dx: 0, dy: -12, w: 7 });
    // un bote de pintura que gotea
    g.save(); g.translate(566, BANCO + 190);
    T.vol(g, c => T.rr(c, -46, -62, 92, 100, 10), C.metal, { sombra: C.metalS, dx: -10, dy: 0, w: 6 });
    T.vol(g, c => { c.beginPath(); c.moveTo(-46, -62); c.lineTo(46, -62); c.lineTo(46, -34); c.quadraticCurveTo(34, -6, 24, -34); c.quadraticCurveTo(10, 14, -4, -34); c.quadraticCurveTo(-22, -12, -30, -34); c.lineTo(-46, -34); c.closePath(); }, T.ROJO, { dx: -8, dy: 0, w: 5 });
    T.elip(g, 0, -62, 46, 11); T.pinta(g, T.ROJO, 6);
    g.restore();
    // virutas
    g.beginPath();
    for (const [x, y] of [[150, BANCO + 14], [470, BANCO + 20], [590, BANCO + 12]]) { g.moveTo(x, y); g.bezierCurveTo(x + 14, y - 14, x + 26, y + 8, x + 12, y + 8); }
    T.linea(g, 5, C.listonS);
  }

  function medidor(g, e, vis) {
    const h = MY1 - MY0, zona = NIV[e.nivel].zona;
    const objetivo = e.clavos[Math.min(e.activa, e.clavos.length - 1)];
    const ty = MY1 - objetivo * h, cy = MY1 - e.fuerza * h;
    const caja = c => T.rr(c, MX - 36, MY0 - 32, 72, h + 64, 32);
    T.sombra(g, caja, 7, 9, 0.28);
    T.vol(g, caja, T.PAPEL, { sombra: '#D9CDB3', dx: -8, dy: 0, w: 7 });
    T.rr(g, MX - 17, MY0, 34, h, 17); T.pinta(g, '#2B2536', 5);
    g.save(); T.rr(g, MX - 17, MY0, 34, h, 17); g.clip();
    g.fillStyle = T.AMARILLO; g.fillRect(MX - 17, ty - zona * h, 34, zona * h * 2);
    g.fillStyle = T.ROJO; g.fillRect(MX - 17, cy, 34, MY1 - cy);
    g.fillStyle = '#FFFFFF'; g.fillRect(MX - 17, cy, 34, 5);
    g.restore();
    g.beginPath(); g.moveTo(MX - 17, ty - zona * h); g.lineTo(MX + 17, ty - zona * h); g.moveTo(MX - 17, ty + zona * h); g.lineTo(MX + 17, ty + zona * h); T.linea(g, 4);
    T.rr(g, MX - 17, MY0, 34, h, 17); T.linea(g, 5);
    // la marca amarilla: hasta ahí tiene que llegar el rojo
    const bx = MX + 46 + Math.sin(vis.t * 0.22) * 4;
    T.marca(g, bx - 16, ty, Math.PI / 2, 32);
  }

  // Un clavo gordo y con cara: se asusta cuando el martillo sube mucho.
  function clavo(g, x, hundido, activo, miedo, t) {
    const top = hundido ? PT - 18 : PT - 100;
    if (!hundido) {
      T.vol(g, c => T.poli(c, [[x - 32, top + 14], [x + 32, top + 14], [x + 24, PT + 6], [x - 24, PT + 6]]), C.metal, { sombra: C.metalS, dx: -8, dy: 0, w: 6 });
      g.save(); g.translate(x, top + 60); g.scale(0.62, 0.62);
      P.cara(g, miedo ? 'susto' : 'neutro', t, { ex: 18, ey: -8, by: 20, piel: C.metal });
      g.restore();
    }
    T.vol(g, c => T.rr(c, x - 62, top - 10, 124, 28, 12), hundido ? C.verde : C.metal, { sombra: hundido ? T.oscuro(C.verde) : C.metalS, dx: 0, dy: -8, w: 6 });
    if (activo) {
      const by = top - 26 + Math.sin(t * 0.22) * 4;
      T.marca(g, x, by, 0, 34);
    }
  }

  function martillo(g, x, fuerza, golpe) {
    const px = x + 250, py = PT - 64, a = golpe ? 0.03 : 0.6 + fuerza * 0.6;
    g.save(); g.translate(px, py); g.rotate(a);
    T.vol(g, c => T.rr(c, -250, -13, 270, 26, 12), C.madera, { sombra: C.maderaS, dx: 0, dy: -8, w: 6 });
    T.vol(g, c => T.rr(c, -298, -54, 96, 100, 14), C.metal, { sombra: C.metalS, dx: -12, dy: 0, w: 7 });
    T.rr(g, -298, 32, 96, 14, 6); T.pinta(g, C.metalS, 5);
    g.restore();
    // la mano, con su tirita
    T.vol(g, c => T.rr(c, px + 14, py - 34, 140, 80, 20), T.AZUL, { dx: 0, dy: -12, w: 6 });
    T.vol(g, c => T.circ(c, px, py, 40), C.piel, { sombra: C.pielS, dx: -8, dy: -6, w: 6 });
    g.beginPath(); for (const d of [-15, 0, 15]) { g.moveTo(px - 30, py + d); g.lineTo(px - 8, py + d); } T.linea(g, 4, '#B9764A');
    g.save(); g.translate(px + 8, py - 20); g.rotate(-0.5);
    T.rr(g, -18, -8, 36, 16, 6); T.pinta(g, '#FFE9C7', 4);
    g.beginPath(); g.moveTo(-5, -8); g.lineTo(-5, 8); g.moveTo(5, -8); g.lineTo(5, 8); T.linea(g, 2.5, '#D9B58A');
    g.restore();
  }

  function dibuja(g, e, vis) {
    T.capa(g, vis, 'bricolaje', fondo);
    medidor(g, e, vis);
    const xs = sitios(e), golpeando = e.cool > 4;
    const liston = c => T.rr(c, 168, PT, 404, 46, 8);
    T.sombra(g, liston, 6, 8, 0.3);
    T.vol(g, liston, C.liston, { sombra: C.listonS, dx: 0, dy: -12, w: 6 });
    g.beginPath(); g.moveTo(196, PT + 14); g.quadraticCurveTo(260, PT + 22, 330, PT + 14); g.moveTo(400, PT + 26); g.quadraticCurveTo(470, PT + 18, 540, PT + 26); T.linea(g, 3.5, C.listonS);
    for (let i = 0; i < e.clavos.length; i++) clavo(g, xs[i], i < e.activa, i === e.activa && !e.resuelto && !golpeando, e.fuerza > 0.6, vis.t + i * 40);

    martillo(g, xs[ix], e.resuelto && !golpeando ? 0.3 : e.fuerza, golpeando);
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) if (x.t === 'golpe') {
      const cx = sitios(e)[Math.max(0, e.activa - 1)];
      vis.temblor = x.bueno ? 10 : 6;
      T.rayitas(vis.ch, cx, PT - 24, 7, T.PAPEL, 30, 46, 1);
      T.estrellas(vis.ch, cx, PT - 30, x.bueno ? 9 : 4, x.bueno ? T.AMARILLO : T.PAPEL, 10, x.bueno ? 22 : 14, 1);
      T.palabra(vis.ch, x.bueno ? '¡CLAVADO!' : x.pts ? '¡CASI!' : x.fuerte ? '¡QUÉ BESTIA!' : '¡FLOJO!', 350, 384, x.bueno ? T.AMARILLO : T.PAPEL, 52, 1, true);
      son && (x.bueno ? son.clavado() : son.golpe());
    }
  }

  ZZ.canales.bricolaje = {
    id: 'bricolaje', num: 6, nombre: 'BRICOLAJE', orden: '¡CLAVA!',
    pista: 'Toca cuando el rojo llegue a la marca amarilla',
    rotulo: 'TALLER EN DIRECTO: «GOLPE SECO»',
    color: C.madera, color2: C.panel, color3: T.AMARILLO,
    animo: x => x.t === 'golpe' ? (x.pts >= 350 ? 1 : -1) : 0,
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();

<script>
/* ZikZak · canal 7 · Documental · ¡ATRAPA!
   Una mosca cruza la escena. Toca cuando esté delante de la rana; la avispa no se toca. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta;

  const NIV = [null,
    { vel: 4.6, inicio: 50, onda: 0, tol: 105, avispa: false },
    { vel: 6.2, inicio: 44, onda: 34, tol: 88, avispa: false },
    { vel: 7.6, inicio: 40, onda: 58, tol: 76, avispa: true }];
  const C = { fondo: '#2A7F62', fondoS: '#18503F', hoja: '#43B97B', rana: '#5FD06C', ranaS: '#2D914A', ala: '#F5E6C8', avispa: '#FFC928' };

  function objeto(e, tipo, n) {
    const N = NIV[e.nivel], o = tipo === 'mosca' ? e.mosca : e.avispa;
    if (!o || n < o.inicio) return null;
    const t = n - o.inicio, onda = tipo === 'mosca' ? N.onda : N.onda * 0.45;
    return { x: -70 + t * o.vel, y: o.y + Math.sin(t * (tipo === 'mosca' ? 0.075 : 0.11)) * onda, t };
  }

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    return {
      semilla, nivel,
      mosca: { inicio: N.inicio, vel: N.vel, y: rng.entre(300, 410) },
      avispa: N.avispa ? { inicio: N.inicio + 90, vel: N.vel + 1.1, y: 270 } : null,
      moscaPos: null, avispaPos: null, atrapada: false, fallo: false, pts: 0, espera: 0, hecho: false, ev: [],
    };
  }

  function paso(e, entradas, n) {
    e.moscaPos = objeto(e, 'mosca', n);
    e.avispaPos = objeto(e, 'avispa', n);
    if (!e.atrapada && !e.fallo) {
      for (const en of entradas) {
        if (en.t !== 'd') continue;
        const a = e.avispaPos && e.avispaPos.x > -20 && e.avispaPos.x < 660 ? e.avispaPos : null;
        const m = e.moscaPos && e.moscaPos.x > -20 && e.moscaPos.x < 660 ? e.moscaPos : null;
        if (a && Math.abs(a.x - 320) < 120) {
          e.fallo = true; e.pts = 0; e.ev.push({ t: 'avispa', x: a.x, y: a.y }); break;
        }
        if (m && Math.abs(m.x - 320) < NIV[e.nivel].tol) {
          const err = Math.abs(m.x - 320);
          e.pts = ZZ.lim(Math.round((1 - err / NIV[e.nivel].tol) * 1000), 0, 1000);
          e.atrapada = true; e.ev.push({ t: 'atrapa', x: m.x, y: m.y, pts: e.pts }); break;
        }
        e.ev.push({ t: 'aire' });
      }
    }
    if (!e.atrapada && !e.fallo && e.moscaPos && e.moscaPos.x > 700) { e.fallo = true; e.ev.push({ t: 'pasa' }); }
    if ((e.atrapada || e.fallo) && ++e.espera > 34) e.hecho = true;
  }

  function puntuacion(e) { return e.atrapada ? ZZ.lim(e.pts, 0, 1000) : 0; }

  function casa(e, mem, rng, d, n) {
    if (mem.paso === undefined) {
      let mejor = 1e9, objetivo = e.mosca.inicio;
      for (let i = e.mosca.inicio; i < ZZ.PASOS - 5; i++) {
        const p = objeto(e, 'mosca', i), err = Math.abs(p.x - 320);
        if (err < mejor) { mejor = err; objetivo = i; }
      }
      mem.paso = ZZ.lim(objetivo + Math.round(rng.campana() * ZZ.mix(30, 4, d)), e.mosca.inicio, ZZ.PASOS - 2);
    }
    return n === mem.paso ? [{ t: 'd', x: 320, y: 500 }] : [];
  }

  function hoja(g, x, y, r, rot, color) {
    g.save(); g.translate(x, y); g.rotate(rot);
    T.vol(g, c => { c.beginPath(); c.moveTo(-r, 0); c.quadraticCurveTo(0, -r * 0.62, r, 0); c.quadraticCurveTo(0, r * 0.62, -r, 0); c.closePath(); }, color, { sombra: T.oscuro(color, 0.3), dx: 0, dy: -8, w: 6 });
    g.beginPath(); g.moveTo(-r * 0.8, 0); g.lineTo(r * 0.8, 0); T.linea(g, 4, T.oscuro(color, 0.4));
    g.restore();
  }
  function fondo(g) {
    // atardecer en la charca: sobre el naranja, la rana verde se ve de lejos
    const fr = ['#FF7A59', '#FF9B5E', '#FFBE6B', '#FFDD8F'];
    fr.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, i * 165, ZZ.PW, 175); if (i) { g.fillStyle = T.trama(g, fr[i - 1], 11, 3); g.fillRect(0, i * 165, ZZ.PW, 30); } });
    // el sol, grande y pálido, poniéndose detrás de la rana
    T.vol(g, c => T.circ(c, 320, 610, 190), '#FFF2B8', { sombra: '#FFE28A', dx: -12, dy: -14, w: 7 });
    g.save(); T.circ(g, 320, 610, 186); g.clip(); g.fillStyle = T.trama(g, '#FFD98A', 13, 3); g.fillRect(120, 540, 400, 130); g.restore();
    // la selva del fondo, en silueta
    T.vol(g, c => { c.beginPath(); c.moveTo(-10, 690); c.lineTo(-10, 560); c.quadraticCurveTo(40, 500, 90, 548); c.quadraticCurveTo(120, 500, 160, 560); c.lineTo(160, 690); c.closePath(); }, '#1D7A62', { sombra: '#145848', dx: 0, dy: -10, w: 6 });
    T.vol(g, c => { c.beginPath(); c.moveTo(650, 690); c.lineTo(650, 540); c.quadraticCurveTo(600, 486, 556, 540); c.quadraticCurveTo(520, 506, 486, 570); c.lineTo(486, 690); c.closePath(); }, '#1D7A62', { sombra: '#145848', dx: 0, dy: -10, w: 6 });
    g.fillStyle = T.trama(g, '#145848', 12, 2.6); g.fillRect(0, 610, 160, 60); g.fillRect(486, 610, 160, 60);
    // juncos
    for (const [x, h, sg] of [[40, 330, 1], [88, 250, -1], [566, 300, 1], [608, 220, -1]]) {
      T.tubo(g, c => { c.beginPath(); c.moveTo(x, 700); c.quadraticCurveTo(x + sg * 18, 700 - h / 2, x + sg * 6, 700 - h); }, C.fondoS, 9, 4);
      g.save(); g.translate(x + sg * 6, 700 - h); g.rotate(sg * 0.06);
      T.vol(g, c => T.rr(c, -13, -64, 26, 70, 13), '#8A5A32', { sombra: '#5E3A1C', dx: -6, dy: 0, w: 5 });
      g.restore();
    }
    // el agua
    T.vol(g, c => T.rr(c, -20, 660, 680, 220, 0), '#2D9CB8', { sombra: '#1B6F8C', dx: 0, dy: 40, w: 7 });
    g.fillStyle = T.trama(g, '#1B6F8C', 13, 2.6); g.fillRect(0, 780, ZZ.PW, 60);
    g.beginPath();
    for (const [x, y, l] of [[36, 716, 90], [486, 722, 120], [150, 806, 110], [420, 812, 150]]) { g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 9, x + l, y); }
    T.linea(g, 5, '#8FE0EC');
    hoja(g, 56, 120, 110, 0.5, C.hoja); hoja(g, 196, 66, 90, 0.15, '#2E9C66'); hoja(g, 604, 396, 80, -0.9, C.hoja);
    // el nenúfar y otro con su flor
    T.vol(g, c => T.elip(c, 320, 746, 214, 54), C.hoja, { sombra: C.ranaS, dx: 0, dy: 12, w: 7 });
    T.poli(g, [[320, 746], [504, 702], [544, 746]]); T.pinta(g, '#2D9CB8', 0);
    T.vol(g, c => T.elip(c, 88, 800, 70, 22), C.hoja, { sombra: C.ranaS, dx: 0, dy: 7, w: 6 });
    for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * 0.5; T.elip(g, 88 + Math.cos(a) * 20, 786 + Math.sin(a) * 16, 15, 9, a); T.pinta(g, '#F6A7D5', 5); }
    T.circ(g, 88, 790, 8); T.pinta(g, T.AMARILLO, 4);
    // visor de cámara
    g.globalAlpha = 0.85;
    for (const [x, y, sx, sy] of [[34, 190, 1, 1], [606, 190, -1, 1], [34, 636, 1, -1], [606, 636, -1, -1]]) {
      g.beginPath(); g.moveTo(x, y + sy * 44); g.lineTo(x, y); g.lineTo(x + sx * 44, y); T.linea(g, 6, T.PAPEL);
    }
    g.globalAlpha = 1;
  }

  function rana(g, e, vis) {
    const abre = vis.lengua > vis.t, m = e.moscaPos, t = vis.t;
    const resp = Math.sin(t * 0.12) * 4;
    const cerca = m && !e.atrapada && Math.abs(m.x - 320) < 230;      // se le hace la boca agua
    for (const sg of [-1, 1]) {
      T.vol(g, c => T.elip(c, 320 + sg * 116, 716, 56, 31, sg * 0.3), C.rana, { sombra: C.ranaS, dx: 0, dy: -8, w: 7 });
      T.vol(g, c => T.elip(c, 320 + sg * 62, 740, 31, 16), C.rana, { sombra: C.ranaS, dx: 0, dy: -5, w: 6 });
    }
    T.vol(g, c => T.rr(c, 210, 582 - resp, 220, 160 + resp, 76), C.rana, { sombra: C.ranaS, dx: -12, dy: -12, w: 8 });
    T.elip(g, 320, 708, 70, 30); T.pinta(g, '#C9F2A6', 0);
    const mira = m && !e.atrapada ? ZZ.lim((m.x - 320) / 320, -1, 1) : 0;
    for (const x of [258, 382]) {
      T.vol(g, c => T.circ(c, x, 576 - resp, 44), C.rana, { sombra: C.ranaS, dx: -7, dy: -8, w: 7 });
      T.circ(g, x, 572 - resp, 27); T.pinta(g, '#FFFFFF', 5);
      T.circ(g, x + mira * 11, 564 - resp, cerca ? 14 : 12); T.pinta(g, T.TINTA, 0);
      T.circ(g, x + mira * 11 - 4, 560 - resp, 4); T.pinta(g, '#FFFFFF', 0);
    }
    for (const x of [244, 396]) { T.circ(g, x, 658, 14); T.pinta(g, '#FF9FA8', 0); }
    if (abre) {
      const p = vis.lenguaP || { x: 320, y: 340 };
      T.elip(g, 320, 656, 52, 32); T.pinta(g, '#7A1F33', 6);
      T.tubo(g, c => { c.beginPath(); c.moveTo(320, 656); c.lineTo(p.x, p.y); }, '#FF6B81', 18, 5);
      T.circ(g, p.x, p.y, 20); T.pinta(g, '#FF6B81', 5);
    } else if (cerca) {
      // boca entreabierta y la punta de la lengua fuera
      g.beginPath(); g.moveTo(262, 644); g.quadraticCurveTo(320, 690, 378, 644); g.closePath(); T.pinta(g, '#7A1F33', 6);
      T.vol(g, c => T.elip(c, 340, 676, 16, 13), '#FF6B81', { dx: -3, dy: -3, w: 5 });
    } else {
      g.beginPath(); g.moveTo(264, 646); g.quadraticCurveTo(320, 682, 376, 646); T.linea(g, 6);
    }
  }

  function mosca(g, p, t) {
    g.save(); g.translate(p.x, p.y); g.scale(1.5, 1.5); g.rotate(Math.sin(t * 0.12) * 0.18);
    const al = Math.sin(t * 1.4) * 0.35;
    for (const sg of [-1, 1]) { T.elip(g, sg * 20, -18, 28, 13, sg * (0.5 + al)); T.pinta(g, C.ala, 4); }
    T.vol(g, c => T.elip(c, 0, 0, 24, 18), '#3A3550', { sombra: T.TINTA, dx: -4, dy: -5, w: 5 });
    for (const sg of [-1, 1]) { T.circ(g, sg * 9, -6, 8); T.pinta(g, T.ROJO, 3); }
    g.restore();
  }

  function avispa(g, p, t) {
    g.save(); g.translate(p.x, p.y); g.scale(1.4, 1.4); g.rotate(Math.sin(t * 0.13) * 0.12);
    const al = Math.sin(t * 1.5) * 0.3;
    for (const sg of [-1, 1]) { T.elip(g, sg * 16, -22, 26, 11, sg * (0.5 + al)); T.pinta(g, C.ala, 4); }
    T.poli(g, [[-34, -4], [-58, 4], [-34, 10]]); T.pinta(g, T.TINTA, 0);
    T.vol(g, c => T.elip(c, 0, 0, 34, 20), C.avispa, { sombra: '#C88D13', dx: -5, dy: -5, w: 5 });
    g.save(); T.elip(g, 0, 0, 34, 20); g.clip(); g.fillStyle = T.TINTA; for (const x of [-18, -2, 14]) g.fillRect(x, -24, 8, 48); g.restore();
    T.circ(g, 26, -6, 6); T.pinta(g, T.ROJO, 3);
    g.beginPath(); g.moveTo(18, -16); g.lineTo(34, -12); T.linea(g, 4);
    g.restore();
  }

  function dibuja(g, e, vis) {
    T.capa(g, vis, 'documental', fondo);
    const m = e.moscaPos, a = e.avispaPos;
    // la marca amarilla: por aquí sale la lengua
    if (!e.atrapada && !e.fallo) {
      const by = 232 + Math.sin(vis.t * 0.22) * 4;
      g.setLineDash([2, 22]); g.beginPath(); g.moveTo(320, 290); g.lineTo(320, 520); T.linea(g, 13); g.beginPath(); g.moveTo(320, 290); g.lineTo(320, 520); T.linea(g, 6, T.PAPEL); g.setLineDash([]);
      T.marca(g, 320, by + 30, 0, 34);
    }
    vis.ch.dibuja(g, 0);
    rana(g, e, vis);
    if (m && m.x > -90 && m.x < 730 && !e.atrapada) mosca(g, m, vis.t);
    if (a && a.x > -90 && a.x < 730 && !e.fallo) avispa(g, a, vis.t);
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'atrapa') {
        vis.lengua = vis.t + 12; vis.lenguaP = { x: x.x, y: x.y }; vis.parada = 2;
        T.estrellas(vis.ch, x.x, x.y, x.pts >= 700 ? 10 : 5, T.AMARILLO, 11, 22, 1);
        T.palabra(vis.ch, x.pts >= 700 ? '¡DELICIOSO!' : '¡A LA LENGUA!', 320, 150, T.AMARILLO, 52, 1, true);
        son && (x.pts >= 700 ? son.acierto() : son.golpe());
      } else if (x.t === 'aire') {
        vis.lengua = vis.t + 7; vis.lenguaP = { x: 320, y: 340 }; son && son.golpe();
      } else if (x.t === 'avispa') {
        vis.lengua = vis.t + 12; vis.lenguaP = { x: x.x, y: x.y };
        T.palabra(vis.ch, '¡ESA NO!', 320, 150, T.ROJO, 56, 1, true); vis.temblor = 12; son && son.fallo();
      } else if (x.t === 'pasa') {
        T.palabra(vis.ch, '¡SE ESCAPA!', 320, 150, T.PAPEL, 52, 1, true); son && son.fallo();
      }

  }

  ZZ.canales.documental = {
    id: 'documental', num: 7, nombre: 'DOCUMENTAL', orden: '¡ATRAPA!',
    pista: 'Toca cuando la mosca pase frente a la rana',
    rotulo: 'NATURALEZA EN DIRECTO: «LA LENGUA»',
    color: C.fondo, color2: T.MENTA, color3: T.AMARILLO,
    animo: x => x.t === 'atrapa' ? (x.pts >= 350 ? 1 : -1) : (x.t === 'avispa' || x.t === 'pasa') ? -1 : 0,
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();

<script>
/* ZikZak · canal 8 · Musical · ¡AL RITMO!
   Dura diez segundos. Las notas corren por el carril hacia el aro: se toca cuando cada una lo cruza.
   Las notas tachadas no se tocan. Mide el oído: cuenta lo poco que te desvías en cada golpe. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const NIV = [null,
    { n: 8, ini: 96, pasos: [60], tol: 14, pausas: 0 },
    { n: 10, ini: 84, pasos: [48], tol: 12, pausas: 2 },
    { n: 12, ini: 60, pasos: [42, 42, 28, 56], tol: 10, pausas: 2 }];
  const C = { pared: '#21C58E', paredS: '#149A6C', suelo: '#7B4DFF', sueloS: '#5A35C9', papel: '#FFF7E3', radio: '#FF3B4E', radioS: '#C92F47', nota: '#2D6BFF', mala: '#FF3B4E' };
  const X0 = 150, PY = 228, V = 3.4;      // el aro, la altura del carril y lo que corre una nota por paso

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const giro = rng.entero(0, N.pasos.length - 1), pausas = [];
    while (pausas.length < N.pausas) {
      const i = rng.entero(2, N.n - 1);
      if (pausas.every(p => Math.abs(p - i) > 1)) pausas.push(i);
    }
    const beats = [];
    let n = N.ini;
    for (let i = 0; i < N.n; i++) {
      beats.push({ n, pausa: pausas.indexOf(i) >= 0, estado: 'pendiente', pts: 0 });
      n += N.pasos[(i + giro) % N.pasos.length];
    }
    return { semilla, nivel, beats, tol: N.tol, sig: 0, suma: 0, errores: 0, aciertosMax: beats.filter(b => !b.pausa).length, espera: 0, hecho: false, ev: [] };
  }

  function paso(e, entradas, n) {
    for (const b of e.beats) if (b.n === n) e.ev.push({ t: 'aviso', pausa: b.pausa });
    for (const en of entradas) {
      if (en.t !== 'd') continue;
      let mejor = null, distancia = 1e9;
      for (const b of e.beats) {
        const d = Math.abs(n - b.n);
        if (b.estado === 'pendiente' && d <= e.tol * 2 && d < distancia) { mejor = b; distancia = d; }
      }
      if (!mejor) { e.ev.push({ t: 'aire' }); continue; }
      if (mejor.pausa) {
        mejor.estado = 'error'; e.errores++; e.ev.push({ t: 'error' });
      } else {
        mejor.estado = 'acierto';
        mejor.pts = Math.max(0, Math.round((1 - distancia / (e.tol * 2)) * 1000));
        e.suma += mejor.pts; e.ev.push({ t: 'golpe', pts: mejor.pts, bueno: mejor.pts >= 700 });
      }
    }
    for (const b of e.beats) if (b.estado === 'pendiente' && n > b.n + e.tol * 2) {
      b.estado = b.pausa ? 'pausa' : 'perdido';
      if (!b.pausa) e.ev.push({ t: 'pierde' });
    }
    while (e.sig < e.beats.length && e.beats[e.sig].estado !== 'pendiente') e.sig++;
    if (e.sig >= e.beats.length && ++e.espera > 32) e.hecho = true;
  }

  // Tocar una nota tachada cuesta casi lo que vale un golpe perfecto.
  function puntuacion(e) {
    return ZZ.lim(Math.round((e.suma - e.errores * 800) / e.aciertosMax), 0, 1000);
  }

  // Jugador de la casa: se desvía más o menos, y si es flojo se salta notas y pica en las tachadas.
  function casa(e, mem, rng, d, n) {
    if (!mem.plan) mem.plan = e.beats.map(b => {
      const j = Math.round(rng.campana() * ZZ.mix(14, 1.5, d)), az = rng();
      if (b.pausa) return az < ZZ.mix(0.3, 0, Math.min(1, d * 1.3)) ? b.n + j : null;
      return az < ZZ.mix(0.18, 0, d) ? null : b.n + j;
    });
    for (let i = 0; i < e.beats.length; i++) {
      if (mem.plan[i] === n && e.beats[i].estado === 'pendiente') return [{ t: 'd', x: 320, y: 650 }];
    }
    return [];
  }

  function fondo(g) {
    g.fillStyle = C.pared; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    T.rayos(g, 320, 566, 900, 16, 0.1, T.claro(C.pared, 0.2));
    g.fillStyle = T.trama(g, C.paredS, 14, 2.8); g.fillRect(0, 306, ZZ.PW, 110);
    // discos colgados en la pared
    for (const [x, y, r, col] of [[66, 452, 52, T.AMARILLO], [580, 432, 60, '#F6A7D5']]) {
      T.circ(g, x + 6, y + 8, r); T.pinta(g, T.TINTA, 0);
      T.vol(g, c => T.circ(c, x, y, r), '#2B2536', { sombra: T.TINTA, dx: -6, dy: -6, w: 6 });
      T.circ(g, x, y, r * 0.68); T.linea(g, 3, '#6A6480');
      T.circ(g, x, y, r * 0.38); T.pinta(g, col, 5);
      T.circ(g, x, y, 5); T.pinta(g, T.TINTA, 0);
    }
    // suelo
    T.vol(g, c => T.rr(c, -20, 690, 680, 190, 0), C.suelo, { sombra: C.sueloS, dx: 0, dy: 34, w: 7 });
    g.fillStyle = T.trama(g, C.sueloS, 14, 2.6); g.fillRect(0, 730, ZZ.PW, 110);
    // casetes por el suelo
    for (const [x, y, rot, col] of [[96, 784, -0.2, T.AMARILLO], [552, 792, 0.16, T.MENTA]]) {
      g.save(); g.translate(x, y); g.rotate(rot);
      const cam = c => T.rr(c, -62, -38, 124, 76, 10);
      T.sombra(g, cam, 6, 8, 0.4);
      T.vol(g, cam, col, { dx: -7, dy: -7, w: 6 });
      T.rr(g, -44, -26, 88, 34, 8); T.pinta(g, T.PAPEL, 5);
      for (const dx of [-20, 20]) { T.circ(g, dx, -9, 10); T.pinta(g, '#2B2536', 4); T.circ(g, dx, -9, 3); T.pinta(g, T.PAPEL, 0); }
      T.poli(g, [[-30, 38], [-22, 20], [22, 20], [30, 38]]); T.pinta(g, T.oscuro(col, 0.25), 5);
      g.restore();
    }
    // la partitura: una tira de papel con su pentagrama
    const tira = c => T.rr(c, -20, 150, 680, 156, 0);
    T.sombra(g, tira, 0, 10, 0.3);
    T.vol(g, tira, C.papel, { sombra: '#EAD9B0', dx: 0, dy: -12, w: 7 });
    for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(0, PY + i * 17); g.lineTo(ZZ.PW, PY + i * 17); T.linea(g, 3.5, '#2B2536'); }
  }

  // Una nota de verdad: cabeza, plica y corchete.
  function nota(g, x, ida) {
    g.save(); g.translate(x, PY + 9);
    g.beginPath(); g.moveTo(20, -4); g.lineTo(20, -70); T.linea(g, 8);
    g.beginPath(); g.moveTo(20, -70); g.quadraticCurveTo(48, -60, 42, -32); T.linea(g, 8);
    T.vol(g, c => T.elip(c, 0, 0, 24, 18, -0.35), ida ? '#B9B4C9' : C.nota, { sombra: ida ? '#8E889F' : '#1F4FD0', dx: -5, dy: -5, w: 6 });
    if (!ida) { T.elip(g, -8, -6, 7, 4, -0.5); T.pinta(g, '#FFFFFF', 0); }
    g.restore();
  }
  // La nota que no se toca: desafinada, con pinchos y con mal genio.
  function notaMala(g, x, t, tocada) {
    g.save(); g.translate(x, PY);
    T.estallido(g, 4, 5, 48, 9, 0.2, T.TINTA, 0, 3);
    T.estallido(g, 0, 0, 48, 9, 0.2, tocada ? '#8E1630' : C.mala, 5, 3);
    g.scale(0.58, 0.58);
    P.cara(g, 'enfadado', t, { ex: 18, ey: -6, by: 20, piel: tocada ? '#8E1630' : C.mala });
    g.restore();
  }

  function pista(g, e, vis) {
    let cerca = false;
    for (const b of e.beats) {
      const x = X0 + (b.n - vis.n) * V;
      if (b.estado === 'acierto' || x < -50 || x > 690) continue;
      if (b.estado === 'pendiente' && !b.pausa && Math.abs(vis.n - b.n) <= e.tol) cerca = true;
      if (b.pausa) notaMala(g, x, vis.t, b.estado === 'error');
      else nota(g, x, b.estado === 'perdido');
    }
    // el aro donde se toca, con sus marcas amarillas
    const flash = vis.golpe !== undefined && vis.t - vis.golpe < 8;
    const r = 42 + (flash ? 8 : cerca ? 4 : 0);
    T.circ(g, X0, PY, r); T.linea(g, 18);
    T.circ(g, X0, PY, r); T.linea(g, 9, flash ? '#FFFFFF' : T.AMARILLO);
    for (const sg of [-1, 1]) {
      T.marca(g, X0, PY + sg * (r + 12 + Math.sin(vis.t * 0.22) * 3), sg > 0 ? Math.PI : 0, 24);
    }
  }

  // El radiocasete tiene cara: los altavoces son los ojos y baila con cada golpe.
  function radio(g, e, vis) {
    const t = vis.t, n = vis.n;
    let pulso = 0;
    for (const b of e.beats) if (!b.pausa) pulso = Math.max(pulso, ZZ.lim(1 - Math.abs(n - b.n) / 16, 0, 1));
    const mal = vis.fallo !== undefined && t - vis.fallo < 30, bien = vis.golpe !== undefined && t - vis.golpe < 12;
    g.save(); g.globalAlpha = 0.3; T.elip(g, 328, 702, 238, 22); g.fillStyle = T.TINTA; g.fill(); g.restore();
    g.save(); g.translate(320, 694); g.scale(1 + pulso * 0.035, 1 - pulso * 0.05); g.rotate(Math.sin(t * 0.1) * 0.012);
    // antena y asa
    const ay = -350 - pulso * 10;
    g.beginPath(); g.moveTo(150, -246); g.lineTo(200, ay); T.linea(g, 13);
    g.beginPath(); g.moveTo(150, -246); g.lineTo(200, ay); T.linea(g, 5, '#DCE6EE');
    T.circ(g, 200, ay, 11); T.pinta(g, T.AMARILLO, 5);
    T.tubo(g, c => { c.beginPath(); c.moveTo(-124, -244); c.lineTo(-124, -292); c.lineTo(124, -292); c.lineTo(124, -244); }, '#2B2536', 14, 5);
    // cuerpo
    T.vol(g, c => T.rr(c, -214, -250, 428, 250, 36), C.radio, { sombra: C.radioS, dx: -12, dy: -14, w: 8 });
    // la pantallita del ecualizador
    T.rr(g, -56, -238, 112, 40, 9); T.pinta(g, '#2B2536', 5);
    for (let i = 0; i < 7; i++) {
      const h = 6 + ((i * 7 + Math.floor(t / 3)) % 14) + pulso * 8;
      g.fillStyle = i % 2 ? T.AMARILLO : T.MENTA; g.fillRect(-45 + i * 14, -204 - h, 8, h);
    }
    // ojos
    for (const sg of [-1, 1]) {
      const ex = sg * 120, ey = -126, R = 72 + pulso * 5;
      T.vol(g, c => T.circ(c, ex, ey, R), '#2B2536', { sombra: T.TINTA, dx: -6, dy: -6, w: 7 });
      T.circ(g, ex, ey, R - 17); T.pinta(g, '#FFFFFF', 5);
      const px = ex + (bien ? 0 : -14), py = ey + (bien ? 2 : -14);
      T.circ(g, px, py, 25); T.pinta(g, T.TINTA, 0);
      T.circ(g, px - 9, py - 9, 8); T.pinta(g, '#FFFFFF', 0);
      if (mal) {
        g.save(); T.circ(g, ex, ey, R - 17); g.clip(); g.fillStyle = C.radioS; g.fillRect(ex - R, ey - R, R * 2, R * 0.82); g.restore();
        g.beginPath(); g.moveTo(ex - R + 22, ey - R * 0.18); g.lineTo(ex + R - 22, ey - R * 0.18); T.linea(g, 6);
      }
    }
    // boca
    if (mal) { g.beginPath(); g.moveTo(-34, -20); g.quadraticCurveTo(0, -46, 34, -20); T.linea(g, 8); }
    else if (pulso > 0.25 || bien) {
      const bw = 32 + pulso * 8, bh = 12 + pulso * 14;
      T.elip(g, 0, -32, bw, bh); T.pinta(g, '#3B1522', 7);
      g.save(); T.elip(g, 0, -32, bw - 3, bh - 3); g.clip(); T.elip(g, 0, -16, 22, 12); g.fillStyle = '#FF7A8A'; g.fill(); g.restore();
    } else { g.beginPath(); g.moveTo(-36, -44); g.quadraticCurveTo(0, -14, 36, -44); T.linea(g, 8); }
    for (const [x, col] of [[-178, T.AMARILLO], [178, T.MENTA]]) { T.circ(g, x, -26, 12); T.pinta(g, col, 5); }
    g.restore();
  }

  function dibuja(g, e, vis) {
    T.capa(g, vis, 'musical', fondo);
    radio(g, e, vis);
    vis.ch.dibuja(g, 0);
    pista(g, e, vis);
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'aviso') { if (!x.pausa && son) son.tic(); }
      else if (x.t === 'golpe') {
        vis.golpe = vis.t;
        T.estrellas(vis.ch, X0, PY, x.bueno ? 8 : 4, x.bueno ? T.AMARILLO : T.PAPEL, 10, x.bueno ? 20 : 13, 1);
        if (x.bueno) vis.ch.mas({ tipo: 'anillo', x: X0, y: PY, r: 30, R: 110, w: 10, color: '#FFFFFF', vida: 12, capa: 1 });
        T.palabra(vis.ch, x.bueno ? '¡BOM!' : x.pts >= 350 ? '¡CASI!' : '¡UY!', 320, 762, x.bueno ? T.AMARILLO : T.PAPEL, 52, 1, true);
        son && (x.bueno ? son.acierto() : son.golpe());
      } else if (x.t === 'pierde') {
        vis.fallo = vis.t;
        T.palabra(vis.ch, '¡SE FUE!', 320, 762, T.ROJO, 50, 1, true); son && son.fallo();
      } else if (x.t === 'error') {
        vis.fallo = vis.t; vis.temblor = 8;
        T.palabra(vis.ch, '¡ESA NO!', 320, 762, T.ROJO, 52, 1, true); son && son.fallo();
      }
    }
  }

  ZZ.canales.musical = {
    id: 'musical', num: 8, nombre: 'MUSICAL', orden: '¡AL RITMO!',
    pista: 'Toca cada nota en el aro. Las tachadas, no',
    rotulo: 'RADIO RELÁMPAGO: «EL BOM PERFECTO»',
    color: C.pared, color2: T.ROJO, color3: T.AMARILLO,
    pasos: 600,      // diez segundos
    animo: x => x.t === 'golpe' ? (x.pts >= 350 ? 1 : -1) : x.t === 'pierde' || x.t === 'error' ? -1 : 0,
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
