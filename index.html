<script>
/* ZikZak · núcleo
   Azar con semilla, partida a paso fijo, repetición de una grabación y jugador de la casa.
   Nada de este fichero toca la pantalla: es lo que más adelante correrá también en el servidor
   para volver a jugar cada partida y comprobar la puntuación. */
(function () {
  'use strict';
  const ZZ = window.ZZ = window.ZZ || {};

  ZZ.VERSION = '1.3.1';
  ZZ.HZ = 60;          // pasos de lógica por segundo
  ZZ.PASOS = 300;      // cinco segundos: lo que dura un canal si no dice otra cosa
  ZZ.PW = 640;         // tamaño lógico de la pantalla de la tele
  ZZ.PH = 840;
  ZZ.canales = {};
  // Cada canal puede durar lo suyo (5, 10, 30 segundos…): lo dice en `pasos`.
  ZZ.pasosDe = canal => (canal && canal.pasos) || ZZ.PASOS;

  // --- utilidades ---------------------------------------------------------
  ZZ.lim = (v, a, b) => (v < a ? a : v > b ? b : v);
  ZZ.mix = (a, b, t) => a + (b - a) * t;
  ZZ.e = {
    out3: t => 1 - Math.pow(1 - t, 3),
    in3: t => t * t * t,
    io: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
    outEl: t => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1),
    rebote: t => Math.sin(Math.min(1, t) * Math.PI),

  // --- azar con semilla (mulberry32) ---------------------------------------
  ZZ.azar = function (semilla) {
    let a = semilla >>> 0;
    const f = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.entre = (x, y) => x + (y - x) * f();
    f.entero = (x, y) => x + Math.floor(f() * (y - x + 1));
    f.elige = l => l[Math.floor(f() * l.length)];
    // Campana aproximada (suma de tres uniformes), media 0 y desviación cercana a 1.
    f.campana = () => (f() + f() + f() - 1.5) * 2;
    return f;
  };

  // --- una partida de un canal ---------------------------------------------
  // Las entradas son { t: 'd' | 'm' | 'u', x, y } con coordenadas enteras de la pantalla de la tele.
  class Partida {
    constructor(canal, semilla, nivel) {
      this.canal = canal;
      this.semilla = semilla >>> 0;
      this.nivel = nivel;
      this.e = canal.init(this.semilla, nivel);
      this.n = 0;
      this.grab = [];
      this.fin = false;
      this.ev = [];
    }
    avanza(entradas) {
      if (this.fin) { this.ev = []; return this.ev; }
      const e = this.e;
      for (const en of entradas) this.grab.push([this.n, en.t, en.x | 0, en.y | 0]);
      e.ev = [];
      this.canal.paso(e, entradas, this.n);
      this.n++;
      if (this.n >= ZZ.pasosDe(this.canal) || e.hecho) this.fin = true;
      this.ev = e.ev;
      return this.ev;
    }
    puntos() { return this.canal.puntuacion(this.e); }
  }
  ZZ.Partida = Partida;

  // --- repetir una grabación -----------------------------------------------
  class Repeticion {
    constructor(canal, semilla, nivel, grab) {
      this.p = new Partida(canal, semilla, nivel);
      this.g = grab || [];
      this.i = 0;
    }
    avanza() {
      const ent = [];
      while (this.i < this.g.length && this.g[this.i][0] === this.p.n) {
        const r = this.g[this.i++];
        ent.push({ t: r[1], x: r[2], y: r[3] });
      }
      return this.p.avanza(ent);
    }
    hastaElFinal() { while (!this.p.fin) this.avanza(); return this.p.puntos(); }
    get fin() { return this.p.fin; }
    puntos() { return this.p.puntos(); }
  }
  ZZ.Repeticion = Repeticion;

  // --- jugador de la casa ---------------------------------------------------
  // Juega un canal con una destreza de 0 a 1 y devuelve la grabación de sus entradas.
  // Es un rival de prueba hecho por programa: en la página se anuncia como tal, nunca como una persona.
  ZZ.grabaCasa = function (canal, semilla, nivel, destreza) {
    const p = new Partida(canal, semilla, nivel);
    const rng = ZZ.azar((semilla ^ 0x9E3779B9) + Math.floor(destreza * 1000));
    const mem = {};
    while (!p.fin) p.avanza(canal.casa(p.e, mem, rng, destreza, p.n) || []);
    return { grab: p.grab, puntos: p.puntos(), pasos: p.n };
  };

<script>
/* ZikZak · tinta
   El estilo común a todos los canales: trazo de tinta grueso, formas planas con una sola sombra,
   tramas de puntos, letras gordas y partículas. Todo lo que se dibuja pasa por aquí. */
(function () {
  'use strict';
  const ZZ = window.ZZ;
  const T = ZZ.tinta = {};
  const TAU = Math.PI * 2;

  T.TINTA = '#17141F';
  T.PAPEL = '#FBF4E6';
  T.ROJO = '#FF3B4E';
  T.AMARILLO = '#FFC928';
  T.AZUL = '#2D6BFF';
  T.MENTA = '#21C58E';
  T.VIOLETA = '#7B4DFF';
  T.F_GORDA = '"Bowlby One", "Arial Black", Impact, sans-serif';
  T.F_UI = 'Rubik, "Trebuchet MS", "Segoe UI", sans-serif';

  // --- color ----------------------------------------------------------------
  const cacheMezcla = new Map();

    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

    v = '#' + [0, 1, 2].map(i => Math.round(x[i] + (y[i] - x[i]) * t).toString(16).padStart(2, '0')).join('');
    cacheMezcla.set(k, v);
    return v;
  };
  T.oscuro = (c, t = 0.26) => T.mezcla(c, T.TINTA, t);
  T.claro = (c, t = 0.4) => T.mezcla(c, '#FFFFFF', t);

  // --- caminos --------------------------------------------------------------
  T.rr = function (g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  };
  T.circ = (g, x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, TAU); };
  T.elip = (g, x, y, rx, ry, rot = 0) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); };
  T.poli = function (g, pts) {
    g.beginPath();
    for (let i = 0; i < pts.length; i++) i ? g.lineTo(pts[i][0], pts[i][1]) : g.moveTo(pts[i][0], pts[i][1]);
    g.closePath();
  };
  T.estrella = function (g, x, y, R, r, n, rot = 0) {
    g.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = rot + i * Math.PI / n - Math.PI / 2, rr = i % 2 ? r : R;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath();
  };

  // --- relleno y trazo ------------------------------------------------------
  T.pinta = function (g, relleno, w = 6, tinta = T.TINTA) {

    if (w > 0) {
      g.lineWidth = w; g.strokeStyle = tinta; g.lineJoin = 'round'; g.lineCap = 'round';
      g.stroke();
    }
  };
  T.linea = function (g, w = 6, tinta = T.TINTA) {
    g.lineWidth = w; g.strokeStyle = tinta; g.lineJoin = 'round'; g.lineCap = 'round';
    g.stroke();
  };

  // Forma con volumen: color de base y una sola sombra en media luna abajo a la derecha.
  // `camino` es una función que traza la forma en el contexto.
  T.vol = function (g, camino, relleno, o) {
    o = o || {};
    const w = o.w === undefined ? 6 : o.w;
    const dx = o.dx === undefined ? -7 : o.dx, dy = o.dy === undefined ? -9 : o.dy;
    g.save();
    camino(g);
    g.fillStyle = o.sombra || T.oscuro(relleno);
    g.fill();
    g.clip();
    g.translate(dx, dy);
    camino(g);
    g.fillStyle = relleno;
    g.fill();
    g.restore();
    if (w > 0) { camino(g); T.linea(g, w, o.tinta || T.TINTA); }
  };

  // Sombra dura de pegatina: la misma forma, desplazada y en tinta.
  T.sombra = function (g, camino, dx = 8, dy = 10, alfa = 1, color = T.TINTA, w = 6) {
    g.save();
    g.translate(dx, dy);
    g.globalAlpha *= alfa;
    camino(g);
    g.fillStyle = color; g.fill();
    if (w > 0) { g.lineWidth = w; g.strokeStyle = color; g.lineJoin = 'round'; g.stroke(); }
    g.restore();
  };

  // Trazo con contorno: para brazos, cuerdas y todo lo que es una línea gorda.
  T.tubo = function (g, camino, color, ancho, borde = 5) {
    g.lineJoin = 'round'; g.lineCap = 'round';

    camino(g); g.lineWidth = ancho; g.strokeStyle = color; g.stroke();
  };

  // La señal de «aquí»: un triángulo amarillo con tinta gruesa alrededor, que se ve sobre cualquier fondo.
  // La punta queda en (x, y); con giro 0 apunta hacia abajo.
  T.marca = function (g, x, y, giro = 0, tam = 30) {
    g.save(); g.translate(x, y); g.rotate(giro);

    g.restore();
  };

  // --- texto ----------------------------------------------------------------
  T.texto = function (g, s, x, y, tam, o) {
    o = o || {};
    g.save();
    g.font = (o.peso ? o.peso + ' ' : '') + tam + 'px ' + (o.fuente || T.F_GORDA);
    g.textAlign = o.al || 'center';
    g.textBaseline = o.base || 'middle';
    g.translate(x, y);

      g.lineWidth = w;
      g.strokeText(s, d, d * 1.25); g.fillText(s, d, d * 1.25);
    }
    if (w > 0) { g.strokeStyle = o.tinta || T.TINTA; g.lineWidth = w; g.strokeText(s, 0, 0); }
    g.fillStyle = o.color || T.PAPEL;
    g.fillText(s, 0, 0);
    g.restore();
  };
  T.ancho = function (g, s, tam, fuente, peso) {
    g.save();

  };

  // --- tramas ---------------------------------------------------------------
  const cacheTrama = new Map();

  T.trama = function (g, color, paso = 14, r = 3) {
    const k = color + '|' + paso + '|' + r;
    let p = cacheTrama.get(k);
    if (p) return p;
    const c = document.createElement('canvas');
    c.width = c.height = paso * 2;
    const x = c.getContext('2d');
    x.fillStyle = color;
    for (const [px, py] of [[0, 0], [paso * 2, 0], [0, paso * 2], [paso * 2, paso * 2], [paso, paso]]) {
      x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
    }
    p = g.createPattern(c, 'repeat');
    cacheTrama.set(k, p);
    return p;
  };
  // Rayas en diagonal.
  T.rayas = function (g, color, paso = 16, ancho = 6) {
    const k = 'r' + color + '|' + paso + '|' + ancho;
    let p = cacheTrama.get(k);
    if (p) return p;
    const c = document.createElement('canvas');
    c.width = c.height = paso;
    const x = c.getContext('2d');
    x.strokeStyle = color; x.lineWidth = ancho; x.lineCap = 'square';
    for (const d of [-paso, 0, paso]) { x.beginPath(); x.moveTo(d, paso); x.lineTo(d + paso, 0); x.stroke(); }
    p = g.createPattern(c, 'repeat');
    cacheTrama.set(k, p);
    return p;
  };

  // Rayos que salen de un punto.
  T.rayos = function (g, cx, cy, R, n, rot, color) {
    g.fillStyle = color;
    g.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot + i * TAU / n, b = a + TAU / n / 2;
      g.moveTo(cx, cy);
      g.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      g.lineTo(cx + Math.cos(b) * R, cy + Math.sin(b) * R);
      g.closePath();
    }
    g.fill();
  };

  // Estallido de cómic (estrella irregular) detrás de una palabra.
  T.estallido = function (g, x, y, R, n, rot, relleno, w = 6, semilla = 7) {
    const rng = ZZ.azar(semilla);
    g.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = rot + i * Math.PI / n;
      const rr = i % 2 ? R * (0.58 + rng() * 0.1) : R * (0.9 + rng() * 0.22);
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * 0.86;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath();
    T.pinta(g, relleno, w);
  };

  // Capa fija guardada: el fondo de un canal se dibuja una vez y luego se copia.
  T.capa = function (g, vis, clave, fn, w, h) {
    const esc = vis.esc || 1, k = '_capa_' + clave;
    w = w || ZZ.PW; h = h || ZZ.PH;

      c.width = Math.ceil(w * esc); c.height = Math.ceil(h * esc);
      c._esc = esc;
      const x = c.getContext('2d');
      x.scale(esc, esc);
      fn(x);
      vis[k] = c;
    }
    g.drawImage(c, 0, 0, w, h);
  };

  class Chispas {
    constructor() { this.l = []; }
    mas(p) {
      p.t = 0; p.rot = p.rot || 0; p.vx = p.vx || 0; p.vy = p.vy || 0;
      this.l.push(p);
      if (this.l.length > 400) this.l.shift();
      return p;
    }
    limpia() { this.l.length = 0; }
    paso() {
      const l = this.l;
      for (let i = l.length - 1; i >= 0; i--) {
        const p = l[i];
        if (p.espera > 0) { p.espera--; continue; }
        p.vy += p.g || 0;
        if (p.roz) { p.vx *= p.roz; p.vy *= p.roz; }
        p.x += p.vx; p.y += p.vy;

            g.globalAlpha = 1 - ZZ.e.in3(k);
            T.circ(g, 0, 0, p.r * s);

  }

  // Emisores de uso común.
  T.confeti = function (ch, x, y, n, colores, fuerza = 9, capa = 0) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = fuerza * (0.5 + Math.random());
      ch.mas({ tipo: 'confeti', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.42, roz: 0.985,
        vr: (Math.random() - 0.5) * 0.4, r: 6 + Math.random() * 6, color: colores[i % colores.length],
        fase: Math.random() * 6, vida: 50 + Math.random() * 40, capa });

<script>
/* ZikZak · personaje
   Cabeza grande, cuerpo pequeño y manos. Cada pinta tiene su forma de cabeza, sus ojos, su ropa
   y su calzado: no es la misma cara con otro gorro. El cuerpo actúa: se inclina, se encoge y celebra.
   Ajuste, el rival de la casa, es una carta de ajuste con esmoquin: se ve que no es una persona. */
(function () {

  const ZZ = window.ZZ, T = ZZ.tinta;

      } else if (E.susto) {

        T.circ(g, x + mira.x * 3, ey + mira.y * 3, 4.2); T.pinta(g, T.TINTA, 0);
      } else if (estilo === 'punto' || estilo === 'gafas' || estilo === 'redondo') {

        const rx = estilo === 'gafas' ? 5.2 : estilo === 'redondo' ? 8.4 : 6.6, ry = estilo === 'gafas' ? 7.4 : estilo === 'redondo' ? 8.4 : 9.8;
        if (estilo === 'redondo') { g.beginPath(); g.moveTo(x - 10, ey + 14); g.quadraticCurveTo(x, ey + 18, x + 10, ey + 14); T.linea(g, 3, T.oscuro(o.piel, 0.4)); }

        if (E.parp > 0.18) {

          g.lineTo(px + rx + 3, yb + inc); g.lineTo(px - rx - 3, yb - inc); g.closePath();
          T.pinta(g, estilo === 'gafas' ? '#EAF6FF' : o.piel, 0);
        }

        const ent = estilo === 'entornado';

        const camOjo = c => T.elip(c, x, ey, rx, ry);
        camOjo(g); T.pinta(g, '#FFFFFF', 0);
        g.save(); camOjo(g); g.clip();
        T.circ(g, x + mira.x * 4, ey + 1.5 + mira.y * 4, ent ? 5.6 : 6.2); T.pinta(g, T.TINTA, 0);
        T.circ(g, x + mira.x * 4 - 2.2, ey - 1 + mira.y * 4, 2); T.pinta(g, '#FFFFFF', 0);
        const parp = Math.max(E.parp || 0, ent ? 0.36 : 0);
        if (parp > 0.02) {
          const yb = ey - ry + ry * 2 * parp, inc = E.ceja * 8 * s;
          g.beginPath(); g.moveTo(x - 16, ey - 22); g.lineTo(x + 16, ey - 22);
          g.lineTo(x + 16, yb + inc); g.lineTo(x - 16, yb - inc); g.closePath();
          T.pinta(g, o.piel, 3);
        }
        g.restore();
        camOjo(g); T.linea(g, 3);
      }
      if (estilo === 'gafas') { T.circ(g, x, ey, 16.5); T.linea(g, 4.5); }
      // ceja
      const yc = ey - (estilo === 'gafas' ? 26 : 23) + (E.cy || 0);
      g.beginPath();
      g.moveTo(x - s * 11, yc + E.ceja * 12);
      g.quadraticCurveTo(x + s * 1, yc - 3 - Math.abs(E.ceja) * 2, x + s * 13, yc - E.ceja * 7);
      T.linea(g, estilo === 'entornado' ? 8 : 6);
    }
    if (estilo === 'gafas') {
      g.beginPath(); g.moveTo(-ex + 16, ey - 2); g.quadraticCurveTo(0, ey - 8, ex - 16, ey - 2); T.linea(g, 4.5);
    }
    if (o.pecas) {
      g.fillStyle = T.oscuro(o.piel, 0.32);
      for (const [x, y] of [[-30, 10], [-23, 15], [-34, 17], [30, 10], [23, 15], [34, 17]]) { T.circ(g, x, y, 2.3); g.fill(); }
    }
    const tono = T.oscuro(o.piel, 0.5);
    if (o.nariz === 'bola') { T.vol(g, c => T.elip(c, 0, o.by - 17, 8, 6.5), T.oscuro(o.piel, 0.12), { sombra: T.oscuro(o.piel, 0.3), dx: -1, dy: -2, w: 3.5 }); }
    else if (o.nariz === 'ele') { g.beginPath(); g.moveTo(1, o.by - 30); g.lineTo(-3, o.by - 15); g.lineTo(5, o.by - 15); T.linea(g, 4, tono); }
    else if (o.nariz === 'u') { g.beginPath(); g.moveTo(-4, o.by - 21); g.quadraticCurveTo(0.5, o.by - 14, 5.5, o.by - 21); T.linea(g, 4, tono); }
    if (o.bigote) {
      T.vol(g, c => { c.beginPath(); c.moveTo(0, o.by - 11); c.bezierCurveTo(10, o.by - 16, 24, o.by - 10, 27, o.by - 2); c.bezierCurveTo(16, o.by - 4, 8, o.by - 1, 0, o.by - 5); c.bezierCurveTo(-8, o.by - 1, -16, o.by - 4, -27, o.by - 2); c.bezierCurveTo(-24, o.by - 10, -10, o.by - 16, 0, o.by - 11); c.closePath(); }, '#2B2536', { sombra: T.TINTA, dx: 0, dy: -2, w: 3 });
      boca(g, E.boca, o.by + 6, 0.82);
    } else boca(g, E.boca, o.by, 1);
  }
  P.cara = cara;

  function boca(g, tipo, y, k) {
    g.save(); g.translate(0, y); g.scale(k, k);
    switch (tipo) {
      case 'abierta': case 'grande': {
        const a = tipo === 'grande' ? 23 : 17, h = tipo === 'grande' ? 27 : 20, y0 = -(tipo === 'grande' ? 7 : 3);
        const cam = c => { c.beginPath(); c.moveTo(-a, y0); c.lineTo(a, y0); c.bezierCurveTo(a, y0 + h * 0.9, a * 0.55, y0 + h, 0, y0 + h); c.bezierCurveTo(-a * 0.55, y0 + h, -a, y0 + h * 0.9, -a, y0); c.closePath(); };
        cam(g); T.pinta(g, '#3B1522', 0);
        g.save(); cam(g); g.clip();
        T.elip(g, 0, y0 + h, a * 0.62, h * 0.42); T.pinta(g, T.ROJO, 0);
        g.fillStyle = '#FFFFFF'; g.fillRect(-a, y0 - 2, a * 2, h * 0.3 + 2);
        g.restore();
        cam(g); T.linea(g, 5);
        break;
      }
      case 'dientes': {
        T.rr(g, -17, -6, 34, 17, 6); T.pinta(g, '#FFFFFF', 5);
        g.beginPath(); g.moveTo(-17, 2.5); g.lineTo(17, 2.5);
        for (const x of [-8, 0, 8]) { g.moveTo(x, -6); g.lineTo(x, 11); }
        T.linea(g, 3);
        break;
      }
      case 'o': T.elip(g, 0, 3, 8.5, 11.5); T.pinta(g, '#3B1522', 5); break;
      case 'pena': g.beginPath(); g.moveTo(-13, 8); g.quadraticCurveTo(0, -6, 13, 8); T.linea(g, 5.5); break;
      case 'lengua': {
        g.beginPath(); g.moveTo(-13, 0); g.quadraticCurveTo(0, 9, 14, -1); T.linea(g, 5.5);
        g.beginPath(); g.moveTo(3, 4); g.quadraticCurveTo(5, 17, 12, 13); g.quadraticCurveTo(17, 9, 13, 1); g.closePath();
        T.pinta(g, T.ROJO, 4.5);
        break;
      }
      default: g.beginPath(); g.moveTo(-14, -2); g.quadraticCurveTo(0, 11, 14, -2); T.linea(g, 5.5);
    }
    g.restore();
  }

  // --- pelo y gorros --------------------------------------------------------
  function peloDetras(g, a) {
    const c = a.cPelo;
    if (a.pelo === 'melena') {
      // dos mechones a los lados, hasta la mandíbula: nunca por debajo de la barbilla
      for (const s of [-1, 1]) {
        T.vol(g, x => { x.beginPath(); x.moveTo(s * 40, -40); x.bezierCurveTo(s * 70, -34, s * 80, 6, s * 68, 38); x.bezierCurveTo(s * 62, 52, s * 44, 48, s * 40, 34); x.closePath(); }, c, { dx: -4, dy: -5, w: 6 });
      }
    } else if (a.pelo === 'coleta') {
      // nace arriba y detrás, con su goma, y cae hacia un lado
      T.vol(g, x => { x.beginPath(); x.moveTo(34, -50); x.bezierCurveTo(70, -86, 110, -52, 100, -4); x.bezierCurveTo(96, 16, 84, 30, 74, 34); x.bezierCurveTo(86, 6, 82, -30, 46, -34); x.closePath(); }, c, { dx: -4, dy: -5, w: 6 });
      T.vol(g, x => T.elip(x, 41, -43, 9, 12, 0.7), T.ROJO, { dx: -1, dy: -2, w: 4.5 });
    } else if (a.pelo === 'rizos') {
      const pts = [];
      for (let i = 0; i < 9; i++) { const an = Math.PI * (1.02 + i * 0.12); pts.push([Math.cos(an) * 56, -8 + Math.sin(an) * 54]); }
      g.fillStyle = T.TINTA; for (const [x, y] of pts) { T.circ(g, x, y, 23); g.fill(); }
      g.fillStyle = c; for (const [x, y] of pts) { T.circ(g, x, y, 17.5); g.fill(); }
    }
  }
  function peloDelante(g, a, tapado, f) {
    const c = a.cPelo;
    if (tapado) {
      for (const s of [-1, 1]) {
        T.vol(g, x => { x.beginPath(); x.moveTo(s * (f.w + 1), -22); x.quadraticCurveTo(s * (f.w - 14), -16, s * (f.w - 10), 6); x.quadraticCurveTo(s * (f.w + 2), 4, s * (f.w + 3), -8); x.closePath(); }, c, { dx: -2, dy: -3, w: 5 });
      }
      return;
    }
    if (a.pelo === 'rizos') {
      const pts = [];
      for (let i = 0; i < 6; i++) { const an = Math.PI * (1.16 + i * 0.136); pts.push([Math.cos(an) * 40, -10 + Math.sin(an) * 40]); }
      g.fillStyle = T.TINTA; for (const [x, y] of pts) { T.circ(g, x, y, 19); g.fill(); }
      g.fillStyle = c; for (const [x, y] of pts) { T.circ(g, x, y, 14); g.fill(); }
      g.fillStyle = T.claro(c, 0.28); for (const [x, y] of pts) { T.circ(g, x - 4, y - 5, 4); g.fill(); }
      return;
    }
    T.vol(g, x => {
      x.beginPath(); x.moveTo(-56, -6);
      x.bezierCurveTo(-60, -50, -32, -64, 0, -64); x.bezierCurveTo(32, -64, 60, -50, 56, -6);
      x.bezierCurveTo(50, -26, 30, -36, 6, -30); x.bezierCurveTo(-18, -24, -44, -30, -56, -6); x.closePath();
    }, c, { dx: -5, dy: -6, w: 6 });
  }

  function gorro(g, a) {
    const c = a.cGorro, s = T.oscuro(c, 0.24);
    switch (a.gorro) {
      case 'gorra': {
        // visera hacia delante y un poco ladeada
        T.vol(g, x => { x.beginPath(); x.moveTo(-50, -22); x.quadraticCurveTo(4, -40, 66, -24); x.quadraticCurveTo(82, -10, 58, -4); x.quadraticCurveTo(6, -18, -44, -8); x.closePath(); }, s, { sombra: T.oscuro(c, 0.42), dx: 0, dy: -5, w: 6 });
        T.vol(g, x => { x.beginPath(); x.moveTo(-58, -18); x.bezierCurveTo(-62, -64, -30, -84, 0, -84); x.bezierCurveTo(30, -84, 62, -64, 58, -18); x.quadraticCurveTo(0, -38, -58, -18); x.closePath(); }, c, { sombra: s, dx: -6, dy: -7, w: 6 });
        T.circ(g, 0, -84, 6); T.pinta(g, s, 5);
        T.vol(g, x => T.circ(x, 4, -56, 15), T.PAPEL, { sombra: '#DDD0B4', dx: -2, dy: -3, w: 5 });
        g.beginPath(); g.moveTo(-3, -61); g.lineTo(6, -61); g.lineTo(-2, -51); g.lineTo(8, -51); T.linea(g, 4);
        break;
      }
      case 'lana': {
        T.vol(g, x => { x.beginPath(); x.moveTo(-56, -24); x.bezierCurveTo(-60, -76, -30, -96, 0, -96); x.bezierCurveTo(30, -96, 60, -76, 56, -24); x.closePath(); }, c, { sombra: s, dx: -6, dy: -7, w: 6 });
        T.vol(g, x => T.rr(x, -60, -42, 120, 26, 12), T.claro(c, 0.3), { sombra: c, dx: 0, dy: -6, w: 6 });
        g.beginPath(); for (let x = -40; x <= 40; x += 20) { g.moveTo(x, -38); g.lineTo(x, -21); } T.linea(g, 4);
        T.vol(g, x => T.circ(x, 0, -102, 16), T.PAPEL, { sombra: '#DDD0B4', dx: -3, dy: -4, w: 6 });
        break;
      }
      case 'vaquero': {
        T.vol(g, x => { x.beginPath(); x.moveTo(-84, -36); x.bezierCurveTo(-60, -14, 60, -14, 84, -36); x.bezierCurveTo(80, -52, 52, -42, 0, -42); x.bezierCurveTo(-52, -42, -80, -52, -84, -36); x.closePath(); }, c, { sombra: s, dx: 0, dy: -6, w: 6 });
        T.vol(g, x => { x.beginPath(); x.moveTo(-50, -36); x.bezierCurveTo(-56, -86, -26, -98, -10, -86); x.quadraticCurveTo(0, -78, 10, -86); x.bezierCurveTo(26, -98, 56, -86, 50, -36); x.quadraticCurveTo(0, -26, -50, -36); x.closePath(); }, c, { sombra: s, dx: -6, dy: -6, w: 6 });
        g.beginPath(); g.moveTo(-51, -49); g.quadraticCurveTo(0, -38, 51, -49); T.linea(g, 10, T.TINTA);
        g.beginPath(); g.moveTo(-50, -49); g.quadraticCurveTo(0, -38, 50, -49); T.linea(g, 5, T.AMARILLO);
        break;
      }
      case 'chef': {
        const pts = [[-30, -84, 27], [0, -98, 29], [30, -84, 27], [0, -72, 28]];
        g.fillStyle = T.TINTA; for (const [x, y, r] of pts) { T.circ(g, x, y, r + 6); g.fill(); }
        g.fillStyle = '#DDD0B4'; for (const [x, y, r] of pts) { T.circ(g, x, y, r); g.fill(); }
        g.fillStyle = c; for (const [x, y, r] of pts) { T.circ(g, x - 4, y - 5, r - 3); g.fill(); }
        T.vol(g, x => T.rr(x, -46, -60, 92, 34, 8), c, { sombra: '#DDD0B4', dx: -5, dy: -5, w: 6 });
        break;
      }
      case 'cinta': {
        T.vol(g, x => { x.beginPath(); x.moveTo(50, -30); x.quadraticCurveTo(80, -44, 88, -18); x.quadraticCurveTo(72, -20, 58, -12); x.closePath(); }, c, { sombra: s, dx: -2, dy: -3, w: 5 });
        g.beginPath(); g.moveTo(-52, -20); g.quadraticCurveTo(0, -40, 52, -20); T.linea(g, 22);
        g.beginPath(); g.moveTo(-52, -20); g.quadraticCurveTo(0, -40, 52, -20); T.linea(g, 11, c);
        break;
      }
    }
  }

  // --- cabezas ----------------------------------------------------------------
  function cabezaHumana(g, a, expr, t, mira) {
    const piel = P.PIELES[a.piel], pielS = T.oscuro(piel, 0.2), f = FORMAS[a.forma] || FORMAS.redonda;
    peloDetras(g, a);
    for (const s of [-1, 1]) T.vol(g, c => T.circ(c, s * (f.w + 1), 6, f.oreja), piel, { sombra: pielS, dx: -2, dy: -3, w: 5 });
    T.vol(g, c => caminoCabeza(c, f), piel, { sombra: pielS, dx: -6, dy: -7, w: 6 });
    if (a.colorete) {
      g.save(); g.globalAlpha = 0.3; g.fillStyle = T.ROJO;
      T.circ(g, -(f.wb || f.w) + 20, 22, 9.5); g.fill(); T.circ(g, (f.wb || f.w) - 20, 22, 9.5); g.fill();
      g.restore();
    }
    if (a.tirita) {
      g.save(); g.translate(36, 9); g.rotate(-0.5);
      T.rr(g, -12, -5.5, 24, 11, 4); T.pinta(g, '#F7E6C4', 3);
      g.fillStyle = T.oscuro('#F7E6C4', 0.3); T.circ(g, -2.5, 0, 1.4); g.fill(); T.circ(g, 2.5, 0, 1.4); g.fill();
      g.restore();
    }
    const tapado = a.gorro && a.gorro !== 'cinta';
    cara(g, expr, t, { ex: a.ojos === 'gafas' ? 22 : 20, ey: a.forma === 'alargada' ? -8 : -4, by: a.forma === 'alargada' ? 33 : 30, piel, mira, ojos: a.ojos, nariz: a.nariz, bigote: a.bigote, pecas: a.pecas });
    peloDelante(g, a, tapado, f);
    if (a.flequillo) {
      // un mechón que se escapa por debajo de la gorra
      T.vol(g, x => { x.beginPath(); x.moveTo(-48, -28); x.quadraticCurveTo(-34, 0, -12, -9); x.quadraticCurveTo(-22, -15, -18, -30); x.closePath(); }, a.cPelo, { dx: -2, dy: -3, w: 5 });
    }
    if (a.gorro) gorro(g, a);
  }

  function cabezaTele(g, a, expr, t, mira) {
    for (const s of [-1, 1]) {
      g.beginPath(); g.moveTo(s * 14, -50); g.lineTo(s * 36, -88); T.linea(g, 8);
      T.vol(g, c => T.circ(c, s * 37, -90, 9), T.ROJO, { dx: -2, dy: -3, w: 5 });
    }
    T.vol(g, c => T.rr(c, -62, -56, 124, 108, 24), T.AMARILLO, { dx: -6, dy: -8, w: 6 });
    const pant = c => T.rr(c, -50, -45, 100, 74, 16);
    const azul = T.mezcla(T.AZUL, T.TINTA, 0.35);
    pant(g); T.pinta(g, azul, 0);
    g.save(); pant(g); g.clip();
    const barras = [T.PAPEL, T.AMARILLO, T.MENTA, T.VIOLETA, T.ROJO, T.AZUL];
    for (let i = 0; i < 6; i++) { g.fillStyle = barras[i]; g.fillRect(-50 + i * 16.7, -45, 17, 13); }
    g.fillStyle = T.TINTA; g.fillRect(-50, -33, 100, 3.5);
    g.restore();
    cara(g, expr, t, { ex: 20, ey: -6, by: 15, piel: azul, mira, ojos: 'blanco' });
    pant(g); T.linea(g, 5.5);
    T.circ(g, -40, 40, 5); T.pinta(g, T.TINTA, 0);
    T.circ(g, -24, 40, 5); T.pinta(g, T.TINTA, 0);
    g.beginPath(); for (const x of [8, 20, 32, 44]) { g.moveTo(x, 36); g.lineTo(x, 44); } T.linea(g, 4);
  }

  function cabeza(g, a, expr, t, mira) {
    if (a.tele) cabezaTele(g, a, expr, t, mira); else cabezaHumana(g, a, expr, t, mira);
  }
  P.cabeza = cabeza;

  // --- ropa: el origen es la base del cuello ------------------------------------
  // `cam` traza el torso. Primero lo que va dentro del torso y luego lo que sobresale.
  function torso(g, a, cam) {
    const c = a.chaqueta, base = a.ropa === 'chaleco' ? T.PAPEL : c;
    T.vol(g, cam, base, { sombra: base === T.PAPEL ? '#DDD0B4' : undefined, dx: -6, dy: -6, w: 0 });
    g.save(); cam(g); g.clip();
    switch (a.ropa) {
      case 'chandal':
        g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 90); T.linea(g, 4);
        T.rr(g, -24, 34, 17, 12, 4); T.pinta(g, T.PAPEL, 4);
        break;
      case 'sudadera':
        T.rr(g, -22, 40, 44, 40, 10); T.pinta(g, T.oscuro(c, 0.14), 4.5);
        break;
      case 'abrigo':
        g.beginPath(); g.moveTo(6, 0); g.lineTo(6, 90); T.linea(g, 4);
        for (const y of [24, 44, 64]) { T.circ(g, -8, y, 5); T.pinta(g, T.TINTA, 0); }
        break;
      case 'chaleco':
        for (const s of [-1, 1]) {
          g.beginPath(); g.moveTo(s * 5, -6); g.lineTo(s * 13, 34); g.lineTo(s * 6, 90); g.lineTo(s * 90, 90); g.lineTo(s * 90, -6); g.closePath();
          T.pinta(g, c, 5);
        }
        T.estrella(g, -22, 26, 9, 4, 5); T.pinta(g, T.AMARILLO, 3.5);
        break;
      case 'chaquetilla':
        g.beginPath(); g.moveTo(-12, 0); g.lineTo(-12, 90); T.linea(g, 4);
        for (const y of [20, 38, 56]) for (const x of [-22, 4]) { T.circ(g, x, y, 4.2); T.pinta(g, T.TINTA, 0); }
        break;
      case 'esmoquin':
        T.poli(g, [[-17, -4], [17, -4], [0, 40]]); T.pinta(g, '#2B2536', 5);
        for (const y of [50, 64]) { T.circ(g, 0, y, 4); T.pinta(g, T.TINTA, 0); }
        break;
    }
    g.restore();
    cam(g); T.linea(g, 6);
  }
  function cuello(g, a) {
    switch (a.ropa) {
      case 'chandal':
        T.poli(g, [[-22, -2], [0, 22], [-5, -2]]); T.pinta(g, T.PAPEL, 5);
        T.poli(g, [[22, -2], [0, 22], [5, -2]]); T.pinta(g, T.PAPEL, 5);
        break;
      case 'sudadera':
        T.vol(g, x => { x.beginPath(); x.moveTo(-34, 4); x.quadraticCurveTo(0, -14, 34, 4); x.quadraticCurveTo(0, 30, -34, 4); x.closePath(); }, T.oscuro(a.chaqueta, 0.16), { dx: -2, dy: -3, w: 5 });
        for (const s of [-1, 1]) {
          g.beginPath(); g.moveTo(s * 8, 14); g.lineTo(s * 10, 38); T.linea(g, 8);
          g.beginPath(); g.moveTo(s * 8, 14); g.lineTo(s * 10, 38); T.linea(g, 3.5, T.PAPEL);
        }
        break;
      case 'abrigo': {
        const b = a.cBufanda || T.ROJO;
        T.vol(g, x => T.rr(x, 12, 4, 22, 46, 8), b, { dx: -3, dy: 0, w: 5.5 });
        g.beginPath(); g.moveTo(17, 42); g.lineTo(17, 50); g.moveTo(23, 42); g.lineTo(23, 50); g.moveTo(29, 42); g.lineTo(29, 50); T.linea(g, 3);
        T.vol(g, x => T.rr(x, -34, -10, 68, 24, 12), b, { dx: 0, dy: -5, w: 5.5 });
        break;
      }
      case 'chaleco':
        T.vol(g, x => T.poli(x, [[-26, -6], [26, -6], [0, 26]]), T.AMARILLO, { dx: -3, dy: -3, w: 5.5 });
        break;
      case 'chaquetilla':
        T.vol(g, x => T.rr(x, -24, -8, 48, 16, 8), T.ROJO, { dx: 0, dy: -4, w: 5 });
        T.vol(g, x => T.poli(x, [[-4, 6], [10, 6], [14, 26], [0, 22]]), T.ROJO, { dx: -2, dy: 0, w: 5 });
        break;
      case 'esmoquin':
        T.vol(g, x => T.poli(x, [[-22, -10], [0, 0], [-22, 12]]), T.ROJO, { dx: -1, dy: -2, w: 5 });
        T.vol(g, x => T.poli(x, [[22, -10], [0, 0], [22, 12]]), T.ROJO, { dx: -1, dy: -2, w: 5 });
        T.circ(g, 0, 1, 6); T.pinta(g, T.ROJO, 5);
        break;
    }
  }

  // --- busto: para las placas ---------------------------------------------------
  // El origen es el centro de la cabeza. `s` es la escala (1 = cabeza de unos 110 de ancho).
  P.busto = function (g, x, y, s, a, expr, t, o) {
    o = o || {};
    const lat = (o.golpe || 0);                 // 1 justo al reaccionar, baja a 0
    const bote = Math.sin(t * 0.09) * 1.5;
    g.save();
    g.translate(x, y); g.scale(s, s);
    g.save(); g.translate(0, 62);
    torso(g, a, c => { c.beginPath(); c.moveTo(-64, 70); c.quadraticCurveTo(-64, 6, -24, 0); c.lineTo(24, 0); c.quadraticCurveTo(64, 6, 64, 70); c.closePath(); });
    if (!a.tele) { T.rr(g, -13, -18, 26, 26, 8); T.pinta(g, T.oscuro(P.PIELES[a.piel], 0.2), 6); }
    cuello(g, a);
    g.restore();
    g.translate(0, bote - lat * 6);
    g.rotate((o.ladeo || 0) + Math.sin(t * 0.05) * 0.02);
    g.scale(1 + lat * 0.08, 1 - lat * 0.06);
    cabeza(g, a, expr, t, o.mira);
    g.restore();
  };

  // --- cuerpo entero ----------------------------------------------------------------
  // El origen es el suelo, entre los pies. Cada pose dice cuánto se inclina el tronco y la cabeza
  // y dónde quedan el codo y la mano de cada brazo: [codoX, codoY, manoX, manoY, abierta].
  const POSES = {
    quieto: { tor: 0.02, cab: 0.04, izq: [-50, -84, -52, -56], der: [50, -84, 54, -58] },
    listo: { tor: -0.07, cab: -0.06, izq: [-60, -92, -42, -126], der: [56, -82, 66, -112] },
    reto: { tor: -0.12, cab: -0.1, izq: [-62, -100, -36, -136], der: [52, -80, 70, -62] },
    victoria: { tor: 0.1, cab: -0.16, izq: [-66, -132, -54, -196], der: [58, -90, 62, -122], salto: true, piernas: [-12, 10] },
    dosArriba: { tor: 0.04, cab: -0.1, izq: [-74, -128, -94, -186], der: [74, -134, 98, -198], salto: true, piernas: [-12, 10] },
    saludoAlto: { tor: 0.08, cab: -0.14, izq: [-60, -96, -80, -128], der: [66, -132, 94, -194, true], salto: true, piernas: [-8, 12] },
    ala: { tor: -0.05, cab: -0.1, izq: [-50, -84, -54, -60], der: [72, -128, 60, -206], sobre: 'der' },
    ala2: { tor: 0.08, cab: -0.14, izq: [-66, -130, -62, -192], der: [72, -128, 60, -206], sobre: 'der', salto: true, piernas: [-10, 8] },
    gafas: { tor: -0.03, cab: -0.06, izq: [-50, -84, -52, -56], der: [66, -118, 42, -172], sobre: 'der' },
    cruzado: { tor: 0, cab: 0.08, izq: [-54, -72, 16, -84], der: [54, -76, -18, -76], frente: true },
    palma: { tor: 0.05, cab: 0.2, cabY: 10, hunde: 6, izq: [-44, -70, -46, -38], der: [62, -112, 20, -158, true], sobre: 'der' },
    manosCabeza: { tor: 0, cab: 0.06, izq: [-80, -150, -46, -222, true], der: [80, -150, 46, -222, true], sobre: 'ambos' },
    derrota: { tor: 0.07, cab: 0.3, cabY: 16, hunde: 9, izq: [-42, -70, -46, -36], der: [40, -70, 46, -38] },
    saludo: { tor: -0.05, cab: 0.1, izq: [-50, -84, -54, -58], der: [62, -120, 88, -168, true] },
  };
  P.entero = function (g, x, y, s, a, expr, t, pose) {
    const Q = POSES[pose] || POSES.quieto;
    const piel = a.tele ? T.AMARILLO : P.PIELES[a.piel];
    const mangas = a.mangas || a.chaqueta;
    const salto = Q.salto ? Math.abs(Math.sin(t * 0.17)) * 22 : 0;
    const resp = Math.sin(t * 0.08) * 2;
    g.save();
    g.translate(x, y); g.scale(s, s);
    g.save(); g.globalAlpha = 0.28; T.elip(g, 0, 2, 62 - salto * 0.8, 13 - salto * 0.2); g.fillStyle = T.TINTA; g.fill(); g.restore();
    g.translate(0, -salto + (Q.hunde || 0));
    // piernas y calzado
    const sep = Q.piernas || [0, 0];
    for (const sg of [-1, 1]) {
      const ab = sg < 0 ? sep[0] : sep[1], sube = Q.salto && sg < 0 ? -10 : 0;
      const px = sg * 20 + ab, py = -14 + sube - (Q.hunde || 0);
      T.tubo(g, c => { c.beginPath(); c.moveTo(sg * 15, -52); c.lineTo(sg * 16 + ab * 0.5, -34 + sube * 0.5); c.lineTo(px, py); }, a.pantalon || '#2B2536', 17, 5);
      if (a.calzado === 'bota') {
        T.vol(g, c => { c.beginPath(); c.moveTo(px - 12, py - 16); c.lineTo(px + 11, py - 16); c.lineTo(px + 11, py - 2); c.quadraticCurveTo(px + 11 + sg * 16, py - 2, px + 11 + sg * 16, py + 14); c.lineTo(px - 12, py + 14); c.closePath(); }, '#8A4B2A', { dx: -2, dy: -3, w: 5.5 });
      } else {
        T.vol(g, c => { c.beginPath(); c.ellipse(px + sg * 5, py + 6, 22, 12, 0, 0, 7); }, T.PAPEL, { sombra: '#DDD0B4', dx: -2, dy: -3, w: 5.5 });
        if (a.calzado === 'zapatilla') { g.beginPath(); g.moveTo(px + sg * 5 - 12, py + 11); g.lineTo(px + sg * 5 + 12, py + 11); T.linea(g, 4, a.tele || a.chaqueta === T.PAPEL ? T.ROJO : a.chaqueta); }
      }
    }
    // el tronco entero gira sobre la cadera
    g.translate(0, -52); g.rotate(Q.tor); g.translate(0, 52);
    const hombroY = -104 + resp;
    const brazo = (sg, b) => {
      T.tubo(g, c => { c.beginPath(); c.moveTo(sg * 30, hombroY + 4); c.lineTo(b[0], b[1] + resp); c.lineTo(b[2], b[3] + resp); }, mangas, 16, 5);
      mano(g, b[2], b[3] + resp, piel, !!b[4], sg);
    };
    const izqSobre = Q.sobre === 'ambos', derSobre = Q.sobre === 'der' || Q.sobre === 'ambos';
    if (!Q.frente && !izqSobre) brazo(-1, Q.izq);
    g.save(); g.translate(0, -114 + resp);
    torso(g, a, c => T.rr(c, -36, -2, 72, 68, 24));
    cuello(g, a);
    g.restore();
    if (Q.frente) brazo(-1, Q.izq);
    if (!derSobre) brazo(1, Q.der);
    g.save();
    g.translate(0, -166 + resp * 1.4 + (Q.cabY || 0));
    g.rotate(Q.cab + Math.sin(t * 0.05) * 0.02 + (Q.salto ? Math.sin(t * 0.17) * 0.04 : 0));
    cabeza(g, a, expr, t, Q.cab > 0.15 ? { x: 0, y: 0.9 } : null);
    g.restore();
    if (derSobre) brazo(1, Q.der);
    if (izqSobre) brazo(-1, Q.izq);
    g.restore();
  };

  function mano(g, x, y, piel, abierta, sg) {
    const s = T.oscuro(piel, 0.2);
    if (abierta) {
      for (let i = 0; i < 4; i++) {
        const an = -Math.PI / 2 + (i - 1.5) * 0.36;
        T.tubo(g, c => { c.beginPath(); c.moveTo(x + Math.cos(an) * 8, y + Math.sin(an) * 8); c.lineTo(x + Math.cos(an) * 25, y + Math.sin(an) * 25); }, piel, 7, 4);
      }
      T.tubo(g, c => { c.beginPath(); c.moveTo(x - sg * 8, y + 2); c.lineTo(x - sg * 22, y - 6); }, piel, 7, 4);
      T.vol(g, c => T.circ(c, x, y, 14), piel, { sombra: s, dx: -2, dy: -3, w: 5 });
    } else {
      // puño con su pulgar
      T.vol(g, c => T.circ(c, x - sg * 10, y - 7, 7), piel, { sombra: s, dx: -1, dy: -2, w: 4.5 });
      T.vol(g, c => T.circ(c, x, y, 14), piel, { sombra: s, dx: -2, dy: -3, w: 5 });
    }
  }
})();

<script>
/* ZikZak · canal 1 · Cocina · ¡CORTA!
   Un chorizo pasa bajo el cuchillo. Se toca cuando una marca llega a la hoja.
   Mide el ritmo: cada corte puntúa según lo cerca que cae de su marca. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta;

  const KX = 236;          // donde corta el cuchillo
  const CY = 520;          // eje del chorizo
  const GROSOR = 96;
  const ARRANQUE = 60;     // lo que le falta a la cabeza para llegar al cuchillo al empezar
  const INC = 18;          // inclinación del corte (al bies)
  const ANG = -1.212;      // giro del cuchillo: su filo queda paralelo a las marcas
  const PUNTA_X = KX - 88; // con esto el filo cruza el eje del chorizo justo en KX
  const NIV = [null,
    { v: 2.7, n: 5, huecos: [48], tol: 38, acel: 0 },
    { v: 3.1, n: 6, huecos: [30, 42, 54], tol: 36, acel: 0 },
    { v: 3.5, n: 8, huecos: [18, 30, 42], tol: 32, acel: 0.22 }];

  const C = {
    chorizo: '#E5482F', chorizoS: '#B5301F', cara: '#F27A5E',
    madera: '#F0B24A', maderaS: '#D58F36',
    hoja: '#E6EDF2', hojaS: '#B9C6D2', mango: '#2B2536',
    piel: '#F2B98A', pielS: '#D9925F',
  };

  // --- lógica ---------------------------------------------------------------
  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const v0 = N.v * rng.entre(0.95, 1.05);
    let llegadas = [];
    for (let intento = 0; intento < 40; intento++) {
      llegadas = [rng.entero(46, 56)];
      for (let i = 1; i < N.n; i++) llegadas.push(llegadas[i - 1] + rng.elige(N.huecos));
      if (llegadas[N.n - 1] <= 266) break;
    }
    const ult = llegadas[N.n - 1];
    if (ult > 266) llegadas = llegadas.map(a => Math.round(46 + (a - 46) * 220 / (ult - 46)));
    const dist = [];
    let d = 0;
    for (let s = 0; s <= ZZ.PASOS + 2; s++) { dist.push(d); d += v0 * (1 + N.acel * s / ZZ.PASOS); }
    const marcas = llegadas.map(a => ({ m: dist[a] - ARRANQUE, llega: a, hecha: false, pasada: false, pts: 0, err: 0 }));
    return {
      semilla, nivel, tol: N.tol, dist, marcas,
      largo: marcas[marcas.length - 1].m + 100,
      ini: 0, cool: 0, fallos: 0, suma: 0, quedan: N.n, espera: 0, c: -ARRANQUE,
      hecho: false, ev: [],
    };
  }

  function paso(e, entradas, n) {
    const c = e.dist[n] - ARRANQUE;      // punto del chorizo que está bajo el cuchillo
    e.c = c;
    if (e.cool > 0) e.cool--;
    for (const en of entradas) {
      if (en.t !== 'd' || e.cool > 0) continue;
      e.cool = 8;
      if (c <= e.ini + 6 || c > e.largo) { e.fallos++; e.ev.push({ t: 'aire' }); continue; }
      let j = -1, mejor = 1e9;
      for (let i = 0; i < e.marcas.length; i++) {
        const m = e.marcas[i];
        if (m.hecha || m.pasada) continue;
        const dd = Math.abs(m.m - c);
        if (dd < mejor) { mejor = dd; j = i; }
      }
      const trozo = c - e.ini;
      if (j >= 0 && mejor <= e.tol) {
        const m = e.marcas[j];
        const q = mejor <= 8 ? 'perfecto' : mejor <= 19 ? 'bien' : 'justo';
        m.hecha = true; m.err = c - m.m;
        m.pts = q === 'perfecto' ? 100 : Math.round(100 - 70 * mejor / e.tol);
        e.suma += m.pts; e.quedan--;
        e.ev.push({ t: 'corte', q, i: j, err: m.err, trozo });
      } else {
        e.fallos++;
        e.ev.push({ t: 'corte', q: 'fallo', trozo });
      }
      e.ini = c;
    }
    for (let i = 0; i < e.marcas.length; i++) {
      const m = e.marcas[i];
      if (!m.hecha && !m.pasada && c - m.m > e.tol) { m.pasada = true; e.quedan--; e.ev.push({ t: 'pasada', i }); }
    }
    if (e.quedan <= 0 && ++e.espera > 26) e.hecho = true;
  }

  function puntuacion(e) {
    return ZZ.lim(Math.round((e.suma - 25 * e.fallos) * 10 / e.marcas.length), 0, 1000);
  }

  // Jugador de la casa: toca cerca de cada marca, con más o menos tino según la destreza.
  function casa(e, mem, rng, d, n) {
    if (!mem.plan) {
      const sig = ZZ.mix(7.5, 1.1, d), salta = ZZ.mix(0.22, 0, Math.min(1, d * 1.3));
      mem.plan = e.marcas.map(m => (rng() < salta ? -1 : Math.round(m.llega + rng.campana() * sig)));
      mem.extra = rng() < ZZ.mix(0.35, 0, d) ? rng.entero(20, 260) : -1;
    }
    return (mem.plan.indexOf(n) >= 0 || mem.extra === n) ? [{ t: 'd', x: 320, y: 600 }] : [];
  }

  // --- dibujo ---------------------------------------------------------------
  function mantel(g) {
    const claro = T.mezcla(T.ROJO, T.PAPEL, 0.55), paso = 76;
    g.fillStyle = T.PAPEL; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.save();
    g.translate(320, 420); g.rotate(-0.09); g.translate(-520, -620);
    for (let i = 0; i < 14; i++) {
      if (i % 2) { g.fillStyle = claro; g.fillRect(i * paso, 0, paso, 1240); g.fillRect(0, i * paso, 1040, paso); }
    }
    g.fillStyle = T.ROJO;
    for (let i = 1; i < 14; i += 2) for (let j = 1; j < 17; j += 2) g.fillRect(i * paso, j * paso, paso, paso);
    g.restore();
  }

  function tabla(g) {
    const cam = c => T.rr(c, 14, 372, 612, 298, 46);
    g.save(); g.translate(320, 521); g.rotate(-0.012); g.translate(-320, -521);
    T.sombra(g, cam, 10, 14, 0.38);
    T.vol(g, cam, C.madera, { sombra: C.maderaS, dx: -6, dy: -12, w: 7 });
    // vetas
    g.save(); cam(g); g.clip();
    g.lineCap = 'round'; g.strokeStyle = C.maderaS; g.lineWidth = 5;
    for (const [y, a, b] of [[410, 60, 300], [438, 330, 560], [612, 120, 420], [636, 400, 580], [404, 420, 520]]) {
      g.beginPath(); g.moveTo(a, y); g.quadraticCurveTo((a + b) / 2, y + 9, b, y + 2); g.stroke();
    }
    g.restore();
    T.circ(g, 56, 418, 15); T.pinta(g, T.oscuro(C.maderaS, 0.45), 6);
    g.restore();
  }

  function plato(g) {
    const cam = c => T.circ(c, 118, 742, 98);
    T.sombra(g, cam, 9, 12, 0.38);
    T.vol(g, cam, T.PAPEL, { sombra: '#DDD0B4', dx: -6, dy: -8, w: 7 });
    T.circ(g, 118, 742, 70); T.linea(g, 5, T.MENTA);
  }

  // Un plato con una cuña de queso.
  function queso(g) {
    const cam = c => T.circ(c, 96, 158, 70);
    T.sombra(g, cam, 9, 12, 0.38);
    T.vol(g, cam, T.PAPEL, { sombra: '#DDD0B4', dx: -6, dy: -8, w: 7 });
    T.circ(g, 96, 158, 50); T.linea(g, 4, '#DDD0B4');
    g.save(); g.translate(60, 196); g.rotate(-0.12);
    const cuna = c => { c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 96, -1.32, -0.42); c.closePath(); };
    T.sombra(g, cuna, 5, 7, 0.3);
    T.vol(g, cuna, T.AMARILLO, { sombra: '#E59A1C', dx: -5, dy: -6, w: 6 });
    g.beginPath(); g.arc(0, 0, 88, -1.28, -0.46); T.linea(g, 7, '#E59A1C');
    for (const [x, y, r] of [[34, -34, 7], [58, -52, 5], [30, -62, 4.5], [56, -28, 4]]) { T.circ(g, x, y, r); T.pinta(g, '#E59A1C', 3.5); }
    cuna(g); T.linea(g, 6);
    g.restore();
  }

  function ajo(g) {
    g.save(); g.translate(246, 96); g.rotate(0.3);
    const cam = c => {
      c.beginPath(); c.moveTo(0, -44);
      c.bezierCurveTo(6, -24, 40, -16, 38, 14); c.bezierCurveTo(36, 40, -36, 40, -38, 14);
      c.bezierCurveTo(-40, -16, -6, -24, 0, -44); c.closePath();
    };
    T.sombra(g, cam, 7, 10, 0.38);
    T.vol(g, cam, T.PAPEL, { sombra: '#D9C9E8', dx: -5, dy: -7, w: 6 });
    g.beginPath(); g.moveTo(-2, -22); g.quadraticCurveTo(-18, 4, -10, 32); T.linea(g, 4);
    g.beginPath(); g.moveTo(4, -22); g.quadraticCurveTo(20, 4, 12, 32); T.linea(g, 4);
    g.restore();
  }

  // Dos rebanadas de pan.
  function pan(g) {
    for (const [x, y, rot] of [[468, 752, -0.25], [548, 770, 0.2]]) {
      g.save(); g.translate(x, y); g.rotate(rot);
      const cam = c => T.elip(c, 0, 0, 50, 34);
      T.sombra(g, cam, 7, 9, 0.35);
      cam(g); T.pinta(g, '#B5722D', 6);
      T.vol(g, c => T.elip(c, 0, 0, 41, 26), '#F8E6BC', { sombra: '#E9CE95', dx: -4, dy: -5, w: 0 });
      g.fillStyle = '#E9CE95';
      for (const [dx, dy, r] of [[-18, -6, 4], [8, -10, 3], [16, 8, 4.5], [-6, 10, 3]]) { T.circ(g, dx, dy, r); g.fill(); }
      g.restore();
    }
  }

  function caminoChorizo(g, x1, x2, cabeza, cola) {
    const r = GROSOR / 2, y0 = CY - r, y1 = CY + r;
    g.beginPath();
    g.moveTo(cabeza ? x1 + r : x1 + INC, y0);
    if (cola) { g.lineTo(x2 - r, y0); g.arc(x2 - r, CY, r, -Math.PI / 2, Math.PI / 2); }
    else { g.lineTo(x2, y0); g.lineTo(x2, y1); }
    if (cabeza) { g.lineTo(x1 + r, y1); g.arc(x1 + r, CY, r, Math.PI / 2, Math.PI * 1.5); }
    else g.lineTo(x1 - INC, y1);
    g.closePath();
  }

  function motasDe(e, vis) {
    if (vis.motas) return vis.motas;
    const rng = ZZ.azar(e.semilla ^ 0x51ED);
    const l = [];
    for (let c = 14; c < e.largo - 10; c += rng.entre(15, 27)) {
      l.push({ c, y: rng.entre(-34, 34), r: rng.entre(3.5, 7), a: rng.entre(0, 3) });
    }
    vis.motas = l;
    return l;
  }

  function chorizo(g, e, vis) {
    const cabezaX = KX - e.c;
    const x1 = cabezaX + e.ini, x2real = cabezaX + e.largo;
    if (x2real < -60) return;
    const cola = x2real < ZZ.PW + 60, x2 = cola ? x2real : ZZ.PW + 60;
    const cabeza = e.ini === 0;
    if (x2 - x1 < 8) return;
    const cam = c => caminoChorizo(c, x1, x2, cabeza, cola);
    T.sombra(g, cam, 6, 12, 0.3);
    // cuerdas de los extremos
    if (cabeza) {
      g.beginPath(); g.moveTo(x1 + 4, CY); g.quadraticCurveTo(x1 - 16, CY - 10, x1 - 22, CY + 12); T.linea(g, 9);
      g.beginPath(); g.moveTo(x1 + 4, CY); g.quadraticCurveTo(x1 - 16, CY - 10, x1 - 22, CY + 12); T.linea(g, 4, T.PAPEL);
    }
    if (cola) {
      g.beginPath(); g.moveTo(x2 - 4, CY); g.bezierCurveTo(x2 + 34, CY - 40, x2 + 46, CY + 26, x2 + 8, CY + 6); T.linea(g, 9);
      g.beginPath(); g.moveTo(x2 - 4, CY); g.bezierCurveTo(x2 + 34, CY - 40, x2 + 46, CY + 26, x2 + 8, CY + 6); T.linea(g, 4, T.PAPEL);
    }
    T.vol(g, cam, C.chorizo, { sombra: C.chorizoS, dx: 0, dy: -18, w: 0 });
    // tocino y brillo, recortados al cuerpo
    g.save(); cam(g); g.clip();
    g.fillStyle = T.PAPEL;
    for (const m of motasDe(e, vis)) {
      const x = cabezaX + m.c;
      if (x < x1 - 10 || x > x2 + 10) continue;
      g.beginPath(); g.ellipse(x, CY + m.y, m.r, m.r * 0.62, m.a, 0, 7); g.fill();
    }
    g.strokeStyle = T.claro(C.chorizo, 0.42); g.lineWidth = 7; g.lineCap = 'round';
    g.setLineDash([46, 30]); g.lineDashOffset = -cabezaX;
    g.beginPath(); g.moveTo(x1 + 30, CY - 31); g.lineTo(x2 - 30, CY - 31); g.stroke();
    g.setLineDash([]);
    g.restore();
    cam(g); T.linea(g, 7);
    // cara del corte
    if (!cabeza) {
      const camCara = c => { c.beginPath(); c.ellipse(x1, CY, 15, GROSOR / 2 + 3, 0.36, 0, 7); };
      camCara(g); T.pinta(g, C.cara, 6);
      g.fillStyle = T.PAPEL;
      for (const [dx, dy] of [[-3, -22], [4, -4], [-2, 16], [3, 30]]) { T.circ(g, x1 + dx, CY + dy, 3.4); g.fill(); }
    }
    // marcas por cortar
    for (const m of e.marcas) {
      if (m.hecha) continue;
      const x = cabezaX + m.m;
      if (x < -30 || x > ZZ.PW + 30) continue;
      g.globalAlpha = m.pasada ? 0.28 : 1;
      g.beginPath(); g.moveTo(x + INC * 0.86, CY - 41); g.lineTo(x - INC * 0.86, CY + 41);
      T.linea(g, 13);
      g.setLineDash([11, 10]);
      g.beginPath(); g.moveTo(x + INC * 0.86, CY - 41); g.lineTo(x - INC * 0.86, CY + 41);
      T.linea(g, 6, T.PAPEL);
      g.setLineDash([]);
      if (!m.pasada) {
        const by = CY - 78 + Math.sin(vis.t * 0.22 + m.m) * 4;
        T.poli(g, [[x + INC - 15, by - 16], [x + INC + 15, by - 16], [x + INC, by + 12]]);
        T.pinta(g, T.AMARILLO, 5);
      }
      g.globalAlpha = 1;
    }
  }

  // El cuchillo se dibuja con la punta en el origen y el mango hacia +x.
  function caminoHoja(g) {
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(60, 34, 140, 50, 204, 46);
    g.lineTo(204, -8);
    g.bezierCurveTo(130, -10, 50, -8, 0, 0);
    g.closePath();
  }
  function cuchillo(g, sombra) {
    if (sombra) {
      g.fillStyle = T.TINTA;
      caminoHoja(g); g.fill();
      T.rr(g, 200, -12, 140, 40, 14); g.fill();
      T.rr(g, 222, -30, 86, 78, 26); g.fill();
      T.rr(g, 300, -40, 420, 100, 30); g.fill();
      return;
    }
    // manga
    T.vol(g, c => T.rr(c, 318, -44, 420, 106, 30), T.PAPEL, { sombra: '#D9CDB3', dx: 0, dy: -16, w: 7 });
    T.vol(g, c => T.rr(c, 296, -50, 46, 118, 16), T.PAPEL, { sombra: '#D9CDB3', dx: 0, dy: -16, w: 7 });
    // hoja
    T.vol(g, caminoHoja, C.hoja, { sombra: C.hojaS, dx: 0, dy: -13, w: 7 });
    g.beginPath(); g.moveTo(40, 6); g.lineTo(150, 12); T.linea(g, 5, '#FFFFFF');
    // mango
    T.vol(g, c => T.rr(c, 200, -12, 140, 40, 14), C.mango, { sombra: '#17141F', dx: 0, dy: -6, w: 7 });
    // puño: cuatro dedos y el pulgar
    T.vol(g, c => T.rr(c, 224, -28, 82, 76, 26), C.piel, { sombra: C.pielS, dx: -3, dy: -8, w: 7 });
    for (let i = 0; i < 4; i++) {
      T.vol(g, c => T.rr(c, 226 + i * 19.5, -32, 21, 50, 10), C.piel, { sombra: C.pielS, dx: -2, dy: -5, w: 5 });
    }
    T.vol(g, c => T.elip(c, 250, 38, 25, 13, -0.12), C.piel, { sombra: C.pielS, dx: -2, dy: -4, w: 5 });
  }

  function rodaja(g, x, y, r, giro, aplasta) {
    g.save();
    g.translate(x, y); g.rotate(giro); g.scale(1, aplasta);
    T.circ(g, 0, 0, r); T.pinta(g, C.chorizoS, 0);
    T.circ(g, 0, 0, r - 5); T.pinta(g, C.cara, 0);
    g.fillStyle = T.PAPEL;
    for (const [dx, dy, rr] of [[-12, -8, 5], [9, -14, 4], [12, 8, 5.5], [-6, 13, 4.5], [0, -1, 3.5]]) { T.circ(g, dx * r / 32, dy * r / 32, rr * r / 32); g.fill(); }
    T.circ(g, 0, 0, r); T.linea(g, 5.5);
    g.restore();
  }

  function fondo(g) {
    mantel(g);
    queso(g);
    ajo(g);
    tabla(g);
    plato(g);
    pan(g);
  }

  const PX = 320, PY = 150;   // las palabras salen en la banda de arriba, como en los otros canales, sobre una placa
  const HUECOS = [[78, 716], [128, 706], [160, 742], [112, 760], [70, 760], [142, 786], [100, 728], [136, 740]];

  function dibuja(g, e, vis) {
    T.capa(g, vis, 'cocina', fondo);
    const t = vis.t;
    // sacudida de la tabla al cortar
    const golpe = vis.golpe === undefined ? 99 : vis.golpe;
    const sac = golpe < 6 ? (6 - golpe) * (golpe % 2 ? -1.2 : 1.2) : 0;
    g.save(); g.translate(0, sac);
    chorizo(g, e, vis);
    g.restore();

    // rodajas en el plato y en el aire
    for (const r of vis.rodajas || []) {
      const k = Math.min(1, (t - r.t0) / 22);
      if (k < 1) {
        const kk = ZZ.e.out3(k);
        const x = ZZ.mix(r.x0, r.x1, kk), y = ZZ.mix(r.y0, r.y1, kk) - Math.sin(k * Math.PI) * 150;
        rodaja(g, x, y, 34, k * 7, 0.55 + 0.45 * Math.abs(Math.cos(k * 9)));
      } else {
        const b = Math.min(1, (t - r.t0 - 22) / 10);
        rodaja(g, r.x1, r.y1, 34, r.giro, 1 - 0.22 * Math.sin(b * Math.PI) * (1 - b));
      }
    }
    vis.ch.dibuja(g, 0);

    // cuchillo: sombra en la tabla y hoja con su mano
    const sube = golpe < 3 ? 0 : golpe < 13 ? ZZ.e.out3((golpe - 3) / 10) : 1;
    const flota = sube * (Math.sin(t * 0.16) * 3);
    const ang = ANG + sube * 0.035;
    g.save();
    g.translate(PUNTA_X + sac * 0.5, CY + 108);
    g.save(); g.globalAlpha = 0.24; g.translate(sube * 20, sube * 8); g.rotate(ANG); cuchillo(g, true); g.restore();
    g.translate(-sube * 16, -sube * 46 + flota);
    g.rotate(ang);
    g.scale(1 + sube * 0.06, 1 + sube * 0.06);
    cuchillo(g, false);
    g.restore();

    vis.ch.dibuja(g, 1);
  }

  // Lo que se ve y se oye cuando pasa algo. No cambia la partida.
  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'corte') {
        vis.golpe = 0;
        const px = KX, py = CY;
        T.polvo(vis.ch, px, py + 30, 5, T.PAPEL, 4, 9);
        if (x.q === 'fallo') {
          const l = ZZ.lim(x.trozo, 24, 150);
          vis.ch.mas({ tipo: 'dib', x: px - l / 2 - 10, y: py, vx: -4.5, vy: -7, g: 0.75, vr: -0.16, vida: 60,
            dib: (c) => { T.vol(c, cc => T.rr(cc, -l / 2, -GROSOR / 2, l, GROSOR, 30), C.chorizo, { sombra: C.chorizoS, dx: 0, dy: -16, w: 7 }); } });
          T.palabra(vis.ch, '¡UY!', PX, PY, T.ROJO, 60, 1, true);
          vis.temblor = 7; son && son.fallo();
        } else {
          vis.rodajas = vis.rodajas || [];
          const h = HUECOS[vis.rodajas.length % HUECOS.length];
          vis.rodajas.push({ t0: vis.t, x0: px - 30, y0: py, x1: h[0], y1: h[1], giro: Math.random() * 6 });
          if (x.q === 'perfecto') {
            T.estrellas(vis.ch, px, py - 20, 7, T.AMARILLO, 9, 20, 1);
            vis.ch.mas({ tipo: 'anillo', x: px, y: py, r: 30, R: 150, w: 14, color: '#FFFFFF', vida: 16, capa: 1 });
            T.palabra(vis.ch, '¡CLAVADO!', PX, PY, T.AMARILLO, 58, 1, true);
            vis.temblor = 9; son && son.clavado();
          } else if (x.q === 'bien') {
            T.rayitas(vis.ch, px, py, 6, T.PAPEL, 28, 56, 1);
            T.palabra(vis.ch, '¡BIEN!', PX, PY, T.PAPEL, 58, 1, true);
            vis.temblor = 5; son && son.acierto();
          } else {
            T.palabra(vis.ch, 'JUSTITO', PX, PY, T.PAPEL, 50, 1, true);
            vis.temblor = 4; son && son.golpe();
          }
        }
        son && son.corte();
      } else if (x.t === 'aire') {
        vis.golpe = 0; vis.temblor = 4;
        T.palabra(vis.ch, '¿EH?', PX, PY, T.PAPEL, 56, 1, true);
        son && son.fallo();
      } else if (x.t === 'pasada') {
        const m = e.marcas[x.i];
        T.palabra(vis.ch, '¡SE VA!', PX, PY, T.ROJO, 54, 1, true);
        son && son.fallo();
      }
    }
    if (vis.golpe !== undefined) vis.golpe++;
  }

  ZZ.canales.cocina = {
    id: 'cocina', num: 1, nombre: 'COCINA', orden: '¡CORTA!',
    pista: 'Toca cuando la marca llegue al cuchillo',
    rotulo: 'HOY: CHORIZO EN CINCO SEGUNDOS',
    color: T.ROJO, color2: T.AMARILLO, color3: T.MENTA,
    todaLaPantalla: true,
    animo: x => (x.t === 'corte' ? (x.q === 'fallo' ? -1 : x.q === 'justo' ? 0 : 1) : (x.t === 'pasada' || x.t === 'aire') ? -1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();

</script>
<script>
/* ZikZak · canal 2 · El tiempo · ¡DESPEJA!
   Las nubes tapan el sol. Se arrastran y se lanzan fuera hasta dejarlo limpio.
   Mide la rapidez: cuanto antes quede despejado, más puntos. */
(function () {
  'use strict';
  const ZZ = window.ZZ, T = ZZ.tinta, P = ZZ.personaje;

  const SOL = { x: 320, y: 384, r: 124 };
  const BORDE = 20;
  const NIV = [null,
    { n: 3, viento: 0, pes: 0, r: 88 },
    { n: 5, viento: 0.45, pes: 1, r: 80 },
    { n: 6, viento: 0.8, pes: 2, r: 76 }];

  // --- lógica ---------------------------------------------------------------
  const lejos = c => Math.hypot(c.x - SOL.x, c.y - SOL.y);
  const libre = c => c.fuera || lejos(c) > SOL.r + c.r * 0.6;

  function init(semilla, nivel) {
    const rng = ZZ.azar(semilla), N = NIV[nivel];
    const nubes = [], giro = rng.entre(0, 6.28);
    for (let i = 0; i < N.n; i++) {
      const a = giro + i / N.n * 6.2832 + rng.entre(-0.35, 0.35), d = i === 0 ? rng.entre(0, 18) : rng.entre(34, 84);
      nubes.push({ x: SOL.x + Math.cos(a) * d, y: SOL.y + Math.sin(a) * d * 0.8, vx: 0, vy: 0, r: N.r * rng.entre(0.94, 1.06), pesada: i < N.pes, fuera: false, cara: rng.entero(0, 2) });
    }
    return { semilla, nivel, nubes, viento: N.viento, agarrada: -1, ox: 0, oy: 0, despejado: false, pasoClaro: -1, hecho: false, ev: [] };
  }

  function paso(e, entradas, n) {
    let movida = false;
    for (const en of entradas) {
      if (en.t === 'd') {
        if (e.agarrada >= 0) continue;
        for (let i = e.nubes.length - 1; i >= 0; i--) {
          const c = e.nubes[i];
          if (c.fuera || Math.hypot(c.x - en.x, c.y - en.y) > c.r * 1.05) continue;
          e.agarrada = i; e.ox = c.x - en.x; e.oy = c.y - en.y; c.vx = 0; c.vy = 0;
          e.ev.push({ t: 'agarra', i });
          break;
        }
      } else if (en.t === 'm') {
        if (e.agarrada < 0) continue;
        const c = e.nubes[e.agarrada], k = c.pesada ? 0.4 : 1;
        const nx = c.x + (en.x + e.ox - c.x) * k, ny = c.y + (en.y + e.oy - c.y) * k;
        c.vx = c.vx * 0.4 + (nx - c.x) * 0.6; c.vy = c.vy * 0.4 + (ny - c.y) * 0.6;
        c.x = nx; c.y = ny; movida = true;
      } else if (en.t === 'u') {
        if (e.agarrada < 0) continue;
        const c = e.nubes[e.agarrada], f = c.pesada ? 0.8 : 1.15;
        c.vx = ZZ.lim(c.vx * f, -40, 40); c.vy = ZZ.lim(c.vy * f, -40, 40);
        e.ev.push({ t: 'suelta', i: e.agarrada, v: Math.hypot(c.vx, c.vy) });
        e.agarrada = -1;
      }
    }
    for (let i = 0; i < e.nubes.length; i++) {
      const c = e.nubes[i];
      if (c.fuera) continue;
      if (i === e.agarrada) { if (!movida) { c.vx *= 0.5; c.vy *= 0.5; } }
      else {
        c.x += c.vx; c.y += c.vy;
        const roz = c.pesada ? 0.9 : 0.95;
        c.vx *= roz; c.vy *= roz;
        const d = lejos(c);
        if (e.viento > 0 && Math.hypot(c.vx, c.vy) < 1.5 && d > 6) { c.x += (SOL.x - c.x) / d * e.viento; c.y += (SOL.y - c.y) / d * e.viento; }
      }
      if (c.x < BORDE || c.x > ZZ.PW - BORDE || c.y < BORDE || c.y > ZZ.PH - BORDE) {
        c.fuera = true;
        if (i === e.agarrada) e.agarrada = -1;
        e.ev.push({ t: 'fuera', i, x: c.x, y: c.y, vx: c.vx, vy: c.vy });
      }
    }
    if (!e.despejado && e.nubes.every(libre)) {
      e.despejado = true; e.pasoClaro = n; e.hecho = true;
      e.ev.push({ t: 'claro' });
    }
  }

  function puntuacion(e) {
    if (e.despejado) return 400 + Math.round(600 * (1 - e.pasoClaro / ZZ.PASOS));
    return Math.round(380 * e.nubes.filter(libre).length / e.nubes.length);
  }

  // Jugador de la casa: coge la nube que más tapa y la arrastra hacia fuera.
  function casa(e, mem, rng, d, n) {
    if (mem.fase === undefined) { mem.fase = 'espera'; mem.hasta = Math.round(ZZ.mix(34, 12, d) + rng.entre(0, 18)); }
    if (e.despejado) return [];
    if (mem.fase === 'espera') {
      if (n < mem.hasta) return [];
      let j = -1, mejor = 1e9;
      e.nubes.forEach((c, i) => { if (libre(c)) return; const dd = lejos(c); if (dd < mejor) { mejor = dd; j = i; } });
      if (j < 0) { mem.hasta = n + 6; return []; }
      const c = e.nubes[j], sig = ZZ.mix(30, 5, d);
      mem.x = ZZ.lim(Math.round(c.x + rng.campana() * sig), 0, ZZ.PW);
      mem.y = ZZ.lim(Math.round(c.y + rng.campana() * sig), 0, ZZ.PH);
      mem.ang = mejor < 12 ? rng.entre(0, 6.28) : Math.atan2(c.y - SOL.y, c.x - SOL.x) + rng.campana() * ZZ.mix(0.5, 0.12, d);
      mem.vel = ZZ.mix(12, 30, d) * (c.pesada ? 1.2 : 1);
      mem.fin = n + Math.round(ZZ.mix(22, 9, d) * (c.pesada ? 1.7 : 1) + rng.entre(0, 6));
      mem.fase = 'arrastra'; mem.ini = n;
      return [{ t: 'd', x: mem.x, y: mem.y }];
    }
    const pausa = () => { mem.fase = 'espera'; mem.hasta = n + Math.round(ZZ.mix(18, 5, d) + rng.entre(0, 14)); };
    if (e.agarrada < 0) { pausa(); return [{ t: 'u', x: mem.x, y: mem.y }]; }
    if (n >= mem.fin) { pausa(); return [{ t: 'u', x: mem.x, y: mem.y }]; }
    mem.x = ZZ.lim(Math.round(mem.x + Math.cos(mem.ang) * mem.vel), 0, ZZ.PW);
    mem.y = ZZ.lim(Math.round(mem.y + Math.sin(mem.ang) * mem.vel), 0, ZZ.PH);
    return [{ t: 'm', x: mem.x, y: mem.y }];
  }

  // --- dibujo -----------------------------------------------------------------
  // El mapa del tiempo: la península, con sus vecinos, sus isobaras y sus temperaturas.
  const geo = (lon, lat) => [20 + (lon + 10.2) * 44, 232 + (44.4 - lat) * 62];
  const COSTA = [[-9.3, 42.9], [-8.4, 43.5], [-7.7, 43.8], [-5.8, 43.6], [-3.8, 43.5], [-1.8, 43.4], [0.7, 42.8], [3.3, 42.3], [3.2, 41.9],
    [2.2, 41.3], [0.9, 40.7], [-0.3, 39.5], [0.2, 38.8], [-0.5, 38.3], [-0.7, 37.6], [-1.9, 36.9], [-2.2, 36.7], [-4.4, 36.7], [-5.6, 36.0],
    [-6.3, 36.6], [-7.4, 37.2], [-7.9, 37.0], [-9.0, 37.0], [-8.8, 38.4], [-9.5, 38.8], [-9.4, 39.4], [-8.9, 40.2], [-8.7, 41.2], [-8.9, 42.2]];
  const FRANCIA = [[-1.8, 43.4], [-1.3, 44.6], [-1.2, 46.4], [5, 46.4], [5, 43.2], [3.3, 42.4], [0.7, 42.9]];
  const AFRICA = [[-7.4, 35.2], [-5.9, 35.8], [-5.3, 35.9], [-4.2, 35.2], [-2.9, 35.3], [-1.4, 35.0], [0.4, 35.6], [0.4, 33.6], [-7.4, 33.6]];
  function suave(g, pts) {
    const q = pts.map(p => geo(p[0], p[1])), n = q.length;
    const med = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const m0 = med(q[n - 1], q[0]);
    g.beginPath(); g.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) { const m = med(q[i], q[(i + 1) % n]); g.quadraticCurveTo(q[i][0], q[i][1], m[0], m[1]); }
    g.closePath();
  }
  function fondo(g) {
    g.fillStyle = T.AZUL; g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    g.fillStyle = T.trama(g, T.mezcla(T.AZUL, T.TINTA, 0.2), 13, 2.6); g.fillRect(0, 0, ZZ.PW, ZZ.PH);
    // isobaras, por el mar
    g.save(); g.globalAlpha = 0.5; g.setLineDash([16, 13]);
    for (const [x, y, r] of [[96, 176, 78], [96, 176, 130], [560, 690, 76], [560, 690, 128]]) { T.circ(g, x, y, r); T.linea(g, 5, T.PAPEL); }
    g.restore();
    // los vecinos, en un tono apagado
    const vecino = '#CFC6AE';   // la tierra de los vecinos, en un tono de arena apagado
    suave(g, FRANCIA); T.pinta(g, vecino, 5);
    suave(g, AFRICA); T.pinta(g, vecino, 5);
    // la península y las islas
    T.sombra(g, c => suave(c, COSTA), 6, 9, 0.3);
    T.vol(g, c => suave(c, COSTA), T.MENTA, { sombra: T.oscuro(T.MENTA, 0.2), dx: -7, dy: -9, w: 7 });
    for (const [lon, lat, rx, ry] of [[2.9, 39.6, 25, 16], [1.4, 38.9, 12, 9]]) {
      const q = geo(lon, lat);
      T.vol(g, c => T.elip(c, q[0], q[1], rx, ry, -0.3), T.MENTA, { sombra: T.oscuro(T.MENTA, 0.2), dx: -3, dy: -4, w: 5.5 });
    }
    // la A de anticiclón y la B de borrasca, cada una en su disco
    for (const [x, y, l, c] of [[96, 176, 'A', T.ROJO], [560, 690, 'B', T.AZUL]]) {
      T.circ(g, x + 4, y + 6, 40); T.pinta(g, T.TINTA, 0);
      T.circ(g, x, y, 40); T.pinta(g, T.PAPEL, 6);
      T.texto(g, l, x, y + 3, 50, { color: c, w: 0 });
    }
    // ciudades con su temperatura
    for (const [lon, lat, t, lado] of [[-6.0, 37.4, '34°', 1], [-0.4, 39.5, '29°', -1], [-9.1, 38.7, '26°', 1]]) {
      const q = geo(lon, lat);
      T.circ(g, q[0], q[1], 8); T.pinta(g, T.ROJO, 5);
      const x = q[0] + lado * 44;
      T.rr(g, x - 30, q[1] - 17, 60, 34, 12); T.pinta(g, T.PAPEL, 4.5);
      T.texto(g, t, x + 1, q[1] + 1, 21, { fuente: T.F_UI, peso: 900, w: 0, color: T.TINTA });
    }
  }

  const BULTOS = [[-50, 12, 34], [-22, -20, 40], [26, -14, 37], [56, 14, 30], [2, 22, 40]];
  function caminoNube(g, extra) {
    g.beginPath();
    for (const [x, y, r] of BULTOS) { g.moveTo(x + r + extra, y); g.arc(x, y, r + extra, 0, 6.2832); }
  }
  const CARAS = ['neutro', 'triste', 'tension'];
  function nube(g, c, t, agarrada, sinCara) {
    const s = c.r / 86 * (agarrada ? 1.08 : 1);
    g.save();
    g.translate(c.x, c.y + (agarrada ? 0 : Math.sin(t * 0.06 + c.r) * 3));
    g.rotate(ZZ.lim(c.vx * 0.014, -0.3, 0.3));
    g.scale(s, s);
    g.save(); g.globalAlpha = 0.13; g.translate(12, 20); caminoNube(g, 6); g.fillStyle = T.TINTA; g.fill(); g.restore();
    caminoNube(g, 6.5); g.fillStyle = T.TINTA; g.fill();
    const base = c.pesada ? '#7C71B4' : '#FFFFFF', som = c.pesada ? '#564B8A' : '#C9D6F5';
    T.vol(g, x => caminoNube(x, 0), base, { sombra: som, dx: -6, dy: -11, w: 0 });
    if (c.pesada && !sinCara) {
      T.poli(g, [[-4, 52], [22, 52], [8, 76], [26, 76], [-10, 116], [-2, 86], [-18, 86]]); T.pinta(g, T.AMARILLO, 5.5);
    }
    if (!sinCara) {
      g.translate(0, 2); g.scale(0.9, 0.9);
      P.cara(g, agarrada ? 'susto' : c.pesada ? 'enfadado' : CARAS[c.cara], t + c.r * 7, { ex: 19, ey: -6, by: 22, piel: base });
    }
    g.restore();
  }

  function sol(g, e, vis) {
    const t = vis.t, claro = e.despejado;
    const libres = e.nubes.filter(libre).length / e.nubes.length;
    const kc = claro ? Math.min(1, (t - (vis.tClaro || t)) / 16) : 0;
    g.save(); g.translate(SOL.x, SOL.y);
    const late = claro ? 1 + Math.sin(t * 0.32) * 0.035 + ZZ.e.rebote(kc) * 0.12 : 1;
    g.scale(late, late);
    const R = SOL.r + (claro ? 70 + Math.sin(t * 0.4) * 9 : 30 + libres * 18);
    g.save(); g.rotate(t * (claro ? 0.022 : 0.005));
    for (let i = 0; i < 12; i++) {
      g.rotate(Math.PI / 6);
      T.poli(g, [[-22, -SOL.r + 8], [22, -SOL.r + 8], [0, -R]]); T.pinta(g, T.AMARILLO, 6);
    }
    g.restore();
    T.vol(g, c => T.circ(c, 0, 0, SOL.r), '#FFD84A', { sombra: '#F2A81E', dx: -10, dy: -13, w: 7 });
    g.save(); g.globalAlpha = 0.34; g.fillStyle = T.ROJO; T.circ(g, -72, 30, 20); g.fill(); T.circ(g, 72, 30, 20); g.fill(); g.restore();
    g.save(); g.scale(2.05, 2.05);
    const ag = e.agarrada >= 0 ? e.nubes[e.agarrada] : null;
    const mira = ag ? { x: ZZ.lim((ag.x - SOL.x) / 120, -1, 1), y: ZZ.lim((ag.y - SOL.y) / 120, -1, 1) } : null;
    P.cara(g, claro ? 'euforico' : libres > 0.6 ? 'contento' : libres > 0.3 ? 'neutro' : 'triste', t, { ex: 24, ey: -8, by: 22, piel: '#FFD84A', mira });
    g.restore();
    if (claro) {
      // gafas de sol que caen del cielo
      const kg = ZZ.e.outBack(ZZ.lim((t - vis.tClaro - 6) / 14, 0, 1));
      g.save(); g.translate(0, -18 - (1 - kg) * 330); g.rotate((1 - kg) * -0.5);
      g.beginPath(); g.moveTo(-104, -6); g.lineTo(104, -6); T.linea(g, 10);
      for (const sg of [-1, 1]) {
        T.vol(g, c => { c.beginPath(); c.moveTo(sg * 8, -16); c.lineTo(sg * 92, -16); c.quadraticCurveTo(sg * 96, 34, sg * 52, 36); c.quadraticCurveTo(sg * 10, 34, sg * 8, -16); c.closePath(); }, '#3A3350', { sombra: T.TINTA, dx: -5, dy: -6, w: 7 });
        g.beginPath(); g.moveTo(sg * 50 - 22, -4); g.lineTo(sg * 50 - 8, 14); T.linea(g, 5, T.PAPEL);
      }
      g.restore();
    }
    g.restore();
  }

  function dibuja(g, e, vis) {
    T.capa(g, vis, 'tiempo', fondo);
    sol(g, e, vis);
    vis.ch.dibuja(g, 0);
    for (let i = 0; i < e.nubes.length; i++) {
      const c = e.nubes[i];
      if (c.fuera || i === e.agarrada) continue;
      // la nube que queda tapada por otra no enseña media cara
      let tapada = false;
      for (let j = 0; j < e.nubes.length && !tapada; j++) {
        const o = e.nubes[j];
        if (j === i || o.fuera || (j < i && j !== e.agarrada)) continue;
        tapada = Math.hypot(o.x - c.x, o.y - c.y) < c.r * 1.05;
      }
      nube(g, c, vis.t, false, tapada);
    }
    if (e.agarrada >= 0) nube(g, e.nubes[e.agarrada], vis.t, true);
    vis.ch.dibuja(g, 1);
  }

  function efectos(e, vis, ev, son) {
    for (const x of ev) {
      if (x.t === 'agarra') { son && son.agarra(); }
      else if (x.t === 'suelta') { if (x.v > 6) son && son.soplo(); }
      else if (x.t === 'fuera') {
        const c = e.nubes[x.i], copia = { x: 0, y: 0, vx: x.vx, r: c.r, pesada: c.pesada, cara: c.cara };
        const d = Math.hypot(x.vx, x.vy) || 1, v = Math.max(16, d);
        vis.ch.mas({ tipo: 'dib', x: x.x, y: x.y, vx: x.vx / d * v, vy: x.vy / d * v, vida: 22, capa: 1,
          dib: (cc) => nube(cc, copia, vis.t, true) });
        T.polvo(vis.ch, ZZ.lim(x.x, 30, ZZ.PW - 30), ZZ.lim(x.y, 30, ZZ.PH - 30), 6, '#FFFFFF', 6, 16, 1);
        T.palabra(vis.ch, '¡FUERA!', ZZ.lim(x.x, 170, ZZ.PW - 170), 150, T.PAPEL, 50, 1);
        son && son.soplo();
      } else if (x.t === 'claro') {
        vis.tClaro = vis.t; vis.temblor = 10;
        T.estrellas(vis.ch, SOL.x, SOL.y, 12, T.AMARILLO, 15, 24, 1);
        vis.ch.mas({ tipo: 'anillo', x: SOL.x, y: SOL.y, r: SOL.r, R: 420, w: 22, color: '#FFFFFF', vida: 22, capa: 0 });
        son && son.sol();
      }
    }
  }

  ZZ.canales.tiempo = {
    id: 'tiempo', num: 2, nombre: 'EL TIEMPO', orden: '¡DESPEJA!', hechoTxt: '¡SOLAZO!',
    pista: 'Arrastra las nubes fuera de la pantalla',
    rotulo: 'MAÑANA: SOL, SI TE DAS PRISA',
    color: T.AZUL, color2: T.AMARILLO, color3: T.MENTA,
    arrastra: true,
    animo: x => (x.t === 'fuera' || x.t === 'claro' ? 1 : 0),
    init, paso, puntuacion, casa, dibuja, efectos,
  };
})();
